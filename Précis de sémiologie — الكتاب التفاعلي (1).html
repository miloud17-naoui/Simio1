<style>
:root{--bg:#F1F5F6;--ink:#0C2233;--card:#fff;--mut:#5B6B76;--line:#D6DFE3;--ecg:#0EA5A0;--fs:19px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1620;--ink:#E4EEF2;--card:#11222E;--mut:#8FA3AF;--line:#1F3646;--ecg:#34D6CF}}
:root[data-theme="dark"]{--bg:#0A1620;--ink:#E4EEF2;--card:#11222E;--mut:#8FA3AF;--line:#1F3646;--ecg:#34D6CF}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ecg);outline-offset:2px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;padding:8px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#top button{width:42px;height:42px;border-radius:12px;font-size:19px}#top button:active{background:var(--line)}
.brand{flex:1;font-weight:700;font-size:15px;direction:ltr;text-align:center;font-family:"Source Serif 4",serif;font-style:italic}
#pb{position:fixed;top:0;right:0;height:3px;width:0;background:var(--c,var(--ecg));z-index:30}
main{max-width:760px;margin:0 auto;padding:0 16px 80px}
.hero{padding:34px 0 10px;text-align:center}
.hero svg{width:100%;height:90px;display:block}
.hero path{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.base{stroke:var(--line)}.pulse{stroke:var(--ecg);stroke-dasharray:.16 1;animation:run 3.2s linear infinite}
@keyframes run{from{stroke-dashoffset:.16}to{stroke-dashoffset:-1}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;stroke-dasharray:none}}
.hero h1{font:italic 600 clamp(34px,9vw,54px)/1.1 "Source Serif 4",serif;margin:14px 0 8px;direction:ltr}
.hero p{color:var(--mut);margin:6px auto;max-width:30em}
.cta{display:inline-block;margin-top:14px;padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600}
.pg{margin:14px auto 0;max-width:320px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.pg i{display:block;height:100%;background:var(--ecg)}
.part{margin:22px 0;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:14px;overflow:hidden}
.part header{display:flex;align-items:center;gap:12px;padding:14px 16px}
.ic{font-size:30px}.part h2{margin:0;font-size:19px;line-height:1.3}.part small,.ch small{display:block;color:var(--mut);direction:ltr;text-align:right;font:italic 400 14px "Source Serif 4",serif}
.pp{margin-inline-start:auto;font-size:13px;color:var(--mut)}
.part ol{list-style:none;margin:0;padding:0}
.ch{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}.ch:active{background:var(--line)}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}.rd .ck{background:var(--c);border-color:var(--c)}
.ch>span:nth-child(2){flex:1}.rt{font-size:12px;color:var(--mut)}
.rh{padding:26px 0 10px;border-bottom:3px solid var(--c)}.rh .ic{font-size:26px}.rh h1{margin:4px 0;font-size:25px;line-height:1.35}.rh small{color:var(--mut);font:italic 400 17px "Source Serif 4",serif;direction:ltr;display:block;text-align:right}
details{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}summary{cursor:pointer;padding:8px 0;font-weight:600}
details button{display:block;width:100%;text-align:left;direction:ltr;padding:7px 0;font:400 15px "Source Serif 4",serif;color:var(--mut);border-top:1px solid var(--line)}details .l3{padding-left:18px}
.doc{direction:ltr;text-align:left;font:400 var(--fs)/1.75 "Source Serif 4",Georgia,serif;hyphens:auto}
.doc p{margin:.8em 0}.doc h2{font:700 1.18em/1.3 "Readex Pro",sans-serif;margin:2em 0 .5em;padding:.3em .7em;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));border-radius:0 8px 8px 0}
.doc h3{font:600 1.08em/1.35 "Readex Pro",sans-serif;margin:1.6em 0 .3em;color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.doc h4{font:italic 600 1em "Source Serif 4",serif;margin:1.2em 0 .2em;border-bottom:1px dashed var(--line)}
.doc .li{position:relative;padding-left:1.3em}.doc .li:before{content:"";position:absolute;left:.2em;top:.8em;width:.5em;height:.5em;border-radius:50%;background:var(--c)}
.doc .def{background:color-mix(in srgb,var(--c) 12%,var(--card));border-left:4px solid var(--c);padding:.6em 1em;border-radius:8px}
.doc pre{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:400 .78em/1.5 ui-monospace,Menlo,monospace}
.fl{animation:fl 1.6s}@keyframes fl{from{background:#FDE04755}}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:30px 0}.nav a,.mk{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;text-align:center}
.mk{display:block;width:100%;margin-top:24px;background:var(--c);color:#fff;border:0;font-weight:600;font-size:16px}.mk.on{background:var(--card);color:var(--ink);border:1px solid var(--line)}
#dr,#sr{position:fixed;inset:0;z-index:40;display:none}#dr.o,#sr.o{display:block}
.sc{position:absolute;inset:0;background:#0008}
.pn{position:absolute;top:0;bottom:0;right:0;width:min(88vw,360px);background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.pn h3{margin:18px 0 4px;font-size:15px;color:var(--mut)}.pn a{display:block;padding:7px 8px;border-radius:8px;font-size:14px}.pn a:active{background:var(--line)}
#sr .pn{width:100%;left:0}#q{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:400 17px "Readex Pro",sans-serif}
.rs{display:block;padding:12px 4px;border-bottom:1px solid var(--line);direction:ltr;text-align:left;font:400 15px/1.55 "Source Serif 4",serif}.rs b{display:block;font:600 12px "Readex Pro",sans-serif;color:var(--c)}mark{background:#FDE047;color:#111;border-radius:3px}
.tr{margin-inline-start:.6em;font:600 12px "Readex Pro",sans-serif;border:1px solid var(--line);border-radius:8px;padding:1px 9px;color:var(--mut);background:var(--card);vertical-align:middle}.tr.ts{display:block;margin:.5em 0 0;font-size:13px;padding:3px 12px;color:var(--ink)}.tr:disabled{opacity:.6}
.tb{direction:rtl;text-align:right;font:400 .95em/1.9 "Readex Pro",sans-serif;background:color-mix(in srgb,var(--c) 8%,var(--card));border-right:4px solid var(--c);border-radius:8px;padding:.6em 1em;margin:.5em 0 1em;white-space:pre-wrap}.tb[hidden]{display:none}
.qz{margin:34px 0 0;direction:ltr;text-align:left;font-family:"Source Serif 4",serif}.qz h2{font:700 19px "Readex Pro",sans-serif;direction:rtl;text-align:right;border-bottom:3px solid var(--c);padding-bottom:6px}.qq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}.qq p{margin:0 0 8px;font-weight:600}.qo{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;font-size:15px}.qo.ok{background:#16A34A;color:#fff;border-color:#16A34A}.qo.no{background:#DC2626;color:#fff;border-color:#DC2626}#qs{font:700 17px "Readex Pro",sans-serif;direction:rtl;text-align:center}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}
</style>

<script id="d" type="application/json">[{"ic":"📖","ar":"مقدمة الكتاب","fr":"Introduction","c":"#475569","ch":[{"ar":"المقدمة","fr":"Introduction","w":392,"b":[["p","Introduction"],["p","Le but de la sémiologie est d'apprendre au futur médecin les différents signes ou symptômes que peut présenter un malade et à traduire ces signes en langage médical ce qui sous-entend la nécessité de l'acquisition d'un vocabulaire précis."],["p","Les différents signes à analyser peuvent être classés en trois catégories : les signes fonctionnels, les signes généraux et les signes physiques :"],["li","Les signes fonctionnels : sont recueillis par l'interrogatoire du malade, leur analyse est souvent difficile car elle dépend de la personnalité du malade mais aussi des qualités d'écoute du médecin. Leur analyse soigneuse est fondamentale, elle doit toujours être le préalable de l'examen clinique du malade qu'elle permettra de guider."],["li","Les signes généraux : sont mesurés de manière précise en unités de mesure : le poids (kilogramme), la taille (centimètre), la température (degré centigrade), la diurèse (litre), la pression artérielle (centimètre de mercure). Ils constituent également des éléments de surveillance objectifs qui peuvent être recueillis par l'infirmier."],["li","Les signes physiques : sont découverts et appréciés de manière objective par le médecin grâce à ses organes des sens : la vue, le toucher et l'ouïe; ils sont analysés lors des différents temps de l'examen clinique : l'inspection, la palpation, la percussion et l'auscultation; ils réclament de la part de l'étudiant l'acquisition d'un savoir-faire précis. Le recueil de ces différents signes préalablement traduits en langage médical constitue l'observation clinique du malade qui va permettre à l'étudiant d'effectuer l'étude synthétique qui consiste à rassembler les différents signes analysés pour obtenir un syndrome', cette étude synthétique est l'étape intermédiaire indispensable avant d'aboutir au diagnostic. En effet l'individualisation du syndrome aidera le praticien à diriger son choix parmi les nombreuses investigations complémentaires souvent nécessaires pour poser un diagnostic, dernière étape avant de choisir la thérapeutique adaptée. Les principales investigations complémentaires actuellement disponibles ont été envisagées : certaines d'entre elles sont détaillées car elles font partie soit des gestes pratiques que l'étudiant doit apprendre en même temps que la sémiologie, ce sont les différentes ponctions (ponctions pleurales, ponction d'ascite et ponction lombaire), soit des examens de pratique courante [le téléthorax, l'abdomen sans préparation, l'électro-cardiogramme (ECG), l'hémogramme] ; d'autres ont été citées afin que l'étudiant apprenne déjà à se familiariser avec elles. Enfin ont été exclus à dessein : l'étude détaillée des maladies qui revient à la pathologie et celle des syndromes rares qui revient au spécialiste."]]}]},{"ic":"🩺","ar":"عموميات","fr":"Généralités","c":"#0F766E","ch":[{"ar":"الاستجواب الطبي (Anamnèse)","fr":"L'anamnèse","w":1428,"b":[["p","Les données de l’anamnèse vont être recueillies par l'interrogatoire du malade qui est le préambule de toute observation clinique. Un interrogatoire bien conduit apportera une aide précieuse au médecin, il l'aidera à diriger et à interpréter son examen clinique et il lui permettra de choisir les éventuelles investigations complémentaires utiles au diagnostic."],["p","Pour qu'un interrogatoire soit fructueux il faut que certaines conditions soient remplies. Ces conditions doivent être connues et comprises par le futur médecin, et leur respect lui évitera bien des tâtonnements et bien des erreurs."],["p","La première de ces régies est la nécessité impérieuse d'établir une bonne relation médecin malade; en effet de ce premier contact vont dépendre, dans un premier temps, la qualité des renseignements recueillis et, dans un deuxième temps, l'adhésion du malade à la thérapeutique prescrite. Pour que cette relation puisse s'établir elle demande de la part du médecin de la courtoisie, de la compréhension voire de la compassion et de la modestie."],["p","La deuxième règle consiste en une écoute attentive du malade : le médecin doit laisser son malade s'exprimer donc écouter son récit, mais il doit aussi quand cela est nécessaire l'aider à s'exprimer en lui posant des questions précises en évitant toutefois d'influencer ses réponses en les lui suggérant."],["p","La troisième règle est de toujours suivre le même schéma-type d'interrogatoire qui avec le temps doit devenir automatique, ce qui évitera d'oublier des points importants qui à eux seuls peuvent parfois conduire au diagnostic."],["p","Les données de l'interrogatoire seront consignées sur des feuilles d'observation qui feront partie intégrante du dossier médical du malade hospitalisé ou sur une fiche numérotée pour le malade vu en consultation externe."],["p","L'interrogatoire sera mené de la manière suivante :"],["h2","I. LES DONNÉES DE L'ÉTAT CIVIL"],["p","Nom, prénom, date et lieu de naissance, adresse, situation de famille, profession actuelle. Il est à noter que ces renseignements peuvent être recueillis au préalable par un secrétaire ou un infirmier."],["h2","II. LE MOTIF D'HOSPITALISATION OU DE CONSULTATION"],["p","II s'agit en fait de faire préciser au malade le symptôme ou les symptômes majeurs qui l'ont amené à consulter."],["p","A ce stade il est également important lorsqu'il s'agit d'un malade hospitalisé ou vu dans une consultation spécialisée de faire préciser le nom du médecin traitant habituel ; ce qui permettra d'établir ultérieurement des relations entre ce dernier et le service hospitalier."],["h2","III. L'HISTOIRE DE LA MALADIE"],["p","Consiste à faire exposer au malade l'histoire chronologique du symptôme majeur qui l'a amené à consulter. Ce récit doit être le plus précis possible et l'on recherchera systématiquement les points suivants :"],["h3","1. La date d'apparition"],["p","Il est souhaitable mais souvent difficile d'obtenir la date précise du début sauf lorsque le symptôme est d'apparition récente ou qu'il est apparu de manière très bruyante. A défaut de date précise il faudra s'attacher à rechercher le nombre de jours, de mois ou d'années par rapport à la date d'admission à l'hôpital ou par rapport à la première consultation. On pourra aider le malade en lui suggérant des repères connus : les fêtes religieuses, la date du mariage, la date de naissance des différents enfants..."],["h3","2. La nature du symptôme"],["p","Si nous prenons comme exemple de motif de consultation la douleur, il faut faire préciser au malade le type de cette douleur : torsion, brûlure, déchirure..."],["h3","3. Le mode de début"],["p","Qui peut être brutal ou progressif."],["h3","4. Les facteurs déclenchants"],["p","Des troubles affectifs, l'activité physique, les repas, la prise de certains médicaments."],["h3","5. Les facteurs sédatifs"],["p","Le repos, les repas, la prise de certains médicaments."],["h3","6. La localisation"],["p","Ce caractère est à rechercher surtout lorsque le symptôme signalé par le malade est à type de douleur. Pour obtenir la localisation précise on demandera au malade de désigner avec le doigt le point où la douleur est maximale; on n'omettra pas de rechercher d'éventuelles irradiations."],["h3","7. L’évolution dans le temps"],["p","Qui peut être permanente ou intermittente; il est également nécessaire de savoir si le symptôme s'est aggravé dans le temps : s'il a augmenté d'intensité ou de fréquence et s'il a été influencé par des traitements en faisant alors préciser leur nature exacte."],["h3","8. Recherche de symptômes associés"],["p","En précisant leur chronologie par rapport au symptôme majeur."],["h3","9. Recherche de symptômes intéressant d'autres appareils"],["p","Il est également indispensable de rechercher systématiquement l'existence d'autres symptômes n'ayant à première vue aucun lien apparent avec la maladie actuelle en posant un certain nombre de questions ayant trait aux autres appareils : la notion de céphalée, d'hémorragies extériorisées, de toux, de dyspnée, de troubles urinaires, d'œdèmes..."],["p","En effet, un malade peut présenter plusieurs problèmes mais souvent la maladie actuelle a tendance à lui faire oublier ses autres ennuis qui .sont d'autant plus nombreux que le malade est plus âgé."],["h2","IV. LES ANTÉCÉDENTS"],["p","La recherche des antécédents a pour but de connaître l'histoire du malade et de son entourage antérieure à la maladie actuelle; ainsi le médecin devra rechercher les antécédents physiologiques et pathologiques du malade et ses antécédents familiaux."],["h3","1. Les antécédents personnels"],["p","1.1. Antécédents physiologiques : dans les 2 sexes on précisera les vaccinations subies et chez la femme il sera indispensable de connaître les différents événements de la vie génitale, ces derniers pouvant retentir directement sur l'état de santé de la malade."],["p","1.1.1. Les vaccinations : le BCG qui se fait habituellement à la naissance ou lors de l'entrée à l'école et qui laisse un cicatrice indélébile à la face antérieure de l'avant-bras; les autres vaccinations le D (diphtérie) - T (tétanos) - polio qui se fait sous forme injectable chez le nourrisson à partir de l'âge de 3 mois ou l’antipolio simple se faisant par voie orale. L'antivariolique qui laisse une cicatrice indélébile au niveau du bras."],["h4","1.1.2. Les épisodes de la vie génitale"],["li","La ménarchie : qui est l'âge d'apparition des premières régies."],["li","Le cycle mensuel : la date des dernières régies, la durée du cycle mensuel, la durée des règles et leur abondance qui doit être précisée en nombre de serviettes hygiéniques utilisées par jour."],["li","Le nombre de grossesses, le nombre d'avortements, l'âge du premier enfant et l'âge du dernier enfant."],["li","La ménopause : qui est la date de disparition des régies et qui marque la fin de la vie génitale active."],["p","1.2. Antécédents pathologiques : ils doivent comporter la récapitulation de toutes les maladies, interventions chirurgicales et blessures antérieures."],["p","On devra faire préciser si ces différents événements ont entraîné une hospitalisation, son lieu et sa date, afin de pouvoir éventuellement consulter le dossier."],["h3","2. Les antécédents familiaux"],["p","Il s'agit de passer en revue l'état de santé de la famille : père, mère, frères, sœurs, conjoint et enfants; s'ils sont vivants ou s'ils sont décédés, la cause de leur décès. On recherchera systématiquement l'existence dans la famille de certaines maladies : diabète sucré, hypertension artérielle, cancer, certaines maladies sanguines (hémophilie, anémie hémolytique), l'obésité, les manifestations allergiques (asthme, urticaire); l'épilepsie, les affections coronariennes et les maladies mentales."],["h2","V. LES CONDITIONS SOCIO-ÉCONOMIQUES"],["p","Elle sont importantes à connaître car elles conditionnent en grande partie les habitudes de vie, notamment l'alimentation, et aussi parce qu'elles peuvent être un facteur déclenchant ou aggravant de certaines maladies. Il faudra préciser le revenu mensuel du malade ainsi que le nombre de personnes à charge. Le mode d'habitation rural ou urbain et le nombre de pièces d'habitation ainsi que le mode d'alimentation en eau : eau de ville ou eau de puits."],["h2","VI. LES HABITUDES DE VIE"],["h3","1. Le régime alimentaire"],["p","En précisant en particulier la fréquence de l'apport protidique (viande - œuf- poisson); la prise de légumes verts et de fruits."],["li","2. La notion de prise d'alcool, de café, de thé et de tabac en précisant la quantité. La notion d'ingestion médicamenteuse, en particulier les sédatifs et les laxatifs."],["li","3. Les rapports du malade avec sa famille : l'entente avec sa femme et l'harmonie de sa vie sexuelle, l'état des relations avec ses enfants."],["h3","4. Les rapports du malade avec son travail : degré d'entente avec ses supérieurs, ses"],["p","collègues, degré de satisfaction dans le travail."],["h2","VII. L'HISTOIRE PROFESSIONNELLE"],["p","Cette dernière comporte la revue de tous les métiers exercés dans le passé, la recherche de la notion d'exposition à certains agents notamment poussières chez les mineurs, plomb chez les peintres. Au terme de cet interrogatoire le médecin a fait pleinement connaissance avec son malade; il peut seulement alors passer à la deuxième étape, l'examen clinique qui nécessitera un minimum de matériel que tout médecin doit posséder et avoir toujours à sa disposition : un stéthoscope, un tensiomètre, un mètre-ruban, une lampe de poche, un marteau à réflexe, une aiguille et un morceau de coton hydrophile."]]},{"ar":"العلامات العامة: الوزن والحمّى","fr":"Signes généraux : sémiologie pondérale, fièvre","w":3944,"b":[["p","La sémiologie pondérale"],["h3","1. GÉNÉRALITÉS"],["p","Le corps comprend 4 secteurs principaux :"],["li","Le tissu de soutien (squelette, tissu conjonctif)."],["li","Le liquide extracellulaire."],["li","La masse active (muscles, parenchymes, cellules)."],["li","Le tissu adipeux : qui représente 15 à 20 % du poids corporel chez l'homme et 25 à 30 % chez la femme. Ce secteur constitue l'essentiel des réserves énergétiques. Ces secteurs sont entre eux en proportions définies, dont la somme représente le poids corporel global. Des variations portant sur chacun de ces secteurs peuvent modifier le poids corporel. Le poids corporel d'un individu normal adulte est stable à 1 ou 2 kg prés. IL LE POIDS NORMAL Le poids normal ou poids idéal est déterminé par rapport à la taille, il est également fonction de l'âge."],["h3","1. Chez le nourrisson et l'enfant"],["p","II existe des courbes de poids établies en fonction de la taille et de l'âge. Un nouveau-né à terme pèse 3,500 kg et mesure 50 cm; approximativement il double son poids de naissance à 5 mois, il le triple à 1 an."],["h3","2. Chez l'adulte"],["p","Le poids normal peut être déterminé de plusieurs manières :"],["p","PDF created with FinePrint pdfFactory trial version http://www.fineprint.com"],["p","2.1. A partir de tables de poids idéal établies en fonction de la taille et de l'âge par les compagnies d'assurance sur la vie. En effet des études statistiques ont démontré que le poids avait une influence sur la longévité, les sujets ayant un excès de poids ont une espérance de vie plus courte."],["p","2.2. Le poids idéal peut aussi être calculé grâce à la formule de Lorentz :"],["p","Poids en kg = (taille en cm — 100) — (Taille – 150)"],["p","4 (H) 2(F)"],["p","Il faut ajouter 1 ou 2 kg par décennie au-delà de 20 ans."],["p","2.3. Approximativement le poids idéal correspond au nombre de centimètres au-dessus du mètre."],["h2","III. LES POIDS PATHOLOGIQUES"],["p","Deux types de variations pathologiques peuvent se voir :"],["li","Des variations portant sur le secteur hydrique : qui sont le plus souvent brutales :"],["li","Les déshydratations dues à des pertes excessives d'eau."],["li","Les œdèmes dus à une rétention excessive d'eau."],["li","Des variations portant sur la masse active et ou sur la masse grasse : qui sont le plus souvent d'apparition progressive, ce sont :"],["li","L'obésité : excès de poids portant sur la masse grasse."],["li","L'amaigrissement : diminution de poids portant à la fois sur la masse grasse et sur la masse active. A partir de ces mécanismes nous classerons les poids pathologiques en deux groupes : les excès de poids et les insuffisances de poids :"],["li","1. Les excès de poids : sont donc de deux types : l'obésité et les œdèmes."],["p","1.1. L'obésité : est un excès de poids en rapport avec l'augmentation de la masse grasse."],["p","1.1.1. Définition : un sujet obèse est un sujet qui présente un excès de poids supérieur à 20 % par rapport au poids normal, excès développé aux dépens de sa masse grasse. Ce qui exclut de ce cadre les excès hydriques."],["p","1.1.2. Etude sémiologique : cette étude repose sur l'interrogatoire et sur l'examen clinique du malade."],["p","L’interrogatoire va rechercher : a) Les modalités de la prise de poids : l'âge de début en recherchant le poids de naissance, le poids lors des visites médicales scolaires, le poids lors du service militaire, des anciennes photos, les tailles vestimentaires successives. Il faudra également rechercher si la prise pondérale a été progressive en quelques années ou rapide en quelques mois."],["p","b) Les circonstances déclenchantes : elles peuvent être retrouvées si l'installation de la prise de poids a été rapide :"],["li","choc émotionnel ou affectif (puberté, contraception, ménopause, grossesse);"],["li","réduction de l'activité physique;"],["li","sevrage de tabac;"],["li","traitement par les dérivés cortisones, les antidépresseurs, les neuroleptiques. c) Le comportement alimentaire 11 peut s'agir de troubles quantitatifs ou de troubles qualitatifs."],["li","Les troubles quantitatifs ne sont pas les plus fréquents, ils ne s'observent que dans 20 % des cas; ils réalisent la polyphagie : le malade mange beaucoup par élévation du seuil de la satiété."],["li","Les troubles qualitatifs sont fréquents, ils sont retrouvés dans deux tiers des cas. Ce sont :"],["li","La compulsion alimentaire : impulsion soudaine à consommer un aliment donné le plus souvent, glucidique."],["li","Le grignotage : le sujet mange sans arrêt de petites quantités. Ces deux comportements sont le plus souvent des réflexes de défense contre l'anxiété."],["li","La boulimie : c'est en dehors de toute faim l'ingestion de grandes quantités d'aliments de toute sorte; elle évolue par crises, elle est le symptôme d'une décompensation psychique grave. d) Les dépenses énergétiques : activités professionnelles : profession, sport. e) L'enquête psychologique : qui permet de déterminer le profil psychologique. j) Les antécédents familiaux : 8 fois sur 10 on retrouve une obésité chez l'un des parents."],["li","L’examen clinique : il se fixe 4 objectifs :"],["pre","•    Apprécier le degré de la surcharge pondérale : en fonction de la surcharge pondérale"],["p","on distingue :"],["li","l'obésité modérée : excès de poids de 20 à 50%:"],["li","l'obésité sévère : excès de poids de 50 à 200 %."],["pre","•    Déterminer le type d'obésité :"],["li","obésité androïde : prédominante à la partie supérieure du corps et à la paroi abdominale;"],["li","obésité gynoïde : intéressant surtout la ceinture pelvienne (bassin, hanches) et les membres inférieurs;"],["li","obésité mixte : qui est une obésité globale:"],["li","obésité cushingoïde : qui est une obésité facio-tronculaire."],["pre","•    Rechercher des signes accompagnateurs :"],["li","les vergetures : qui sont des stries plus ou moins longues et plus ou moins larges, blanchâtres ou rougeâtres siégeant au niveau de l'abdomen, des cuisses, parfois des seins. Elles correspondent à la rupture des fibres élastiques du derme. Elles se voient dans les obésités de constitution rapide et sont particulièrement nombreuses dans l'obésité cushingoïde."],["li","la cellulite : qui est un épaississement de la peau qui prend l'aspect de peau d'orange; elle siège essentiellement au niveau des hanches et des cuisses."],["pre","•    Dépister des complications :"],["li","mécaniques : arthrose des hanches et des genoux, troubles de la statique vertébrale"],["li","respiratoires : insuffisance respiratoire chronique pouvant réaliser un syndrome de Pickwick;"],["li","métaboliques : diabète, athérosclérose, goutte, hyperlipidèmie."],["h4","1.1.3. Causes des obésités"],["li","Constitutionnelle."],["li","Psychogène."],["li","Endocriniennes : syndrome de Cushing (en rapport avec un hypercorticisme)."],["li","Neurologiques : lésion diencéphalique : par traumatisme crânien, tumeur cérébrale."],["h4","1.2. Les œdèmes"],["p","1.2.1. Définition : les œdèmes réalisent une infiltration sous-cutanée en rapport avec une rétention hydrique, qui va entraîner un excès de poids aux dépens du secteur liquidien extracellulaire."],["p","Leur existence doit être soupçonnée devant toute prise de poids quotidienne égale ou supérieure à 500 g."],["p","1.2.2. Etude sémiologique : c'est l'examen clinique qui va permettre de reconnaître les œdèmes."],["li","Leur siège : ils peuvent être :"],["li","localisés : soit aux régions déclives : chez le sujet debout : région malléolaire (chevilles) et jambes (le long de la face interne du tibia); chez le malade couché : région lombaire et face interne des cuisses. Soit aux régions où le tissu cellulaire est le plus lâche : paupières, dos des mains;"],["li","généralisés : à tout le tissu cellulaire sous-cutané. Ils sont bilatéraux et symétriques. Les œdèmes généralisés peuvent être associés à des épanchements des séreuses (pleural : hydrothorax, péritonéal : ascite), cet ensemble réalise un tableau d'anasarque."],["li","Leur aspect ; les œdèmes se traduisent par :"],["li","à l'inspection : une augmentation de volume de la région la peau est lisse, luisante, avec effacement des saillies et des méplats;"],["li","à la palpation : le signe du godet : la pression du doigt laisse une empreinte sur la peau. L'aspect des œdèmes va varier en fonction de leur cause :"],["li","les œdèmes de type rénal ou hépatique sont blancs, mous, indolores, gardant bien le godet ;"],["li","les œdèmes de causes cardiaques sont rosés ou rouges violacés, douloureux, fermes, gardant mal le godet. En fait l'aspect des œdèmes est aussi fonction de leur ancienneté :"],["li","récents : ils sont mous, prenant bien le godet;"],["li","anciens : ils sont fermes et douloureux."],["h4","1.2.3. Causes des œdèmes"],["li","Rénale (syndrome néphrétique et glomérulonéphrite aiguë)."],["li","Hépatique (cirrhose)."],["li","Cardiaque (insuffisance cardiaque globale ou droite)."],["p","1.3. Le myxœdème : réalise une infiltration particulière des téguments de type mucoïde s'accompagnant d'un excès de poids; il est un des signes caractéristiques de l'insuffisance thyroïdienne."],["h3","2. Les déficits pondéraux : sont de deux types : l'amaigrissement et les états de"],["p","déshydratation."],["h4","2.1. L'amaigrissement"],["p","2.1.1. Définition : l'amaigrissement est une perte de poids en rapport avec la diminution de la masse grasse active. Il s'agit d'un symptôme important d'un grand nombre de maladies."],["p","Il doit être différencié de la maigreur qui est une insuffisance pondérale non pathologique, en effet il s'agit d'un état :"],["li","Constitutionnel (poids insuffisant depuis l'enfance ou l'adolescence)."],["li","Stable."],["li","Qui ne s'accompagne d'aucun trouble."],["p","2.1.2. Etude sémiologique : elle repose sur l'interrogatoire et l'examen clinique."],["li","L'interrogatoire recherche :"],["li","La rapidité et l'importance quantitative de la perte de poids. La valeur sémiologique de l'amaigrissement est d'autant plus grande que celui-ci est plus massif et plus rapide (quelques semaines)."],["li","Un symptôme associé important la notion d'anorexie ou inappétence qui peut être responsable de l'amaigrissement, mais qui peut manquer."],["li","D'autres signes associés : troubles digestifs : nausée, vomissement, diarrhée, une asthénie."],["pre","•        L'examen clinique : va essayer d'apprécier l'état du pannicule adipeux (en cas"],["p","d'amaigrissement important la peau est flasque et paraît trop grande pour le corps : ceci est surtout visible au niveau des bras, des cuisses et de l'abdomen); ainsi que l'état des masses musculaires : au niveau des bras et des mollets."],["p","2.1.3. Causes des amaigrissements : les amaigrissements peuvent être classés en deux groupes selon qu'ils s'accompagnent ou non d'une anorexie."],["li","Amaigrissement avec anorexie :"],["li","Origine psychologique : dépression nerveuse."],["li","Origine digestive : ulcère."],["li","Maladies générales : cancer, tuberculose."],["li","Amaigrissement avec conservation de l'appétit :"],["li","Par augmentation des dépenses énergétiques : hyperthyroïdie, médicaments : extraits thyroïdiens, amphétamines."],["li","Par pertes digestives : diarrhée chronique."],["li","Diabète sucré insulinoprive."],["p","2.2. Les états de déshydratation : sont des états aigus. Ils sont dus à une diminution brutale du secteur liquidien extracellulaire, parfois associée à une diminution du secteur liquidien intracellulaire."],["p","2.2.1. La déshydratation extracellulaire : elle est en rapport avec une perte d'eau et de sodium, elle s'accompagne d'une hypovolémie."],["pre","•   Etude clinique : la déshydratation extracellulaire se reconnaît sur les signes"],["p","suivants :"],["li","La peau perd son élasticité normale, lorsqu'on pince la peau entre le pouce et l'index elle garde le pli ; ce signe se recherche à la face interne des cuisses et dans la région sous-claviculaire."],["li","Hypotonie des globes oculaire qui paraissent enfoncés dans les orbites; les yeux sont cernés."],["li","Hypotension artérielle et tachycardie."],["li","Oligurie."],["li","Perte de poids."],["li","Les causes :"],["li","Par fuite rénale : du fait d'une polyurie avec une natriurèse élevée supérieure à 2 g par jour : insuffisance rénale chronique."],["li","Par pertes digestives, vomissements et ou diarrhée, la natriurèse sera alors basse, inférieure à 500 mg par jour."],["p","2.2.2. La déshydratation intracellulaire : elle est rarement isolée; le plus souvent elle est associée à des signes de déshydratation extracellulaire. Elle se reconnaît sur les signes suivants :"],["li","Soif intense."],["li","Sécheresse des muqueuses qui se recherche au niveau de la muqueuse jugale."],["li","Polypnée, fièvre."],["li","Troubles de la conscience."],["li","Perte de poids importante."],["p","2.2.3. La déshydratation globale : on retrouve des signes de déshydratation extracellulaire et intracellulaire. Elle se voit en cas de pertes digestives importantes."],["p","La fièvre"],["h2","I. DÉFINITION, GÉNÉRALITÉS"],["p","On désigne par fièvre toute élévation de la température centrale au-dessus de la normale : c'est-à-dire au-dessus de 37 °C le matin et au-dessus de 37,5 °C le soir."],["p","La température centrale correspond à la température rectale ou encore à la température buccale (seule utilisée dans les pays anglo-saxons). La température cutanée est plus basse que la température centrale d'où la règle de bannir la prise de la température au niveau du creux axillaire."],["p","La prise de température doit être effectuée matin et soir tous les jours à la même heure chez les malades alités, chez les autres sujets elle doit être prise le matin avant le lever et le soir après une demi-heure de repos absolu, avant le repas."],["h2","II. RAPPEL PHYSIOLOGIQUE"],["h3","1. La température normale"],["p","Au repos la température normale est de 37 °C en moyenne; elle subit des variations nycthémérales de 1 °C du matin au soir; elle est de 36,5 °C le matin et de 37,5 °C le soir (fig. 2)."],["p","Fig1. – Courbe thermique au cours du cycle menstruel."],["h3","2. Variations physiologiques"],["p","Certains facteurs peuvent induire des variations de la température chez le sujet normal :"],["p","2.1. L'effort : entraîne une élévation de température de plusieurs dixièmes de degré; après un effort musculaire intense la température peut atteindre 39 °C. D'où la règle de ne prendre la température qu'après 30 minutes de repos."],["p","2.2. Le cycle menstruel : chez la femme la température varie au cours du cycle menstruel : on mesure la température chaque matin avant le lever."],["li","Du 1er au 13e jour du cycle menstruel la température est à 36,5°C."],["li","A partir du 14e jour du cycle qui correspond à la ponte ovulaire la température s'élève de 2 à 3 dixièmes de degré et revient à son chiffre antérieur le 1er jour des régies (fig. 1)."],["p","Fig2. - Courbe de température normale"],["li","3. La régulation thermique :"],["p","Chez le sujet normal la température centrale reste à peu prés constante aux environs de 37 °C grâce à un équilibre constant entre la quantité de chaleur produite (thermogenése) et la quantité de chaleur perdue (thermolyse) par l'organisme; l'homme est un homéotherme. Cette régulation thermique équilibrée n'existe pas chez le nourrisson dans les premières semaines de la vie d'où la nécessité de surveiller la température ambiante au cours de cette période de la vie."],["p","3.1. La thermogenèse : dans l'organisme la chaleur est produite par la combustion des glucides, des lipides et des protides apportés par l'alimentation."],["p","Cette combustion est sous la dépendance de certaines hormones : hormones thyroïdienne et hypophysaire ; elle est également augmentée par l'activité musculaire volontaire ou involontaire : par exemple le frisson."],["p","3.2. La thermolyse : l'organisme perd de la chaleur par rayonnement qui entraîne une perte de chaleur proportionnelle à la température cutanée et par évaporation qui se fait par perspiration cutanée et pulmonaire et surtout par transpiration."],["p","3.3. Les mécanismes de la régulation thermique seront mis enjeu lors des variations de la température ambiante :"],["li","Si la température ambiante s'abaisse : l'organisme p0ut augmenter sa production de chaleur ou thermogénèse par :"],["li","l'activité musculaire volontaire;"],["li","l'activité musculaire involontaire : le frisson ;"],["li","l'augmentation des sécrétions hormonales hypophysaires et thyroïdiennes et diminuer sa déperdition de chaleur par vasoconstriction cutanée."],["li","Si la température ambiante s'élève l'organisme peut augmenter sa déperdition de chaleur ou thermolyse par :"],["li","la vasodilatation cutanée;"],["li","la transpiration cutanée ;"],["li","la polypnée."],["p","3.4. Les centres régulateurs : il existe des récepteurs thermiques localisés au niveau de la surface corporelle qui envoient leurs impressions sensitives au centre régulateur situé dans le plancher du troisième ventricule qui joue le rôle de thermostat."],["h2","III. PHYSIOPATHOLOGIE DE LA FIEVRE 1. Les mécanismes de la fièvre"],["p","1.1. Le coup de chaleur : lorsque la température ambiante s'élève anormalement le mécanisme régulateur de la thermolyse est dépassé, il y a apparition de fièvre."],["p","1.2. L’hyperthyroïdie : la fièvre est due à l'augmentation du métabolisme de base donc à l'augmentation des combustions."],["p","1.3. Certaines maladies du système nerveux : par l'atteinte du centre régulateur situé dans le troisième ventricule (encéphalite ou tumeur) s'accompagnent de fièvre."],["p","1.4. Les maladies infectieuses : on pense que ce sont les substances pyrogènes d'origine microbienne qui agissent directement sur le thermostat central en modifiant le niveau de la régulation thermique."],["h3","2. La thermo-régulation au cours de la fièvre"],["p","Lorsque la température du thermostat est réglée à une valeur plus élevée par exemple 40° au lieu de 37°, l'organisme réagit comme s'il était placé dans une enceinte dont la température ambiante serait basse ; les mécanismes régulateurs de thermogenèse sont donc mis en Jeu pour amener la température corporelle à ce nouveau niveau : vasoconstriction cutanée, frisson, augmentation du métabolisme cellulaire."],["p","Au contraire lors de la défervescence le mécanisme inverse de la thermolyse est mis en jeu d'où apparition de la sudation."],["p","Ceci est parfaitement illustré dans la fièvre observée au cours de l'accès palustre qui se déroule en quelques heures : l'ascension thermique brutale et élevée est précédée d'un frisson et d'une sensation de froid intense qui amène le sujet à se couvrir de plusieurs couvertures (thermogenèse); puis lorsque la fièvre est installée le sujet ressent une sensation de chaleur intense et dans les heures qui suivent la défervescence a lieu et le sujet présente une transpiration très abondante (thermolyse) d'où la succession en quelques heures de la classique triade : frisson - chaleur - sueur."],["h3","3. Les conséquences de la fièvre"],["li","Augmentation du métabolisme cellulaire : d'où augmentation de la fréquence et du débit cardiaque."],["li","Hypercatabolisme protidique : d'où amaigrissement."],["li","Déperdition hydrique : donc risque de déshydratation."],["li","Si la température s'élève à 41 ° risque de convulsions. Ces convulsions sont surtout fréquentes chez l'enfant chez lequel elles apparaissent pour un seuil d'autant plus bas que l'enfant est plus jeune."],["h2","IV. ETUDE SÉMIOLOGIQUE DE LA FIÈVRE"],["p","La fièvre est un motif fréquent de consultation. Selon la durée elle peut être de plusieurs types : brève : il s'agit d'un accès thermique ne"],["pre","dépassant pas 24 heures; elle peut durer quelques jours ou bien elle peut être prolongée,       3"],["p","semaines, parfois des mois. Son étude va reposer sur l'interrogatoire, l'étude de la courbe thermique et l'examen clinique."],["li","1. L'interrogatoire : va essayer de préciser :"],["li","Le mode de début :"],["li","Aigu : ascension de la fièvre de 37° à 40° en quelques heures, débutant par un frisson unique et prolongé; exemple la pneumonie."],["li","Progressif avec ascension de 0,5° par jour, le maximum thermique 40° étant atteint en 4 à 5 jours; exemple : la fièvre typhoïde (fig. 3)."],["li","Insidieux, ne permettant pas de préciser le début exact."],["pre","•   L'existence de symptômes évocateurs de l'affection causale : exemple la dysphagie"],["p","(angine) - une toux (pneumopathie) - brûlure mictionnelle (infection urinaire)."],["li","L'évolution de cette fièvre dans le temps :"],["li","Permanente."],["li","Par accès."],["li","Variations dans le nycthémère : fièvre matinale ou à l'opposé fièvre vespérale. Cette évolution sera mieux précisée par l'étude de l'allure de la courbe thermique."],["pre","Fig3. Ascension progressive de la fièvre     Fig4. – Fièvre en plateau"],["li","2. Etude de la courbe thermique : Cette courbe thermique va être établie en reportant, sur la feuille de température, la température du matin et du soir et mieux, si cela est possible, toutes les 3 heures. La courbe thermique peut prendre l'un des aspects évocateurs suivants :"],["p","a) Fièvre continue ou en plateau : elle est à 40° avec une faible rémission de 0,5° le matin, se voit dans la fièvre typhoïde, les septicémies, le paludisme de primo-invasion (fîg. 4)."],["p","b) Fièvre rémittente quotidienne : la température du matin est sub-normale, elle s'élève à 39° ou 40° le soir, se voit dans les suppurations profondes (fig. 5)."],["p","c) Fièvre intermittente : accès de fièvre séparés par des intervalles d'apyrexie totale régulièrement espacés."],["p","1° C'est l'accès palustre qui évolue en 3 phases : frisson - chaleur (élévation thermique)"],["li","sueurs; il réalise soit une fièvre de type tierce (1 accès fébrile le 1er, le 3e, le 5e jour...) (fig. 6-1) soit une fièvre de type quarte (1 accès fébrile le 1er, le 4e, le 7e jour...) (fig. 6-2)."],["pre","FIG. 5. — Fièvre rémittente.     FIG. 6-1.   Fièvre tierce.   FIG. 6-2. — Fièvre quarte."],["p","2° L'accès pseudo-palustre : accès de fièvre séparés par des intervalles d'apyrexie irrégulièrement espacés (cholécystite)."],["p","d) Fièvre ondulante : il s'agit de poussées thermiques à début et fin progressives en lysis alternant avec des rémissions thermiques complètes; évoluant sur des semaines ou des mois (maladie de Hodgkin, Brucellose) (fig. 7)."],["p","FIG. 7. — Fièvre ondulante."],["p","e) Fébricule : il s'agit d'un décalage thermique aux environs de 38° (tuberculose - hyperthyroïdie) (Fig. 8)."],["p","Fig8. — Fébricule."],["p","f) Fièvre désarticulée ou fièvre hectique : est une fièvre prolongée à grandes oscillations."],["h3","3. L'examen clinique va rechercher, les signes accompagnateurs de la fièvre et des signes"],["p","évocateurs de Pédologie."],["p","3.1. Signes accompagnateurs :"],["li","Augmentation de la température cutanée."],["li","Accélération de la fréquence respiratoire."],["li","Accélération du pouls : le pouls est en rapport avec la température sauf dans la fièvre typhoïde et les méningococcémies où il est dissocié."],["li","Signes de déshydratation : oligurie."],["li","Asthénie - amaigrissement."],["p","3.2. Signes évocateurs de l’étiologie :"],["li","Des troubles de la conscience : tuphos : fièvre typhoïde."],["li","Un exanthème : éruption cutanée morbiliforme : rougeole; taches rosées lenticulaires fièvre typhoïde."],["h2","V. CAUSES DES FIÈVRES"],["p","Elles sont nombreuses, elles seront déterminées grâce à l'interrogatoire, l'examen clinique et des examens complémentaires : numération formule sanguine - hémoculture dosage des anticorps sériques (sérodiagnostics), et téléthorax."],["h3","1. Les causes infectieuses sont les plus nombreuses"],["p","II peut s'agir de maladies infectieuses bactériennes, virales, parasitaires ou mycosiques."],["p","1.1. Parmi les maladies infectieuses bactériennes nous insisterons sur la fièvre typhoïde à cause de sa fréquence et de l'importance de son diagnostic précoce. Elle évolue en 3 phases ou septénaires :"],["li","Le premier septénaire ou phase de début est marqué par des :"],["li","Signes fonctionnels : Céphalée - anorexie et constipation."],["li","Signes généraux : une fièvre d'installation progressive, élévation de 1 degré du matin au soir avec rémission de un demi-degré du soir au matin pour atteindre 39- 40° à la fin du 1er septénaire."],["li","Signes physiques : fosse iliaque droite sensible et gargouillante. Le diagnostic de certitude repose sur l'hémoculture. e"],["li","Le 2 septénaire ou phase d'état : est marqué par des :"],["li","Signes fonctionnels :"],["li","un tuphos : malade prostré, répondant mal aux questions;"],["li","troubles digestifs : anorexie, surtout diarrhée : couleur ocre « jus de melon »."],["li","Signes généraux :"],["li","fièvre en plateau à 40° ;"],["li","pouls dissocié : 90 à 100/minute."],["li","Signes physiques :"],["li","splénomégalie modérée;"],["li","taches rosées lenticulaires siégeant à la partie haute de l'abdomen et la partie basse du thorax ; ce sont des macules rosées de 2 à 3 mm de diamètre en règle peu nombreuses. Le diagnostic de certitude repose sur l'hémoculture et sur le séro-diagnostic qui devient positif à la fin de ce 2e septénaire."],["li","Au 3e ou 4e septénaire ou plus précocement après antibiotique, défervescence thermique en lysis : la fièvre diminue progressivement de 1 ° du soir au matin."],["p","1.2. Le paludisme est l'infection parasitaire fébrile la plus couramment rencontrée. II évolue en 2 phases :"],["li","1ère phase : paludisme de primo-invasion : Le sujet présente une fièvre en plateau d'une durée de 4 à 5 jours."],["li","2e phase : c'est la phase des accès palustres :"],["p","Le sujet pr sente des acc*s typiques : acc*s palustre de type tierce ou quarte qui volue en 3 stades :"],["li","Frisson : le sujet éprouve une sensation de froid intense, il s'enfouit sous plusieurs couvertures, la température est basse souvent inférieure à 36°, ce stade dure 30 minutes à 1 heure."],["li","Chaleur : le malade se réchauffe, la température atteint 40° à 41 °, le malade rejette ses couvertures; le pouls est rapide; ce stade dure 2 à 4 heures."],["li","Sueurs : des sueurs profuses apparaissent, la température revient à la normale, cette phase se termine par l'émission d'urines foncées abondantes. Le seul signe objectif retrouvé à l'examen clinique du malade est la splénomégalie de volume modéré. Le diagnostic repose dans tous les cas sur l'examen du frottis sanguin et de la goutte épaisse."],["h3","2. Les causes non infectieuses"],["p","2.1. Les hémopathies : surtout leucémies aiguës et maladie de Hodgkin."],["p","2.2. Les cancers."],["p","2.3. Les maladies inflammatoires : collagénoses et rhumatismes inflammatoires. Ainsi la fièvre est un symptôme important qui peut relever d'un grand nombre de causes parmi lesquelles les maladies infectieuses restent de loin les plus fréquentes."]]},{"ar":"سيميولوجيا الجلد","fr":"La sémiologie cutanée","w":1707,"b":[["p","La peau est l'enveloppe du corps humain : elle est donc un organe immédiatement accessible et se prête à un examen clinique qui peut être minutieux et riche de renseignements."],["h2","I. RAPPEL ANATOMO-PHYSIOLOGIQUE"],["p","La peau est formée de 3 couches :"],["h3","1. L'épiderme : qui par sa couche cornée a une fonction de protection contre les agents"],["p","extérieurs micro-organismes, produits chimiques, rayons ultraviolets."],["p","La mélanine que contient l’épiderme a une fonction de protection contre la pénétration des rayons ultraviolets."],["h3","2. Le derme : possède plusieurs fonctions : il protège contre les traumatismes, il a une"],["p","fonction neurologique, car il contient les terminaisons nerveuses, enfin il joue le rôle de réservoir d'eau et d'électrolytes."],["li","3. L'hypoderme : est un réservoir de graisses, il joue le rôle d'un isolant thermique. Les phanères sont des structures kératinocytaires, c'est-à-dire qu'elles proviennent de la couche cornée; elles s'étendent de l'épiderme au derme où elles s'enfoncent; ce sont les ongles, les poils, les glandes sébacées et les glandes sudoripares. Ces glandes, par leur sécrétion, forment un film hydrolipidique qui protège la peau (fig. 1)."],["p","IL L'EXAMEN DE LA PEAU L'examen de la peau est facile car il s'agit d'un organe accessible à la vue et au toucher. Cet examen devra intéresser systématiquement la peau, les muqueuses et les phanères : cheveux, poils et ongles."],["p","Couche cornée Epiderme"],["p","Derme"],["p","Glande sébacée Hypoderme"],["p","FIG 1. — Histologie de la peau et des annexes. L'examen de la peau comprend 3 temps : l'interrogatoire accompagnera l'inspection et la palpation."],["li","1. L'interrogatoire va s'attacher à préciser les points suivants :"],["li","La date et le mode d'apparition des lésions."],["li","Les circonstances écologiques : notion d'un contage septique, d'application ou d'ingestion médicamenteuse, d'exposition à certains agents physiques."],["li","Les particularités évolutives : évolution d'un seul tenant ou au contraire par poussées."],["li","La recherche de signes fonctionnels accompagnateurs :"],["li","Douleur localisée à type de cuisson ou de brûlure, douleur de type névralgique, telles qu'on peut les rencontrer au cours du zona (infection virale à tropisme neuroectodermique)."],["li","Prurit : la recherche de la notion de prurit est fondamentale. En effet ce signe est à la base de certaines classifications dermatologiques; c'est ainsi que l'on distingue :"],["li","les dermatoses prurigineuses : exemple urticaire, eczéma;"],["li","les dermatoses non prurigineuses : exemple psoriasis."],["li","2. L'inspection : est le temps essentiel, elle doit obéir à 4 règles; elle doit être :"],["li","Totale : le malade doit être entièrement dévêtu et l'examen doit concerner non seule ment la peau en totalité, mais aussi les ongles, les poils et les cheveux."],["li","Préparée : après nettoyage de la peau."],["li","Bien éclairée : à la lumière du jour en s'aidant d'une loupe."],["li","Minutieuse : elle doit préciser la topographie, la dimension, la teinte, les contours, le relief, le nombre et le mode de groupement des lésions. Elle va apprécier la couleur de la peau et rechercher une anomalie."],["h3","3. La palpation"],["p","3.1. Lorsqu'il n'existe pas de lésion cutanée apparente : la palpation doit systématiquement apprécier la souplesse, l'élasticité, la température, le degré de sécheresse ou d'humidité : par exemple au cours du myxœdème (insuffisance thyroïdienne) les téguments sont épaissis et secs, au contraire en cas d'hyperthyroïdie les téguments sont chauds et humides."],["p","La palpation se fait avec la pulpe et avec la face dorsale des doigts pour mieux percevoir les différences de température; entre le pouce et l'index pour apprécier l'épaisseur et la souplesse de la peau. C'est ainsi qu'on recherche la persistance du pli cutané signant un état de déshydratation."],["p","La palpation permet également d'apprécier l'état du tissu sous-cutané : le degré d'adiposité; l'existence d'œdèmes sous-cutanés par la recherche du signe du godet."],["p","3.2. Lorsqu'il existe des lésions cutanées apparentes à l'inspection, la palpation renseigne sur la consistance : induration ou souplesse de la base d'implantation, recherche de l'adhérence aux plans profonds."],["p","Par la vitro-pression, qui peut être remplacée par l'étirement de la peau entre le pouce et l'index, on peut faire la différence entre une lésion érythémateuse s'effaçant à la vitro pression et une lésion purpurique qui ne s'efface pas."],["p","Le grattage des lésions peut mettre en évidence l'existence de squames."],["h2","III. LES DIFFÉRENTES ANOMALIES CUTANÉES"],["p","Trois types d'anomalies cutanées peuvent être rencontrés : les modifications de la teinte des téguments sans lésions cutanées, les lésions cutanées et les éruptions accompagnant certaines maladies infectieuses."],["h3","1. Les modifications de la teinte des téguments sans lésion cutanée"],["p","1.1. La pâleur : due :"],["li","Soit à une vasoconstriction des petits vaisseaux, exemple la pâleur au cours de la syncope."],["li","Soit à une diminution du nombre de globules rouges, c'est la pâleur de l'anémie."],["p","1.2. L'érythème : est une coloration rouge, due à une vaso-dilatation des petits vaisseaux."],["p","1.3. L'érythrose : est également une coloration rouge, due à une augmentation du nombre de globules rouges encore appelée polyglobulie. L'érythrose prédomine au niveau des parties découvertes et siège au niveau de la peau et des muqueuses."],["p","1.4. La cyanose : est une coloration bleutée des téguments et des muqueuses due à une augmentation de l'hémoglobine réduite, supérieure à 5 g/100 ml dans le sang capillaire."],["p","1.5. Les dyschromies : sont définies comme des variations de la richesse de la peau en pigments."],["p","1.5.1. Les hyperchromies sont des excès de mélanine; elles sont :"],["li","Soit diffuses : c'est la mélanodermie réalisant un brunissement diffus des téguments prédominant aux régions découvertes et aux régions normalement pigmentées et des taches ardoisées au niveau des muqueuses."],["li","Soit localisées : ce sont les taches pigmentaires :"],["li","Le chloasma ou masque de grossesse."],["li","Les éphélides ou taches de rousseur qui sont des macules brunâtres."],["li","Les naevi : sont des taches pigmentaires le plus souvent congénitales s'accompagnant d'une modification de la texture des téguments : ce sont les naevi pigmentaires. Les naevi peuvent être également pileux ou vasculaires."],["p","1.5.2. Les hypochromies : sont des défauts de mélanine ou leucodermies ; elles réalisent une dépigmentation diffuse telle qu'elle est rencontrée dans l'albinisme par absence congénitale de pigment."],["p","1.5.3. Les dyschromies mixtes : ce sont les leuco-mélanodermies où les taches hyperpigmentées voisinent avec des taches dépigmentées ; cette anomalie est réalisée au cours du vitiligo."],["p","1.6. Des colorations anormales peuvent être dues :"],["p","1.6.1. A l'accumulation de bilirubine au niveau de la peau : coloration jaune au cours de l'ictère."],["p","1.6.2. Au dépôt anormal de certains sels de métaux : coloration grisâtre après ingestion prolongée de médicaments à base d'argent, d'or ou de bismuth."],["h3","2. Les lésions cutanées"],["p","Sont soit primaires, soit secondaires consécutives à des lésions primaires."],["h4","2.1. Les lésions primaires"],["p","2.1.1. La macule (fig. 2) est une tache réalisant une modification parcellaire de la teinte des téguments sans modification de l'épaisseur ni de la consistance, dont le diamètre est inférieur à 1 cm."],["p","Elle peut être :"],["li","Erythémateuse : de couleur rouge, s'effaçant à la vitro-pression."],["li","Purpurique : en rapport avec une extravasation du sang hors des capillaires, de couleur rouge, ne s'effaçant pas à la vitro-pression, punctiforme ou lenticulaire, c'est une pétéchie; elle peut être en stries, ce sont les vibices."],["li","Rouge sang comme la pétéchie, c'est la télangiectasie : qui est une ectasie des petits vaisseaux dermiques s'effaçant à la vitro-pression."],["li","Pigmentaire : tache de rousseur, naevus plan."],["p","2.1.2. La papule (fig. 3) : est une élevure cutanée, circonscrite de moins de 1 cm de diamètre, solide, due à un infiltrât superficiel, qui guérit sans séquelles."],["p","2.1.3. La vésicule : est une élevure circonscrite de la peau, de diamètre inférieur à 1 cm, contenant une sérosité."],["p","2.1.4. La bulle ou phlyctène (fig. 4) : possède les mêmes caractères que la vésicule, elle en est différente par la taille qui est supérieure à 1 cm."],["p","2.1.5. La pustule : est semblable à la vésicule et à la bulle, elle n'en diffère que par son contenu purulent."],["pre","Fig2. – La macule                               Fig3. – La papule"],["pre","FIG. 4. — La vésicule.                FIG. 5. — Le nodule."],["p","2.1.6. Le nodule (fig. 5) : est une masse solide qui siège dans l’hypoderme donc plus profondément que la papule, son diamètre est inférieur à 1 cm ; la nouure a les mêmes caractères, mais son diamètre est supérieur à 1 cm. La nouure est l'élément caractéristique de l’érythéme noueux."],["p","2.1.7. Le kyste (fig. 6) : est une cavité remplie de liquide et située dans le derme ou l’hypoderme."],["p","2.1.8. La tumeur : est une néoformation cutanée de nature variable, bénigne ou maligne."],["h4","2.2. Les lésions secondaires"],["p","2.2.1. Les squames (fig. 7) : sont des lamelles épidermiques détachées de la couche cornée elles sont caractéristiques du psoriasis."],["p","2.2.2. Les croûtes (fig. 8) : représentent un exsudât desséché sur la peau, se voient au cours de l’impétigo."],["p","2.2.3. Les fissures (fig. 9) : sont des déchirures ou fentes de l’épiderme."],["pre","FIG. 6. — Le kyste.             FIG. 7. — Les squames."],["pre","Fig8. – Une croûte          Fig9. – Une fissure"],["pre","Fig10. – Une érosion   Fig11. – Une ulcération"],["p","2.2.4. Une érosion ou exulcération (fig. 10) : est une perte partielle intéressant la couche superficielle de la peau (épiderme) ou d'une muqueuse, elle guérit sans laisser de cicatrice."],["p","2.2.5. Une ulcération (fig. 11 ) : est une zone où la perte de l'épithélium de la peau ou de la muqueuse est totale, elle guérit en laissant une cicatrice indélébile."],["h3","3. Les éruptions cutanées accompagnant les maladies infectieuses appelées fièvres"],["p","éruptives L'éruption cutanée dans ce cas réalise un exanthème qui peut être précédé ou accompagné d'une éruption au niveau des muqueuses appelée énanthème. Les principales fièvres éruptives sont :"],["p","3.1. La scarlatine : qui réalise une éruption érythémateuse diffuse faite de nappes rouges confluentes sans intervalle de peau saine s'accompagnant d'une sensation de cuisson."],["p","3.2. La rougeole est caractérisée par une éruption dite morbiliforme faite de macules : taches rouges, irrégulières, inégales, non confluentes. Un énanthème caractéristique, le signe de Koplick, fait d'un semis de petits points blanchâtres saupoudrant une muqueuse jugale érythémateuse, précède l'exanthème."],["p","3.3. La rubéole : réalise une éruption érythémato-maculeuse."],["p","3.4. La varicelle : réalise une éruption vésiculeuse diffuse."],["p","3.5. Le zona : réalise une éruption vésiculeuse localisée de topographie radiculaire ou métamérique accompagnée de douleurs de même topographie."],["p","3.6. La variole : à la phase d'état est caractérisée par une éruption pustuleuse. Ainsi l'examen de la peau a une grande importance car il peut mettre en évidence des anomalies qui peuvent amener au diagnostic précis d'une maladie."]]},{"ar":"سيميولوجيا الغدد الصماء","fr":"La sémiologie endocrinienne","w":1186,"b":[["p","L'étude de la sémiologie endocrinienne comportera celle de la glande thyroïde, des glandes surrénales et enfin celui du métabolisme glucidique ; nous exclurons de ce cadre l'étude des gonades qui sera envisagée dans la sémiologie génito-urinaire."],["h2","I. SÉMIOLOGIE DE LA GLANDE THYROÏDE"],["h3","1. Rappel anatomo-physiologique"],["p","1.1. Le corps thyroïde est une glande à sécrétion interne située à la face antérieure du cou devant la trachée dont elle est solidaire."],["p","A l'état normal le corps thyroïde pèse 25 à 30 g."],["p","1.2. Le corps thyroïde sécrète les hormones thyroïdiennes : T3 et T4 qui augmentent l'activité métabolique de toutes les cellules de l'organisme."],["p","Cette sécrétion est réglée par une stimuline hypophysaire, la TSH elle-même sous le contrôle de la TRH hypothalamique."],["h3","2. L'examen clinique"],["p","La thyroïde est la seule glande endocrine accessible à l'inspection et à la palpation."],["p","2.1. Techniques de l'examen : l'examen de la thyroïde fait appel à la palpation combinée à l'inspection :"],["li","De face (fig1) : on pratique la palpation de l'isthme et des lobes en faisant fléchir et incliner la tête du sujet vers le côté examiné; cette palpation se fait au repos puis pendant un mouvement de déglutition en faisant boire le sujet à petites gorgées : la thyroïde est mobile avec les mouvements de déglutition. Ceci permet de mettre en évidence une augmentation de volume ou un nodule, l'existence d'un frémissement ou l'existence d'adénopathies cervicales associées. En se plaçant derrière le sujet (fig. 2), la même technique sera utilisée que celle de face."],["li","L'auscultation recherche un souffle au niveau de la thyroïde."],["p","Fig1. - Technique de la palpation de la thyroïde de face."],["p","2.2. Résultats :"],["p","2.2.1. A l'état normal : le corps thyroïde est à peine perceptible à la palpation."],["p","2.2.2. Les anomalies du corps thyroïde peuvent être morphologiques ou fonctionnelles."],["p","a) Les anomalies morphologiques sont le goitre et le cancer. Le goitre : on appelle goitre une augmentation de volume de la thyroïde, il existe plusieurs types de goitre :"],["li","Le goitre simple : augmentation de volume de la thyroïde qui n'est ni inflammatoire, ni cancéreuse, ni accompagnée de signes de dysthyroïdie ; suivant l’épidémiologie on distingue :"],["li","Le goitre endémique : fréquence élevée dans une région (exemple : Grande Kabylie)."],["li","Le goitre sporadique : survenant de façon isolée. Suivant son aspect morphologique on distingue :"],["li","Le goitre simple diffus : selon son volume. Type 1 : seulement palpable. Type 2 : visible à la seule inspection. Type 3 : énorme goitre en besace."],["li","Le goitre nodulaire : le plus souvent nodule unique (lobes ou isthme)."],["li","Le goitre avec dysfonctionnement thyroïdien. Le cancer est une tuméfaction thyroïdienne très dure plus ou moins fixée aux plans profonds, pouvant s'accompagner :"],["li","De signes de compression : de la trachée : dyspnée (gêne respiratoire); de l’œsophage : dysphagie (gêne à la déglutition); du nerf récurrent : dysphonie (trouble de la voix)."],["li","D'adénopathies cervicales : difficiles à mettre en évidence."],["p","b) Les anomalies fonctionnelles :"],["li","Le syndrome d’hyperthyroïdie, ou maladie de Basedow, est caractérisé par les signes suivants :"],["li","un goitre avec signes d'hypervascularisation : à la palpation on retrouve un frémissement : (thrill); à l'auscultation un souffle systolique ou continu;"],["li","une exophtalmie : protrusion des globes oculaires;"],["li","des signes de thyréotoxicose : tremblement, tachycardie, amaigrissement et hypersudation."],["li","Le syndrome d'hypothyroïdie ou myxœdème, comporte les signes suivants :"],["li","un myxœdème : qui est une infiltration cutanée pseudo-œdémateuse (par une substance muco-polysaccharidique), avec troubles des phanères (poils, cheveux, ongles, dents);"],["li","une bradycardie;"],["li","un ralentissement des activités : physique, psychique, sexuelle."],["p","FIG. 2. — Technique de la palpation de la thyroïde en se plaçant derrière le malade."],["p","TABLEAU RÉCAPUTILATIF DES ANOMALIES FONCTIONNELLES DE LA THYROÏDE"],["pre","Hyperthyroïdie Maladie de Basedow       Hypothyroïdie Myxœdème"],["pre","Corps thyroïde           Goitre                                  Atrophie (inconstante)\nYeux                     Exophthalmie\nCœur                     Tachycardie et Tremblement              Bradycardie"],["pre","Poids                    Amaigrissement                          Augmentation de poids"],["p","(myxœdème)"],["pre","Transit digestif     Diarrhée                                    Constipation\nRégulation thermique Hyperthermie. Thermophobie                  Hypothermie. Frilosité"],["h2","II. SÉMIOLOGIE DES SURRÉNALES"],["h3","1. Rappel anatomo-physiologique"],["p","1.1. Les surrénales sont des glandes endocrines profondes situées au pôle supérieur des reins, donc inaccessibles à l'examen clinique formées de 2 parties : la corticosurrénale et la médullosurrénale."],["p","1.2. La corticosurrénale sécrète :"],["li","Le cortisol qui agit sur le métabolisme des glucides : c'est une hormone hyperglycémiante et il a une action catabolisante sur les protides. La sécrétion du cortisol est sous la dépendance d'une hormone hypophysaire, l’ACTH, selon le principe général du feed-back, elle-même sous la dépendance de la CRH d'origine hypothalamique."],["li","L'aldostérone : maintient l'équilibre hydro-électrique de l'organisme en conservant le sodium (tube distal du néphron) et donc l'eau. La sécrétion de l'aldostérone est peu influencée par l'ACTH."],["li","Les androgènes."],["p","1.3. La médullosurrénale : sécrète l'adrénaline."],["h3","2. Les anomalies des surrénales"],["p","2.1. Les dysfonctionnements des corticosurrénales :"],["li","L'insuffisance surrénale ou maladie d'Addison associe :"],["li","Une mélanodermie."],["li","Des troubles digestifs : anorexie, nausées, douleur abdominale, diarrhée."],["li","Une hypotension artérielle."],["li","L'hypercorticisme ou syndrome de Cushing associe :"],["li","Une obésité facio-tronculaire avec amaigrissement des membres."],["li","Des signes cutanés : érythrose, vergetures et acné."],["li","Une hypertension artérielle."],["p","TABLEAU RÉCAPUTILATIP DES ANOMALIES FONCTIONNELLES DE LA CORTICO- SURRÉNALE"],["pre","                     Maladie de Cushing           Maladie d'Addison\nSignes cutanés       Erythrose cervico-faciale    Mélanodermie"],["p","Vergetures Acné"],["pre","TA                   HTA                          Hypotension\nPoids                Obésité facio-tronculaire    Amaigrissement"],["p","2.2. La tumeur de la médullosurrénale ou phéochromocytome : s'accompagne d'un excès d'adrénaline d'où HTA."],["h2","III. LE MÉTABOLISME GLUCIDIQUE ET SES ANOMALIES"],["h3","1. Rappel physiologique"],["p","La concentration du glucose sanguin ou glycémie est variable au cours de la journée. Seule la glycémie à jeun est à un chiffre stable."],["p","Plusieurs hormones règlent l'équilibre glycémique de l'organisme :"],["li","L'insuline sécrétée par les cellules bêta des îlots de Langerhans du pancréas : est une hormone hypoglycémiante."],["li","Le glucagon sécrété par les cellules alpha des îlots de Langerhans, le cortisol, la STH et les catécholamines : sont des hormones hyperglycémiantes."],["h3","2. Les anomalies du métabolisme glucidique"],["p","2.1. Le diabète sucré : est un trouble de la glycorégulation caractérisé par une hyperglycémie."],["p","Trois signes fonctionnels permettent de le suspecter :"],["li","La polyphagie."],["li","La polydipsie (augmentation de la soif)."],["li","La polyurie (augmentation de la diurèse des 24 heures au-delà de 3 litres). L'âge du malade permet de distinguer 2 types de diabète :"],["li","Le diabète de la maturité : où le poids est normal ou en excès (obésité) et où la sécrétion d'insuline est conservée."],["li","Le diabète juvénile : où le sujet est maigre et où la sécrétion d'insuline est effondrée."],["p","2.2. L'hypoglycémie : à l'opposé du diabète l'hypoglycémie est définie comme une diminution de la glycémie, elle peut être :"],["p","2.2.1. Modérée comprise entre 0,50 à 0,70 g/1, elle va entraîner des signes mineurs :"],["li","Asthénie physique et psychique."],["li","Sueurs froides."],["li","Tachycardie avec instabilité tensionnelle."],["li","Sensation de faim et crampes épigastriques."],["p","2.2.1. Sévère : inférieure à 0,50g/l, elle s'accompagne de signes majeurs :"],["li","Coma hypoglycémique avec sueurs abondantes, hypertonie et agitation, signe de Babinski bilatéral, crises convulsives. On assiste à une disparition rapide des troubles si une injection de sérum glucose hypertonique est faite rapidement. Les causes des hypoglycémies sont de 2 types :"],["li","Hypoglycémies provoquées : par une injection d'insuline, la prise d'hypoglycémiants oraux ou le jeûne prolongé."],["li","Les hypoglycémies spontanées : au cours des tumeurs pancréatiques, de l'insuffisance antéhypophysaire, de l'insuffisance corticosurrénale, de l'insuffisance hépatique grave."]]},{"ar":"تضاريس الصدر وسيميولوجيا الثدي","fr":"Topographie du thorax, sémiologie des seins","w":2762,"b":[["h2","I. TOPOGRAPHIE DU THORAX"],["h3","1. Considérations générales"],["p","Le thorax ou cage thoracique est constitué d'une charpente osseuse sur laquelle viennent s'insérer les muscles. Il a la forme d'un tronc de cône dont l'orifice supérieur est le lieu de passage de la trachée, de l'œsophage, des gros vaisseaux du cou et de la tête et dont l'orifice inférieur est fermé par le diaphragme."],["h4","1.1. La charpente osseuse. (fig. 1)"],["li","Les vertèbres dorsales :"],["li","12 vertèbres dorsales : Dl à D12. La 1\" vertèbre dorsale est située juste au-dessous de la e 7 vertèbre cervicale qui est la vertèbre proéminante facile à repérer, située à la base du cou."],["p","FIG. 1. — La charpente osseuse."],["li","Les côtes : au nombre de 12 s'insèrent en arrière sur les vertèbres dorsales."],["li","Les 7 premières sont les côtes vraies, elles sont unies au sternum par un cartilage costal."],["li","Les fausses côtes : les 8e, y et IV côtes sont reliées par leur cartilage costal au cartilage costal de la 7e côte; donc indirectement au sternum."],["li","Les côtes flottantes : les 11e et 12e côtes : dont le cartilage antérieur reste libre."],["li","Le sternum : formé de 3 parties : le manubrium sternal, le corps du sternum et l'appendice xyphoïde; sur lequel viennent s'insérer les côtes et les clavicules. L'union du corps et du manubrium forme une arête saillante en avant : l'angle de Louis, c'est à son niveau que vient s’articuler la 2e côte."],["p","1.2. Les constituants musculaires :"],["li","Les muscles intercostaux : occupent les espaces intercostaux ; les éléments vasculaires et nerveux intercostaux cheminent sous le bord inférieur de chaque côte."],["li","Le diaphragme : muscle inspiratoire principal, ferme en bas la cage thoracique, il est innervé par le nerf phrénique. Il est percé de 3 orifices : en arrière l'orifice aortique, en avant de lui l'orifice œsophagien, latéralement à droite l'orifice de la veine cave inférieure. De face, la coupole diaphragmatique droite située à la hauteur de la 4e côte est plus haute que la coupole diaphragmatique gauche située à la hauteur du 5e espace intercostal. Lors des mouvements respiratoires, à l'inspiration le diaphragme s'aplatit, à l'expiration il reprend sa place. La course diaphragmatique est mesurée à la radioscopie, c'est la distance qui sépare la position du diaphragme lors de l'inspiration forcée de sa position de repos à la fin de l'expiration, elle est normalement de 8 à 10cm, c'est-à-dire 2 espaces intercostaux (fig. 2)."],["p","Diaphragme lors de l'expiration Diaphragme"],["p","lors de l'inspiration"],["p","FIG. 2. — Positions du diaphragme."],["h3","2. Les repères fixes"],["p","A partir du squelette thoracique facilement accessible à la vue et au toucher, on peut déterminer un certain nombre de repères fixes : la fourchette sternale, l'angle de Louis, des lignes topographiques et des régions."],["p","2.1. La fourchette sternale ou creux sus-sternal est le bord supérieur du manubrium sternal concave vers le haut."],["p","2.2. L'angle de Louis : est l'arête saillante formée par la jonction du corps et du manubrium sternal."],["p","Il s'agit d'un repère important puisque :"],["li","à son niveau viennent s'articuler les 2es côtes, donc il permettra de repérer le 2e espace intercostal qui est situé juste au-dessous de lui et ainsi de dénombrer les espaces intercostaux."],["li","Derrière lui se situe la bifurcation de la trachée."],["li","Il correspond à la limite supérieure des oreillettes, il va donc être un repère pour la mesure de la pression veineuse."],["p","2.3. Les lignes topographiques :"],["p","2.3.1. Sur la face antérieure du thorax (Fig. 3) :"],["li","La ligne médio-thoracique ou médio-sternale : est la verticale passant par le milieu du sternum."],["li","La ligne médio-claviculaire : est la verticale passant par le milieu de la clavicule, ce repère doit remplacer la ligne mamelonnaire (verticale passant par le mamelon) surtout chez la femme où la position du mamelon est très variable."],["p","2.3.2. Sur la face latérale du thorax (fig..4) : Sur le malade de profil, bras levé à 90 degrés, on peut définir les lignes axillaires :"],["li","La ligne axillaire antérieure : est la verticale passant par le pli antérieur de l'aisselle, le long de la face antéro-latérale de la poitrine."],["li","La ligne axillaire moyenne : est la verticale passant par le sommet de l'aisselle."],["li","La ligne axillaire postérieure : est la verticale passant par le pli postérieur de l’aisselle, le long de la face postéro-latérale du thorax."],["p","2.3.3. Sur la face postérieure du thorax (fig. 5) :"],["li","La ligne scapulaire : est la verticale passant par la pointe de l'omoplate, le sujet étant en position debout, les bras le long du corps."],["li","La ligne des épineuses ou ligne vertébrale : est la verticale passant par les apophyses épineuses dorsales."],["p","2.4. Les régions :"],["p","2.4.1. En avant : par rapport à la clavicule, on définit la région sus-claviculaire ou creux sus-claviculaire et la région sous-claviculaire."],["p","2.4.2. En arrière : par rapport à l'épine de l'omoplate, on distingue la région sus-épineuse ou fosse sus-épineuse et la région sous-épineuse."],["h3","3. Projection des différents organes"],["p","Le thorax : contient le cœur et les gros vaisseaux, les poumons et les plèvres qui sont les 3 organes intrathoraciques sus-diaphragmatiques ; sous le diaphragme, derrière les côtes, se situent le foie et la rate."],["p","3.1. Les organes sus-diaphragmatiques :"],["p","3.1.1. Les poumons et les plèvres :"],["li","Les poumons : de face, les poumons descendent jusqu'à la 6e côte, de profil ils coupent la ligne axillaire moyenne au niveau de la 9e côte, et descendent en arrière jusqu'à la 10e vertèbre dorsale. Les sommets des poumons dépassent les clavicules d'environ 4 centimètres (fig. 6-1)."],["p","Ligne médiodaviculaire"],["p","FIG. 3. — Face antérieure du thorax."],["p","FIG 4. — Face latérale du thorax."],["p","A droite, la scissure oblique ou grande scissure part de la 4e vertèbre dorsale, croise la 5e côte sur la ligne axillaire moyenne et se situe en avant au niveau de la 6e côte, elle sépare en arrière le lobe supérieur du lobe inférieur et en avant le lobe moyen du lobe inférieur: la scissure horizontale ou petite scissure commence au niveau de la ligne axillaire moyenne au niveau de la 5e côte et se prolonge en avant au niveau du 3e espace intercostal, elle sépare en avant le lobe supérieur et le lobe moyen."],["p","A gauche, la scissure oblique sépare le lobe supérieur et le lobe inférieur; elle part de la 4e vertèbre dorsale, croise la 5e côte sur la ligne axillaire moyenne et se prolonge en avant au niveau de la 6e côte (fig. 6-1 et 6-2)."],["li","Les plèvres : de face les plèvres descendent jusqu'à la 7e côte, de profil elles coupent la ligne axillaire moyenne au niveau de la 10e côte et descendent en arrière jusqu'à la 12e vertèbre dorsale."],["p","Scissure horizontale"],["p","Scissure oblique droite Poumon gauche"],["p","Scissure oblique gauche"],["p","Plèvre"],["p","FIG. 6-1.— Projection sur la paroi thoracique antérieure des plèvres, des poumons et des scissures."],["p","Gauche"],["p","FIG. 62. — Projection sur la paroi thoracique latérale des plèvres, des poumons et des scissures."],["p","3.1.2. La trachée :"],["li","La bifurcation trachéale se situe derrière l'angle de Louis."],["li","La bronche souche droite est plus verticale (angle de 25 degrés avec la verticale) que la bronche souche gauche (angle de 45 degrés avec la verticale) (fig. 7)."],["p","FIG7. — Bifurcation trachéale."],["p","3.1.3. Le cœur et les vaisseaux (fig. 8) :"],["li","Le cœur :"],["li","Le bord droit du cœur : dessine une courbe à convexité droite qui va du bord supérieur du 3e cartilage costal droit à 2 cm en dehors du sternum jusqu'à la 6e articulation chondro-costale droite; il correspond à l'oreillette droite."],["li","Le bord gauche du cœur : dessine une courbe à convexité dirigée en haut et à gauche qui va du bord inférieur du 3e cartilage costal gauche à 2 cm en dehors du sternum jusqu'au 5e espace intercostal gauche à 1,5 cm en dedans de la ligne médio-claviculaire, ce bord gauche correspond essentiellement au ventricule gauche et à la partie supérieure de l'oreillette gauche."],["li","Le bord inférieur du cœur : est une ligne qui va de la 6e articulation chondro-costale droite jusqu'au 5e espace intercostal gauche à 1 ou 2 cm en dedans de la ligne médioclaviculaire."],["li","Les vaisseaux :"],["li","La veine cave supérieure à droite : dessine un segment rectiligne ou légèrement convexe à droite qui va du bord supérieur du 1er cartilage costal au bord externe du manubrium sternal jusqu'au bord supérieur du 3e cartilage costal à 2 cm en dehors du sternum."],["p","Foie"],["p","FIG. 8. — Projection sur la paroi thoracique antérieure du cœur, des gros vaisseaux, du foie et de la rate."],["li","L'aorte à gauche : dessine un arc convexe à gauche qui va du bord inférieur du 1er cartilage costal au bord inférieur du 2e cartilage costal."],["li","L'artère pulmonaire à gauche : dessine un arc convexe à gauche qui va du bord inférieur du 2e cartilage costal au bord inférieur du 3e cartilage costal."],["h4","3.2. Les organes sous-diaphragmatiques"],["p","3.2.1. Le foie : est situé sous la coupole diaphragmatique droite. Le bord supérieur va de la 6e côte gauche «sur la ligne médio-claviculaire passe derrière l'articulation sternoxyphoïdienne et va jusqu'à la 5e côte à droite sur la ligne médio-claviculaire, le bord inférieur va de la 6e côte gauche sur la ligne médio-claviculaire jusqu'à la 11e côte droite sur la ligne axillaire moyenne (fig. 8)."],["p","3.2.2. La rate : est située sous la coupole diaphragmatique gauche; elle a une position transversale entre la ligne axillaire moyenne et la ligne axillaire postérieure et entre la 9e et la 11e côte."],["h2","II. SÉMIOLOGIE DES SEINS"],["h3","1. Rappel anatomique"],["p","1.1. Chez la femme après la puberté le sein a la forme d'un hémisphère modifié : sein discoïde, sein conique..."],["p","Chaque sein s'étend horizontalement du bord externe du sternum à la ligne axillaire antérieure (souvent un prolongement dépasse cette ligne et fait saillie dans le creux axillaire) et verticalement de la 3e à la 7e côte."],["li","Le sein comprend 3 parties : le corps du sein proprement dit ; le mamelon qui est situé un peu au-dessous du centre du sein, qui regarde légèrement vers le haut et qui présente 12 à 20 pores au niveau desquels s'abouchent les canaux galactophores et l'aréole qui est la région circulaire qui entoure le mamelon, elle présente une pigmentation plus intense que la peau avoisinante et à sa surface on retrouve les tubercules de Montgomery qui contiennent des glandes sébacées et apocrines (fig. 9-1)."],["p","Fie. 9-1. — Les seins : aspect et position anatomique."],["li","Le sein est mobile sur la paroi thoracique et peut glisser sur l'aponévrose du muscle grand pectoral (fig. 9-2)."],["li","Le sein est formé de 12 à 20 lobes, chaque lobe possède un canal excréteur : canal galactophore qui va jusqu'au mamelon."],["li","Les lymphatiques du sein sont drain
