ras opposé au bout de 15 minutes et de 45 minutes dans lequel on mesure la quantité de BSP restante normalement la quantité de BSP restante à la 45e minute est inférieure à 5 %."],["p","Les tests partiels : a) Fonction protidique :"],["li","dosage de l'albumine plasmatique dont le taux est obtenu à partir des protides totaux (60 à 75 g/1) et de l'électrophorèse des protides (albumine : 60 %) : le taux normal est égal ou supérieur à 30 g/1."],["li","Les facteurs de la coagulation :"],["li","la fîbrinogène : taux normal est égal ou supérieur à 3 g/1 ;"],["li","le taux de prothrombine (TP) est compris entre 80 et 100 % ; devant un TP bas, un test de Koller doit être effectué : il consiste à injecter par voie intramusculaire 1 amp de vitamine K par jour pendant 3 jours et à refaire le 4e jour un TP : * si le TP reste bas, il s'agit d'une insuffisance cellulaire hépatique, * si le TP se normalise, il s'agit d'un déficit en vitamine K en rapport avec une malabsorption qui se voit en cas de rétention biliaire;"],["li","dosage de l'urée sanguine : 0,20 à 0,40 g/1 ;"],["li","dosage de l'ammoniémie : inférieur à 70 µg/100 ml. b) Fonction lipidique :"],["li","Dosage des lipides totaux : 4 à 7 g/litre."],["li","Dosage du cholestérol : 2 g/litre."],["li","Dosage des triglycérides : 0,5 g à 1,5 g/litre. c) Fonction glucidique : Dosage de la glycémie : 1 g/litre."],["p","d) Fonction biliaire :"],["li","Dans le sang : dosage de la bilirubine totale : inférieure à 10 mg/1, de la bilirubine indirecte : inférieure ou égale à 5 mg/1."],["li","Dans les urines : recherche de sels et pigments biliaires : absents à l'état normal. Dans les selles : dosage du stercobilinogène fécal. e) Les dosages enzymatiques : Transaminases : SGOT - SGPT (inférieures à 30 unités internationales). Phosphatases alcalines : inférieures à 13 unités King Amstrong. Gamma GT : inférieures à 25 unités internationales. f) Dosage du fer sérique : 70 à 130 µg/100 ml."],["p","2.2.3. Etude synthétique de l'exploration fonctionnelle hépatique : les tests hépatiques seront perturbés dans un certain nombre de situations pathologiques ou syndromes qui permettent de les classer suivant des critères physio-pathologiques, on reconnaît ainsi quatre grands syndromes biologiques d'insuffisance hépato-cellulaire, de cholestase, de cytolyse et inflammatoire (syndromes de Fauvert)."],["li","Syndrome d'insuffisance hépato-cellulaire : il associe :"],["li","Une hypoalbuminémie."],["li","Un abaissement du TP non corrigé par la vitamine K (test de Koller négatif). Il se voit au cours de la cirrhose. En cas de grande insuffisance hépatique notamment, en cas d'ictère grave ou de cirrhose à la phase terminale, on aura outre"],["li","Un TP inférieur à 30%."],["li","Une hypoglycémie."],["li","Une diminution de l'urée sanguine."],["li","Une hyperammoniémie."],["li","Syndrome de cholestase ou syndrome de rétention biliaire : il associe :"],["li","Une hyperbilirubinémie conjuguée."],["li","Une hypercholestérolémie, une hypertriglycéridémie."],["li","Une augmentation des phosphatases alcalines."],["li","Une augmentation de la gamma GT."],["li","Un TP bas corrigé par la vitamine K (test de Koller positif). Il se voit en cas de rétention biliaire surtout par obstacle de la voie biliaire principale."],["li","Syndrome de cytolyse : il associe :"],["li","Une augmentation des transaminases surtout SGPT."],["li","Une augmentation du fer sérique accessoirement se voit en cas de destruction des cellules hépatiques essentiellement en cas d'hépatite virale."],["li","Syndrome inflammatoire : se manifeste par une hyper-gamma-globulinémie mesurée par l’électrophorèse des protides supérieure à 15 g/1. Il se voit au cours de la cirrhose, où il est souvent associé au syndrome d'insuffisance hepato-cellulaire."],["h4","2.2. Les examens radiographiques"],["p","2.2.1. La radiographie de l'abdomen sans préparation : peut visualiser des calcifications hépatiques (kyste hydatique calcifié) ou des calculs radio-opaques des voies biliaires (lithiase biliaire)."],["p","2.2.2. La cholécystographie par voie orale : consiste à faire ingérer au malade un produit iodé, s'éliminant de manière élective par la bile ce qui permet d'opacifier la vésicule biliaire et les voies biliaires extra-hépatiques."],["p","2.2.3. La cholangiographie par voie intraveineuse : est la radio des voies biliaires après injection intraveineuse du produit iodé."],["p","Il est à noter que ces deux radios ne pourront être faites qu'en l'absence d'ictère, en effet en cas d'ictère, le produit iodé ne peut pas être éliminé dans la bile et les voies biliaires ne sont pas visibles."],["p","2.2.4. La cholangiographie par voie rétrograde CPRE : consiste à injecter directement le produit iodé dans le cholédoque après cathétérisation de la papille par voie endoscopique. Cet examen permet de visualiser les voies biliaires même en cas d'ictère."],["p","2.3. L'échotomographie abdominale : est actuellement un examen capital pour le diagnostic des affections hépato-biliaires :"],["li","Il met en évidence les masses liquidiennes : kyste hydatique."],["li","Il peut montrer l'image directe des calculs ou bien mettre en évidence des signes indirects par exemple la dilatation du cholédoque et des voies biliaires."],["p","2.4. Les autres types d'exploration :"],["li","La scintigraphie hépatique : consiste à mesurer la fixation d'un isotope radioactif au niveau du foie ce qui permet d'obtenir une image anatomique et fonctionnelle du foie. Les tumeurs bénignes et malignes apparaîtront sous forme de lacunes, lorsque leur diamètre est égal ou supérieur à 2 cm."],["li","La laparoscopie : qui consiste à introduire un laparoscope (tube rigide muni d'un système d'éclairage) dans la cavité péritonéale après création d'un pneumo-péritoine et vérification des tests de l'hémostase, permet de voir l'état du péritoine, l'aspect macroscopique du foie, de la circulation portale (ligament rond), de la rate. Elle permet en outre de pratiquer une PBF ponction biopsie du foie sous contrôle de la vue."],["li","L'opacification vasculaire : artériographie hépatique, permet d'avoir une image anatomique du foie et de la circulation portale."],["li","La laparotomie exploratrice est parfois le dernier recours diagnostic quand toutes les explorations précédentes n'ont pas permis d'aboutir à un diagnostic de certitude."]]},{"ar":"المتلازمات الهضمية الكبرى","fr":"Les principaux syndromes digestifs","w":7589,"b":[["h2","I. LES ICTÈRES"],["h3","1. Définition"],["p","L'ictère est une coloration jaune des téguments et des muqueuses due à une augmentation de la bilirubine dans le sang."],["h3","2. Rappel physiologique du métabolisme de la bilirubine"],["p","2.1. Origine : la bilirubine provient essentiellement de la destruction des globules rouges arrivés au terme de leur vie d'une durée de 120 jours."],["p","La destruction des globules rouges a lieu au niveau de la moelle osseuse, de la rate et du foie; elle aboutit à la libération de l'hémoglobine qui est scindée en hème et en globine; L'hème va subir des transformations pour aboutir à la formation de bilirubine libre; 300 mg de bilirubine libre sont formés par 24 heures (fig. 6)."],["p","2.2. Devenir : la bilirubine libre ou bilirubine non conjuguée est un produit toxique, liposoluble, qui va être épuré au niveau du foie (fig. 7)."],["li","Transport au niveau du sang où elle est liée à l'albumine jusqu'au foie."],["li","Captation hépatique : est rapide, la demi-vie plasmatique de la bilirubine est de 18 minutes. Elle est captée par les cellules hépatiques où elle se lie aux protéines transporteuses Y et Z et va être conduite aux microsomes."],["li","Conjugaison : a lieu au niveau des microsomes grâce à la glycuronyl-transférase et va donner la bilirubine conjuguée qui est hydrosoluble."],["li","Excrétion biliaire : la bilirubine conjuguée est excrétée dans la bile et est évacuée par les canaux biliaires dans la vésicule biliaire et le cholédoque."],["li","Devenir intestinal : les enzymes bactériennes intestinales réduisent la bilirubine et la transforment en urobilinogène ; une partie est réabsorbée et reprise par le foie et transformée en urobiline éliminée dans les urines, la plus grande partie est éliminée dans les selles directement ou après transformation en stercobilinogène qui confère aux selles leur coloration brune."],["pre","Oxydation                     Réduction"],["pre","Hème                        Biliverdine                    Bilirubine libre"],["p","Libération du fer"],["p","Globines"],["p","Acides aminés FIG 6. – Origine de la bilirubine"],["p","Hème"],["pre","Vaisseau sanguin     Bilirubine-Albumine"],["p","Protéines Y et Z Cellule hépatique Microsomes (glycuro-conjugaison)"],["pre","Canalicule biliaire           Excrétion de la bile"],["p","FIG 7. – Devenir de la bilirubine"],["h4","2.3. Propriétés physico-chimiques de la bilirubine"],["li","La bilirubine conjuguée est hydrosoluble, elle est dosée directement grâce à la diazoréaction, d'où son nom de bilirubine directe."],["li","La bilirubine libre est liposoluble, la diazo-réaction se produit de manière indirecte après adjonction d'alcool méthylique, d'où le nom de bilirubine indirecte."],["h3","3. Physiopathologie des ictères (fig. 8)"],["p","L'ictère qui est dû à une augmentation de la bilirubine dans le sang peut se produire par plusieurs mécanismes :"],["li","Augmentation de la production de la bilirubine : par augmentation de l’hème due à une hémolyse pathologique qui est un raccourcissement de la durée de vie des hématies."],["li","Défaut au niveau du métabolisme de la bilirubine :"],["li","Défaut de conjugaison :"],["li","par déficit enzymatique héréditaire en glycuronyl-transférase : défaut qui peut être total : maladie de Criggler-Najjar, ou partiel : maladie de Gilbert; ce déficit peut être également passager chez le nouveau-né par immaturité hépatique;"],["li","par inhibition médicamenteuse de l'enzyme : exemple Novobiocine."],["li","Défaut de l'excrétion : ce défaut peut être héréditaire, c'est la maladie de Dubin-Johnson et le syndrome de Rotor où seule la bilirubine ne peut être excrétée au niveau de la bile; le défaut peut être acquis notamment au cours des hépatites virales, il semble qu'il existe une inhibition sécrétoire : trouble fonctionnel de l'excrétion biliaire par l'hépatocyte."],["li","Anomalies de l'évacuation de la bile : c'est la cholestase ou rétention de bile qui va entraîner un passage dans le sang de tous les composés de la bile : pigments biliaires essentiellement bilirubine conjuguée, sels biliaires, phosphatases alcalines et cholestérol. Cette anomalie de l'évacuation de la bile peut se situer :"],["li","Au niveau des canalicules biliaires responsables de la cholestase infra-hépatique qui peut se voir au cours des hépatites virales et médicamenteuses."],["li","Au niveau des voies biliaires extra-hépatiques : essentiellement au niveau du cholédoque, soit par obstacle intracholédocien : calcul; soit par compression du cholédoque : cancer de la tête du pancréas, responsable de la cholestase extra-hépatique. Suivant le mécanisme de production de l'ictère,'on peut distinguer :"],["li","Les ictères préhépatiques : par hyperproduction de bilirubine, ce sont les ictères hémolytiques qui sont des ictères constitués essentiellement par de la bilirubine libre (80 %)."],["li","Les ictères hépatiques : par anomalie du métabolisme de la bilirubine."],["li","Anomalie de la conjugaison : responsable d'ictère à bilirubine non conjuguée : maladie de Criggler-Najjar et maladie de Gilbert."],["li","Anomalies de l'excrétion : responsables d'ictères à bilirubine mixte qui se voient au cours de la maladie de Dubin-Johnson et du syndrome de Rotor; parfois au cours des cirrhoses et des hépatites virales."],["li","Cholestase infra-hépatique : responsable d'ictère à bilirubine conjuguée qui se voit dans les hépatites virales et parfois au cours des cirrhoses."],["li","Les ictères post-hépatiques : par anomalie de l'évacuation de la bile par le cholédoque : cholestase extra-hépatique, l'ictère est fait essentiellement de bilirubine directe au moins 70%."],["pre","Hème                Hémolyse pathologique"],["p","Bilirubine libre"],["pre","Conjugaison                     Déficit enzymatique englycuronyl-transférase"],["p","Inhibition médicamenteuse"],["pre","Excrétion               Affection héréditaire : S. de Dubin-Johnson"],["p","Ictère des cirrhoses Hépatite virale"],["pre","Excrétion        Cholestase        intra-hépatique (canalicules biliaires)"],["p","extra hépatique (cholédoque)"],["p","FIG.8. — Physiopathologie des ictères."],["pre","196                                                                                   Précis de"],["p","sémiologie"],["h3","4. Etude sémiologique de l’ictère"],["p","4.1. Diagnostic positif : reconnaître l'ictère. L'ictère est une coloration jaune des téguments et des muqueuses qui est reconnue cliniquement et mesurée biologiquement, suivant son intensité, on distingue : ,"],["li","L'ictère discret ou subictère qui doit être recherché à la lumière du jour au niveau des muqueuses : conjonctives et muqueuse de la face inférieure de la langue, qui correspond à un taux de bilirubine totale compris entre 15 et 30 mg/1."],["li","L'ictère franc : couleur jaune safran, qui est généralisé aux téguments et aux muqueuses, qui correspond à un taux de bilirubine totale supérieur à 30 mg/1."],["li","L'ictère très intense : couleur brun verdâtre au maximum « bronze florentin » qui s'accompagne d'un taux de bilirubine totale entre 300 et 400 mg/1. Il faut connaître la possibilité d'un décalage entre l'hyperbilirubinémie et l'ictère : l'hyperbilirubinémie précède et survit à l'ictère."],["p","4.2. Diagnostic différentiel : l'ictère doit être différencié des faux ictères :"],["li","Pâleur jaunâtre de certaines anémies."],["li","Hypercarotinémie. Dans ces deux cas, les conjonctives sont de coloration normale."],["li","Pseudo-ictère picrique apparaissant après l'absorption d'acide picrique."],["li","Difficulté à reconnaître l'ictère chez les sujets pigmentés."],["p","4.3. Diagnostic étiologique : l'analyse sémiologique va permettre de rechercher la cause de l'ictère, elle est basée sur l'interrogatoire, l'examen clinique et les examens complémentaires."],["li","L'interrogatoire :"],["li","Age - sexe - profession."],["li","Ictère : mode de début progressif ou brutal, date de début, notion de période pré-ictérique asthénie ou triade classique : céphalée, urticaire, arthralgies qui se voit au cours de l'hépatite virale, évolution soit d'une seule tenue ou au contraire par poussées, les signes accompagnateurs : coloration des selles et des urines et notion de prurit."],["li","Autres signes digestifs : douleur abdominale : exemples : colique hépatique, hémorragie digestive."],["li","Signes fonctionnels témoignant d'une anémie."],["li","Signes généraux : amaigrissement, fièvre."],["li","Notion de prise médicamenteuse : exemple : contraceptifs oraux ou de prise toxique."],["li","Notion d'injection, de transfusion ou de soins dentaires dans les 6 semaines à 6 mois qui précèdent l'ictère."],["li","Notion d'éthylisme."],["li","Antécédents familiaux : notion d'ictère familial."],["li","L'examen clinique : va comporter un examen de l'appareil cutanéo-muqueux, de l'appareil digestif et un examen général."],["li","Examen de l'appareil cutanéo-muqueux : qui va rechercher une pâleur, des hémorragies cutanéo-muqueuses, des œdèmes des membres inférieurs et l'existence d'angiomes stellaires."],["li","Examen de l'appareil digestif: recherche l'existence d'une circulation veineuse collatérale au niveau de la paroi abdominale, apprécie le volume et la consistance du foie; recherche une vésicule biliaire palpable, une splénomégalie, une ascite, une douleur provoquée par la manœuvre de Murphy."],["li","Examen général : appréciation du poids en fonction de la taille, recherche d'adénopathies superficielles."],["li","Les examens complémentaires : dans un premier temps, dosage de la bilirubine totale et de la bilirubine directe et indirecte qui permettra d'orienter le diagnostic étiologique et de décider des autres investigations complémentaires."],["li","Si ictère à bilirubine indirecte : une exploration hématologique est nécessaire."],["li","Si ictère à bilirubine mixte ou à bilirubine directe : nécessité d'une exploration fonctionnelle hépatique, d'une exploration du foie et des voies biliaires."],["h3","5. Les différents types d'ictères"],["p","5.1. Ictère hémolytique : qui peut se présenter selon deux tableaux : l'ictère hémolytique chronique et l'ictère hémolytique aigu."],["li","L'ictère hémolytique chronique : associe trois signes cliniques évocateurs :"],["li","L'ictère qui est le plus souvent d'intensité modérée : subictère accompagné de selles foncées et d'urines claires ou orangées, sans jamais de prurit."],["li","La splénomégalie"],["li","La pâleur cutanéo-muqueuse Biologiquement, il est caractérisé par trois signes essentiels :"],["li","Augmentation de la bilirubine indirecte dont le taux ne dépasse pas en règle 50 mg/1."],["li","Anémie."],["li","Augmentation du taux de réticulocytes; l'augmentation du fer sérique n'est pas un signe constant et donc n'est pas un bon test en faveur de l'hémolyse."],["li","L'ictère hémolytique aigu : est dû à une hémolyse brutale intravasculaire, il va se manifester par un tableau parfois dramatique associant :"],["li","Immédiatement : un état de choc, des douleurs abdominales ou lombaires, une fièvre, une oligurie et une hémoglobinurie : émission d'urines rouge Porto ou rouge Sélecto."],["li","Le lendemain : apparition de l'ictère."],["p","5.2. Ictère des cirrhoses : l'ictère est le plus souvent un signe de décompensation de la cirrhose et un signe de gravité."],["p","La cirrhose est reconnue :"],["li","Sur les signes cliniques :"],["li","L'aspect du foie : modifications de la taille : hypertrophie ou atrophie ou parfois taille normale; de la consistance : bord inférieur tranchant."],["li","Les signes d'hypertension portale : splénomégalie, ascite, circulation veineuse collatérale abdominale, hémorragies digestives."],["li","La présence d'angiomes stellaires."],["li","Sur les examens complémentaires :"],["li","L'exploration fonctionnelle hépatique qui montre une hyperbilirubinémie mixte ou directe et l'association d'un syndrome d'insuffisance hépato-cellulaire et d'un syndrome inflammatoire."],["li","L'œso-gastro-duodénoscopie qui met en évidence les varices œsophagiennes, la laparoscopie qui visualise le foie et permet la PBF."],["p","5.3. Ictère cytolytique ou ictère par hépatite virale, est affirmé :"],["li","Sur la notion de contage : épidémie (hépatite épidémique), sur la notion d'injection dans les six semaines à six mois qui ont précédé l'ictère (hépatite d'inoculation)."],["li","Sur la notion d'une période pré-ictérique : qui apparaît une semaine avant l'apparition de l'ictère :"],["li","Signe digestifs : anorexie, nausée, dégoût de la viande et du tabac, pesanteur ou douleur épigastrique."],["li","Un syndrome grippal : courbatures, frissons et fièvre."],["li","Une asthénie importante."],["li","Une triade caractéristique dite de Caroli rarement retrouvée associant : migraine, urticaire, arthralgies."],["li","La période ictérique : l'ictère est franc cutanéo-muqueux avec urines foncées et selles de coloration le plus souvent normale parfois légèrement décolorées, parfois splénomégalie et hépatomégalie discrète."],["li","L'exploration fonctionnelle hépatique : va montrer soit une hyperbilirubinémie mixte, soit une augmentation de la bilirubine directe, avec présence de sels et pigments biliaires dans les urines, un syndrome de cytolyse franc et un syndrome inflammatoire modéré."],["p","Cas particulier : l'hépatite virale peut réaliser le tableau d'un ictère grave qui est reconnu sur l'association de trois signes cliniques : l'ictère, un syndrome hémorragique et des troubles neurologiques et sur l'existence d'un taux de prothrombine inférieur à 30% (syndrome d'insuffisance hépato-cellulaire majeur)."],["p","5.4. Ictères cholestatiques ou ictères rétentionnels : sont dominés par les cholestases extrahépatiques : le calcul du cholédoque et le cancer de la tête du pancréas."],["li","Le calcul du cholédoque :"],["li","Terrain : femme d'âge moyen."],["li","Antécédents de colique hépatique."],["li","Mode d'installation de l'ictère : succession chronologique de douleur (colique hépatique), fièvre et ictère en moins de 48 heures réalisant le syndrome cholédocien, la fièvre peut réaliser un accès angio-cholitique avec frissons, fièvre à 40° et sueurs, ou au contraire être modérée 38 à 38,5 °C."],["li","L'ictère est d'intensité modérée avec décoloration incomplète des selles et urines foncées."],["li","L'hépatomégalie est discrète ou absente."],["li","Il n'y a pas de vésicule palpable (vésicule scléro-atrophique) mais un signe de Murphy positif : loi de Courvoisier et Terrier qui n'est pas absolue."],["li","L'évolution de l'ictère se fait par poussées."],["li","Examens complémentaires : exploration fonctionnelle hépatique : syndrome de rétention et hémogramme qui montre une hyperleucocytose avec polynucléose neutrophile. L'exploration des voies biliaires en période ictérique se fait par l'échotomographie et la CPRE, en période non ictérique : cholécystographie et cholangiographie si Péchotomo graphie ne détecte pas de calcul."],["li","Le cancer de la tête du pancréas :"],["li","Terrain : homme de 50 ans ou plus."],["li","Antécédents : absents en règle."],["li","Mode d'installation de l'ictère : existence d'une période pré-ictérique s'étalant sur plusieurs semaines faite d'une altération rapide de l'état général avec amaigrissement, asthénie, signes digestifs : anorexie, parfois douleur pancréatique."],["li","L'ictère s'installe insidieusement et fonce progressivement pour devenir très foncé : « bronze florentin »; il s'accompagne d'urines très foncées, mousseuses et de selles décolorées « blanc mastic », de signe d'intoxication par les sels biliaires avec prurit féroce s'accompagnant de lésions de grattage, bradycardie et hypotension artérielle."],["li","L'hépatomégalie est importante, il s'agit d'une hépatomégalie de cholestase."],["li","La vésicule est palpable et il n'existe pas de signe de Murphy : loi de Courvoisier et Terrier."],["li","L'évolution est sans rémission."],["li","Les examens complémentaires : l'exploration fonctionnelle hépatique montre un syndrome de rétention franc, l'échotomographie et la CPRE vont visualiser la compression du cholédoque par la tumeur pancréatique. La cholestase peut être d'origine intra-hépatique : hépatite virale, hépatite médicamenteuse, cancer du foie, kyste hydatique fissuré dans les voies biliaires."],["h2","II. LES HÉPATOMÉGALIES"],["h3","1. Définition"],["p","On appelle hépatomégalie une augmentation de volume du foie portant sur l'ensemble ou sur une partie du foie, ce qui permet ainsi de distinguer les hépatomégalies globales et les hépatomégalies localisées."],["h3","2. Rappel anatomique"],["p","Le foie est situé dans l'hypochondre droit, il est limité en haut par le diaphragme, en bas par l'angle colique droit et le côlon transverse, il se prolonge dans la région épigastrique vers l'hypocondre gauche, où il est en rapport avec la petite courbure gastrique (fig. 9). Il est constitué de deux lobes principaux droit et gauche séparés par l'insertion du ligament rond."],["h3","3. Examen clinique du foie normal"],["h4","3.1. Technique"],["li","La percussion : est exécutée sur le malade en décubitus dorsal, elle permet essentiellement de délimiter le bord supérieur du foie, elle se fait de haut en bas, les doigts de la main de l'examinateur sont placés à plat parallèlement aux espaces .intercostaux. La partie supérieure de la matité hépatique dessine une courbe convexe en haut, qui commence à la base de l'appendice xyphoïde, passe dans le 5e espace intercostal droit au niveau de la ligne médio-claviculaire, dans le 7e espace intercostal sur la ligne axillaire et arrive en arrière à la 11e vertèbre dorsale. A gauche, elle se confond avec la matité cardiaque. Lorsque le bord inférieur n'est pas palpable, il peut être étudié par la percussion douce pratiquée de bas en haut en commençant par l'hypocondre droit. De la ligne axillaire à la ligne médio-claviculaire la matité se confond avec le rebord des fausses côtes, à partir de la ligne médio-claviculaire, le bord inférieur déborde le thorax, croise la ligne médiane à égale distance de l'appendice xyphoïde et de l'ombilic et se perd au point de jonction des 7e et 8e côtes (fig. 10). Les difficultés de la percussion : en cas de distension colique, de pneumo-péritoine, d'épanchement pleural droit : intérêt de la percussion en position assise, en cas d'épanchement la matité s'élève."],["p","FIG. 9. — Rapports anatomiques du foie."],["li","La palpation : est la méthode de choix pour délimiter le bord inférieur du foie et en préciser les caractères. Différents procédés de palpation peuvent être utilisés mais toujours l'examinateur se place à la droite du malade, ce dernier étant en décubitus dorsal. * La palpation unimanuelle : méthode de Chauffard : l'examinateur se place face au malade, la main gauche est glissée dans la région lombaire droite, la main droite est placée bien à plat sur l'abdomen, doigts dirigés vers le haut un peu obliques par rapport au rebord costal, on demande au malade de respirer profondément, le foie s'abaisse à chaque mouvement respiratoire et son bord inférieur vient buter sur la pulpe des doigts en attente (fig. 11 ). 9 * La palpation bimanuelle :"],["li","méthode de Gilbert : l'examinateur se place face au malade; les deux mains bien à plat. doigts rapprochés dirigés vers le haut, le bord cubital de la main gauche est tourné vers le thorax et la racine de la main droite dirigé vers l'arcade crurale (fig. 12), le bord inférieur du foie vient buter contre la pulpe des doigts à chaque inspiration;"],["li","méthode de Mathieu : l'examinateur se place à la tête du malade regardant vers les pieds du sujet examiné. Ses deux mains sont posées sur l'abdomen, « les doigts en crochet » dépassant le rebord costal cherchant à accrocher le bord inférieur du foie lors de l'inspiration (fig. 13)."],["p","3.2. Résultats : l'examen clinique (percussion combinée à la palpation)-va permettre d'apprécier le volume du foie en mesurant la flèche hépatique qui est la distance qui sépare le bord supérieur du bord inférieur du foie sur la ligne médio-claviculaire."],["p","Chez l'adulte, la flèche hépatique normale est de 10 à 12 cm. Chez le sujet normal en règle, le bord inférieur du foie ne déborde pas le rebord costal, sauf chez le sujet longiligne. Lorsque le bord inférieur est palpé lors dès mouvements respiratoires profonds, on peut alors apprécier ses caractères normaux : il est régulier, parfois une petite encoche marque la séparation entre les lobes droit et gauche, sa consistance est élastique, sa surface est lisse, il est peu épais : mousse (c'est-à-dire arrondi), indolore, mobile avec les mouvements respiratoires."],["p","FIG. 10. — Résultats de la percussion hépatique."],["p","FIG. 11. — Palpation unimanuelle : méthode de Chauffard."],["h3","4. Diagnostic positif d'une hépatomégalie"],["p","L'examen clinique va permettre de déceler une hépatomégalie qui se manifeste par une augmentation de la flèche hépatique supérieure à 12cm au niveau de la ligne médioclaviculaire. Il permettra de distinguer s'il s'agit d'une hépatomégalie diffuse ou s'il s'agit d'une hépatomégalie localisée développée vers le bas à expression abdominale ou développée vers le haut à expression thoracique."],["p","L'examen sera complété par un calque du foie qui est obtenu en traçant sur l'abdomen du sujet les limites supérieures et inférieures du foie par rapport à des repères anatomiques fixes le rebord costal, l'appendice xyphoïde et l'ombilic."],["p","FIG. 13. — Palpation bimanuelle : méthode de Mathieu."],["p","4.1. Hépatomégalie diffuse : elle est reconnue sur les caractères suivants : la flèche hépatique est augmentée, le foie réalise une tuméfaction de l’hypocondre droit et de l’épigastre mobile avec la respiration, de situation antérieure, dont le bord inférieur est oblique en haut et en dedans."],["p","Le diagnostic peut être difficile chez l'obèse et en cas d'ascite, l’hépatomégalie donne dans ce dernier cas le signe du glaçon, parfois elle n'est mise en évidence qu'après ponction évacuatrice lorsque l’ascite est de grande abondance."],["h4","4.2. Hépatomégalie localisée"],["li","A développement abdominal : qui réalise une masse tumorale de l’hypocondre droit le plus souvent, plus rarement du creux épigastrique."],["li","A développement thoracique : donnant une limite supérieure anormalement haute à la percussion et au téléthorax un aspect de surélévation de la coupole diaphragmatique droite."],["h3","5. Diagnostic différentiel d'une hépatomégalie"],["p","Il se posera différemment en cas d'hépatomégalie diffuse et d'hépatomégalie localisée."],["p","5.1. Hépatomégalie diffuse : elle devra être différenciée :"],["li","Du foie ptôse : le bord inférieur du foie est palpable, parfois un peu sensible à la pression mais la flèche hépatique est normale."],["li","Du foie luxé : le foie est refoulé vers le bas par un processus thoracique pathologique le plus fréquent est un épanchement pleural liquidien."],["li","Du lobe de Riedel : languette qui occupe le flanc droit en continuité avec le foie."],["p","5.2. Hépatomégalie localisée à développement abdominal :"],["p","a) Elle peut poser le problème d'une masse tumorale de l'hypocondre droit (hépatomégalie développée aux dépens du lobe droit) qui devra être différenciée :"],["li","D'une grosse vésicule : qui donne une tuméfaction à bord inférieur arrondi et rénitttente."],["li","D'un gros rein : qui donne le contact lombaire et qui s'accompagne le plus souvent de signes fonctionnels urinaires, importance de l'urographie intraveineuse qui permet de trancher dans les cas difficiles."],["li","D'une tumeur de l'angle colique droit : qui n'est pas mobile lors des mouvements respiratoires, qui s'accompagne le plus souvent de troubles du transit, importance du lavement baryte dans les cas difficiles. b) Elle peut poser également le problème d'une masse tumorale épigastrique (hépatomégalie développée aux dépens du lobe gauche) qui devra être différenciée :"],["li","D'une volumineuse tumeur gastrique : intérêt de la fibroscopie qui montrera la tumeur gastrique remplacée par une compression de la petite courbure gastrique en cas d'hépatomégalie."],["li","D'une splénomégalie dont le bord antérieur est crénelé. Que l'hépatomégalie localisée soit développée au niveau de l'hypocondre droit ou au niveau du creux épigastrique, dans les deux cas, on peut discuter une tumeur pariétale qui sera reconnue en faisant redresser le malade; la palpation de la paroi abdominale contractée montre une disparition de la tuméfaction en cas d'hépatomégalie et sa persistance en cas de tumeur pariétale."],["p","5.3. Hépatomégalie localisée à développement thoracique : qui est décelée à la percussion comme une ascension du bord supérieur de la matité et au téléthorax qui réalise une surélévation de la coupole diaphragmatique droite qui doit être différenciée d'une pleurésie surtout diaphragmatique; dans les cas difficiles, intérêt de la création d'un pneumo péritoine."],["h3","6. Diagnostic étiologique d'une hépatomégalie"],["p","Il repose :"],["p","6.1. Sur l'interrogatoire : notion d'éthylisme, d'antécédents d'ictère, d'hémorragies digestives."],["p","6.2. Sur l'examen clinique qui va préciser :"],["li","Les caractères de l'hépatomégalie : Son type : globale ou localisée. L'aspect de sa surface : régulière ou irrégulière. Sa consistance : molle, ferme ou dure. Sa mobilité avec les mouvements respiratoires. Sa sensibilité à la palpation. L'aspect de son bord inférieur : mousse ou tranchant. L'existence de signes vasculaires : reflux hépato-jugulaire, une expansion systolique du foie, l'existence d'un souffle à l'auscultation hépatique."],["li","L'existence de signes accompagnateurs évocateurs : ictère, ascite, splénomégalie, circulation veineuse collatérale abdominale, angiomes stellaires, signes d'insuffisance cardiaque droite ou globale."],["p","6.3. Sur les examens complémentaires :"],["li","Biologiques : exploration fonctionnelle hépatique, sérologie hydatique et intra-dermoréaction de Casoni, sérologie amibienne."],["li","Radiologiques : ASP à la recherche de calcifications."],["li","L’échotomographie abdominale."],["li","La scintigraphie hépatique"],["li","La laparoscopie et la PBF."],["h3","7. Les différentes causes d'hépatomégalie"],["h4","7.1. Hépatomégalie vasculaire"],["li","Globale."],["li","Surface lisse, régulière."],["li","Consistance ferme."],["li","Douloureuse spontanément et lors de la palpation."],["li","Mobile."],["li","Bord inférieur mousse."],["li","Signes accompagnateurs : reflux hépato-jugulaire, parfois expansion systolique du foie et subictére, signes d'insuffisance ventriculaire droite, d'insuffisance cardiaque globale ou de péricardite."],["li","Examens complémentaires : ECG et téléthorax."],["h4","7.2. Hépatomégalie cholestatique"],["li","Globale."],["li","Surface lisse, régulière."],["li","Consistance ferme."],["li","Insensible."],["li","Mobile."],["li","Bord inférieur mousse."],["li","Signes accompagnateurs : ictère rétentionnel avec parfois grosse vésicule."],["li","Examens complémentaires : exploration fonctionnelle hépatique : syndrome rétentionnel pur, recherche d'un obstacle sur la voie biliaire principale : échotomographie et CPRE."],["p","7.3. Hépatomégalie cirrhotique :"],["li","Globale ou prédominant sur un lobe ou localisée à un lobe (à noter que lors d'une cirrhose, le foie peut également être de volume normal ou au contraire atrophique)."],["li","Surface irrégulière parsemée de petits nodules de taille variable : d'où l'aspect de •foie clouté »."],["li","Consistance très ferme."],["li","Insensible."],["li","Mobile."],["li","Bord inférieur tranchant."],["li","Signes accompagnateurs : signes d'hypertension portale : splénomégalie, ascite, circulation veineuse collatérale abdominale, hémorragies digestives, un ictère, des angiomes stellaires et parfois des signes neurologiques."],["li","Examens complémentaires : exploration fonctionnelle hépatique : syndrome d'insuffisance hépato-cellulaire associé à un syndrome inflammatoire, la laparoscopie montre la présence de nodules de régénération à la surface du foie et permet la PBF qui apporte le diagnostic histologique de certitude de la cirrhose."],["h4","7.4. Hépatomégalies tumorales"],["p","a) Tumeur bénigne : kyste hydatique :"],["li","Formation localisée arrondie, régulière, lisse, bombant en verre de montre à la surface du foie, de consistance souvent rénitente, insensible."],["li","Absence de signes accompagnateurs."],["li","Examens complémentaires : exploration fonctionnelle hépatique : normale; échotomographie : met en évidence le kyste hydatique sous forme d'une formation liquidienne; sérologie hydatique et IDR de Casoni positives. b) Tumeurs malignes :"],["li","Cancer primitif du foie : Hépatomégalie globale ou localisée, augmentant rapidement de volume. Surface régulière. Consistance : dureté pierreuse. Sensible puis douloureuse. Rapidement fixée. Signes accompagnateurs : ictère, ascite, altération de l'état général. Examens complémentaires : augmentation des phosphatases alcalines, hyperleucocytose, importance de la laparoscopie avec PBF et dosage de l'alpha 1-fœtoprotéine."],["li","Cancer secondaire du foie :"],["li","Hépatomégalie globale."],["li","Surface irrégulière parsemée de gros nodules durs d'où aspect de « foie marronne »."],["li","Consistance dure."],["li","Sensibilité variable."],["li","Mobile."],["li","Signes accompagnateurs : identiques à ceux du cancer primitif."],["li","Examens complémentaires : augmentation des phosphatases alcalines, laparoscopie qui montre des nodules cancéreux et permet d'en faire la biopsie, recherche du cancer primitif surtout digestif ou pulmonaire."],["p","7.5. Hépatomcgalics infectieuses : représentées essentiellement par l'amibiase hépatique."],["li","Hépatomégalie globale."],["li","Surface régulière."],["li","Consistance ferme."],["li","Douloureuse : spontanément, lors de la palpation et lors de l'ébranlement : la main gauche placée dans les derniers espaces intercostaux de la région thoraco-abdominale est percutée avec le bord cubital de la main droite (fig. 14)."],["li","Mobile."],["li","Signe accompagnateur : la fièvre."],["li","Examens complémentaires : exploration fonctionnelle hépatique normale, hémogramme : hyperleucocytose, sérologie amibienne fortement positive. L'amibiase hépatique non traitée peut évoluer vers l'abcès du foie."],["p","7.6. Hépatomégalie de surcharge : qui est en rapport avec une stéatose, plus rarement avec une amylose ou une hémochromatose."],["li","Hépatomégalie globale."],["li","Surface lisse régulière."],["li","Consistance molle."],["p","TABLEAU RÉCAPUTILATIF : LES HÉPATOMÉGALIES"],["p","Hépatomégalie        Type            Surface           Consistance    Sensibilité   Mobilité   Bord inférieur       Signes             Examens"],["pre","accompagnateurs     complémentaires"],["p","Reflux hépato- Vasculaire        Globale         Régulière            Ferme       Douloureuse   +              Mousse           jugulaire            Téléthorax"],["pre","lisse                                                                          IVD ICG              ECG"],["p","Péricardite"],["p","EFH = syndrome"],["p","Cholestase        Globale         Régulière lisse      Ferme       -             +              Mousse           Ictère             rétentionnel"],["pre","rétentionnel        ECHO . ."],["p","pppp obstacle CrKc,"],["p","Cirrhose          Globale ou     Irréguliére foie      Ferme       -             +              Tranchant       HTP Ictère           EFH = syndrome"],["pre","localisée      clouté                                                                          Angiomes            IH + Inflammatoire\n                                                                                                  stellaires       PBF"],["pre","   Kyste             Localisée       Régulière            Rénitente   -             +                               Absents              ECH\nhydatique                        Arrondie Lisse                                                                                     O"],["p","Sérologi"],["pre","                  Globale                              Dureté                                                    Ictère          e    Laparoscopie\nprimitif          ou              Régulière            pierreuse   +                                             Asdte                P\n              localisée                                                                                      Altération EG       BF"],["p","Alpha 1 F.P"],["p","Cancer           Globale          Irréguliére «       Dure        ±             +                               Ictère Ascite        Laparoscopie PBF"],["pre","secondaire                       foie marronne »                                                                Altération EG"],["p","Infectieuse       Globale         Régulière            Ferme       Douloureuse   +                               Fièvre              Hémogramme Amibiase                                                                                                                            Sérologie"],["p","Surcharge         Globale         Régulière            Molle       ±             +              Mousse           Absents              Laparoscopie PBF Lisse"],["li","Bord inférieur mousse."],["li","Sensibilité variable."],["li","Mobile."],["li","Signes accompagnateurs : absents le plus souvent."],["li","Examens complémentaires : laparoscopie qui permet la PBF et le diagnostic précis de surcharge et de son type."],["p","FIG. 14. — Recherche de la douleur à l'ébranlement."],["h2","III. LES ASCITES"],["h3","1. Définition"],["p","L'ascite se définit comme un épanchement liquidien dans la cavité péritonéale ; le liquide est habituellement jaune citrin, il peut être coloré en vert par de la bile (en cas d'ictère), en rouge par du sang : ascite séro-hémorragique, d'aspect laiteux ou crémeux : ascite chyleuse. L'hémopéritoine (épanchement de sang pur) et les péritonites purulentes (présence de pus dans la cavité péritonéale) ne sont pas des ascites. Les ascites sont le plus souvent libres dans la cavité péritonéale, plus rarement il s'agit d'ascites cloisonnées dues à des adhérences soudant en partie le feuillet viscéral et le feuillet pariétal et divisant la séreuse en logettes irrégulières."],["h3","2. Physio-pathologie"],["p","Les ascites répondent à deux grands mécanismes : elles peuvent être soit d'origine inflammatoire, soit d'origine mécanique."],["p","2.1. Ascites d'origine inflammatoire : elles sont dues à une irritation du péritoine :"],["li","Localisation au niveau du péritoine d'une infection tuberculeuse."],["li","Métastase au niveau du péritoine d'un cancer développé à distance : exemple : cancer de l'ovaire."],["p","2.2. Ascites d'origine mécanique :"],["li","Elles sont en rapport avec une rétention hydrique, elles entrent alors dans le cadre d'un syndrome œdémateux généralisé (anasarque) : d'origine cardiaque, d'origine hépatique ou d'origine rénale."],["li","Elles peuvent être secondaires à une augmentation de la pression dans le système porte : hypertension portale."],["p","FIG. 16-1. — Percussion de la matité dans les flancs (décubitus dorsal)."],["p","FIG. 16-2. — Percussion de la matité dans les flancs (décubitus latéral)."],["li","le signe du flot : la palpation combinée à la percussion met en évidence le signe du flot autre témoin du caractère libre de l'ascite : le malade est en décubitus dorsal, la main gauche de l'examinateur est posée à plat sur le flanc droit, de la main droite l'examinateur donne une chiquenaude sur le flanc gauche du malade, la main d'un aide est placée par son bord cubital sur la ligne médiane de l'abdomen pour empêcher la transmission de l'onde sonore par la paroi, en cas d'ascite, l'onde sonore est transmise à travers le liquide et elle est perçue par la main gauche de l'examinateur (fig. 17)."],["li","Les touchers pelviens :"],["li","chez la femme : le toucher vaginal permet de retrouver :"],["li","le refoulement des culs-de-sac vaginaux qui sont bombés et rénitents,"],["li","l'abaissement de l'utérus qui est anormalement mobile;"],["li","chez l'homme : le toucher rectal permet de percevoir le cul-de-sac de Douglas qui est refoulé, bombé et rénitent."],["p","b) Ascite de grande abondance :"],["li","Les signes fonctionnels : sont souvent très bruyants : dyspnée, palpitations, constipation et oligurie."],["p","_ Les signes physiques : l'ascite est évidente."],["li","L'inspection :"],["li","l'abdomen est énorme;"],["li","l'ombilic est déplissé, retourné « en doigt de gant »;"],["li","la peau est tendue à l'extrême, amincie, luisante, sillonnée de vergetures;"],["li","il existe des œdèmes infiltrant les membres inférieurs, les organes génitaux externes, la paroi abdominale; une circulation veineuse collatérale sous-ombilicale et dans les flancs (les œdèmes et la circulation veineuse collatérale sont liés à la compression de la veine cave inférieure par l'ascite, ils régressent après ponction évacuatrice)."],["li","La percussion : met en évidence une matité de tout l'abdomen :"],["li","franche, hydrique;"],["li","les caractères de déclivité et de mobilité ne sont plus retrouvés."],["li","La palpation :"],["li","l'abdomen donne une sensation de résistance extrême;"],["li","l'examen du foie et de la rate est impossible;"],["li","le signe du flot est négatif."],["li","Les touchers pelviens : les culs-de-sac vaginaux et le cul-de-sac de Douglas sont bombés et rénitents."],["li","Les signes accompagnateurs : du fait de son abondance, l'ascite va être accompagnée de signes d'intolérance qui sont dus à la compression des organes intrathoraciques : cyanose, pouls petit, rapide, parfois irrégulier, tension artérielle basse, bruits du cœur assourdis et rapides."],["p","FIG. 17. — Le signe du flot."],["p","La ponction évacuatrice lente et prudente s'impose. c) Ascite de petite abondance : elle est de diagnostic difficile."],["li","L'inspection est en règle normale."],["li","La palpation : n'apporte pas de renseignements."],["li","La percussion : doit être fine, elle met en évidence une matité légère, déclive, mobile."],["li","matité des flancs : apparaissant ou s'accentuant en décubitus latéral droit et gauche;"],["li","matité péri-omhilicale : retrouvée en position genu-pectorale."],["li","Les touchers pelviens :"],["li","légère rénitence des culs-de-sac;"],["li","utérus anormalement mobile. Le diagnostic est affirmé par la ponction exploratrice."],["p","3.2. Les ascites cloisonnées : elles sont responsables à la palpation d'une sensation d'empâtement de l'abdomen."],["li","4. Diagnostic différentiel :"],["p","Une ascite ne doit pas être confondue avec :"],["p","4.1. Une adiposité pariétale : chez un obèse, une ascite de petite abondance peut être difficile à reconnaître."],["p","4.2. Un météorisme abdominal : qui entraîne une augmentation de volume de l'abdomen, mais la percussion met en évidence un tympanisme diffus."],["p","4.3. Un globe vésical : s'accompagne d'une matité sous-ombilicale sensible à limite supérieure convexe vers le haut."],["p","4.4. Un kyste de l'ovaire à développement abdominal : réalise une matité médiane ou latéralisée à limite supérieure convexe vers le haut (fig. 15-2) et une ascension de l'utérus au toucher vaginal ; deux signes ont une grande valeur en faveur du kyste : l'absence de déplissement de l'ombilic et la persistance de la sonorité lombaire en position demi-assise ; enfin, on recherchera le signe de la règle (fig. 18) qui consiste à placer une règle plate sur l'abdomen juste au-dessus du niveau des épines iliaques antérieures et supérieures, on appuie fermement la règle sur la paroi abdominale : en cas de kyste de l'ovaire, les pulsations de l'aorte abdominale sont transmises à la règle et peuvent être ressenties et vues, en cas d'ascite le liquide est déplacé dans les flancs et aucune pulsation n'est transmise."],["p","FIG. 18. — Le signe de la règle."],["h3","5. Les principales causes d'ascites"],["p","5.1. Le diagnostic étiologique repose sur :"],["li","l'interrogatoire : habitudes alimentaires, notion d'éthylisme chronique, notion de contage tuberculeux..."],["li","L'examen clinique : recherchera une circulation veineuse collatérale, des angiomes stellaires, des signes d'insuffisance cardiaque..."],["li","La ponction d'ascite :"],["li","Technique : se pratique avec une aiguille de Kuss, on pique à l'union du tiers externe et des deux tiers internes de la ligne joignant l'ombilic à l'épine iliaque antéro-supérieure gauche; on évitera de piquer à droite car risque de blessure du caecum qui est superficiel."],["li","Résultats :"],["li","aspect macroscopique du liquide : clair, jaune citrin, parfois séro-hémorragique, exceptionnellement chyleux ;"],["li","étude chimique : elle permet de distinguer les transsudats des exsudais :"],["li","le transsudat : pauvre en protides (taux inférieur à 30 g/1) et Rivalta négatif,"],["li","l'exsudat : riche en protides (taux supérieur à 30 g/1) et Rivalta positif;"],["li","étude cyto-bactériologique :"],["li","étude cytologique : numération des éléments blancs, équilibre (lymphocytes, polynucléaires, cellules mésothéliales) et recherche de cellules malignes,"],["li","recherche de BK (bacille de Koch)."],["li","Les examens complémentaires : en dehors de l'examen cyto-bactériologique et chimique du liquide; la laparoscopie est l'examen clé du diagnostic des ascites inflammatoires, elle permet de voir les anomalies du péritoine et d'en faire la biopsie."],["h4","5.2. Les différentes causes"],["p","5.2.1. Les ascites inflammatoires : le liquide d'ascite possède une formule d'exsudat, ce sont :"],["li","L'ascite tuberculeuse, la formule cytologique du liquide est à prédominance lymphocytaire; la laparoscopie, montre un péritoine inflammatoire parsemé de fines granulations blanchâtres et permet d'en faire la biopsie."],["li","L'ascite cancéreuse : métastase d'un cancer digestif ou chez la femme d'un cancer génital. L'examen cytologique du liquide peut montrer la présence de cellules malignes et la laparoscopie met en évidence de grosses granulations et permet d'en faire la biopsie."],["p","FIG. 19. — Différentes positions anatomiques de l'appendice."],["p","5.2.2. Les ascites mécaniques : le liquide d'ascite possède une formule de transsudat, ces ascites sont toujours associées à des œdèmes des membres inférieurs réalisant un syndrome œdémato-ascitique. Ce sont :"],["li","Les ascites cirrhotiques."],["li","Les ascites d'origine rénale : syndrome néphrétique."],["li","Les ascites d'origine cardiaque : insuffisance cardiaque globale, insuffisance cardiaque droite et péricardite constrictive. Une seule exception à cette règle est réalisée par l'ascite de l'hypertension portale pure qui peut ne pas être accompagnée d'œdème des membres inférieurs. Les causes les plus fréquentes sont : les ascites cirrhotiques, les ascites tuberculeuses et les ascites cancéreuses."],["h2","IV. LES PRINCIPALES URGENCES ABDOMINALES"],["p","Les urgences abdominales les plus fréquentes sont l'appendicite aiguë, la péritonite aiguë généralisée et l'occlusion intestinale aiguë."],["h3","1. L'appendicite aiguë"],["p","1.1. Définition : l'appendicite aiguë est une inflammation aiguë de l'appendice. L'appendice est de siège variable, le plus souvent il est en position iliaque droite, mais il peut également se situer en position rétro-caecale, pelvienne ou sous-hépatique (fig. 19). Ce qui explique que l'aspect sémiologique de l'appendicite aiguë peut varier en fonction du siège de l'appendice."],["h4","1.2. Etude sémiologique"],["p","a) L'appendicite iliaque droite : est la forme la plus fréquente"],["li","Signes fonctionnels :"],["li","Douleur abdominale : à début brutal siégeant au niveau de la fosse iliaque droite, d'intensité variable."],["li","Vomissements parfois remplacés par un simple état nauséeux."],["li","Troubles du transit : le plus souvent à type de constipation."],["pre","—      Signes généraux : fièvre modérée variant entre 38-38,5 °C, le pouls est accéléré en"],["p","rapport avec la température."],["li","Signes physiques : l'appendicite aiguë est reconnue sur :"],["li","La palpation de l'abdomen : pratiquée avec douceur en commençant par la fosse iliaque gauche et en remontant le long du cadre colique jusqu'à la fosse iliaque droite, elle permet de mettre en évidence :"],["li","une douleur provoquée au niveau du point appendiculaire : point de Mac Burney situé au milieu de la ligne joignant l'ombilic et l'épine iliaque antérieure et supérieure. La recherche de la douleur provoquée peut mettre en évidence deux signes particuliers :"],["p","* le signe de Blumberg, c'est l'apparition d'une douleur vive à la décompression de la fosse iliaque droite, on l'obtient en appuyant profondément mais avec douceur les doigts dans la fosse iliaque droite, puis on lâche brusquement la pression en soulevant la main d'un seul coup, une douleur vive apparaît au point appendiculaire;"],["p","* le signe de Rovsing : est obtenu en déprimant profondément la fosse iliaque gauche, une douleur vive apparaît au point appendiculaire ;"],["li","une défense pariétale localisée à la fosse iliaque droite;"],["li","une hyperesthésie cutanée."],["li","Le toucher rectal ou vaginal met en évidence une douleur provoquée au niveau du cul-desac de Douglas (fig. 20)."],["p","FIG. 20. — TR : douleur provoquée au cul-de-sac de Douglas."],["p","b) L'appendicite rétro-caecale : l'appendice est située derrière le caecum. Elle est reconnue sur le siège de la douleur provoquée qui aura un maximum postérieur. Elle est mise en évidence par le palper bimanuel lombaire et iliaque, la main lombaire déclenche la douleur audessus du versant postérieur de la crête iliaque."],["p","c) L'appendicite pelvienne : outre la douleur et la fièvre, il existe des signes fonctionnels urinaires : dysurie et pollakiurie. Le toucher rectal ou vaginal est seul capable de mettre en évidence la douleur provoquée siégeant au niveau du cul-de-sac de Douglas."],["p","d) L'appendicite sous-hépatique : le maximum des signes se situe au niveau de l’hypochondre droit et simule une cholécystite aiguë."],["p","1.3. Examens complémentaires : l'hémogramme montre dans tous les cas, une hyper leucocytose avec polynucléose neutrophile, l'ASP est en règle normal."],["p","1.4. L'évolution : en l'absence de traitement chirurgical précoce, l'appendicite aiguë va évoluer vers les complications dont la plus grave est la perforation responsable de la péritonite aiguë."],["h3","2. La péritonite aiguë généralisée"],["p","2.1. Définition : la péritonite aiguë généralisée est une infection aiguë étendue à toute la séreuse péritonéale."],["p","2.2. Mécanismes :"],["li","Le plus souvent, il s'agit d'une perforation d'un organe creux dans la cavité péritonéale"],["li","Soit perforation traumatique d'un organe sain."],["li","Soit perforation d'un organe creux qui est le siège, d'un processus pathologique : perforation d'un appendice, siège d'une inflammation, perforation d'un ulcère duodénal ou gastrique : le liquide gastrique aseptique fait irruption dans la cavité péritonéale responsable de la douleur brutale, secondairement au bout de 5 à 6 heures apparition d'une infection par pullulation des germes responsables des signes de péritonite."],["li","Plus rarement, il s'agit d'une infection péritonéale primitive : péritonite à pneumocoque qui se voit chez l'enfant et dont le traitement est médical."],["p","2.3. Etude sémiologique :"],["li","Les signes communs de péritonite aiguë :"],["li","S ignés fonctionnels :"],["li","douleur abdominale : constante, permanente, augmentée par les mouvements, la toux, l'éternuement, l'effort de défécation et la palpation : toutes les manœuvres qui augmentent la pression intra-péritonéale. Cette douleur est d'abord localisée, le siège initial de la douleur est important car il peut permettre de reconnaître la cause, puis la douleur est secondairement généralisée à tout l'abdomen;"],["li","vomissements : inconstants;"],["li","troubles du transit : constipation, parfois arrêt des matières et des gaz en rapport avec un iléus réflexe (occlusion intestinale fonctionnelle)."],["li","Signes généraux : la fièvre dont l'heure d'apparition varie avec la cause, le pouls est accéléré."],["li","Signes physiques :"],["li","inspection : abolition de la respiration abdominale', parfois, il existe une rétraction de l'abdomen;"],["li","palpation : met en évidence un signe majeur : la contracture abdominale qui possède les caractères suivants : elle est douloureuse s'accompagnant d'une hyperesthésie cutanée, elle est localisée au début puis généralisée, elle est invincible, permanente et irréductible, réalisant le classique « ventre de bois ». Les signes accompagnateurs sont les suivants :"],["li","abolition des réflexes cutanés abdominaux;"],["li","douleur vive déclenchée au niveau du cul-de-sac de Douglas par le toucher rectal : « cri du Douglas »."],["p","Il faut savoir que parfois la contracture abdominale peut manquer et être remplacée par une défense pariétale."],["li","Les signes de la péritonite appendiculaire :"],["li","Signes fonctionnels : douleur abdominale : à début progressif, dont le siège initiaient la fosse iliaque droite ;"],["li","signes généraux : sont marqués, fièvre rapidement élevée à 39,5-40 °C, le pouls est accéléré en rapport;"],["li","signes physiques : la contracture abdominale est maximale au niveau de la fosse iliaque droite;"],["li","examens complémentaires : l'hémogramme montre une hyperleucocytose avec polynucléose neutrophile, l'ASP est en règle normal."],["li","Les signes de la péritonite par perforation d'ulcère :"],["pre","—     Signes fonctionnels :"],["li","douleur abdominale : à début brutal, déchirante en coup de poignard, survenant en pleine santé apparente, de siège épigastrique, puis diffuse secondairement à droite et en bas. Il est indispensable de préciser l'heure d'apparition de la douleur;"],["li","vomissements : sont retardés et inconstants;"],["li","l'interrogatoire recherche des antécédents de douleur ulcéreuse qui peuvent manquer."],["li","Signes généraux : la température est normale les premières heures, le pouls est parfois accéléré."],["pre","—     Signes physiques : l'examen clinique va mettre en évidence deux signes fondamen-"],["p","taux :"],["li","la contracture abdominale épigastrique ou diffuse à prédominance épigastrique;"],["li","la disparition de la matité préhépatique mise en évidence par la percussion pratiquée sur le sujet en position demi-assise; elle traduit l'existence d'un pneumopéritoine."],["pre","—     Examens complémentaires : l'hémogramme est normal dans les premières heures,"],["p","l'ASP met en évidence le pneumopéritoine qui apparaît comme un croissant gazeux inter-hépato-diaphragmatique (fig. 21 )."],["p","FiG. 21. — A SP : pneumo-péritoine."],["h3","3. L'occlusion intestinale aiguë"],["p","3.1. Définition : l'occlusion intestinale aiguë est une obstruction mécanique où fonctionnelle de l'intestin siégeant au niveau du côlon ou du grêle, s'accompagnant d'une gêne au transit intestinal."],["p","Nous envisagerons d'abord l'occlusion intestinale mécanique qui est toujours une urgence chirurgicale et nous terminerons par l'occlusion fonctionnelle."],["h4","3.2. Mécanismes"],["p","a) L'occlusion intestinale aiguë mécanique peut se produire suivant deux mécanismes : par strangulation et par obstruction."],["pre","—     Occlusion par strangulation : il s'agit d'un obstacle qui entraîne une strangulation"],["p","due à :"],["li","Une bride : cicatrice fibreuse secondaire à une intervention chirurgicale (fig. 22)."],["li","Un volvulus : qui est une torsion de l'intestin sur lui-même (fig. 23)."],["li","Un étranglement herniaire : est la cause la plus fréquente des occlusions par strangulation, la hernie contient de l’épiploon et de l'intestin."],["pre","—     Occlusion par obstruction de la lumière intestinale, la cause la plus fréquente est"],["p","une tumeur intestinale."],["pre","FIG. 22. — Occlusion sur bride.                           FIG. 23. — Volvulus."],["p","b) L'occlusion intestinale fonctionnelle peut survenir :"],["li","Au cours d'une péritonite aiguë, l'occlusion est alors réflexe."],["li","En cas de déséquilibre hydro-électrolytique s'accompagnant d'hypolcaliémie."],["h4","3.3. Etude sémiologique"],["p","a) Occlusion intestinale mécanique : l'étude sémiologique a pour but de reconnaître l'occlusion, d'en préciser le siège et de retrouver si possible la cause."],["li","Reconnaître l'occlusion: sur des caractères communs réalisant le syndrome occlusif. * Signes fonctionnels : à l'interrogatoire, on retrouve une triade fonctionnelle caractéristique :"],["li","douleur abdominale : dont le mode de début est variable ainsi que l'intensité, à type de coliques intermittentes évoluant par paroxysmes témoins de la lutte de l'intestin contre l'obstacle, entre les paroxysmes persiste un fond douloureux permanent;"],["li","vomissements : plus ou moins précoces d'abord alimentaires, puis bilieux et enfin fécaloïdes dans les formes négligées;"],["li","l'arrêt des matières et des gaz est le signe fondamental ; l'arrêt des gaz est constant, il précède l'arrêt des matières de quelques heures."],["pre","—      Signes physiques : l'examen clinique va mettre en évidence le météorisme abdominal"],["p","qui est visible, palpable et percutable."],["li","inspection : met en évidence le météorisme abdominal ou ballonnement abdominal qui est généralisé ou localisé ; parfois existence de mouvements péristaltiques visibles sous la peau qui peuvent être déclenchés par une chiquenaude ;enfin, elle recherche une cicatrice d'intervention chirurgicale;"],["li","palpation : montre une sensation de résistance élastique, elle contrôle l'absence de contracture abdominale, elle peut noter une sensation de durcissement intermittent qui est en rapport avec les ondulations péristaltiques, enfin elle permet de vérifier les orifices herniaires à la recherche d'une hernie étranglée;"],["li","percussion : met en évidence un tympanisme généralisé ou localisé;"],["li","l'auscultation : va retrouver soit un silence abdominal, soit au contraire des bruits hydroaériques et des gargouillements spontanés ou provoqués;"],["li","les touchers pelviens : TR et TV sont en règle normaux."],["li","Examens complémentaires : l'ASP va montrer un signe fondamental, l'existence de niveaux hydro-aériques."],["li","Le siège de l'occlusion: sera reconnu sur des signes particuliers, il peut s'agir d'une occlusion du grêle ou d'une occlusion du côlon. * Occlusion du grêle : début brutal"],["li","Signes fonctionnels : douleurs abdominales à début brutal et très intenses, vomissements intenses et précoces ; arrêt des matières et des gaz tardif; altération de l'état général importante, il existe un tableau de déshydratation d'installation rapide qui peut aboutir au collapsus par hypovolémie."],["li","Signes physiques : le météorisme abdominal est localisé, central dans la région périombilicale et il est discret."],["li","Signes radiologiques : l'ASP montre des niveaux hydro-aériques nombreux, de petites dimensions, réalisant des images étagées « en tuyaux d'orgue », absence de distension colique (fig. 24-1). * Occlusion du côlon : début progressif"],["li","Signes fonctionnels : douleurs abdominales à début progressif, d'intensité peu marquée; vomissements tardifs; arrêt des matières et des gaz précoce; l'état général est longtemps conservé."],["li","Signes physiques : le météorisme abdominal est très important, soit périphérique en cadre, soit asymétrique, puis il devient diffus et généralisé."],["li","Signes radiologiques : l'ASP montre une distension gazeuse du cadre colique et des images hydro-aériques peu nombreuses (fig. 24-2)."],["pre","FIG. 24-1. — ASP : Occlusion du grêle.     FIG. 24 2. — ASP : Occlusion du côlon."],["li","La cause de l'occlusion: on peut opposer l'occlusion par strangulation qui réalise un tableau à début brutal et d'une grande gravité à l'occlusion par obstruction qui au contraire réalise un tableau à début progressif et moins alarmant, mais en fait le diagnostic précis est apporté par la laparotomie exploratrice qui est de toute façon le geste indispensable dès que le diagnostic d'occlusion intestinale aiguë est porté."],["p","b) L'occlusion intestinale fonctionnelle ou iléus paralytique est due à une paralysie de l'intestin; elle est reconnue sur les signes suivants :"],["li","Signes fonctionnels : arrêt des matières, sans arrêt absolu des gaz, la douleur est peu importante, voire absente."],["li","Signes physiques : météorisme abdominal diffus, immobile, sans ondulations péristaltiques."],["li","Signes radiologiques : l’ASP montre une distension intestinale globale intéressant également le cadre colique sans niveaux hydro-aériques."]]}]},{"ic":"🧠","ar":"الجهاز العصبي","fr":"Le système nerveux","c":"#7C3AED","ch":[{"ar":"آلام الرأس والوجه","fr":"Les algies cranio-faciales","w":1989,"b":[["p","Les algies cranio-faciales comprennent les algies crâniennes localisées au niveau de la boîte crânienne encore appelées céphalées qui sont les plus fréquentes et les algies faciales localisées au niveau de la face."],["h2","I. RAPPEL DES DISPOSITIFS SENSIBLES DU CRÂNE ET DE LA FACE"],["h3","1. Les structures sensibles endocrâniennes"],["p","Ce sont les vaisseaux méningés, la dure-mère (base du crâne), les gros troncs artériels et les sinus veineux. Il est à noter que l’encéphale et les autres tuniques méningées ne sont pas sensibles."],["h3","2. Les structures sensibles exo-crâniennes"],["p","Ce sont l’œil, l'oreille moyenne, la mastoïde, les dents, les muqueuses buccale, nasale, sinusale, du conduit auditif externe, le revêtement cutané."],["h2","II. LES VOIES DE LA SENSIBILITÉ"],["h3","1. Territoire d’innervation sensitive du V"],["p","D'une façon générale, le nerf trijumeau est la voie principale de la sensibilité douloureuse de la tête."],["p","1.1. Structures endocrâniennes : situées au-dessus de la tente du cervelet."],["p","1.2. Structures exocrâniennes (fig. 1) : téguments de la face, muqueuses buccale, nasale et sinusale, dents, conduit auditif externe, cavités orbitaires, articulation temporo-maxillaire et artère temporale superficielle."],["p","Une anomalie de ces structures va se traduire soit par des douleurs faciales, soit par de céphalées qui correspondent à une douleur projetée dans la moitié antérieure du crâne réalisant une céphalée frontale, temporale ou pariétale."],["p","FIG. l. — Territoire d'innervation sensitive du trijumeau."],["li","2. Territoire d'innervation sensitive du IX, du X et des deux premières racines cervicales"],["p","2.1. Structures endocrâniennes : situées au-dessous de la tente du cervelet."],["p","2.2. Structures exocrâniennes : premières articulations vertébrales, muscles cervicaux, oreille moyenne et mastoïde, artère occipitale et artère vertébrale."],["p","Une anomalie de ces structures va se traduire par des céphalées qui correspondent à une douleur projetée dans la moitié postérieure du crâne prédominant dans la région occipitale."],["h2","III. PHYSIO-PATHOLOGIE DES ALGIES CRANIO-FACIALES"],["p","Plusieurs mécanismes peuvent être à l'origine des algies cranio-faciales."],["h3","1. Une souffrance des structures sensibles du crâne : à type de distorsion vasculaire par"],["p","un processus tumoral ou une inflammation de ces structures par exemple : méningite et sinusite; ces mécanismes permettent d'individualiser les algies cranio-faciales symptomatiques."],["li","2. Une vaso-dilatation est responsable des migraines et algies vasculaires de la face. Ces troubles vaso-moteurs apparaissent par crises qui débutent par une vaso-constriction responsable de l'aura migraineuse, suivie par une vaso-dilatation qui correspond cliniquement à la phase douloureuse."],["h3","3. Les algies cranio-faciales peuvent être d'origine psychiques, ce sont les céphalées"],["p","psychogènes dont l'exemple le plus typique est la céphalée par tension douloureuse des muscles."],["li","4. Enfin, ces algies peuvent apparaître sans cause décelable, c'est le cas de la névralgie essentielle du trijumeau."],["h2","IV. ETUDE SÉMIOLOGIQUE"],["p","Elle doit être centrée sur l'interrogatoire; c'est de lui dont dépend la compréhension du symptôme et l'orientation étiologique précise qui va conditionner l'attitude pratique : rassurer le malade et le traiter ou entreprendre des investigations complémentaires spécialisées."],["p","L'interrogatoire va préciser Ses caractères suivants de la douleur :"],["h2","I. Le siège"],["p","Localisé ou diffus, fixe ou changeant, douleur de la face ou céphalée antérieure ou postérieure."],["h3","2. Le type"],["p","Pulsatile, constrictive (casque ou étau), sensation de tension (crampe musculaire), sensation de décharge électrique."],["h3","3. L'évolution dans le temps"],["p","Permanente ou paroxystique : évoluant par crise douloureuse."],["h3","4. Les facteurs déclenchants"],["li","Facteurs mécaniques : toux, effort, variations thermiques, éclairement, attention visuelle."],["li","Facteurs digestifs."],["li","Facteurs psychologiques : émotion."],["h3","5. Les antécédents"],["p","Traumatisme crânien, notion familiale."],["p","L'interrogatoire devra être complété par un examen neurologique, un fond d’œil(FO) et la prise systématique de la tension artérielle qui sont les trois gestes indispensables devant toute algie cranio-faciale."],["h2","V. LES DIFFÉRENTS TYPES D'ALGIES CRANIO-FACIALES"],["p","Nous envisagerons successivement les algies cranio-faciales vasculaires, la névralgie essentielle du trijumeau : les algies cranio-faciales symptomatiques et enfin les céphalées psychogènes."],["h3","1. Les algies cranio-faciales vasculaires"],["p","Elles ont pour point commun d'évoluer par crise paroxystique, elles comprennent les algies crâniennes vasculaires ou migraines et les algies faciales vasculaires."],["p","1.1. Les migraines : sont les plus fréquentes, se voient surtout chez la femme, sur un terrain particulier où l'on note, outre une notion familiale, une grande fréquence des manifestations allergiques et des manifestations digestives surtout d'origine vésiculaire et un caractère psychologique commun : l'anxiété."],["li","Définition : les migraines sont définies comme : une affection familiale, caractérisée par des accès répétitifs de céphalées très variables dans leur intensité, leur fréquence et leur durée; ces accès sont habituellement unilatéraux et généralement associés à des vomissements ou des nausées; parfois, ils succèdent ou s'associent à des troubles de l'humeur ou à des perturbations neurologiques."],["li","Les différentes variétés de migraine : la migraine simple, la migraine accompagnée et la migraine compliquée. a) La migraine simple : est la variété la plus fréquente."],["li","Prodromes : sont fréquents; le plus souvent, la veille au soir modifications de l'humeur : instabilité, tendance dépressive et agitation hypomaniaque."],["li","La crise migraineuse : réalise une céphalée ayant les caractères suivants :"],["li","horaire de survenue : le matin au réveil ou au cours de la journée;"],["li","topographie : classiquement unilatérale réalisant une hémicrânie, de siège habituellement temporal, en fait variable d'un maladie à l'autre, des irradiations sont fréquentes à l'autre côté de la tête;"],["li","type : le plus souvent pulsatile"],["li","intensité : habituellement intense, aggravée par l'activité, la lumière et le bruit;"],["li","signes associés : signes digestifs : les nausées, sont constantes, accompagnées de vomissements dans deux tiers des cas ; troubles vasomoteurs : rougeur de la face et hyperhémie conjonctivale réalisant la migraine rouge ou pâleur intense réalisant la migraine blanche;"],["li","évolution de la crise : la céphalée s'accentue rapidement et atteint son maximum en deux à trois heures, puis reste stable pendant un temps variable et cède progressivement après le sommeil marquée par une crise polyurique. b) La migraine accompagnée : dans ce cas, la céphalée est précédée ou accompagnée d'une « aura » : c'est-à-dire d'un dysfonctionnement cérébral focal transitoire intéressant la vision, la sensibilité ou le langage."],["li","La migraine ophtalmique : est la plus fréquente des migraines accompagnées; elle est précédée d'une aura visuelle évoluant en deux phases : première phase : scotome scintillant : point très lumineux qui débute au centre de la vision et s'étend par un seul de ses côtés vers la périphérie ; présent les yeux ouverts et les yeux fermés; deuxième phase : scotome anopsique ou scotome aveugle qui succède au scotome scintillant en suivant la même progression. Le trouble visuel intéresse les deux yeux de façon identique."],["li","Autre migraine accompagnée : avec aura sensitive : impression d'engourdissement débutant à la main, atteignant le membre supérieur, l'hémiface et l'hémilangue avec dysarthrie. Les symptômes durent vingt minutes, puis la céphalée s'installe controlatérale à l'aura en trente à soixante minutes, dure une à deux heures et disparaît progressivement."],["p","c) La migraine compliquée :"],["li","Migraine hémiplégique : déficit hémiplégique qui dure cinq à soixante minutes, puis apparition de la céphalée."],["li","Migraine ophtalmoplégique : la céphalée inaugure l'accès, elle est orbitaire, unilatérale, la paralysie oculaire apparaît quelques heures à quelques jours après le début de la céphalée, elle est homolatérale et intéresse le III, elle régresse en une à quatre semaines."],["p","1.2. Algie faciale vasculaire : « cluster headache » : mal de tête en salves (par périodes), se voit surtout chez l'homme jeune, il évolue par crise ou accès qui présente les caractères suivants :"],["li","Mode de début : brutal, douleur d'emblée intense, maximum au bout de quelques minutes."],["li","Siège : oculaire, rétro-oculaire ou péri-oculaire; elle peut rester localisée ou s'étendre du même côté : front, tempe, maxillaire supérieur; elle peut toucher l'ensemble de l'hémiextrémité céphalique dépassant ainsi le territoire du V; elle est strictement unilatérale."],["li","Type : douleur vive à type de brûlure, transpercement, déchirement, écrasement."],["li","Durée et évolution : en moyenne trente minutes, le sujet présente en moyenne un à trois accès par jour pendant des périodes de quelques semaines (deux à huit semaines)."],["li","Signes accompagnateurs : homolatéraux."],["li","Rougeur intense de l'hémiface."],["li","Injection conjonctivale avec larmoiement."],["li","Obstruction nasale avec catarrhe."],["li","Syndrome de Claude Bernard Horner avec myosis et ptosis."],["h3","2. Névralgie essentielle du trijumeau ou tic douloureux de Trousseau"],["p","Elle se voit surtout chez la femme entre 50 et 55 ans. Il s'agit d'une douleur discontinue évoluant par paroxysme ou accès ou éclairs qui possède les caractères suivants :"],["li","Siège : unilatéral, intéressant le plus souvent une seule branche du V surtout la branche maxillaire supérieure (lèvre supérieure, aile du nez, gencive supérieure), parfois la branche maxillaire inférieure (gencive inférieure, menton), rarement la branche ophtalmique, parfois d'emblée deux branches; elle peut se bilatéraliser : c'est une douleur extensive."],["li","Type : secousse électrique, coup de couteau, broiement, arrachement : c'est une douleur effroyable."],["li","Durée et évolution: dix à quinze secondes à quelques minutes (une à deux minutes), plusieurs accès se répètent en quelques minutes à quelques heures, par périodes qui durent quelques jours à plusieurs semaines; elle respecte le sommeil."],["li","Facteur déclenchant : la douleur est provoquée par la parole, la mastication (d'où gêne à l'alimentation) et par l'effleurement de la zone gâchette ou « trigger zone » qui est une zone limitée appartenant au territoire de la douleur."],["li","Signes accompagnateurs :"],["li","Manifestations motrices : tressaillement musculaire, spasme d'où le nom de tic douloureux de la face."],["li","Phénomènes vasomoteurs : discrets : rougeur, larmoiement."],["li","L'examen neurologique est normal."],["h3","3. Les algies cranio-faciales symptomatiques"],["p","3.1. Les algies faciales symptomatiques : peuvent être, soit de cause locale en rapport avec une anomalie des structures sensibles de la face, soit symptomatiques d'une lésion du trijumeau."],["li","Algies faciales de cause locale : oculaire : exemple : glaucome, sinusale : sinusite, dentaire : pulpite, osseuse."],["li","Algies faciales symptomatiques d'une lésion du V : la douleur présente les caractères suivants : * Elle peut survenir à tout âge. * Elle peut toucher n'importe quelle branche du trijumeau. * Elle évolue par accès douloureux moins nets survenant sur un fond douloureux permanent; * elle n'est pas périodique mais chronique, elle ne respecte pas le sommeil. * On ne retrouve pas de zone gâchette. * Elle n'est pas extensive."],["pre","229                                                                      Le système nerveux"],["p","* Elle s'accompagne de signes neurologiques :"],["li","hypoesthésie du V (abolition du réflexe cornéen);"],["li","atteinte du V moteur;"],["li","autres signes neurologiques. Les causes : sont des lésions du trijumeau."],["li","Lésions du tronc cérébral : sclérose en plaques."],["li","Tumeur de l'angle ponto-cérébelleux."],["li","Zona du ganglion de Gasser."],["li","Lésion des branches du V par cancer du naso-pharynx."],["p","3.2. Les céphalées symptomatiques : peuvent être en rapport avec une douleur projetée ou bien avoir une cause neurologique, vasculaire ou générale."],["p","_ Douleur projetée : d'origine oculaire : glaucome ou baisse de l'acuité visuelle; d'origine sinusale : sinusite."],["p","_ Causes neurologiques :"],["li","Par inflammation ou irritation des méninges au cours des méningites, des hémorragies méningées."],["li","Par hypertension intra-crânienne : au cours des tumeurs cérébrales (le FO montre un œdème papillaire). Dans ces deux cas, les céphalées sont accompagnées de vomissements faciles en fusée."],["li","Céphalées post-traumatiques : après traumatisme crânien."],["li","Causes vasculaires : au cours de l'artérite temporale de Horton ; qui atteint le sujet âgé de 70 ans qui va se manifester par des céphalées importantes temporo-occipitales ; l'examen clinique montre des artères temporales épaissies, non pulsatiles. _ Causes générales :"],["li","HTA."],["li","Anémie."],["li","Polyglobulie."],["li","hypoxie et hypercapnie. D'où l'importance devant toute céphalée de pratiquer un examen neurologique, de prendre systématiquement la TA et de faire un FO."],["h3","4. Les céphalées psychogènes"],["p","Elles sont de loin les plus fréquentes des algies cranio-faciales."],["p","4.1. Les psychalgies ou cénesthopathies : elles ne répondent à aucune description sémiologique précise, on retrouve le plus souvent un facteur déclenchant psycho-affectif et une personnalité particulière : angoisse et troubles de l'humeur et du comportement."],["p","4.2. Les céphalées par tension musculaire : ce sont des douleurs permanentes, plus marquées le matin, diminuant en Un de journée."],["p","Siège : en casque, bifrontale, occipitale parfois cervicale. Elles réalisent une douleur superficielle qui peut être réveillée par la pression des régions pariétales ou des muscles cervicaux et accentuée par les efforts d'attention intellectuelle. Ces céphalées sont dues à une tension anormale des muscles paravertébraux d'origine psychogène, parfois favorisées par une anomalie organique en particulier arthrose vertébrale et troubles visuels."]]},{"ar":"الفحص العصبي","fr":"L'examen neurologique","w":7097,"b":[["h2","I. PRINCIPES GÉNÉRAUX"],["p","L'examen neurologique doit être fait systématiquement au cours de tout examen clinique complet."],["p","Comme tout examen clinique, il comprend un interrogatoire et un examen physique qui doit suivre un ordre rigoureux."],["p","Le matériel nécessaire est le suivant : un marteau à réflexe, un diapason, une lampe de poche, une aiguille, un morceau de coton hydrophile, un tube d'eau chaude et un tube d'eau froide et une pointe mousse (exemple : clé de voiture)."],["p","L'examen neurologique d'un malade conscient nécessite sa collaboration étroite; elle sera obtenue par une mise en confiance préalable et une explication claire des différentes manœuvres."],["p","Enfin, cet examen ne doit pas être trop long, car la fatigue peut aboutir à des réponses erronées."],["h2","II. L'INTERROGATOIRE"],["p","Va s'attacher à rechercher des signes fonctionnels; il va permettre d'apprécier l'état mental du malade et enfin il recherchera des troubles du langage."],["h3","1. Les signes fonctionnels suivants sont systématiquement recherchés"],["p","1.1. Les algies cranio-faciales (voir Chapitre premier)."],["p","1.2. Les troubles sensitifs subjectifs : à type de douleur ou de paresthésies (voir Chapitre VI)."],["p","1.3. Les troubles sphinctériens : retard à la miction ou miction impérieuse."],["p","1.4. Les troubles génitaux : impuissance."],["h3","2. L'état mental"],["p","L'interrogatoire du malade s'attache à préciser l'état de conscience, l'orientation, l'humeur, le comportement, la mémoire ; il recherche des troubles du contenu de la pensée et enfin il teste les performances intellectuelles."],["p","2.1. L'état de conscience : les perturbations de la conscience peuvent aller de la simple obnubilation au coma."],["p","2.1.1. L'obnubilation : est un
