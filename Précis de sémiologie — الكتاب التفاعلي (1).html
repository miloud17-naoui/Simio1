rs de l'inspiration profonde; en décubitus latéral droit (fig. 7), le malade est couché sur le côté droit, les membres inférieurs légèrement fléchis, l'examinateur se place à gauche du malade et place les doigts de sa main gauche en"],["p","FIG. 7. — Palpation de la rate en décubitus latéral droit."],["p","crochet sous le rebord costal gauche, on demande au sujet de respirer à fond le pôle inférieur de la rate vient buter contre les doigts lors de l'inspiration profonde; cette dernière technique de palpation permet de rechercher les splénomégalies de petite taille."],["li","Résultats : la splénomégalie est reconnue sur les caractères suivants :"],["li","le bord antérieur crénelé avec ses deux ou trois incisures superposées est le caractère le plus spécifique en faveur de la splénomégalie;"],["li","la mobilité lors des mouvements respiratoires : ce caractère n'est pas spécifique car le rein est également mobile avec les mouvements respiratoires;"],["li","l'absence de contact lombaire : la splénomégalie n'est pas palpable dans la fosse lombaire gauche, en fait une rate très volumineuse et latéralisée peut être perçue au niveau de la fosse lombaire;"],["li","le pôle supérieur de la splénomégalie n'est jamais palpable. En résumé, au terme de l'examen clinique dans les cas habituels, la splénomégalie réalise une tuméfaction de l'hypocondre gauche qui possède les caractères suivants : elle est mate à la percussion, elle est mobile avec les mouvements respiratoires, elle ne donne pas de contact lombaire, son pôle supérieur n'est pas palpable et enfin Surtout son bord antérieur est crénelé. La palpation permet également de préciser les caractères de la splénomégalie :"],["li","Son volume : le volume de la rate est apprécié en appliquant la classification de l'OMS (fig. 8) :"],["li","rate 0 : est une rate de volume normal, non palpable même en inspiration profonde;"],["li","rate 1 : est une rate palpable lors de l'inspiration profonde ce qui est normal chez le nourrisson, mais pathologique chez l'adulte;"],["li","rate 2 : est une rate palpable lors de la respiration normale, mais qui ne dépasse pas une horizontale passant à égale distance entre le rebord costal et l'ombilic;"],["li","rate 3 : est une rate qui descend au-dessous de cette ligne, mais qui ne dépasse pas l'horizontale passant par l'ombilic;"],["li","rate 4 : est une rate qui descend au-dessous de l'ombilic, mais ne dépasse pas une ligne passant à égale distance entre l'ombilic et la symphyse pubienne;"],["li","rate 5 : est une rate qui descend au-dessous de cette ligne et qui est palpable dans la fosse iliaque gauche. Les contours de la rate une fois délimités par la palpation pourront être tracés sur la peau à l'aide d'un crayon feutre et un calque pourra être fait qui constituera un document et qui permettra de suivre l'évolution dans le temps."],["li","Sa consistance : ferme et élastique le plus souvent, parfois dure lorsque la splénomégalie est ancienne."],["li","Sa surface : régulière le plus souvent ou parfois irrégulière."],["li","Sa sensibilité : en règle indolore, parfois sensible."],["p","3.1.2. Les examens complémentaires : seront parfois nécessaires dans les cas difficiles pour affirmer qu'une tuméfaction de l'hypocondre gauche est bien une splénomégalie en particulier lorsque le bord antérieur crénelé n'est pas nettement palpable."],["li","La radiographie de l'abdomen sans préparation : peut montrer l'ombre homogène de la rate qui contraste avec les viscères voisins de l'estomac et le côlon."],["li","Les radiographies avec préparation des viscères voisins (fig. 9)."],["li","Le transit gastro-duodénal : la splénomégalie refoule la grande courbure de l'estomac opacifié."],["li","Le lavement baryte : la splénomégalie abaisse et refoule l'angle colique gauche vers la ligne médiane."],["li","L'urographie intraveineuse : est le plus important, car il permet de préciser que le rein gauche est normal."],["p","FIG 8. – Classification des splénomégalies (OMS)"],["li","La scintigraphie hépato-splénique au technicium permet de visualiser la splénomégalie."],["p","3.2. Le diagnostic différentiel : l'examen clinique et les examens complémentaires vont permettre de différencier la splénomégalie des autres tuméfactions de l’hypocondre gauche."],["p","3.2.1. Un gros rein : est le diagnostic différentiel le plus important et le plus difficile ; il réalise une tuméfaction barrée par la sonorité colique, donnant le contact lombaire; mobile avec les mouvements respiratoires; l’UIV permettra de trancher dans les cas douteux."],["p","3.2.2. Une tumeur de l'angle colique gauche : réalise une tuméfaction irrégulière et"],["li","immobile lors des mouvements respiratoires s'accompagnant le plus souvent de troubles du transit; le lavement baryte et la coloscopie permettront de trancher dans les cas douteux."],["p","FIG. 9. — Refoulement de la grande courbure de l'estomac et de l'angle colique gauche par la splénomégalie."],["p","3.2.3. Une hypertrophie du lobe gauche du foie \\ réalise une masse plus médiane à bord inférieur mince en continuité avec le reste de la glande."],["h4","3.2.4. Exceptionnellement, une tumeur de la queue du pancréas ou une tumeur du"],["p","mésentère."],["h3","4. Enquête étiologique"],["p","4.1. L'interrogatoire : va rechercher systématiquement la notion de signes généraux : fièvre et amaigrissement; la notion d'hémorragies digestives, la notion de consanguinité et de splénomégalie familiale."],["p","4.2. L'examen clinique recherche :"],["li","Des signes d'hypertension portale : une ascite, une circulation veineuse collatérale abdominale; des hémorroïdes."],["li","Une modification de volume du foie, un ictère."],["li","Des signes hématologiques : une pâleur cutanéo-muqueuse, des adénopathies, des douleurs osseuses provoquées, un purpura pétéchial et ecchymotique."],["p","4.3. Les examens complémentaires de routine seront systématiquement demandés ."],["li","Un hémogramme et un frottis sanguin."],["li","Un taux de réticulocytes."],["li","Un dosage de la bilirubine indirecte."],["li","Une exploration fonctionnelle hépatique. D'autres examens complémentaires spécialisés seront demandés en fonction du contexte clinique et biologique."],["h3","5. Les différentes étiologies"],["p","5.1. Les splénomégalies infectieuses : surviennent en règle dans un contexte fébrile sauf \\i kyste hydatique de la rate."],["li","Les septicémies : le sujet présente un syndrome infectieux sévère avec altération de l'état général, fièvre élevée et splénomégalie en règle modérée de type 1 ou 2. » L'hémoculture avant tout traitement antibiotique permet de mettre en évidence le germe en cause. Parmi les septicémies, la fièvre typhoïde tient une place importante du fait de sa fréquence dans notre pays : au deuxième septénaire, elle sera reconnue sur l'association : fièvre en plateau, pouls dissocié, splénomégalie et taches rosées lenticulaires."],["li","Les parasitoses :"],["li","Le paludisme : associe une fièvre intermittente de type tierce le plus souvent, plus rarement quarte et une splénomégalie de volume modéré. Le frottis sanguin et la goutte épaisse permettent de retrouver le plasmodium en cause."],["li","Le kala-azar : ou leishmaniose viscérale, fréquent chez le nourrisson, plus rare chez l'enfant, exceptionnel chez l'adulte; associe une hyperthermie; une pâleur cutanéo-muqueuse, une splénomégalie volumineuse. Le médullogramme permet de mettre en évidence le parasite : leishmania donovani."],["li","Cas particulier : le kyste hydatique réalise une splénomégalie isolée de surface irrégulière : l'échographie met en évidence en son sein une formation liquidienne et la sérologie hydatique est positive."],["p","5.2. Les splénomégalies hématologiques :"],["li","Les anémies hémolytiques : qui associent une pâleur cutanéo-muqueuse, un subictère et une splénomégalie de volume variable et sur le plan biologique une anémie (diminution du taux d'hémoglobine, du taux d'hématocrite, du nombre de globules rouges), une hyperréticulocytose et une augmentation de la bilirubine indirecte. Il peut s'agir :"],["li","Soit d'une anémie hémolytique congénitale qui sera reconnue chez l'enfant présentant un retard staturo-pondéral ; le plus souvent, il s'agit d'une anomalie de l'hémoglobine dont le diagnostic est fait par l'électrophorèse de l'hémoglobine."],["li","Soit d'une anémie hémolytique acquise."],["li","Les hémopathies malignes :"],["li","La leucémie myéloïde chronique : se voit chez l'adulte jeune, qui présente une splénomégalie en règle volumineuse, isolée, le diagnostic repose sur l'hémogramme."],["li","La leucémie lymphoïde chronique : se voit chez le sujet âgé, la splénomégalie est associée à des adénopathies superficielles généralisées et symétriques; le diagnostic repose sur l'hémogramme et le médullogramme."],["li","La leucémie aiguë : se voit surtout chez l'enfant, elle associe une pâleur cutanéomuqueuse, un syndrome hémorragique, une fièvre, des douleurs osseuses et des adénopathies; le diagnostic repose sur l'hémogramme et le médullogramme."],["li","La maladie de Hodgkin et les lymphomes non hodgkiniens : la splénomégalie est en règle associée à des adénopathies superficielles et parfois profondes ; le diagnostic repose sur la ponction ganglionnaire et la biopsie ganglionnaire."],["p","5.3. Les splénomégalies congestives : ce sont les splénomégalies qui entrent dans le cadre de l'hypertension portale qui associe une splénomégalie de volume variable, une ascite, une circulation veineuse collatérale abdominale, des hémorragies digestives; le diagnostic repose sur l'œso-gastro-fîbroscopie qui montre les varices œsophagiennes. Cette hypertension portale est due le plus souvent à une cirrhose."],["p","5.4. Les splénomégalies de surcharge : sont rares, c'est essentiellement la maladie de Gaucher (lipidose); la splénomégalie est souvent associée à une hépatomégalie et à un retard psychique; on retrouve souvent la notion de splénomégalie familiale; le diagnostic repose sur le médullogramme et la ponction splénique qui permettront de mettre en évidence les cellules de Gaucher : cellules de surcharge."],["p","5.5. Parfois, toutes les investigations cliniques et biologiques restent négatives et la splénomégalie est apparemment sans cause : ce sont les splénomégalies idiopathiques surtout fréquentes dans le bassin méditerranéen et en Afrique et c'est ainsi qu'on les appellera selon le lieu où l'on se trouve : splénomégalie méditerranéenne. Africaine ou Algérienne."]]}]}]</script>

oc rotulien indique","un épanchement du genou","une rupture du ligament croisé","une fracture","un genu valgum"],["Le genu valgum correspond à","des genoux en X","des jambes arquées","un genou fléchi","un pied plat"]],"7-0":[["La ménorragie est","des règles abondantes et prolongées","des saignements entre les règles","l’absence de règles","des règles douloureuses"],["La métrorragie est","un saignement en dehors des règles","des règles abondantes","l’absence de règles","une leucorrhée"],["La cryptorchidie est","l’absence de testicule dans les bourses","une torsion","un hydrocèle","une varicocèle"]],"7-1":[["L’oligurie correspond à une diurèse","< 500 mL/24 h","> 3 L/24 h","< 1500 mL/24 h","nulle"],["La pollakiurie est","des mictions fréquentes","une douleur à la miction","du sang dans les urines","une rétention"],["Colique néphrétique","douleur lombaire paroxystique irradiant vers les organes génitaux","douleur épigastrique","douleur de l’hypochondre droit","douleur thoracique"],["La manœuvre de Giordano explore","la fosse lombaire (pyélonéphrite)","la prostate","la vessie","le testicule"]],"8-0":[["Anémie chez l’homme selon l’OMS","Hb < 13 g/dL","Hb < 8 g/dL","Hb < 16 g/dL","Hb < 10 g/dL chez tous"],["Une anémie microcytaire a un VGM","< 80 fL","entre 80 et 100 fL","> 100 fL","> 120 fL"],["Signes d’anémie","pâleur, dyspnée d’effort, tachycardie","hypertension, bradycardie","ictère uniquement","cyanose"],["Une thrombopénie correspond à des plaquettes","< 150 000/mm³","> 450 000/mm³","< 1 000 000/mm³","< 500 000/mm³"]],"8-1":[["Le ganglion de Troisier est","sus-claviculaire gauche (cancer digestif)","inguinal","axillaire droit","poplité"],["Adénopathie néoplasique typique","dure, indolore, fixée","chaude et douloureuse","fluctuante","molle et mobile"],["Les signes B d’un lymphome sont","fièvre, sueurs nocturnes, amaigrissement","toux, dyspnée, œdème","céphalée, vertige","diarrhée, vomissements"]]};
function quiz(k){const q=QZ[k];if(!q)return'';return`<section class="qz"><h2>اختبر نفسك — QCM</h2>`+q.map((x,i)=>`<div class="qq"><p>${i+1}. ${esc(x[0])}</p>${x.slice(1).map((t,n)=>[t,n===0]).sort(()=>Math.random()-.5).map(([t,ok])=>`<button class="qo" data-ok="${ok?1:0}">${esc(t)}</button>`).join('')}</div>`).join('')+`<p id="qs"></p></section>`}
function bindQ(){let s=0;const A=document.querySelectorAll('.qq');A.forEach(d=>d.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;d.querySelectorAll('.qo').forEach(o=>{if(o.dataset.ok==='1')o.classList.add('ok')});if(b.dataset.ok==='1')s++;else b.classList.add('no');if(document.querySelectorAll('.qq[data-d]').length===A.length)document.getElementById('qs').textContent='النتيجة: '+s+' / '+A.length+(s===A.length?' 🎉':'')})) }
const flat=[];D.forEach((P,p)=>P.ch.forEach((C,c)=>flat.push({p,c,k:p+'-'+c,P,C})));
const mins=C=>Math.max(1,Math.round(C.w/200)),link=(p,c,j)=>'#/c/'+p+'/'+c+(j!=null?'/'+j:'');
R.style.setProperty('--fs',fs+'px');if(th)R.dataset.theme=th;
$('#th').onclick=()=>{th=(R.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';R.dataset.theme=th;st('th',th)};
$('#fp').onclick=()=>{fs=fs>=23?17:fs+2;R.style.setProperty('--fs',fs+'px');st('fs',fs)};
const row=f=>`<a class="ch${read[f.k]?' rd':''}" href="${link(f.p,f.c)}"><span class="ck">${read[f.k]?'✓':''}</span><span>${f.C.ar}<small>${esc(f.C.fr)}</small></span><span class="rt">${mins(f.C)} د</span></a>`;
function drawer(){$('#dn').innerHTML='<a href="#/"><b>الصفحة الرئيسية</b></a>'+D.map((P,p)=>`<h3>${P.ic} ${P.ar}</h3>`+flat.filter(f=>f.p===p).map(f=>`<a href="${link(f.p,f.c)}">${read[f.k]?'✓ ':''}${f.C.ar}</a>`).join('')).join('')}
const tg=(el,on)=>el.classList.toggle('o',on);
$('#mn').onclick=()=>{drawer();tg($('#dr'),1)};$('#dr .sc').onclick=()=>tg($('#dr'),0);$('#dn').onclick=e=>{if(e.target.closest('a'))tg($('#dr'),0)};
function home(){
 const done=flat.filter(f=>read[f.k]).length,last=st('last'),tw=flat.reduce((s,f)=>s+f.C.w,0),f0=last?flat.find(f=>f.k===last):flat[0];
 let e='';for(let i=0;i<4;i++)e+=' h30 l8 5 l8 -34 l8 52 l8 -22 h24 q12 -16 24 0';
 app.innerHTML=`<section class="hero"><svg viewBox="0 0 700 90" preserveAspectRatio="none"><path class="base" d="M0 50${e} H700"/><path class="pulse" pathLength="1" d="M0 50${e} H700"/></svg><h1>Précis de sémiologie</h1><p>الكتاب كاملًا في جيبك: ${flat.length} فصلًا في ${D.length-1} أقسام، نحو ${Math.round(tw/200/60)} ساعات قراءة، مع بحث فوري وتتبّع لتقدّمك.</p><a class="cta" href="${link(f0.p,f0.c)}">${last?'تابع من حيث توقفت':'ابدأ القراءة'}</a><div class="pg"><i style="width:${done/flat.length*100}%"></i></div><p style="font-size:13px">أنهيتَ ${done} من ${flat.length} فصلًا</p></section>`+
 D.map((P,p)=>{const fs_=flat.filter(f=>f.p===p);return`<section class="part" style="--c:${P.c}"><header><span class="ic">${P.ic}</span><div><h2>${P.ar}</h2><small>${esc(P.fr)}</small></div><span class="pp">${fs_.filter(f=>read[f.k]).length}/${fs_.length}</span></header><ol>${fs_.map(row).join('')}</ol></section>`}).join('')+'<footer>المحتوى مأخوذ من كتاب Précis de sémiologie</footer>';
 scrollTo(0,0)}
function chapter(p,c,j){
 const P=D[p],C=P.ch[c],k=p+'-'+c,i=flat.findIndex(f=>f.k===k);st('last',k);let h='',o='';
 C.b.forEach(([t,x],n)=>{const e=esc(x);
  if(t==='h2'||t==='h3'){h+=`<${t} id="b${n}">${e}</${t}>`;o+=`<button class="l${t[1]}" data-j="${n}">${e}</button>`}
  else if(t==='h4')h+=`<h4 id="b${n}">${e}</h4>`;
  else if(t==='pre')h+=`<pre id="b${n}">${e}</pre>`;
  else h+=`<p id="b${n}" class="${t==='li'?'li':/^(\d+(\.\d+)*\.?\s*)?D[ée]finitions?\b/.test(x)?'def':''}">${e}</p>`});
 const pv=flat[i-1],nx=flat[i+1];
 app.style.setProperty('--c',P.c);
 app.innerHTML=`<div class="rh"><span class="ic">${P.ic}</span> ${P.ar}<h1>${C.ar}</h1><small>${esc(C.fr)}</small><span class="rt">قراءة نحو ${mins(C)} دقيقة</span></div>${o?`<details><summary>محتوى الفصل (${o.split('<button').length-1})</summary>${o}</details>`:''}<article class="doc" lang="fr">${h}</article>${quiz(k)}<button class="mk${read[k]?' on':''}" id="mk">${read[k]?'✓ تم إنهاؤه — اضغط للتراجع':'أنهيتُ هذا الفصل'}</button><div class="nav">${nx?`<a href="${link(nx.p,nx.c)}">← ${nx.C.ar}</a>`:'<span></span>'}${pv?`<a href="${link(pv.p,pv.c)}">${pv.C.ar} →</a>`:'<span></span>'}</div>`;
 bindQ();bindT();$('#mk').onclick=()=>{read[k]=!read[k];st('read',read);chapter(p,c)};
 app.querySelectorAll('details button').forEach(b=>b.onclick=()=>go(b.dataset.j));
 j!=null?setTimeout(()=>go(j),30):scrollTo(0,0)}
let SP;const TC=new Map();
async function spl(){if(SP===undefined)SP=window.claude&&claude.use?await claude.use('sample').catch(()=>null):null;return SP}
async function tr(txt,el,btn,lab){let box=el.nextElementSibling;if(box&&box.classList.contains('tb')){box.hidden=!box.hidden;return}
 box=document.createElement('div');box.className='tb';el.after(box);const s=await spl();if(!s){box.textContent='الترجمة غير متاحة في هذا العرض (تعمل عند فتح الصفحة داخل claude.ai)';return}
 btn.disabled=true;btn.textContent='…';box.textContent='جارٍ الترجمة…';
 try{if(TC.has(txt))box.textContent=TC.get(txt);else{const r=await s('Traduis ce texte de sémiologie médicale du français vers un arabe clair et précis. Après chaque terme médical technique, garde le terme français entre parenthèses. Conserve la structure des paragraphes. Réponds uniquement par la traduction, sans commentaire.\n\n'+txt,{modelTier:'quick',onText:({text})=>{box.textContent=text}});box.textContent=r.text;TC.set(txt,r.text)}}
 catch(e){box.remove();alert(e&&e.code==='rate_limited'?'طلبات كثيرة، انتظر قليلًا ثم أعد المحاولة':e&&e.code==='not_granted'?'لم تُمنح صلاحية الترجمة':'تعذّرت الترجمة، أعد المحاولة')}
 btn.disabled=false;btn.textContent=lab}
function bindT(){const E=[...app.querySelectorAll('.doc>p,.doc>h2,.doc>h3,.doc>h4,.doc>pre')];E.forEach(e=>e.dataset.t=e.textContent);
 E.forEach((e,i)=>{const t=e.tagName;if(t==='H4'||t==='PRE')return;const sec=t==='H2'||t==='H3',lab=sec?'ترجم القسم':'ع',b=document.createElement('button');b.className='tr'+(sec?' ts':'');b.textContent=lab;b.title='ترجمة إلى العربية';
  b.onclick=()=>{let x=e.dataset.t;if(sec){const a=[];for(let n=i+1;n<E.length&&!/^H[23]$/.test(E[n].tagName);n++)a.push(E[n].dataset.t);x+='\n\n'+a.join('\n\n');if(x.length>6000)x=x.slice(0,6000)}tr(x,e,b,lab)};e.append(b)})}
function go(j){const e=document.getElementById('b'+j);if(e){e.scrollIntoView({block:'center'});e.classList.add('fl')}}
function route(){const m=location.hash.match(/^#\/c\/(\d+)\/(\d+)(?:\/(\d+))?/);app.style.removeProperty('--c');$('#pb').style.setProperty('--c','');
 if(m&&D[m[1]]&&D[m[1]].ch[m[2]]){chapter(+m[1],+m[2],m[3]);$('#pb').style.setProperty('--c',D[m[1]].c)}else home()}
addEventListener('hashchange',route);route();
addEventListener('scroll',()=>{const h=R.scrollHeight-innerHeight;$('#pb').style.width=/^#\/c\//.test(location.hash)&&h>0?scrollY/h*100+'%':'0'},{passive:true});
let ix=null;const q=$('#q');
$('#sb').onclick=()=>{if(!ix){ix=[];D.forEach((P,p)=>P.ch.forEach((C,c)=>C.b.forEach(([t,x],j)=>ix.push({p,c,j,x,n:norm(x),c0:P.c,t:C.ar}))))}tg($('#sr'),1);q.focus()};
$('#qx').onclick=()=>tg($('#sr'),0);
let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{const w=norm(q.value).trim().split(/\s+/).filter(x=>x.length>1);if(!w.length){$('#qr').innerHTML='';$('#qc').textContent='';return}
 const r=ix.filter(o=>w.every(t=>o.n.includes(t)));$('#qc').textContent=r.length?`${r.length} نتيجة`:'لا نتائج — جرّب كلمة فرنسية أقصر أو بدون أخطاء إملائية';
 $('#qr').innerHTML=r.slice(0,50).map(o=>{const s=Math.max(0,o.n.indexOf(w[0])-50);let t=esc(o.x.slice(s,s+200));w.forEach(k=>{t=t.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')});return`<a class="rs" style="--c:${o.c0}" href="${link(o.p,o.c,o.j)}"><b>${o.t}</b>${s?'…':''}${t}…</a>`}).join('')},200)};
$('#qr').onclick=e=>{if(e.target.closest('a'))tg($('#sr'),0)};
