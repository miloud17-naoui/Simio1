état de somnolence avec torpeur intellectuelle : le sujet répond aux questions posées mais avec un certain retard."],["p","2.1.2. La confusion mentale : est un état de torpeur intellectuelle avec impossibilité de coordonner les idées et les sensations perçues."],["p","2.1.3. Le délire : est un état de confusion mentale accompagné d'excitation et d'hallucinations."],["p","2.1.4. Le coma : est une perte de conscience durable avec trouble des fonctions de relation et conservation relative des fonctions végétatives (voir Chapitre IV)."],["h4","2.2. L'orientation"],["p","2.2.1. Dans le temps : est appréciée en demandant au sujet le jour, la date, le mois et \"année."],["p","2.2.2. Dans l'espace : est jugée sur la possibilité du sujet à situer le lieu où il se trouve et la ville où il habite."],["p","2.2.3. Vis-à-vis des personnes : est recherchée en demandant au sujet l'identité et la fonction des personnes qui l'entourent."],["h4","2.3. Les troubles de l'humeur et du comportement"],["p","2.3.1. Les troubles de l'humeur peuvent être à type :"],["li","D'instabilité : qui réalise des changements rapides d'humeur qui passe de la tristes  au rire."],["li","D'euphorie : qui est une sensation de bien être, s'accompagnant d'indifférence pour les événements graves."],["h4","2.3.2. Les modifications du comportement peuvent se manifester par l'apparition"],["p","d'agressivité ou de violence."],["h4","2.4. Les troubles de la mémoire"],["p","2.4.1. La mémoire récente : est la mémoire de plusieurs notions apprises quelques minutes auparavant, elle est la première atteinte au cours des anomalies du système nerveux central."],["p","2.4.2. La mémoire éloignée : est celle qui persiste le plus longtemps ; elle tend à survivre aux maladies."],["p","2.5. Les troubles du contenu de la pensée : peuvent être à type d'idée préoccupante, d'obsession, de phobie, d'hallucinations."],["p","2.6. Les performances intellectuelles :"],["li","Les connaissances générales : possibilité de nommer quatre grandes villes, plusieurs pays et leurs capitales... ; ces connaissances ne sont perdues qu'en cas de démence avancée."],["li","L'incapacité de calculer est un signe de lésion pariétale."],["h3","3. Les troubles du langage"],["p","Le langage est une des fonctions principales de l'hémisphère gauche qui est l'hémisphère dominant pour tous les droitiers et pour 50 % des gauchers donc environ 95 % des sujets. L'aphasie est un trouble du langage dû le plus souvent à une lésion de l'hémisphère gauche; l'aphasie est presque toujours associée à une hémiplégie droite. On distingue deux types d'aphasie :"],["p","3.1. L'aphasie motrice ou aphasie de Broca : qui réalise une réduction du langage qui est quantitativement diminué avec hésitation et lenteur d'élocution : il s'agit d'une difficulté d'expression de la pensée par les mots : le malade parle peu, il emploie un petit nombre de mots. Il n'existe pas de trouble majeur de la compréhension du langage parlé et écrit."],["p","3.2. L'aphasie sensitive ou aphasie de Wernicke : l'expression orale est facile et abondante, mais le sujet emploie des mots inappropriés, ce qui réalise la paraphasie ou même des sons sans signification réalisant la jargonophasie. Il existe des troubles de la compréhension du langage parlé et écrit."],["p","IIL L’EXAMEN PHYSIQUE L'examen clinique étudie la posture et la marche; il teste les différents nerfs crâniens; il apprécie la motricité; il recherche les différents réflexes; il teste la sensibilité et enfin il recherche une anomalie des enveloppes méningées."],["h3","1. La posture et la démarche"],["p","La posture qui est étudiée par la position debout et la démarche sont des actes en grande partie automatiques, mais en réalité très complexes nécessitant l'intégrité de la force musculaire, de la coordination, de la sensibilité proprioceptive, de la fonction vestibulaire et de la vue."],["p","1.1. La position debout : est étudiée en demandant au sujet de se tenir debout, les pieds joints, les bras le long du corps, les yeux ouverts puis les yeux fermés."],["li","Normalement : le sujet est capable de maintenir cette position les yeux ouverts et les yeux fermés."],["li","Les anomalies de la station debout peuvent se voir en cas d'atteinte de la sensibilité proprioceptive, en cas d'atteinte vestibulaire et en cas d'atteinte cérébelleuse."],["li","Atteinte de la sensibilité proprioceptive : le maintien de la station debout les yeux fermés est impossible, le malade présente de grandes oscillations et tombe si on ne le retient pas : c'est le signe de Romberg."],["li","Atteinte vestibulaire unilatérale : le malade ne peut maintenir la position debout et tend à tomber vers le côté atteint, ce trouble est aggravé par l'occlusion des yeux : c'est le pseudo- Romberg."],["li","Atteinte cérébelleuse : le malade doit élargir son polygone de sustentation, c'est-à-dire écarter les pieds pour se maintenir en position debout même lorsque ses yeux sont 1.2. La démarche : il est indispensable de faire marcher librement le malade, l'épreuve peut être sensibilisée en demandant au sujet de marcher sur une ligne droite de façon à toucher le talon avec le gros orteil."],["li","Normalement : le sujet a une démarche assurée qui s'accompagne de mouvements associés tels que le balancement des bras."],["li","Les anomalies de la marche sont observées en cas d'atteinte de la sensibilité proprioceptive, en cas d'atteinte cérébelleuse et en cas d'hémiplégie."],["li","Atteinte de la sensibilité proprioceptive : le sujet lance la jambe très haut et celle-ci retombe lourdement sur le talon : c'est la démarche talonnante."],["li","Atteinte cérébelleuse : le sujet marche les pieds écartés, il chancelle et titube : c'est la démarche ébrieuse."],["li","Hémiplégie ancienne : la jambe du côté paralysé décrit une courbe, le genou est raide et le pied en extension : c'est la démarche en fauchant."],["h3","2. L'examen des nerfs crâniens"],["p","La paralysie d'un ou plusieurs nerfs crâniens peut apporter un argument décisif pour le diagnostic topographique d'une lésion neurologique."],["p","2.1. Rappel anatomique :"],["li","Les différents nerfs crâniens : on dénombre 12 paires de nerfs crâniens numérotés de ï à XII en chiffres romains : I : olfactif, II : optique, III : moteur oculaire commun, IV : pathétique, V : trijumeau, VI : moteur oculaire externe, VII : facial, VIII : auditif, IX : glosso-pharyngien, X : pneumogastrique, XI : spinal, XII : grand hypoglosse. Les III, IV, VI sont les nerfs oculomoteurs, ils se partagent la responsabilité des mouvements des globes oculaires et seront étudiés ensemble."],["li","Situation topographique des noyaux d'origine des nerfs crâniens (Fig. 1) : tous les noyaux d'origine siègent au niveau du tronc cérébral sauf l'olfactif et l'optique. Le III et le IV siègent au niveau des pédoncules cérébraux. Le V, le VI, le VII et le VIII siègent au niveau de la protubérance. Le IX, le X, le XI et le XII siègent au niveau du bulbe."],["h4","2.2. Etude sémiologique"],["p","2.2.1. L'olfactif (I) : s'explore en demandant au sujet d'identifier les yeux fermés différentes odeurs (savon, tabac, café) présentées, successivement à chaque narine, l'autre étant obturée. La perte de l'odorat s'appelle l'anosmie, l'anosmie unilatérale possède une grande valeur car elle peut être révélatrice d'une tumeur du sillon olfactif."],["p","Noyau du III"],["p","Noyau du IV Noyau du V moteur Noyau du VI Noyau du VII Noyau du VIII Noyau sensitif du V"],["p","Noyau ambigu IX X XI"],["p","Noyau du XII"],["p","FIG. 1. — Noyaux d'origine des nerfs crâniens."],["p","2.2.2. L'optique (II) : l'étude de ce nerf nécessite un rappel anatomique préalable (fig. 2). Le nerf optique est formé par la réunion des axones des neurones ganglionnaires provenant eux-mêmes de la rétine; la réunion des deux nerfs optiques forme le chiasma qui est le siège d'une décussation partielle des fibres optiques, les fibres provenant du champ nasal de la rétine croisent la ligné médiane pour gagner la bandelette optique controlatérale, les fibres issues du champ temporal ne déçussent pas et s'engagent dans la bandelette optique homolatérale; les bandelettes optiques se rendent au corps genouillé externe; les radiations optiques relient le corps genouillé externe au cortex visuel au niveau du lobe occipital. L'étude de l'optique doit comprendre trois étapes : l'étude de l'acuité visuelle, du champ visuel et du fond d'œil qui nécessitent la collaboration du médecin et du spécialiste ophtalmologiste."],["p","_ L'étude de l'acuité visuelle : elle se fait pour chaque œil à l'aide d'une échelle de lecture après correction des anomalies de réfraction par des verres correcteurs. Les anomalies qui peuvent être observées sont :"],["li","L’amblyopie : qui est un déficit de l'acuité visuelle unilatéral ou bilatéral."],["li","L’amaurose : qui est une perte complète de l'acuité visuelle unilatérale ou bilatérale. Ces deux anomalies traduisent une atteinte neurologique des voies visuelles. _ L'étude du champ visuel : peut se faire au lit du malade avec le doigt : on demande au sujet de fixer un point droit devant lui et l'examinateur déplace son doigt de la périphérie vers le centre dans les différents méridiens; l'examen se fait pour chaque œil séparément, puis pour les deux yeux simultanément. Le champ visuel peut aussi s'étudier plus précisé ment par campimétrie en milieu spécialisé. Les anomalies du champ visuel sont représentées par les scotomes et les hémianopsies."],["li","Le scotome : est une lacune dans le champ visuel d'un œil; il est de siège variable : central ou périphérique."],["p","FIG. 2. — Les voies optiques."],["p","Il peut être le symptôme d'une névrite optique : processus inflammatoire atteignant le nerf optique ou d'une compression des voies optiques par un processus tumoral ; dans ces cas, l'examen de la rétine au fond de l'œil est normal."],["li","L’hémianopsie : est un déficit bilatéral supprimant une partie des champs visuels des deux yeux, il s'agit d'un symptôme qui présente une valeur localisatrice importante. On distingue plusieurs types d'hémianopsie :"],["li","L’hémianopsie verticale : quand la frontière entre le champ anopsique et le champ de vision normale est horizontale;"],["li","L’hémianopsie latérale (fig. 2) lorsque la frontière est verticale : elle peut être hétéronyme : elle est alors le plus souvent bitemporale beaucoup plus"],["p","rarement binasale, elle est le signe d'une lésion chiasmatique, elle possède une grande valeur diagnostique des lésions hypophysaire et hypothalamique, elle peut être homonyme elle se traduit par une amputation du champ visuel droit ou gauche; par exemple, une hémianopsie latérale homonyme droite intéresse le champ temporal de l’œil droit et le champ nasal de l’œil gauche ; elle est l'indice d'une lésion dés voies optiques rétro-chiasmatiques, c'est l'anomalie la plus fréquente."],["p","_ L'étude du fond d'œil (FO) : se fait à l'aide d'un ophtalmoscope après dilatation pupillaire par un mydriatique; il permet l'étude de la papille, des vaisseaux et de la rétine est important pour le diagnostic des lésions de la rétine et du nerf optique."],["li","La papille : apparaît à l'ophtalmoscope comme un disque régulier, de contour net de coloration blanc rosé; il correspond au point où se réunissent les fibres nerveuses issues de la rétine; de son centre partent les artères rétiniennes et les veines. Les principales lésions de la papille sont la stase, l'inflammation et l'atrophie."],["li","la stase papillaire : débute par l'œdème papillaire qui se reconnaît à un signe principal, le flou des bords papillaires ; la stase constituée : associe une saillie de la papille, un flou des bords et une dilatation veineuse; sa cause majeure est l'hypertension intracrânienne liée à une tumeur cérébrale; un œdème papillaire n'est pas synonyme de tumeur cérébrale, il peut être retrouvé au cours de l'HTA, des méningites subaiguës (méningite tuberculeuse) et de certains troubles métaboliques (hypercapnie);"],["li","la papillite : est une inflammation du nerf optique intéressant la papille; elle est le plus souvent unilatérale;"],["li","l'atrophie optique : la papille apparaît pâle, nacrée, décolorée; elle est secondaire, soit à une stase papillaire prolongée soit à une papillite, soit à une névrite optique rétro-bulbaire, elle s'accompagne d'une baisse de l'acuité visuelle."],["li","Les vaisseaux : artères et veines sont modifiés au cours de l'HTA et permettent d'apprécier la gravité de celle-ci."],["li","La rétine : peut être le siège d'anomalies par exemple les tubercules de Bouchut au cours de la méningite tuberculeuse. 2.2.3. L'oculomotricité : _ L'étude de l'oculomotricité comprend : l'étude des mouvements des globes oculaires, l'étude des mouvements des paupières et l'étude de la motilité propre des pupilles."],["p","a) Les mouvements des globes oculaires : sont sous la dépendance des nerfs oculomoteurs : le III, le IV et le VI qui innervent les muscles oculomoteurs."],["li","Le III (nerf moteur oculaire commun) innerve les muscles : droit supérieur, droit inférieur, droit interne et petit oblique."],["li","Le IV (nerf pathétique) innerve le grand oblique."],["li","Le VI (nerf moteur oculaire externe) innerve le droit externe. \\"],["p","b) Les mouvements ftèsfaupières : sont sous la dépendance de deux muscles antagonistes."],["li","Le releveur de la paupière supérieure : qui permet l'ouverture de la paupière, il est formé de deux muscles :"],["li","Un muscle strié : innervé par le III."],["li","Un muscle lisse : innervé par les fibres sympathiques."],["li","L'orbiculaire : qui permet la fermeture active de la paupière; il est innervé par le VII. En cas dé paralysie du releveur de la paupière, on retrouve un ptosis : chute de la paupière supérieure; il sera observé soit en cas de paralysie du III; soit en cas de paralysie de s fibres sympathiques."],["p","c) La motilité des pupilles :"],["p","Rappel anatomique : la motilité des pupilles est sous la dépendance :"],["li","Des muscles constricteurs de la pupille : qui sont innervés par les fibres parasympathiques qui cheminent avec le III."],["li","Des muscles dilatateurs de la pupille : qui sont innervés par les fibres sympathiques. _ Les réflexes pupillaires :"],["li","Le réflexe photomoteur s'étudie en demi-obscurité; on demande au sujet de fixer un point devant lui et on éclaire latéralement successivement chaque œil : la réponse normale est un myosis au niveau de l'œil éclairé et au niveau de l'autre œil."],["li","Le réflexe d'accommodation-convergence ou réflexe d'accommodation à la distance : consiste à demander au sujet de fixer un objet éloigné et à rapprocher progressivement cet objet; l'accommodation s'accompagne d'un myosis."],["li","Les anomalies de l’oculomotricité : a) La paralysie du III associe :"],["li","Un ptôsis."],["li","Un strabisme divergent avec impossibilité de mouvoir le globe oculaire en haut. en bas et en dedans."],["li","Une mydriase aréactive, avec abolition du réflexe photomoteur et du réflexe d'accommodation. b) LA paralysie du IV entraîne : une diplopie verticale dans le regard vers le bas et vers le côté sain; pour compenser le sujet incline la tête sur l'épaule du côté sain et tourne la tête vers ce côté."],["p","c) La paralysie du VI associe :"],["li","Une diplopie horizontale."],["li","Un strabisme convergent. d) La paralysie du sympathique cervical supérieur réalise le syndrome de Claude Bernard Horner qui se manifeste par :"],["li","Un rétrécissement de la fente palpébrale dû à un ptôsis modéré."],["li","Une énophtalmie."],["li","Un myosis."],["p","e) Le signe d'Argyll-Robertson : qui est un signe de syphilis nerveuse, associe :"],["li","Une abolition bilatérale complète du réflexe photomoteur avec conservation du réflexe à l'accommodation convergence."],["li","Un myosis."],["li","Une inégalité et une irrégularité pupillaires."],["p","2.2.4. Le trijumeau (V) : il s'agit d'un nerf mixte moteur et sensitif. _ Le V moteur : est responsable des mouvements de la mâchoires il innerve les muscles masséter, temporal et ptérygoïdien."],["p","Pour examiner le masséter et le temporal, on demande au sujet de mordre un abaisse langue et on tire dessus pour l'arracher, on palpe les muscles pour déceler une asymétrie de la contraction."],["p","Les muscles ptérygoïdiens déplacent la mâchoire vers l'avant et vers le côté opposé; on demande au malade de déplacer sa mâchoire de côté et de résister à l'effort de l'examinateur pour la remettre en place."],["p","_ Le V sensitif : est responsable de l'innervation sensitive de la face par ses trois branches : l'ophtalmique, le maxillaire supérieur et le maxillaire inférieur (fig. 3)."],["li","L'ophtalmique est responsable de la sensibilité des téguments de la partie antérieure du cuir chevelu, du front, de la paupière supérieure, de la racine et du dos du nez ; de la sensibilité du globe oculaire (fibres afférentes du réflexe cornéen), des fosses nasales et des sinus."],["li","Le nerf maxillaire supérieur : est responsable de la sensibilité cutanéo-muqueuse dans le territoire suivant : paupière inférieure, pommette, aile du nez, lèvre supérieure, gencives et dents du maxillaire supérieur."],["p","FIG. 3. — Territoire d'innervation sensitive du trijumeau."],["li","Le nerf maxillaire inférieur : assure l'innervation sensitive de la région temporale, de la joue, du menton, de la lèvre inférieure, de la gencive et des dents du maxillaire inférieur et enfin la sensibilité générale de la langue. L'exploration de la sensibilité de la face se fait à l'aide d'un coton (sensibilité tactile), d'une épingle (sensibilité douloureuse), de tubes chaud et froid (sensibilité thermique). Le réflexe cornéen qui dépend de la branche ophtalmique (pour sa voie afférente) se recherche en touchant légèrement la cornée avec un brin de coton, la réponse normale est la fermeture de la paupière supérieure. A noter, pour que le réflexe cornéen puisse avoir lieu, il faut également que le nerf facial soit indemne (voie efférente). On peut observer une névralgie du trijumeau (voir Chapitre premier)."],["p","2.2.5. Le facial (Vil) est un nerf mixte : il est constitué par le nerf facial qui innerve les muscles de la face (VIT moteur) et par l'intermédiaire de Wrisberg qui contient des fibres sensitives, sensorielles et parasympathiques."],["li","Le VII moteur : il innerve les muscles de la face et le peaucier du cou."],["li","Une lésion du noyau du VII entraîne une paralysie faciale périphérique portant sur l'ensemble des muscles de l'hémiface du même côté que la lésion; l'hémiface atteinte apparaît hypotonique et immobile. A l’ étage supérieur (territoire facial supérieur), on note :"],["li","un effacement des rides du front;"],["li","un élargissement de la fente palpébrale avec abaissement de la paupière inférieure;"],["li","une impossibilité de fermer l'œil, c'est la lagophtalmie et un signe de Charles Bell (fig. 4- 1) : lors de la tentative d'occlusion palpébrale, l'œil reste ouvert et on observe un déplacement synergique normal du globe oculaire en haut et en dehors dû à la contraction synergique du droit supérieur."],["li","une abolition du réflexe cornéen ; ainsi qu'une absence d'occlusion de la paupière à la menace. A l'étage inférieur (territoire facial inférieur), on observe :"],["li","un effacement du pli naso-génien;"],["li","une chute de la commissure labiale alors que la bouche est attirée vers le côté sain;"],["li","le malade ne peut ni sourire, ni gonfler la joue, ni siffler;"],["li","le signe du peaucier de Babinski : le peaucier du cou ne se contracte pas à l'ouverture contrariée de la bouche."],["li","Une lésion supra-nucléaire va réaliser une paralysie faciale centrale, elle accompagne le plus souvent une hémiplégie; elle va se distinguer de la paralysie faciale périphérique par le fait qu'elle respecte le territoire facial supérieur. En effet, le noyau du facial supérieur reçoit une innervation supra-nucléaire provenant du cortex moteur des deux hémisphères cérébraux alors que le noyau du facial inférieur ne reçoit une innervation supra-nucléaire que de l'hémisphère controlatéral (fig. 5). La paralysie faciale centrale prédomine sur les muscles du territoire facial inférieur du côté de la face opposé à la lésion centrale, elle respecte les muscles du territoire facial supérieur car ces derniers ont une représentation corticale bilatérale. Il n'y a pas de signe de Charles Bell (fig. 4-2). Chez le malade dans le coma, la paralysie faciale centrale est mise en évidence par la manœuvre de Pierre Marie et Foix : la pression du nerf facial en arrière de la branche montante du maxillaire inférieur entraîne une grimace du côté sain."],["li","L'intermédiaire de Wrisberg possède trois fonctions :"],["li","Une fonction sensitive : il assure la sensibilité dans la zone de Ramsay-Hunt : conduit auditif externe et pavillon de l'oreille."],["p","FIG. 4-1. — Paralysie faciale périphérique gauche."],["p","FIG. 42. — Paralysie faciale centrale gauche."],["li","Une fonction sensorielle : il est responsable de la sensibilité gustative des deux tiers antérieurs de la langue."],["li","Une fonction secrétaire : les fibres parasympathiques cheminent dans l'intermédiaire de Wrisberg et vont innerver les glandes lacrymales, les glandes de la cavité nasale et les glandes salivaires : sous-maxillaire et sub-linguale. C'est ainsi qu'au cours d'une paralysie faciale, on peut observer en plus des troubles moteurs déjà décrits une agueusie (perte de la sensibilité gustative) des deux tiers antérieurs"],["p","de la langue, une hypoesthésie dans la zone de Ramsay-Hunt et un tarissement des sécrétions lacrymales et salivaires."],["p","2.2.6. L'auditif (VIII) comprend en fait deux nerfs distincts : le nerf cochléaire et le nerf vestibulaire."],["li","Le nerf cochléaire : est le nerf de l'audition ; une anomalie de ce nerf peut entraîner des acouphènes qui sont des bourdonnements ou des sifflements et une hypoacousie qui est une diminution de l'acuité auditive. Il sera exploré cliniquement par l'épreuve de la voix chuchotée et par l'épreuve au diapason."],["p","Noyau facial supérieur"],["p","Noyau facial inférieur"],["p","FIG. 5. — Noyau d'origine du facial."],["li","L'épreuve de la voix chuchotée : le sujet est placé de profil, on lui fait entendre soit la voix chuchotée, soit le tic-tac d'une montre; l'épreuve se fait alternativement pour chaque oreille, l'autre étant obturée."],["li","L'épreuve au diapason : permet de connaître le type de la surdité : surdité de transmission (atteinte de l'oreille externe ou moyenne) et surdité de perception (atteinte de l'oreille interne ou du nerf auditif)."],["li","épreuve de Weber : le diapason est placé sur la ligne médiane du crâne, chez le sujet normal la perception est localisée au milieu ou également des deux côtés et lorsque l'on obture un conduit auditif, la perception se déplace vers le côté occlus. Si le sujet présente une surdité de transmission d'un côté et une acuité normale de l'autre côté, il entendra le diapason de l'oreille malade, on dit que le Weber est latéralisé et positif. Par contre, s'il est atteint de surdité de perception d'une oreille, c'est l'oreille saine qui entendra le son, on dit que le Weber est latéralisé et négatif."],["li","épreuve de Rinne : elle consiste à comparer les temps de conduction (temps que met la perception à s'éteindre) aérienne : en présentant un diapason au pavillon de l'oreille et osseuse en appliquant ce même diapason par son pied sur la mastoïde."],["p","Normalement, le sujet entend deux fois plus longtemps par conduction aérienne (CA) que par conduction osseuse (CO). Chez le sujet qui présente une surdité de transmission, ce rapport s'annule ou s'inverse (CA < CO) on dit que le Rinne est négatif; chez le sujet porteur d'une surdité de perception, les deux durées sont diminuées (CA > CO) l'épreuve de Rinne est positive. Des données plus précises seront fournies par l'audiogramme qui est la mesure fine de l'acuité auditive en milieu spécialisé ORL. Ainsi, l'examen clinique va permettre de reconnaître les deux types de surdité :"],["p","Surdité de transmission : par obstruction de l'oreille externe (bouchon de cérumen) ou par lésion de l'oreille moyenne."],["li","Perception de la voix haute peu diminuée."],["li","Perception de la voix chuchotée fortement diminuée."],["li","Epreuve de Rinne négative."],["li","Epreuve de Weber : latéralisée et positive. urdité de perception : par lésion du nerf auditif ou de l'oreille interne."],["li","Perception de la voix haute et chuchotée diminuée."],["li","Epreuve de Rinne positive."],["li","Epreuve de Weber : latéralisée et négative."],["li","Le nerf vestibulaire : est le nerf de l'équilibration dont l'étude sera détaillée dans le chapitre VII."],["p","2.2.7. Le glosso-pharyngien (IX) : le glosso-pharyngien est un nerf mixte, il contient des fibres motrices, sensitives, sensorielles et végétatives."],["li","Fonction motrice : les fibres motrices ont une origine et une distribution communes avec celles du X ; les fibres motrices se distribuent au muscle stylo-pharyngien et contribuent avec celles du X, à l'innervation du voile du palais et des muscles du pharynx."],["li","Fonction sensitive : il assure l'innervation sensitive des amygdales, du naso-pharynx, de l'oropharynx et de l'oreille moyenne."],["li","Fonction sensorielle : il assure la sensibilité gustative du tiers postérieur de la langue."],["li","Fonction secrétaire : il assure l'innervation de la glande parotide. Une lésion du glossopharyngien entraîne :"],["li","Une agueusie du tiers postérieur de la langue."],["li","Une hypoesthésie de l'amygdale, du voile et du pharynx."],["li","Une gêne à la déglutition."],["li","Une abolition unilatérale du réflexe nauséeux. On peut observer une névralgie du IX qui a les mêmes caractères que la névralgie du trijumeau sauf la topographie de la douleur qui siège au niveau du pharynx et irradie vers l’oreille et qui est déclenchée par sa déglutition."],["p","2.2.8. Le pneumogastrique (X) est un nerf mixte, il possède des fibres sensitives, motrices et végétatives dont l'étude n'a pas d'intérêt en neurologie."],["li","Fonction sensitive : il assure l'innervation sensitive du larynx."],["li","Fonction motrice : il innerve les muscles striés du pharynx, du larynx et du voile du palais. Une lésion du X entraîne :"],["li","Une paralysie d'un hémivoile : la voix est sourde et nasonnée, la déglutition est perturbée, les liquides « reviennent par le nez », le voile est asymétrique, la luette est déviée vers le côté sain."],["li","Une paralysie unilatérale du larynx qui se traduit par une voix bitonale."],["li","Une paralysie de l’hémipharynx : avec signe du rideau : la paroi postérieure du pharynx dévie du côté sain lorsqu'on fait prononcer la lettre A au malade."],["p","2.2.9. Le spinal (XI) : seul le spinal médullaire ou spinal externe sera envisagé; il s'agit d'un nerf exclusivement moteur qui innerve le sterno-cléido-mastoïdien et le trapèze,"],["li","Le sterno-cléido-mastoïdien : est un muscle fléchisseur et rotateur de la tête. La flexion de la tête est produite par la contraction des deux muscles. La rotation est produite par la contraction du muscle du côté opposé à la rotation. La contraction du muscle est visible et palpable sous forme d'une corde située de chaque côté du cou. Pour faire contracter le muscle, on demande au sujet soit de fléchir sa tête en avant, l'examinateur supposant à la flexion en prenant appui sur le menton : on obtient normalement une contraction simultanée des deux côtés ; soit de tourner alternativement la tête d'un côté puis de l'autre contre une résistance appliquée sous le menton : on obtient normalement une contraction du muscle droit lors de la rotation de la tête vers la gauche et inversement (fig.6-1)."],["li","Le trapèze : est un muscle élévateur de l'épaule; l'exploration du trapèze se fait en demandant au sujet de soulever les épaules contre résistance. En cas d'atteinte du spinal externe, on observera :"],["li","L'absence de contraction du sterno-cléido-mastoïdien dans les mouvements contrariés de flexion de la tête en avant et de rotation vers le côté opposé (fig. 6-2)."],["pre","FIG. 6.1. - exploration du SCM gauche.            FIG. 6-2. - Paralysie du SCM gauche par"],["p","atteinte du spinal externe"],["li","Un creusement du creux sus claviculaire, un abaissement du moignon de l’épaule, une déviation de l'omoplate en bas et en dehors (fig. 7) et l'impossibilité de hausser l'épaule du côté atteint."],["p","2.2.10. Le grand hypoglosse (XII) est aussi un nerf purement moteur destiné à la langue. Une atteinte unilatérale du XII entraîne une paralysie de l'hémilangue avec atrophie : l’hémilangue a un aspect aminci; elle est le plus souvent Se siège de fasciculations."],["p","Lorsqu'on demande au malade de tirer la langue, elle est déviée vers le côté paralysé, en effet le génioglosse du côté sain n'est plus équilibré par son symétrique."],["p","FIG. 7. — Paralysie du trapèze gauche par atteinte du spinal externe."],["h3","3. La motricité"],["p","L'étude de la motricité comprend l'étude de la force musculaire et du tonus musculaire."],["p","3.1. La force musculaire : pourra être appréciée par l'étude des mouvements spontanés et celle de la motricité volontaire."],["p","3.1.1. La motricité spontanée : est appréciée à l'inspection en dehors de toute sollicitation par l'observation de l'activité gestuelle, de la mimique et de la parole."],["p","3.1.2. La motricité volontaire : est explorée en demandant au malade d'effectuer systématiquement certains mouvements :"],["li","Au membres supérieurs : poignée de main, abduction contrariée des bras, flexion contrariée des avant-bras."],["li","Aux membres inférieurs : dorsi-flexion contrariée du pied, flexion contrariée du genou et de la hanche."],["p","3.2. Le tonus musculaire : le tonus musculaire est apprécié par la mobilisation passive d'un membre dans toutes les positions possibles : normalement, il n'existe qu'une résistance très faible à la mobilisation passive."],["p","Les anomalies du tonus musculaire peuvent être de deux types : l'hypertonie et l'hypotonie."],["p","3.2.1. L'hypertonie ou contracture musculaire est un état de raccourcissement du muscle qui se caractérise par une diminution de l'amplitude du mouvement passif. On peut observer deux types d'hypertonie : pyramidale et extra-pyramidale."],["li","Hypertonie pyramidale : elle possède les caractères suivants : Elle est spastique ou élastique : si on déplace un segment de membre l'intensité de la résistance augmente rapidement avec le degré d'étirement ; puis le membre reprend sa position initiale dés qu'il est abandonné à lui-même; si le déplacement est poursuivi en dépit de la résistance, celle-ci peut céder brusquement comme la lame d'un canif."],["li","Elle est élective : elle prédomine sur les fléchisseurs et pronateurs aux membres supérieurs et sur les extenseurs et adducteurs aux membres inférieurs."],["li","Elle s'accentue lors des mouvements volontaires."],["li","Elle s'accompagne d'une diminution de la force musculaire, d'une exagération des réflexes ostéo-tendineux et d'un signe de Babinski."],["li","Elle se voit au cours des lésions chroniques du faisceau pyramidal. _ Hypertonie extra-pyramidale : elle se reconnaît sur les caractères s vivants :"],["li","Elle est plastique : lorsque l'on déplace les divers segments de membre, ils gardent plus ou moins longtemps la nouvelle position."],["li","La résistance à la mobilisation passive est soit uniforme sans à-coups, du type « en tuyau de plomb »; soit faite d'une alternance de renforcements et de relâchements, du type « en roue dentée »."],["li","Elle est diffuse : homogène dans sa répartition."],["li","Elle ne s'accompagne pas de déficit de la force musculaire, ni de troubles des réflexes."],["li","Elle est associée à un tremblement de repos et à une akinésie (réduction considérable de l'activité : malade figé) réalisant le syndrome parkinsonien."],["p","3.2.2. L'hypotonie : lors de la mobilisation passive, on observe une augmentation de l'amplitude du mouvement articulaire."],["p","Elle se voit dans l'atteinte cérébelleuse', au stade initial des lésions centrales graves et dans les atteintes périphériques."],["h3","4. La coordination"],["p","La coordination des mouvements est sous la dépendance du cervelet et des voies de la sensibilité proprioceptive."],["p","Elle est étudiée lors de la position debout et de la marche. Elle est explorée par l'étude des mouvements finalisés  les yeux ouverts, puis les yeux fermés :"],["li","Aux membres supérieurs : épreuve du doigt sur le nez."],["li","Aux membres inférieurs : épreuve du talon sur le genou et par l'étude des mouvements alternatifs rapides : épreuve des marionnettes."],["h3","5. Les réflexes"],["p","Ce sont des mouvements involontaires déclenchés par une stimulation tendineuse. cutanée ou muqueuse."],["p","5.1. Les réflexes ostéo-tendineux (OT) : ils se recherchent en percutant le tendon d'un muscle à l'aide d'un marteau à réflexe; l'examen sera toujours comparatif. A l'état normal, les réflexes sont symétriques."],["p","5.1.1. Les différents réflexes ostéo-tendineux :"],["li","Aux membres supérieurs :"],["li","Réflexe stylo-radial : dépend de C6 (C5-C7) : se recherche en percutant le tendon du long supinateur au-dessus de la styloïde radiale, le membre supérieur étant placé en demi flexion et pronation bord radial tourné vers le haut, reposant sur le ventre du sujet si ce dernier est couché, soutenu par la main du médecin si le malade est assis (fig. 8)."],["p","FIG. 8. — Réflexe stylo-radial."],["p","La réponse est une flexion de l'avant-bras sur le bras par contraction du long supinateur et accessoirement du biceps et du brachial antérieur."],["li","Réflexe bicipital : dépend de C6 (C5) : se recherche en percutant le pouce de l'examinateur posé à plat sur le pli du coude sur le tendon du biceps, le membre supérieur est placé en supination, l'avant-bras semi-fléchi, le dos de la main du malade reposant sur l'avant-bras de l'examinateur (fig. 9). La réponse est une flexion de l'avant-bras sur le bras par contraction du biceps et du brachial antérieur."],["li","Réflexe tricipital : dépend de C7 (C6-C8) : il se recherche en percutant le tendon du triceps brachial au-dessus de l'olécrane. Sur le malade couché, la position est la même que pour la recherche du stylo-radial. Sur le malade assis, le bras est porté en abduction soutenu par la main de l'examinateur, l'avant-bras est pendant (fig. 10)."],["pre","FIG. 9.     Réflexe bicipital.               FIG. 10. — Réflexe tricipital."],["p","La réponse est une extension de l'avant-bras sur le bras par contraction du triceps brachial."],["li","Aux membres inférieurs :"],["li","Réflexe rotulien : dépend de L4 (L3-L5) se recherche en percutant le tendon rotulien entre la rotule et la tubérosité tibiale antérieure. Sur le malade couché : l'examinateur soulève d'une main le creux poplité et place le genou en position semi-fléchie, le talon reposant sur le plan du lit (fig. 11 -2)."],["pre","FIG 11.1. – Réflexe rotulien              FIG 11.2. – Réflexe rotulien\n        en position assise                       en position couchée"],["p","Sur le malade assis : le réflexe est recherché sur les jambes pendantes ou en faisant croiser alternativement une jambe sur l'autre (fig. 11-1)."],["p","La réponse est une extension de la jambe sur la cuisse par contraction du quadriceps."],["li","Réflexe achiléen : dépend de S1 (S2), il se recherche en percutant le tendon d'Achille audessus de l'insertion calcanéenne. Sur le malade couché, le membre inférieur est placé en semi-abduction, rotation externe, genou demi-fléchi ; l'examinateur saisit l'avant-pied et le maintient à angle droit, le talon et le bord externe du pied reposant sur le lit (fig. 12-2). Sur le malade à genoux sur le lit, le dos tourné à l’examinateur (fig. 12-1). La réponse est une extension du pied sur la jambe par contraction du triceps sural."],["pre","FIG 12.1. – Réflexe achiléen              FIG 12.2. – Réflexe achiléen\n  Chez le sujet à genoux                     en position couchée"],["p","5.1.2. Modifications pathologiques des réflexes OT :"],["li","Abolition ou aréflexie : elle n'a de valeur que si le réflexe idio-musculaire est conservé (c'est-à-dire que la percussion directe du muscle entraîne une contraction de celui-ci)."],["p","Elle est due :"],["li","Soit à une atteinte de l'arc réflexe : racine postérieure, corne antérieure, nerf rachidien ou périphérique."],["li","Soit à une atteinte sévère de l'encéphale ou de la moelle à sa phase initiale."],["li","Exagération ou hyper-réflectivité ostéo-tendineuse : les réflexes sont amples, vifs, diffusés (extension de la zone réflexogène), polycinétiques (plusieurs réponses pour une seule stimulation). Les signes accompagnateurs sont le clonus et l'existence de réflexes proprioceptifs."],["li","Le clonus : est une série ininterrompue de contractions rythmiques d'un muscle provoquée par l’étirement d'un tendon."],["li","Le clonus de la rotule : est obtenu en repoussant brusquement la rotule vers le bas."],["li","Le clonus du pied : est obtenu en fléchissant brusquement le pied sur la jambe, on observe alors une succession rythmée de mouvements d'extension du pied."],["li","Les réflexes proprioceptifs : leur existence est pathologique, elle permet d'affirmer que l'hyper-réflectivité ostéo-tendineuse est en rapport avec une atteinte du faisceau pyramidal."],["li","le signe de Hoffmann : se recherche en relâchant brusquement une flexion forcée imprimée à la dernière phalange du médius ou de l'index, il se produit alors une flexion rapide et brève des doigts;"],["li","le signe de Rossolimo : la percussion de la face plantaire de la deuxième phalange des orteils entraîne une flexion des orteils. L'exagération des réflexes ostéo-tendineux, le clonus et l'existence de réflexes proprioceptifs traduisent une lésion de la voie pyramidale."],["h4","5.2. Les réflexes cutanés et muqueux"],["p","5.2.1. Le réflexe cutané plantaire : se recherche sur le sujet en décubitus dorsal, la jambe semi-fléchie sur la cuisse, le pied réchauffé en parcourant avec une pointe mousse le bord externe de la plante du pied en partant du talon pour aboutir à la base du premier orteil (flg.13-1)."],["p","Le réflexe cutané plantaire n'est interprétable que si l'innervation sensitive et motrice de la plante du pied et des orteils est intacte."],["p","Une inversion de la réponse du cutané plantaire est le signe de Babinski : la stimulation plantaire entraîne alors une extension lente et majestueuse du gros orteil (fig. 13-2) avec parfois extension et écartement des quatre derniers orteils, c'est le signe de l'éventail."],["p","Le signe de Babinski est en rapport avec une lésion centrale : cortex ou faisceau pyramidal ; il est physiologique chez le nourrisson avant l'âge de la marche (jusqu'à l'âge de 2 ans)."],["p","5.2.2. Les réflexes cutanés abdominaux : ils se recherchent en frôlant la paroi abdominale avec une pointe mousse. La stimulation est appliquée légèrement et rapidement sur quelques centimètres sur une ligne horizontale de dehors en dedans, la réponse normale est une contraction brève des muscles abdominaux sous jacents qui est appréciée par l'inspection de la paroi abdominale et le déplacement de l'ombilic. On distingue de chaque côté trois niveaux :"],["li","Le supérieur (segments médullaires D6-D8). Le moyen (segments médullaires D8-D10)."],["li","L'inférieur (segments médullaires D10 D12)."],["p","FIG. 13-1. — Technique de recherche du réflexe cutané plantaire et résultat chez le sujet normal."],["p","FIG. 13-2. — Le signe de Babinski."],["p","L'abolition des réflexes cutanés abdominaux se voit en cas de péritonite, en cas de lésion du faisceau pyramidal et en cas de lésions intéressant les racines et les segments médullaires deD6 àD12."],["p","5.2.3. Le réflexe crémastérien : est une contraction du crémaster avec ascension du testicule obtenue par la stimulation cutanée de la face interne de la cuisse: le sujet étant placé en décubitus dorsal, les cuisses en abduction légère."],["p","Le niveau segmentaire est L1-L2. Il est aboli en cas de lésion du faisceau pyramidal et en. cas de lésions intéressant les racines et segments médullaires L1-L2."],["p","5.2.4. Le réflexe cornéen : se recherche en portant l'extrémité effilée d'un petit morceau de coton au contact de la cornée, la réponse normale est un clignement palpébral. Pour éviter le réflexe visuel à la menace, le coton doit être approché de l’œil latéralement et en dehors du champ visuel."],["p","Ce réflexe a pour voie afférente la branche ophtalmique du trijumeau, pour voie efférente le facial, le centre est la protubérance. Il est aboli dans les lésions du V, du VII et au cours des comas dont il permet d'apprécier la profondeur."],["p","5.2.5. Le réflexe vélo-palatin : la stimulation du voile du palais avec un abaisse langue entraîne sa contraction."],["p","En cas de lésion du X : la moitié du voile se contracte et la luette est attirée vers le côté sain."],["h3","6. La sensibilité"],["p","6.1. Les troubles sensitifs subjectifs ; douleurs et paresthésies ont été recherchées à l’interrogatoire."],["p","6.2. La sensibilité objective : est appréciée à l'examen clinique en demandant au sujet de fermer les yeux."],["p","On explore successivement la sensibilité superficielle et la sensibilité profonde. Ce temps de l'examen neurologique est le plus délicat car il demande beaucoup de patience de la part du médecin et la pleine coopération du malade; enfin il ne doit pas être prolongé."],["p","6.2.1. La sensibilité superficielle :"],["li","La sensibilité tactile : est explorée en touchant les téguments avec un morceau de coton ou avec la pulpe du doigt."],["li","La sensibilité douloureuse : en piquant les téguments à l'aide d'une aiguille."],["li","La sensibilité thermique : en appliquant successivement sur la peau du sujet un tube contenant de l'eau chaude et un tube contenant de la glace fondante."],["p","FIG. 14. — Les territoires sensitifs radiculaires."],["p","On demande au sujet de répondre immédiatement par : touche, pique, chaud ou froid. L'exploration des téguments doit se faire de manière symétrique et s'il existe des anomalies, on dessine sur un schéma le territoire anesthésié ce qui permettra de préciser la topographie exacte des troubles (fig. 14)."],["p","6.2.2. La sensibilité profonde ou proprioceptive :"],["li","La sensibilité vibratoire au diapason : elle s'explore à l'aide d'un diapason dont on applique le manche sur les saillies osseuses superficielles : malléoles, rotules, tibia, styloïde radiale. Le diapason est appliqué tantôt vibrant, tantôt immobile; le sujet doit préciser s'il perçoit ou non les vibrations."],["li","Le sens des positions segmentaires : elle consiste à demander au sujet dont on mobilise passivement le gros orteil ou un doigt d'identifier la position dans laquelle le segment a été placé. On peut également placer le gros orteil ou un doigt dans une certaine position et demander au malade de reproduire la même attitude avec le segment de membre symétrique."],["li","Le sens stéréognosique : la stéréognosie est la faculté d'identifier les objets par la palpation."],["h3","7. Recherche d'une anomalie des enveloppes méningées"],["p","Elle a pour but de mettre en évidence des signes d'irritation des méninges réalisant le syndrome méningé qui est dû, soit à une méningite (inflammation des méninges en réponse à une infection bactérienne ou virale) soit à une hémorragie méningée."],["p","7.1. Les signes fonctionnels : réalisent le classique trépied méningitique."],["li","Céphalée : permanente, diffuse, exagérée par les mouvements, le bruit et la lumière."],["li","Vomissements : faciles, en fusée."],["li","Constipation. Parmi ces trois -symptômes, la céphalée est le signe constant."],["p","7.2. Les signes physiques : sont des signes de contractures musculaires."],["li","La raideur de la nuque : la tentative de flexion passive de la nuque s'accompagne d'une résistance permanente et douloureuse; elle peut entraîner une triple flexion des membres inférieurs, c'est le signe de Brudzinski (fig. 15)."],["p","FIG. 15. — Le signe de Brudzmski."],["p","_ Le signe de Kernig : met en évidence une contracture des membres inférieurs. Il se recherche :"],["li","Soit en faisant asseoir le malade : on observe alors une flexion des membres inférieurs lorsque le sujet passe de la position couchée à la position assise (fig. 16-1)."],["li","Soit sur le malade en décubitus dorsal : on relève les membres inférieurs complètement étendus, qui ne peuvent être mis à angle droit sur le tronc (fig. 16-2). La constatation d'un syndrome méningé doit conduire à faire une ponction lombaire qui permettra de confirmer l'atteinte méningée et sa cause précise en étudiant le liquide céphalo-rachidien."],["pre","FIG. 16-1. — Le signe de Kernig.            FIG. 16-2. — Le signe de Kernig."]]},{"ar":"الفحوص التكميلية","fr":"Investigations complémentaires","w":1448,"b":[["p","Les explorations du système nerveux peuvent être classées en examens de pratique courante et en examens spécialisés."],["h2","I. LES EXAMENS DE PRATIQUE COURANTE"],["p","Sont l'étude du fond d'œil, la ponction lombaire, la radiographie du crâne et l’EEG."],["h3","1. L'étude du fond d'œil (FO)"],["p","Voir Chapitre II : l'examen neurologique."],["h3","2. La ponction lombaire"],["p","Elle a pour but de prélever le liquide céphalo-rachidien (LCR) par ponction du cul-de-sac durai afin d'en effectuer l'analyse."],["p","2.1. Technique : la ponction lombaire peut se faire soit en position assise, soit en position couchée, à l'aide d'une aiguille spéciale munie d'un mandrin."],["li","Position assise : le malade est assis soit sur un tabouret, soit au bord du lit, le tronc est en flexion forcée le dos rond (fig. 1)."],["li","Position couchée : est la position de choix, le malade est placé en décubitus latéral, un aide lui maintient la tête et les membres inférieurs en flexion forcée (fig. 2). L'aiguille est introduite entre les apophyses épineuses dans l'espace L4-L5 ou dans l'espace L5-SI. Les épineuses sont repérées par la palpation, le point de ponction doit toujours se situer audessous d'une ligne horizontale joignant le point le plus élevé des crêtes iliaques (fig. 3). L'aiguille doit être enfoncée perpendiculairement à la peau dans un plan strictement médian, dans une direction légèrement oblique en direction de l'extrémité céphalique. La traversée du ligament interépineux et de la dure-mère est reconnue à leur résistance: on retire alors le mandrin et le LCR s'écoule facilement."],["p","FIG. 1. — Ponction lombaire en position assise."],["p","FIG. 2. — Ponction lombaire en position couchée."],["h4","2.2. Résultats"],["p","2.2.1. Mesure de la pression du LCR : elle se fait grâce à un manomètre de Claude ou à un tube de Stookey, elle est en moyenne de 12 à 15 cm d'eau chez le sujet couché; elle augmente sous l'influence de la compression abdominale."],["p","2.2.2. L'épreuve de Queckenstedt-Stookey : est une étude dynamique de la pression du LCR destinée à dépister un obstacle à la circulation du LCR dans le canal rachidien."],["p","Après avoir noté la pression du LCR, on comprime les veines jugulaires pendant 20 secondes, on note la pression toutes les 5 secondes."],["p","Chez le sujet normal : l'augmentation de la pression est rapide et franche jusqu'à 30 cm, le retour à la normale s'effectue en 20 secondes."],["p","En cas de compression médullaire, la compression jugulaire n'élève pas la pression du LCR."],["p","2.2.3. L'étude du LCR :"],["li","Le LCR normal :"],["li","Macroscopiquement : il est clair, limpide, eau de roche."],["pre","Le                                        système                                       nerveux"],["p","255"],["p","FIG. 3. — Repères des apophyses épineuses."],["li","Etude chimique :"],["li","albumine : 0,20 à 0,30 g/1; taux de gamma-globulines inférieur à 10 % (mesuré par électrophorèse);"],["li","chlorure : 7 à 7,5 g/1;"],["li","glucose : 0,50 g/1."],["li","Etude cytologique : 1 à 3 éléments par mm3 (toujours inférieur à 10 éléments par mm3) fait de lymphocytes."],["li","Etude bactériologique : absence de germes."],["li","LCR pathologiques :"],["li","LCR hémorragique : de couleur rosée ou rouge contenant plus de 10 000 éléments par mm3 fait de globules rouges. Il évoque une hémorragie méningée ou cérébro-méningée qui doit être différenciée d'un incident de ponction (blessure accidentelle d'un vaisseau sanguin), la distinction se fait sur l'épreuve des trois tubes : s'il s'agit d'un incident de ponction, le liquide s'éclaircit du premier au troisième tube, s'il s'agit d'une hémorragie, le LCR reste uniformément rouge dans les trois tubes et il est incoagulable."],["li","LCR clair, opalescent, louche ou purulent : se voit au cours des méningites : le taux d'albumine est augmenté, il existe une hypercytose faite soit de lymphocytes, soit de polynucléaires."],["p","2.3. Les indications de la ponction lombaire :"],["li","En cas de syndrome méningé."],["li","En cas de compression médullaire : épreuve de Queckenstedt-Stookey et hyperalbuminorachie importante."],["li","En cas de neuropathie périphérique : pour affirmer le diagnostic de polyradiculonévrite : dissociation : albumino-cytologique."],["li","En cas de coma neurologique : pour différencier l'hémorragie cérébro-méningée (LCR hémorragique) du ramollissement cérébral (LCR normal)."],["p","2.4. Contre-indication de la ponction lombaire : la seule contre-indication est l'hypertension intracrânienne, car la PL peut entraîner un engagement des amygdales cérébelleuses dans le trou occipital qui peut être mortel. D'où la règle de ne pratiquer la PL Qu'après un examen du FO pour éliminer un œdème papillaire qui est un des signes importants d'HIC."],["p","Toutefois, cette régie peut être transgressée en cas de syndrome méningé aigu, en prenant la précaution alors de faire la PL en position couchée et en ne retirant que peu de liquide."],["h3","3. Radiographie simple du crâne"],["p","De face et de profil, elle montre rarement des images pathologiques permettant un diagnostic neurologique."],["h3","4. L'électroencéphalogramme (EEG)"],["p","4.1. EEG normal : le tracé normal d'un sujet adulte éveillé, les yeux fermés est caractérisé par le rythme alpha au niveau des deux tiers postérieurs du scalp, des rythmes bêta sont enregistrés sur les régions frontales et rolandiques et des rythmes thêta sur les régions temporales."],["p","4.2. Les anomalies de l’EEG : elles peuvent être généralisées ou localisées."],["li","Généralisées : se voient au cours des comas, où l'apparition de rythmes lents de type delta est l'indice d'un coma profond ou coma carus."],["li","Localisées : elles sont la manifestation d'une lésion focale, mais elles ne sont jamais spécifiques d'une étiologie déterminée. Enfin, il faut insister sur la valeur de l'EEG pour confirmer le diagnostic d'épilepsie où les anomalies caractéristiques sont à type de pointe ou de pointe-ondes (fig. 4)."],["pre","Pointes                    Pointe-ondes"],["p","FIG. 4. — Principales anomalies de l'EEG."],["p","IL LES EXAMENS SPÉCIALISÉS"],["p","Peuvent être divisés en examens de type non invasif et en examens de type invasif."],["h3","1. Les examens non invasifs"],["p","Sont l’échographie, les explorations isotopiques et la tomodensitométrie, ce sont les examens les plus récents; ils sont surtout intéressants pour le diagnostic des néo-formations intracrâniennes."],["p","1.1. L'échographie : qui consiste à faire passer un faisceau d'ultrasons à travers la boîte crânienne va montrer en cas de lésion expansive hémisphérique un déplacement controlatéral de « l'écho-médian » (onde produite par le passage des ultrasons dans l'espace inter-hémisphérique)."],["p","1.2. Les explorations isotopiques : _ La gamma-encéphalographie : consiste à injecter un traceur radioactif dans la circulation générale, chez le sujet normal, ce traceur ne franchit pas la barrière sang-cerveau."],["p","Une hyperfixation localisée à une région de l'encéphale peut être due à :"],["li","Un angiome."],["li","Une néo-formation extra-parenchymateuse méningiome."],["li","Un processus néoplasique : glioblastome."],["li","Une lésion ischémique récente. _ Le transit isotopique : l'injection d'un traceur radioactif dans les espaces méningés par voie lombaire ou par voie sous-occipitale va permettre une étude dynamique de la circulation du LCR. Cet examen est surtout utile pour localiser les obstacles à la circulation du LCR (hydrocéphalie)."],["p","1.3. La tomodensitométrie (TDM ou scanner) : est l'étude des diverses structures crâniennes en fonction de leur coefficient d'absorption aux rayons X. Elle permet d'obtenir l'image de plusieurs coupes horizontales successives du cerveau."],["p","Elle a un intérêt considérable dans le diagnostic des tumeurs cérébrales, car les tumeurs possèdent des coefficients d'absorption différents du tissu cérébral normal."],["h3","2. Les examens invasifs"],["p","Sont l'encéphalographie gazeuse, l'angiographie cérébrale et l'exploration de la moelle épinière et des racines."],["p","2.1. L'encéphalographie gazeuse : consiste à injecter de l'air par voie lombaire, ce qui permet d'obtenir l'image des citernes et des ventricules cérébraux. En fait, les indications de cet examen sont restreintes, il a été supplanté par l'angiographie, les méthodes isotopiques et la TDM."],["p","2.2. L'angiographie cérébrale : est l'opacification des vaisseaux cérébraux par ponction, soit de la carotide primitive, soit de l'artère humérale au pli du coude."],["p","Les indications de l'angiographie sont nombreuses bien que actuellement elle soit supplantée parfois par les examens non invasifs."],["p","Son indication principale reste le diagnostic des malformations vasculaires : anévrysme surtout et angiome."],["p","2.3. L'exploration de la moelle épinière et des racines : _ L'examen radiographique du rachis sans préparation : de face et de profil doit précéder obligatoirement les examens spécialisés; il va permettre d'étudier l'aspect des corps vertébraux, des pédicules et les disques inter-vertébraux. _ Les procédés de contraste artificiels sont utilisés pour étudier les relations de la moelle et des racines avec le canal rachidien."],["li","La myélographie lipiodolée : consiste à injecter du lipiodol dans l'espace sous-arachnoïdien, soit par voie lombaire, soit par voie sous-occipitale. Son inconvénient majeur est que le lipiodol persistera indéfiniment dans les espaces méningés."],["li","La myélographie gazeuse : consiste à introduire de l'air dans l'espace sous-arachnoïdien soit par voie lombaire, soit par voie sous-occipitale qui tend à remplacer la myélographie lipiodolée."],["li","La radiculosaccographie : est l'opacifîcation du cul-de-sac dural et des gaines radiculaires des racines lombaires inférieures et sacrées; elle utilise un produit opaque hydrosoluble : l'amipaque qui est injecté par voie lombaire sur le malade en position assise. Elle permet le diagnostic des néo-formations de la queue de cheval et des hernies discales."]]},{"ar":"اضطرابات الوعي","fr":"Les troubles de la conscience","w":2265,"b":[["p","La conscience n'est pas une fonction simple, mais l'association de plusieurs fonctions du système nerveux central qui permettent à l'individu d'établir avec l'extérieur des relations et donc de fournir une réponse appropriée à des stimulations variées : visuelles, auditives ou tactiles; il s'agit donc de l'état de conscience élémentaire ou vigilance. Les troubles de la conscience peuvent être divisés suivant leur durée en troubles de la conscience de durée brève ou pertes de connaissance brèves qui sont les plus fréquents : lipothymie, syncope et épilepsie et en trouble de la conscience de durée prolongée essentiellement les comas qu'il faudra distinguer de l'obnubilation et de la confusion mentale."],["h2","I. LES PERTES DE CONNAISSANCE BRÈVES"],["h3","1. Physio-pathologie"],["p","Deux mécanismes peuvent être en cause : l'anoxie cérébrale et une décharge neuronale hypersynchrone."],["p","1.1. Une anoxie cérébrale : qui entraîne une paralysie neuronale, d'où perte de connaissance. Cette anoxie cérébrale peut être due à une insuffisance respiratoire ou à une insuffisance circulatoire et va se manifester cliniquement suivant le degré de l'anoxie soit par une syncope si l'anoxie est complète par arrêt circulatoire le plus souvent; soit par une lipothymie s'il s'agit seulement d'une hypoxie."],["p","1.2. Une décharge neuronale hypersynchrone : qui a pour conséquence une perte de connaissance épileptique; elle se manifeste cliniquement par l'épilepsie dite généralisée, soit de type grand mal, soit de type petit mal."],["h3","2. Les différents types de pertes de connaissance brèves"],["h4","2.1. Les syncopes"],["p","2.1.1. Définition : la syncope est une perte complète de la conscience brusque et passagère, liée à une anoxie cérébrale."],["p","2.1.2. Etude sémiologique : la syncope est un accident subit, qui s'accompagne d'une chute sur le sol ; elle est parfois précédée de prodromes : malaise avec pâleur, sueur, nausée, troubles sensoriels."],["p","La perte de conscience est totale. L'examen clinique retrouve une pâleur extrême du visage, une disparition du pouls et des battements cardiaques, la tension artérielle est imprenable, parfois on note un arrêt respiratoire ou une respiration stertoreuse."],["p","La durée de la syncope est courte, de quelques secondes : 10 secondes en moyenne; si elle se prolonge au-delà de 10 secondes, elle se complique de convulsions, le malade présente alors un spasme tonique parfois suivi d'une ou deux secousses cloniques. La durée maximale est d'une minute; si cette durée est supérieure à trois minutes, il s'ensuit la mort cérébrale."],["p","A la fin de la syncope, la récupération de la conscience est immédiate et totale."],["p","2.1.3. Causes : les causes de syncope sont soit cardiaques, soit extra-cardiaques."],["li","Causes cardiaques: la syncope d'Adams-Stokes est une complication du bloc auriculoventriculaire du troisième degré ; le rétrécissement aortique peut s'accompagner de syncope apparaissant lors de l'effort."],["li","Causes extra-cardiaques : la syncope peut être due à une hypotension orthostatique' qui est soit idiopathique, soit d'origine iatrogène (c'est-à-dire induite par des médicaments au premier rang desquels viennent les hypotenseurs)."],["h4","2.2. Les lipothymies"],["p","2.2.1. Définition : la lipothymie est une perte incomplète de la conscience : il s'agit d'une simple obnubilation en rapport avec une hypoxie cérébrale (terme populaire : «évanouissement»)."],["p","2.2.3. Etude sémiologique : le mode de début de la lipothymie est progressif, il est marqué par une angoisse, des sueurs froides et des troubles sensoriels : bourdonnements d'oreille, impression de voile blanc devant les yeux, sensation d'éblouissement ou d'étourdissement."],["p","Puis, la station debout devient impossible avec chute sur le sol qui peut être évitée par un décubitus préalable."],["p","La perte de connaissance n'est pas totale. Les signes accompagnateurs sont une pâleur du visage, une tension artérielle basse, un pouls petit mais qui reste perceptible."],["p","La conscience revient lentement au bout de 2 à 3 minutes; la récupération physique est plus lente : 15 à 30 minutes; elle est suivie d'une sensation de fatigue."],["p","2.2.3. Causes : la lipothymie peut être due à une hypotension orthostatique ou se voir chez le sujet neurotonique hyperémotif."],["p","2.3. L'épilepsie ou perte de connaissance épileptique."],["p","2.3.1. Définition : l'épilepsie est une crise cérébrale en rapport avec une décharge paroxystique, hypersynchrone d'une population neuronale. Elle peut revêtir deux tableaux cliniques distincts : la crise de grand mal et la crise de petit mal."],["p","2.3.2. Etude sémiologique : _ La crise de grand mal :"],["li","Elle survient à tout âge."],["li","Le mode de début est brutal : il s'agit d'une perte de connaissance brutale, inopinée et soudaine, sans prodromes, entraînant la chute du malade."],["li","La crise évolue en quatre phases : _ la phase tonique : marquée par une hypertonie généralisée avec apnée, cyanose et morsure de la langue', sa durée est de 10 à 20 secondes; _ la phase clonique : est faite de secousses musculaires violentes et synchrones s'accompagnant d'un relâchement sphinctérien avec perte des urines\\ sa durée est de 30 secondes ; _ la phase stertoreuse : pendant laquelle le malade présente une respiration ample et bruyante dite stertoreuse; sa durée est de 30 secondes à 2 minutes; _ la phase résolutive : au cours de laquelle on observe un retour progressif de la conscience; cette phase est suivie d'un repos réparateur; sa durée est de 10 minutes."],["li","Après la crise, le sujet présente un signe important : l'amnésie postcritique (le malade ne se souvient pas de sa crise)."],["li","Si l'on n'a pas assisté à la crise, deux signes objectifs importants permettront de l'identifier la morsure de la langue et la perte des urines. _ La crise de petit mal ou absence :"],["li","Elle ne se voit que chez l'enfant."],["li","Elle réalise une suspension brève de la conscience d'une durée de 5 à 10 secondes. Elle est d'apparition soudaine et inopinée, sans prodromes. Elle ne s'accompagne ni de chute, ni de troubles du tonus, ni de relâchement sphinctérien, ni de manifestations cloniques."],["li","Elle est suivie d'une reprise immédiate de l'activité."],["h2","II. LES COMAS"],["h3","1. Définition"],["p","Le coma se définit comme une perte durable de la conscience, avec altération de la vie de relation, c'est-à-dire baisse de la vigilance et conservation relative des fonctions végétatives."],["p","Le coma n'est pas une exagération des phénomènes de sommeil, mais une dépression des structures d'éveil due à une atteinte des structures réticulées."],["h3","2. Etude sémiologique"],["p","Elle va permettre de reconnaître le coma, d'apprécier sa profondeur afin de le classer. Cette étude sémiologique repose essentiellement sur l'examen clinique qui se fait en deux temps : le premier temps apprécie la vigilance du sujet et le deuxième temps consiste à effectuer l'examen neurologique proprement dit."],["p","2.1. Etude de la vigilance : elle comprend l'étude de la perceptivité de la réactivité."],["p","2.1.1. Etude de la perceptivité : la perceptivité répond à des mécanismes nerveux acquis nécessitant une intégration corticale; son étude repose sur différents tests, l'absence de réponse à ces tests indique un trouble de la conscience de gravité croissante."],["li","Réponse verbale simple à une question simple : nom, prénom, âge."],["li","Exécution d'un ordre verbal simple : tirer la langue, fermer les yeux."],["li","Recherche d'un clignement palpébral à la menace."],["p","2.1.2. Etude de la réactivité : la réactivité répond à des mécanismes nerveux primordiaux dont le siège est sous-cortical."],["li","La réactivité non spécifique :"],["li","La réaction d'orientation : se recherche chez le sujet les yeux ouverts, un stimulus sonore entraîne une rotation des yeux vers le côté d'où vient le bruit."],["li","La réaction d'éveil : se recherche chez le sujet les yeux fermés, le stimulus sonore doit entraîner l'ouverture des yeux avec réaction d'orientation."],["li","La réactivité à la douleur : la stimulation douloureuse consiste en un pincement du trapèze ou du mamelon, la réaction à la douleur est faite de trois composantes dont l'absence est de gravité croissante :"],["li","Réaction par une mimique (grimace) avec ou sans réaction vocale."],["li","Réaction d'éveil : ouverture des yeux."],["li","Réaction motrice : la réaction motrice peut être coordonnée : marquée par un retrait du membre stimulé ou au contraire incoordonnée."],["p","2.2. L'examen neurologique : doit être complet; il a quatre objectifs : rechercher des troubles de la motricité, des troubles du tonus, des troubles végétatifs et enfin les réflexes mésencéphaliques."],["p","2.2.1. Examen de la motricité : recherche l'existence de signes neurologiques en foyer qui sont inconstants; en particulier des signes d'hémiplégie."],["p","2.2.2. Examen du tonus : afin de mettre en évidence des troubles du tonus à type d'hypertonie ou au contraire d'hypotonie."],["p","2.2.3. Recherche de troubles végétatifs :"],["li","Troubles de la fonction respiratoire : réalisant des troubles du rythme et de l'amplitude respiratoire."],["li","Une respiration périodique de type Cheyne-Stokes se voit dans les lésions de l'encéphale."],["li","Une hyperventilation à type d'hyperpnée rapide, régulière et ample qui traduit une atteinte du pédoncule cérébral."],["li","Une respiration apneustique : respiration entrecoupée de pauses à chaque inspiration; se voit dans les lésions de la protubérance."],["li","Une ataxie respiratoire : respiration irrégulière qui traduit une altération des centres bulbaires."],["li","Troubles de la fonction circulatoire : instabilité de la fréquence cardiaque et de la tension artérielle."],["li","Troubles thermiques : à type d'hyperthermie ou plus rarement d'hypothermie."],["p","2.2.4. Les réflexes mésencéphaliques :"],["li","Etude de la déglutition : la déglutition comporte trois temps :"],["li","Le premier temps : buccal est intentionnel et volontaire."],["li","Le deuxième temps : bucco-pharyngé est automatique; son abolition se traduit par une stase pharyngée qui indique un coma profond."],["li","Le troisième temps : pharyngé est réflexe ; son abolition se traduit par des fausses routes, ce qui impose l'arrêt de tout apport liquidien par la bouche et la mise du malade en position déclive avec aspiration pour éviter l'inondation des voies respiratoires par la salive."],["li","Le réflexe pupillaire ou photomoteur : le stimulus lumineux d'un côté entraîne normalement un myosis bilatéral; son abolition est le signe d'un coma grave."],["li","Le réflexe cornéen : l'attouchement de la cornée avec un brin de coton effilé entraîne normalement l'occlusion de la paupière, son abolition signe un état grave."],["h3","3. Le diagnostic différentiel"],["p","Au terme de l'étude sémiologique, le coma pourra être distingué des autres troubles durables de la conscience : l'obnubilation et la confusion mentale (voir Chapitre II)."],["h3","4. La classification des comas"],["p","Le coma reconnu, il sera classé suivant sa profondeur en quatre stades. On se basera pour cette classification sur les résultats de l'examen clinique."],["p","4.1. Stade 1 : Coma léger : qui peut être défini comme une altération plus ou moins importante de la perceptivité avec toutefois persistance du clignement palpébral à la menace; par contre, la réactivité non spécifique et la réactivité à la douleur sont conservées et les réflexes mésencéphaliques sont présents."],["p","Il faut individualiser le cas particulier du coma vigil : qui est un coma léger avec excitation psycho-motrice à type d'agitation et de délire et qui est particulièrement fréquent au cours des hémorragies méningées."],["p","L'EEG montre un rythme de base ralenti et une réactivité électrique aux stimulations augmentée."],["p","4.2. Stade II : Coma confirmé : il réalise une perte complète de la perceptivité avec absence de clignement palpébral à la menace; une absence de réactivité non spécifique et une perturbation de la réactivité à la douleur qui se manifeste par une absence de réponse par la mimique, une absence de réaction d'éveil mais par contre une persistance de la réaction motrice coordonnée. Par ailleurs, il n'existe pas de troubles du tonus, ni de troubles des fonctions végétatives, les réflexes mésencéphaliques sont présents."],["p","Il est à noter que la déglutition n'est perturbée que dans son premier temps : le temps buccal. Enfin, les troubles sphinctériens sont constants."],["p","L'EEG : montre un effacement du rythme de base, une activité delta spontanée et une réactivité électrique aux fortes stimulations."],["p","4.3. Stade III : Coma profond ou coma carus : est caractérisé par une abolition de toute perceptivité et de toute réactivité, seule persiste une réaction motrice incoordonnée aux stimulations douloureuses. Il s'accompagne outre les troubles sphinctériens de troubles du tonus, de troubles végétatifs et d'anomalies des réflexes mésencéphaliques avec troubles de la déglutition et risque de fausses routes, d'abolition du réflexe photomoteur avec mydriase bilatérale fixe et d'abolition du réflexe cornéen."],["p","L'EEG montre des ondes deltas amples monomorphes et une absence de réactivité électrique aux stimulations."],["p","4.4. Stade IV : Coma dépassé : il réalise une abolition de toute vie de relation et de toute vie végétative avec hypotonie musculaire, arrêt de la respiration spontanée, effondrement tensionnel et mydriase."],["p","L'EEG montre une activité nulle. Le stade IV peut évoluer suivant deux modalités :"],["p","4.4.1. Coma avec sidération végétative : qui est réversible et qui peut se voir en cas d'intoxication barbiturique."],["p","4.4.2. Coma dépassé irréversible : dont les critères diagnostiques stricts sont les suivants :"],["li","Perte totale de conscience."],["li","Abolition de toute réactivité des nerfs crâniens avec abolition du réflexe cornéen, immobilité des globes oculaires, mydriase bilatérale aréflexique."],["li","Abolition de la respiration spontanée après débranchement du respirateur pendant au moins 3 minutes avec PCO2 égale ou supérieure à 40 mm de Hg."],["li","Nullité du tracé électrique (EEG) pendant au moins dix minutes."],["h3","5. Recherche de la cause du coma"],["p","Cette recherche va reposer sur l'interrogatoire de l'entourage qui va préciser : les circonstances d'apparition du coma, les antécédents pathologiques : notion de maladie connue (HTA, diabète), la notion de traumatisme récent ou ancien et enfin la notion de prise médicamenteuse; sur l'examen somatique complet et enfin sur les examens biologiques : glycémie, recherche de sucre et de corps cétoniques dans les urines, urée sanguine et créatinémie."],["p","Un coma peut être dû à l'une des trois grandes causes suivantes : neurologique, métabolique ou toxique."],["p","5.1. Causes neurologiques :"],["li","Traumatisme crânien."],["li","Accident vasculaire cérébral : hémorragie cérébro-méningée ou ramollissement cérébral."],["li","Infection : méningite, encéphalite."],["p","5.2. Causes métaboliques : diabète, insuffisance rénale, insuffisance hépatique, insuffisance respiratoire, hypoglycémie et cause endocrinienne : surtout insuffisance thyroïdienne et insuffisance anté-hypophysaire."],["p","5.3. Causes toxiques : de grande fréquence dominée par le coma barbiturique et l'intoxication à l'oxyde de carbone."]]},{"ar":"اضطرابات الحركة: الشلل والمتلازمات خارج الهرمية","fr":"Troubles de la fonction motrice","w":5398,"b":[["p","La motricité est sous la dépendance de plusieurs structures nerveuses : système pyramidal, système extra-pyramidal et cervelet dont l'intégrité est nécessaire afin que le mouvement puisse s'accomplir de manière normale. Les troubles de la fonction motrice sont de trois grands types :"],["li","Les paralysies qui sont une diminution ou une abolition de la motricité volontaire."],["li","Les syndromes extra-pyramidaux au premier rang desquels se place le syndrome parkinsonien."],["li","Les troubles moteurs divers dont la physiopathologie est encore obscure et qui réalisent des mouvements anormaux."],["h2","I. LES PARALYSIES"],["h3","1. Définition"],["p","La paralysie est une diminution ou une abolition de la motricité volontaire."],["h3","2. Rappel anatomo-pathologique"],["p","La motricité volontaire est possible grâce au système pyramidal, au neurone moteur périphérique et aux muscles."],["p","2.1. Le système pyramidal (fig. 1) : commence au niveau de l'aire motrice frontale ascendante, descend dans la capsule interne, traverse les pédoncules cérébraux, la protubérance et croise dans la partie inférieure du bulbe au-dessous des noyaux d'origine des nerfs crâniens réalisant le faisceau pyramidal croisé qui descend dans le cordon latéral de la moelle épinière. Une petite partie du faisceau pyramidal ne croise pas dans le bulbe et forme le faisceau pyramidal direct qui descend dans le cordon antérieur de la moelle et qui est destiné presque entièrement à la région cervicale."],["p","Une lésion du système pyramidal entraîne une paralysie dite centrale."],["p","Noyaux moteurs des nerfs crâniens"],["p","FIG. 1. — Le système pyramidal."],["p","2.2. Le neurone moteur périphérique (fig. 2) : débute au niveau de la corne antérieure de la moelle qui donne naissance aux fibres nerveuses qui vont former la racine antérieure, celleci va rejoindre la racine postérieure pour donner le nerf rachidien."],["p","Les nerfs rachidiens vont s'anastomoser pour former les plexus d'où naîtront les nerfs périphériques qui vont innerver les muscles."],["p","Une lésion du neurone moteur périphérique entraîne une paralysie dite périphérique."],["p","2.3. Les muscles : une anomalie musculaire pourra entraîner une diminution de la motricité volontaire soit par atteinte de la jonction neuromusculaire; soit par atteinte du muscle luimême."],["p","Nerf musculo-cutané"],["p","FIG. 2. — Le neurone moteur périphérique (exemple nerfs rachidiens-plexus brachial et nerfs périphériques du membre supérieur)."],["h3","3. Etude sémiologique des paralysies"],["p","3.1. L'existence d'une paralysie sera dépistée par l'examen clinique qui va d'abord apprécier la force musculaire globale en étudiant l'exécution des mouvements volontaires : poignée de main, flexion contrariée de l'avant-bras..."],["p","Certaines manœuvres permettront de dépister une paralysie incomplète ou parésie :"],["li","Aux membres supérieurs : l'épreuve des bras tendus qui met en évidence un déficit moteur portant sur le triceps brachial et les extenseurs des doigts."],["li","Aux membres inférieurs :"],["li","L'épreuve de Barré (fig. 3) : le sujet est placé en décubitus ventral, les jambes fléchies à angle droit sur les cuisses."],["li","L'épreuve de Mingazzini (fig. 4) : le sujet est placé en décubitus dorsal, les cuisses et les jambes fléchies à angle droit. Ces deux épreuves mettent en évidence un déficit portant sur les muscles raccourcisseurs; en cas de déficit moteur, on observe une chute de l'un ou des deux membres. Lorsqu'un déficit moteur est détecté, on apprécie l'étendue et le degré des paralysies par une étude de la force musculaire de chaque segment paralysé ou force musculaire segmentaire. Elle est étudiée en demandant au sujet d'exécuter un mouvement contre résistance ce qui permet d’apprécier la force musculaire des différents muscles de manière"],["p","FIG. 4. — Epreuve de Mingazzini (hémiparésie gauche)."],["p","comparative des deux côtés du corps. Ainsi, le degré de la paralysie pour chaque muscle est coté suivant sa gravité de 0 à 5 : c'est le testing musculaire."],["li","0 : pas de contraction musculaire visible."],["li","1 : contraction musculaire visible mais qui n'entraîne pas de déplacement."],["li","2 : mouvement possible après élimination de la pesanteur."],["li","3 : mouvement possible contre la pesanteur."],["li","4 : mouvement possible contre la pesanteur et résistance."],["li","5 : force musculaire normale."],["p","3.2. L'examen des réflexes ostéo-tendineux et cutanés doit être systématique; ils peuvent être normaux, abolis ou augmentés. Leur appréciation va permettre de préciser le type de la paralysie : des réflexes ostéo-tendineux vifs avec clonus inépuisable, signes de Hoffmann et Rossolimo et signe de Babinski signent l'atteinte du faisceau pyramidal."],["p","3.3. L'examen du tonus : est également indispensable et montrera soit une hypotonie: soit une hypertonie spastique qui est toujours en rapport avec une lésion du faisceau pyramidal."],["p","3.4. L'examen de la sensibilité doit être systématique."],["p","3.5. Enfin, on recherchera des troubles trophiques : une atrophie musculaire accompagnée ou non de fasciculations qui signe l'atteinte du neurone périphérique."],["h3","4. Le diagnostic différentiel"],["p","Les paralysies ne devront pas être confondues avec :"],["p","4.1. Des troubles de la motilité liés à une lésion ostéo-articulaire : une lésion articulaire à type d'arthrite peut entraîner une impotence fonctionnelle avec atrophie musculaire qui peut être confondue avec une atteinte motrice périphérique."],["p","4.2. Trouble de la motricité lié soit à une rétraction tendineuse ischémique dans le syndrome de Volkmann; soit à une rétraction de l'aponévrose palmaire dans la maladie de Dupuytren."],["p","4.3. Troubles moteurs dus à une atteinte du système extra-pyramidal."],["p","4.4. Troubles de la motricité fine des doigts en rapport avec une abolition de la sensibilité profonde."],["p","4.5. Enfin, la simulation; dans ce cas les signes objectifs sont absents."],["h3","5. Les différents types de paralysies"],["p","Une paralysie peut être due soit à une atteinte du système pyramidal, soit à une atteinte du neurone moteur périphérique, soit à une atteinte musculaire."],["p","5.1. Les paralysies centrales : sont en rapport avec une atteinte du système pyramidal. Deux types de lésion peuvent être rencontrés :"],["li","Une lésion unilatérale qui siège le plus souvent sur le trajet intracrânien du faisceau pyramidal : elle réalise une hémiplégie située du côté opposé à la lésion (controlatérale): beaucoup plus rarement, elle peut siéger au niveau de la moelle réalisant une hémiplégie située du même côté que la lésion (homolatérale)."],["li","Une lésion bilatérale : siégeant au niveau de la moelle qui entraîne une quadriplégie ou plus souvent une paraplégie."],["p","5.1.1. Caractères communs : quel que soit le type de la lésion unilatérale ou bilatérale, le syndrome pyramidal possède des caractères communs :"],["p","Le déficit moteur : est de degré variable; la paralysie peut être complète mais en fait le plus souvent, elle est partielle."],["li","Elle respecte les muscles à action synergique : muscles du cou, du tronc, du larynx. le diaphragme et les oculomoteurs."],["li","Elle prédomine sur certains muscles au niveau de chaque segment du corps atteint :"],["li","A la face la paralysie prédomine sur le territoire facial inférieur."],["li","Aux membres supérieurs : elle intéresse essentiellement les extenseurs et les supinateurs."],["li","Aux membres inférieurs : elle atteint les raccourcissements et les abducteurs. Les troubles du tonus sont habituels :"],["li","Soit hypotonie : dans les atteintes brutales et sévères de la voie motrice principale au stade initial; cette hypotonie est ensuite remplacée par une hypertonie. ."],["li","Soit hypertonie : qui est habituelle au cours des lésions chroniques de la voie pyramidale, il s'agit d'une hypertonie en extension qui dans les lésions sévères peut évoluer vers l’hypertonie en flexion. Les troubles des réflexes :"],["li","Les réflexes ostéo-tendineux :"],["li","L'aréflexie ostéo-tendioeuse est habituelle au stade initial des atteintes sévères de la voie pyramidale, elle accompagne l'hypotonie. Elle s'observe également au cours des hypertonies en flexion."],["li","L'hyper-réflectivité ostéo-tendineuse est habituelle dans les formes avec hypertonie; elle s'accompagne de clonus et de réflexes proprioceptifs pathologiques : signe de Hoffmann et signe de Rossolimo."],["li","Les réflexes cutanés :"],["li","Le signe de Babinski est le signe le plus caractéristique d'une atteinte du faisceau pyramidal, il se voit dans les formes hypotoniques et dans les formes hypertoniques."],["li","Les réflexes cutanés abdominaux et crémastériens sont habituellement abolis. Les autres signes :"],["li","Il n'existe pas d'amyotrophie; sauf l'amyotrophie globale qui peut être due à l'immobilisation prolongée."],["li","Les troubles sphinctériens sont seulement retrouvés d
