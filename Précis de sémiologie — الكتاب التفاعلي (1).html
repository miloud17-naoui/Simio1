nte, plus net en décubitus latéral gauche, il signifie qu'il existe une insuffisance ventriculaire gauche; il peut être proto-diastolique ou présystolique, * le bruit de galop droit : est entendu à la base de l'appendice xyphoïde ; il signifie qu'il existe une insuffisance ventriculaire droite; il peut être proto-diastolique ou présystolique. Ainsi les rythmes à trois temps anormaux constituent l'essentiel des anomalies des bruits cardiaques, leur diagnostic clinique peut être difficile, on devra s'aider pour leur repérage de la prise du pouls artériel; ils devront être différenciés des dédoublements du 1er et du 2e bruits qui eux sont très serrés et donnent l'impression de bruit fendus en deux."],["p","TABLEAU RÉCAPITULATIF DES BRUITS SURAJOUTÉS"],["p","Systoliques"],["pre","Claqués :         Claquement artériel : protosystolique : IA - RA - RP - HTAP Bruit de triolet :"],["p","mésosystolique ou télésystolique : élongations des cordages de la valve mitrale"],["p","Diastoliques :"],["pre","Claqués           COM : protodiastolique : RM"],["p","Vibrance péricardique : protodiastolique : péricardite constrictive Bruit de galop : Sourds :"],["li","Protodiastolique*"],["li","Présystolique*"],["li","Sommation : mésodiastolique : tachycardie * Insuffisance ventriculaire droite ou gauche."],["p","4.2.3. Les souffles cardiaques : a) Définition : un souffle est un phénomène sonore d'une durée plus longue que celle d'un bruit, il est produit :"],["li","Soit par l'écoulement du sang d'une zone de haute pression vers une zone de basse pression, à travers un orifice rétréci ou incontinent."],["li","Soit par l'augmentation du débit cardiaque associée ou non à une diminution de la viscosité sanguine, par exemple, au cours de l'anémie. Lorsque ce phénomène sonore prolongé est doux, on l'appelle souffle, lorsqu'il est rude, on l'appelle roulement. b) Classification des souffles : elle se fait suivant trois critères :"],["li","Suivant le moment où il apparaît dans la révolution cardiaque, c'est-à-dire suivant le temps."],["li","Suivant le mécanisme d'apparition, c'est-à-dire suivant le type."],["li","Suivant la cause : organique, fonctionnelle ou non organique. SUIVANT LE TEMPS on distingue :"],["li","Les souffles diastoliques : qui peuvent être prododiastolique (début de la diastole), mésodiastolique (milieu de la diastole), télédiastolique (fin de la diastole) ou holo-diastolique (couvrant la totalité de la diastole)."],["li","Les souffles systoliques : peuvent être également protosystoliques, télésystoliques ou holo-systoliques."],["li","Les doubles souffles systolo-diastoliques : le double souffle peut être défini comme la succession au niveau d'un même orifice cardiaque d'un souffle systolique et d'un souffle diastolique bien séparés l'un de l'autre par un intervalle silencieux dus à l'association d'un rétrécissement et d'une insuffisance valvulaire."],["li","Le souffle continu : est un souffle entendu lors de la systole et de la diastole sans intervalle silencieux. SUIVANT LE TYPE :"],["li","Les souffles d'éjection : qui sont dus à un obstacle au passage du sang qui doit franchir un orifice artériel rétréci (aorte ou artère pulmonaire), ils sont toujours systoliques."],["li","Les souffles de régurgitation : sont en rapport avec le reflux du sang à travers une valvule incontinente ou à travers une communication anormale entre deux cavités cardiaques, ils sont soit systoliques, soit diastoliques :"],["li","Systoliques : lorsque la régurgitation se fait du ventricule vers l'oreillette (insuffisance mitrale et insuffisance tricuspidienne), ou du ventricule gauche vers le ventricule droit (communication interventriculaire)."],["li","Diastoliques : lorsque la régurgitation se fait d'un gros vaisseau (aorte ou artère pulmonaire) vers le ventricule (insuffisance aortique)."],["li","Le roulement diastolique : qui est un souffle diastolique de remplissage, qui correspond à la phase de remplissage du ventricule à travers un orifice auriculo-ventriculaire rétréci (rétrécissement mitral). SUIVANT LA CAUSE on distingue :"],["li","Les souffles organiques : qui traduisent le plus souvent une lésion valvulaire : insuffisance ou rétrécissement; plus rarement une communication anormale entre l'artère pulmonaire et l'aorte (persistance du canal artériel) ou une communication anormale entre deux cavités cardiaques (communication interventriculaire)."],["li","Les souffles fonctionnels : sont des souffles qui peuvent s'observer :"],["li","Soit au cours d'une cardiopathie, mais qui ne sont pas dus à une lésion valvulaire par exemple l'insuffisance ventriculaire gauche peut s'accompagner d'une incontinence mitrale qui diminue ou disparaît sous l'effet du traitement de l'IVG."],["li","Soit au cours d'anomalies extra-cardiaques retentissant sur le cœur ainsi au cours de l'anémie un souffle fonctionnel peut apparaître en rapport avec l'augmentation du débit cardiaque et la diminution de la viscosité sanguine."],["li","Les souffles anorganiques : sont des souffles non pathologiques qui sont retrouvés chez des sujets par ailleurs normaux."],["p","c) Moyens d'exploration des souffles : ce sont l'auscultation et l'enregistrement phonocardiographique."],["p","L'AUSCULTATION : va s'attacher à préciser les caractères sémiologiques suivants des souffles :"],["li","Le siège d'intensité maximale et les irradiations."],["li","Le temps : systolique ou diastolique en s'aidant de la prise du pouls qui est synchrone de B1."],["li","Le timbre : aigu ou grave."],["li","L'intensité qui peut être cotée de 1 à 6."],["li","1 /6 : à peine audible."],["li","2/6 : souffle plus net"],["li","3/6 : souffle qui s'entend bien."],["li","4/6 et 5/6 : souffle intense et souvent frémissant."],["li","6/6 : très intense, entendu à distance du thorax."],["li","Les variations du souffle avec les changements de position et avec les mouvements respiratoires :"],["li","L'inspiration forcée : qui augmente le retour veineux et le débit du cœur droit; elle renforce donc les souffles qui prennent naissance dans les cavités droites."],["li","L'expiration forcée diminue le retour veineux au cœur droit et augmente le débit cardiaque gauche en chassant le sang contenu dans les poumons par les veines pulmonaires vers l'oreillette gauche : elle renforce donc les souffles qui prennent naissance dans les cavités gauches."],["li","La manœuvre de Valsalva : consiste à demander au malade de faire un effort expiratoire glotte fermée après une inspiration forcée; cette manœuvre entraîne une diminution du retour veineux pulmonaire et périphérique d'où un affaiblissement des souffles droit et gauche. Elle permet de différencier les souffles droit et gauche : en effet à la fin de l'épreuve, l'expiration va s'accompagner d'une augmentation du retour veineux d'abord au ventricule droit, puis au ventricule gauche; ainsi les souffles droits réapparaissent rapidement, les souffles gauches ne réapparaissent que 5 à 7 contractions plus tard."],["li","Les renforcements éventuels des souffles."],["li","Les signes auscultatoires accompagnateurs : variation d'intensité des bruits, dédoublements et bruits surajoutés."],["pre","L'ENREGISTREMENT PHONOCARDIOGRAPHIQUE                 : est l'enregistrement graphique de"],["p","l'auscultation par le phonocardiogramme, son intérêt est primordial, car il complète les données de l'auscultation. Ainsi, chaque souffle suivant son type aura une forme géométrique caractéristique :"],["li","Le souffle d'éjection est losangique (fig. 10-1)."],["li","Le souffle de régurgitation systolique est rectangulaire (fig. 10-2)."],["li","Le souffle de régurgitation diastolique est triangulaire (fig. 10-3). d) Etude analytique des souffles : nous étudierons les souffles suivant leurs temps : les souffles systoliques, les souffles diastoliques, les doubles souffles et le souffle continu."],["p","LES SOUFFLES SYSTOLIQUES : ils peuvent être organiques, fonctionnels et non organiques."],["li","Les souffles systoliques organiques : ils sont en rapport avec une anomalie valvulaire ou une communication anormale."],["li","Les souffles systoliques d'éjection : ils émanent d'un orifice ventriculaire artériel rétréci (aorte ou artère pulmonaire), ils sont liés à la puissante contraction ventriculaire."],["p","* Caractères communs :"],["li","ils sont intenses, souvent frémissants, de timbre grave, râpeux,"],["li","ils débutent après B1, ils vont rapidement croissant jusqu'à un maximum, puis rapidement décroissant, ils sont donc surtout mésosystoliques"],["li","ils siègent à la base du cœur,"],["li","ils sont mieux entendus en position assise, penchée en avant et après effort,"],["li","ils sont solitaires sauf addition d'un claquement artériel protosystolique, le B1 est peu audible et le B2 est souvent aboli,"],["li","l'aspect phonocardiographique est losangique où le meilleur enregistrement est obtenu au foyer d'Erb; * le souffle systolique de la sténose aortique :"],["li","il est souvent entendu sur toute la surface précordiale, le maximum d'intensité est retrouvé au 2e espace intercostal droit et au 3e espace intercostal gauche,"],["li","B2 est souvent diminué ou aboli; * le souffle systolique de la sténose pulmonaire :"],["li","il est plus localisé que le souffle de la sténose aortique, il est maximum au 2e et au 3e espaces intercostaux gauches,"],["li","il irradie vers la clavicule gauche, les creux sus-claviculaires et les espaces interscapulovertébraux, il se propage peu à la pointe,"],["li","il est moins intense que le souffle systolique aortique,"],["li","B2 est soit conservé, soit diminué, soit dédoublé. Pour distinguer les souffles systoliques d'éjection aortique et pulmonaire, on aura recours à la manœuvre de Valsalva : le souffle pulmonaire augmente immédiatement d'intensité dés la fin de l'épreuve, alors que le souffle aortique ne reprend son intensité maximale que 5 à 7 battements plus tard."],["li","Les souffles systoliques de régurgitation : ils résultent du reflux systolique du sang d'une cavité à forte pression vers une cavité à faible pression : du ventricule gauche vers l'oreillette gauche : insuffisance mitrale (IM); du ventricule droit vers l'oreillette droite : insuffisance tricuspidienne (IT); du ventricule gauche vers le ventricule droit : communication interventriculaire (CIV) * Caractères communs :"],["li","ils débutent précocement dans la systole avec le 1er bruit qui peut être masqué, l'intensité est d'emblée maximale couvrant toute la systole jusqu'au 2e bruit dont ils ne sont pas séparés, ils sont holosystoliques,"],["li","l'aspect phonocardiographique est rectangulaire; * le souffle systolique d'IM : c'est le plus caractéristique des souffles systoliques organiques de régurgitation :"],["li","il est maximal à la pointe,"],["li","il irradie vers l'aisselle gauche et le dos, parfois vers l'appendice xyphoïde,"],["li","il est d'intensité variable, parfois grande, avec un timbre rude et sec « en jet de vapeur »; * le souffle systolique de l’IT : est rarement organique :"],["li","il est maximal au voisinage de l'appendice xyphoïde,"],["li","il est d'intensité habituellement faible,"],["li","il augmente d'intensité lors de l'inspiration forcée, il est donc mieux entendu lorsque le malade est en apnée inspiratoire, c'est le signe de Carvallo; * le souffle systolique de la CIV est rare :"],["li","il est maximal le long du bord gauche du sternum à l'extrémité interne du 4e espace intercostal gauche ou dans la région mésocardiaque,"],["li","il irradie en rayons de roue,"],["li","il est le plus souvent intense."],["li","Les souffles systoliques fonctionnels : sont des souffles de régurgitation."],["pre","B4    B1           B2 OM B3"],["p","FIG 9. – Courbes de pression et bruits du cœur"],["pre","B1        B2                                                         B1    B2"],["pre","FIG 10-1. – Souffle systolique d’éjection      FIG 10-2. – Souffle systolique          FIG 10-3. – Souffle diastolique\n                                                      de régurgitation                        de régurgitation"],["pre","B1     B2         B1                 B1                  B1      B1         B2             B1"],["pre","FIG 10-4.- Roulement diastolique         FIG 10-5. – Double souffle           FIG 10-6. – Souffle continu"],["p","* Caractères communs :"],["li","ils sont brefs, n'occupant qu'une partie de la systole : protosystolique ou mésosystolique,"],["li","ils sont le plus souvent de faible intensité, de timbre doux,"],["li","ils n'irradient pas ou peu,"],["li","ils varient d'un moment à l’autre et selon la position du sujet,"],["li","en fait, ils ont des caractères variable et ils peuvent ressembler à un souffle systolique organique, mais ils ne sont jamais frémissants et ils diminuent ou peuvent disparaître lors du traitement de la cause qui les a fait naître; * le souffle systolique de l’IM fonctionnelle : peut être retrouvé lorsqu'il existe une dilatation du ventricule gauche dans l'insuffisance ventriculaire gauche et également au cours de l'anémie; il siège à la pointe; * le souffle systolique de l'IT fonctionnelle est retrouvé au cours de l'insuffisance ventriculaire droite, il est associé alors à une hépatomégalie avec expansion systolique et à une expansion systolique des veines jugulaires. * Les souffles systoliques anorganiques : se voient chez le sujet normal, surtout en cas d'éréthisme cardiovasculaire. Leurs caractères sont les suivants :"],["li","siège parasternal gauche;"],["li","durée brève : protosystolique ou mésosystolique;"],["li","timbre doux, faible intensité, jamais frémissants;"],["li","pas d'irradiation;"],["li","variabilité d'un jour à l'autre et avec la position du sujet;"],["li","peuvent être accompagnés d'un B3 audible."],["p","LES SOUFFLES DIASTOLIQUES : contrairement aux souffles systoliques, ils sont toujours organiques :"],["p","* Souffle diastolique de régurgitation : le plus fréquent est celui retrouvé au cours de l'insuffisance aortique (IA)."],["li","Il siège au niveau du 2e espace intercostal droit et du 3e espace intercostal gauche."],["li","Il irradie le long du bord gauche du sternum et vers la pointe."],["li","Il est le plus souvent d'intensité faible."],["li","Il est doux, humé, aspiratif."],["li","Il commence dés le 2e bruit qu'il peut effacer, il est d'emblée maximal et décroît progressivement, il s'éteint avant le 1\" bruit, il est holodiastolique."],["li","L'aspect phonocardiographique est triangulaire. * Le roulement diastolique est un souffle diastolique de remplissage, il est entendu au cours du rétrécissement mitral."],["li","II siège à la pointe, il est mieux entendu en décubitus latéral gauche."],["li","II débute à distance du 2e bruit après le claquement d'ouverture de la mi traie, il se prolonge toute la mésodiastole en décroissant et subit en fin de diastole un renforcement présystolique rageur et bref(fig. 10-4) qui disparaît en cas de fibrillation auriculaire."],["li","II est intense, il a un timbre grave et sourd, il est souvent accompagné d'un frémisse ment cataire mis en évidence lors de la palpation."],["li","Les signes accompagnateurs auscultatoires sont l'éclat de B1 et le claquement d’ouverture de la mitrale."],["p","LES DOUBLES SOUFFLES ET LE SOUFFLE CONTINU :"],["li","Les doubles souffles : réalisent la succession d'un souffle systolique et diastolique émanant d'un même orifice et séparés par un intervalle silencieux. L'exemple de double souffle le plus typique et celui qui est retrouvé dans la maladie aortique, il associe un souffle systolique d'éjection (RA) et un souffle diastolique de régurgitation (IA) (fig. 10-5)."],["p","* Le souffle continu : est constitué de deux souffles de régurgitation systolique et diastolique se succédant sans intervalle silencieux avec un maximum télésystolique et protodiastolique (fig. 10-6)."],["li","Il siège sous la clavicule gauche."],["li","Il irradie vers les deux creux sus-claviculaires et vers le dos au niveau de la fosse susépineuse gauche."],["li","Il est le plus souvent intense et frémissant."],["li","C'est un souffle dit tunnellaire : il est comparé au bruit d'une locomotive à vapeur passant dans un tunnel."],["li","Il est dû à une persistance du canal artériel."],["p","4.2.4. Le frottement péricardique : est un bruit surajouté superficiel en rapport avec une inflammation des deux feuillets du péricarde (péricardite aiguë sèche)."],["li","Il siège dans la région mésocardiaque et le bord gauche du sternum."],["li","Il n'irradie pas, on dit qu'il « naît et meurt sur place »."],["li","Il est d'intensité et de timbre variables : soit doux, évoquant le froissement de la soie; soit intense, râpeux, ressemblant au crissement du cuir neuf."],["li","Il est mésosystolique ou mésodiastolique, parfois il est entendu dans les deux temps, il réalise alors un bruit de va-et-vient."],["li","Il respecte les bruits du cœur."],["li","Il est variable avec la position du sujet, avec la pression du stéthoscope et dans le temps."],["li","Il doit être différencié du frottement pleural par le fait qu'il persiste lors de l'apnée."],["h2","III. LES PRINCIPALES EXPLORATIONS CARDIAQUES"],["h3","1. Les examens non spécialisés"],["p","1.1. La radioscopie : permet l'appréciation de la morphologie et de la dynamique cardiaque associée à l'opacification de l'œsophage par de la baryte, elle permet de mieux analyser le contour postérieur du cœur; elle est actuellement le plus souvent remplacée par l'examen à l'amplificateur de brillance."],["p","1.2. La radiographie : est un document de base indispensable, il est un élément de comparaison indispensable pour suivre l'évolution d'une cardiopathie."],["p","La radiographie sera prise sous trois incidences : la face, l'oblique antérieure gauche (OAG) et l'oblique antérieure droite (OAD)."],["p","1.2.1. La radiographie de face : permet d'apprécier le volume cardiaque par la mesure de l'indice cardiothoracique qui est le rapport du plus grand diamètre cardiaque sur le diamètre thoracique mesuré à la hauteur des coupoles diaphragmatiques, il est normalement égal ou inférieur à 0,50."],["p","Elle permet aussi de visualiser les bords du cœur (fig. 11)."],["p","1.2.2. La radiographie en OAD : le cœur a une forme triangulaire à base diaphragmatique limitée par un bord antérieur oblique et un bord postérieur presque vertical correspondant en haut à l'oreillette gauche et en bas à l'oreillette droite (fig. 12)."],["p","1.2.3. La radiographie en OAG : le cœur a une forme ovoïde dont le bord postérieur correspond en haut à l'oreillette gauche et en bas au ventricule gauche (fig. 13)."],["p","Diamètre cardiaque Diamètre thoracique"],["p","FIG 11. – Aspect radiologique du cœur vu de face"],["p","Ventricules"],["pre","FIG 12. – Aspect radiologique du cœur                 FIG 13. – Aspect radiologique du cœur\n           vu en OAD                                                 vu en OAG"],["p","1.3. L'ECG : est l'enregistrement de l'activité électrique du cœur, il se fait grâce à des électrodes placées à la surface du corps qui permettent l'enregistrement des différences de potentiel en fonction du temps et d'obtenir ainsi les différentes dérivations."],["p","1.3.1. Les dérivations périphériques (fig. 14) au nombre de 6 sont obtenues en plaçant les électrodes au niveau des membres, elles comprennent les dérivations standards et les dérivations périphériques."],["li","Les dérivations standards :"],["li","D1 : poignet gauche et poignet droit."],["li","D2 : poignet droit et cheville gauche."],["li","D3 : poignet gauche et cheville gauche."],["li","Les dérivations unipolaires des membres :"],["li","AVR : membre supérieur droit."],["li","AVL : membre supérieur gauche."],["li","A VF : membre inférieur gauche."],["p","1.3.2. Les dérivations précordiales : sont obtenues en plaçant les électrodes au niveau de la région précordiale (fig. 15)."],["p","Ventricule droit : V1 : extrémité interne du 4e espace intercostal droit V2 : extrémité interne du 4e espace intercotal gauche."],["p","Dérivations transitionnelles : V3 : à mi-distance entre V2 et V4. V4 : au 5e espace intercostal gauche sur la ligne médioclaviculaire. Ventricule gauche : V5 : au 5e espace intercostal gauche sur la ligne axillaire antérieure. V6 : au 5e espace intercostal gauche sur la ligne axillaire moyenne."],["p","On utilise pour l'enregistrement du papier millimétré où l'ordonnée représente le voltage : 1 cm (2 grands carreaux) : 1 m. volt et l'abscisse le temps : 1 grand carreau : 0,20 seconde et un petit carreau : 0,04 seconde (fig. 16) pour une vitesse de déroulement du papier de 25 mm par seconde."],["pre","FIG 14. – Dérivations périphériques              FIG 15. – Dérivations précordiales"],["pre","FIG 16 . – Papier d’enregistrement ECG   FIG 17. – ECG et phonocardiogramme normal"],["h3","2. Les examens spécialisés"],["p","2.1. Le phonocardiogramme : est un examen non invasif, très précieux, il doit être couplé à l'auscultation qu'il permet souvent de préciser."],["p","C'est l'enregistrement au niveau de face antérieure du thorax des vibrations produites par les bruits qui prennent naissance au niveau du cœur, il permet donc d'enregistrer les bruits normaux du cœur, les bruits surajoutés et les souffles."],["p","L'enregistrement phonocardiographique doit toujours être fait en même temps que l’ECG (fig. 17)."],["p","Il peut être associé au mécanogramme qui est l'enregistrement des déplacements, soit de la pointe du cœur : apexogramme, soit du pouls carotidien : carotidogramme, soit du pouls jugulaire : jugulogramme (fig. 18)."],["p","Jugulogramme"],["p","Carotidogramme"],["p","Apexogramme"],["p","Phono"],["p","FIG 18. – Mécanogramme"],["p","FIG. 19. - Echographie normale de la valve mitrale. Echographie pathologique au cours du RM"],["p","2.2. L'echocardiographie : est également une méthode non invasive, basée sur la transmission des ultrasons et qui permet de visualiser le cœur. Elle permet l'étude fonctionnelle et anatomique du ventricule gauche et l'étude dès valves. Par exemple, le diagnostic de rétrécissement mitral peut être affirmé dans pratiquement 100 % des cas par cette méthode (Fig. 19)."],["p","2.3. Le cathétérisme cardiaque : permet l'enregistrement des courbes de pression dans les cavités gauches et droites (voir hémodynamique intracardiaque)."],["p","2.4. L'angiocardiographie : est l'opacification du cœur et des gros vaisseaux, elle permet de visualiser les cavités cardiaques et leurs modifications au cours des contractions du cœur."],["p","Il s'agit d'un examen spécialisé dont l'indication doit être discutée en raison des dangers qu'il comporte."],["p","Ainsi, parmi les explorations cardiaques à côté de la radiographie et de l'ECG qui sont entrés dans la pratique courante, le phonomécanogramme et l'échocardiogramme sont deux méthodes qui peuvent être largement utilisées du fait des nombreuses informations qu'elles apportent et de leur innocuité."],["p","Par contre, le cathétérisme cardiaque et l'angiocardiographie restent des examens dont l'indication doit être discutée en milieu spécialisé."]]},{"ar":"السيميولوجيا الوعائية","fr":"Sémiologie vasculaire","w":3861,"b":[["p","L'étude de la sémiologie cardiaque doit toujours être complétée par l'examen des artères et des veines."],["h2","I. LA SÉMIOLOGIE ARTÉRIELLE"],["h3","1. L'examen clinique des artères comprend quatre temps"],["p","L'inspection, la palpation systématique de tous les pouls périphériques, l'auscultation des grands axes artériels et la prise de la tension artérielle."],["p","1.1. L'inspection : apporte en règle générale peu de renseignements"],["p","1.1.1. A l'état normal: les artères périphériques sont invisibles."],["p","1.1.2. A l'état pathologique : les artères périphériques deviennent visibles :"],["li","Au cours de l'athérosclérose : les artères humérales sont visibles à la partie interne du bras et au pli du coude; on peut, à leur niveau, retrouver le signe de la sonnette qui réalise un mouvement de reptation de l'artère humérale sinueuse et très battante à chaque systole."],["li","Au cours de l'insuffisance aortique : les pulsations carotidiennes sont amples, elles sont visibles à la base du cou ; elles peuvent réaliser le signe de Musset ce sont des secousses rythmiques de la tête lorsque celle-ci est légèrement fléchie."],["p","1.2. La palpation : est le temps capital de l'examen clinique des artères."],["p","1.2.1. Technique : la palpation se fait avec la pulpe des 2e, 3e et 4e doigts, la pression exercée doit être douce."],["li","Au niveau du cou : le pouls carotidien est recherché sur le sujet assis, la tête légèrement penchée vers le côté examiné (fig. 1)."],["li","Au niveau des membres supérieurs :"],["li","Le pouls radial : est palpé au niveau de la gouttière du pouls située à la partie inféroexterne de l'avant-bras au-dessus du poignet (fig. 2)."],["p","FIG.1. – Recherche du pouls carotidien"],["p","FIG. 2. — Recherche du pouls radial."],["p","FIG. 3. — Recherche du pouls huméral."],["li","Le pouls huméral : est mieux palpé sur le sujet debout, une main de l'examinateur soutient l'avant-bras placé à angle droit sur le bras, l'autre main palpe l'artère en dedans de la partie inférieure du biceps (fig. 3)."],["p","Ø Au niveau des membres inférieurs :"],["li","Le pouls fémoral : se recherche sur le sujet en décubitus dorsal, jambes étendues, au niveau du triangle de Scarpa (fig. 4)."],["li","Le pouls poplité : se recherche sur le sujet en décubitus dorsal, les jambes légèrement fléchies, l'examinateur réunit ses deux pouces sur la rotule alors que les autres doigts des deux mains palpent le creux poplité (fig. 5)."],["li","Le pouls tibial postérieur : se recherche dans la gouttière rétro-malléolaire interne (fig. 6)."],["li","Le pouls pédieux : est recherché sur le dos du pied (fig. 7), il est non perçu chez le sujet normal dans 5 à 10% des cas."],["li","Au niveau du tronc : l'aorte abdominale est palpée à gauche de la ligne médiane, elle est mieux palpée chez les sujets maigres."],["p","1.2.2. Résultats :"],["li","A l’état normal :"],["li","Les artères sont souples et dépressibles."],["li","Tous les pouls périphériques doivent être i normalement retrouvés à l'exception parfois des pouls pédieux."],["li","Deux artères symétriques ont des battements égaux et synchrones."],["li","Le pouls carotidien est synchrone du 1er bruit cardiaque."],["li","Le pouls radial et le pouls fémoral sont synchrones."],["li","Le pouls est régulier, sa fréquence est la même que la fréquence cardiaque."],["li","Les anomalies du pouls artériel :"],["li","Les troubles du rythme cardiaque : la prise du pouls radial peut mettre en évidence une irrégularité du rythme cardiaque ou une anomalie de la fréquence cardiaque : bradycardie ou tachycardie. Cette appréciation peut être faussée au cours de certains troubles du rythme lorsque l'ondée sanguine est trop faible pour arriver jusqu'à l'artère radiale : ainsi, en cas de bigéminisme, de fibrillation auriculaire ou de tachycardie paroxystique, la prise du pouls sous-estime la fréquence cardiaque et doit être associée à l'auscultation cardiaque."],["li","Les modifications de la consistance artérielle :"],["li","artères en tuyau de pipe : sont des artères dures retrouvées en cas d'athérosclérose;"],["li","artères en fil de fer : sont des artères dures de taille réduite, sont retrouvées en cas d'HTA du sujet jeune."],["li","Les modifications de l'amplitude des battements artériels : l'affaiblissement général des pouls : un pouls petit et mou ou microsphygmie se voit dans tous les cas où le débit cardiaque est réduit :"],["li","au cours du rétrécissement aortique et de l'insuffisance cardiaque globale le pouls est petit de manière permanente,"],["li","au cours des lipothymies et des syncopes, le pouls est petit de manière passagère. L'affaiblissement ou disparition des pouls fémoraux avec conservation ou augmentation des pouls radiaux peut se voir dans 2 circonstances :"],["li","chez le sujet jeune, en cas de coarctation de l'aorte,"],["li","chez le sujet âgé, en cas de thrombose de la partie terminale de l'aorte ou des deux artères iliaques. * L'affaiblissement ou disparition élective d'un pouls artériel est dû à une obstruction totale ou sub-totale d'un tronc artériel; il se voit dans l'artérite des membres inférieurs et dans l'embolie artérielle d'un membre. * L'augmentation d'amplitude des pouls artériels ne peut être que généralisée à tout l'arbre artériel puisqu'elle est le reflet de l'activité cardiaque : elle est retrouvée au cours de l'éréthisme cardiaque, l'hyperthyroïdie et surtout au cours de l'insuffisance aortique où il réalise le pouls de Corrigan qui est ample, bondissant et dépressible (il soulève subitement le doigt pour s'affaisser aussitôt). * L'amplitude du pouls peut varier avec les mouvements respiratoires, c'est le pouls paradoxal de Kussmaul où l'amplitude des battements diminue à l'inspiration et augmente à l'expiration, il se voit dans la péricardite à gros épanchement et dans la péricardite constrictive. * Le pouls bigéminé réalise la succession de deux battements rapprochés : l'un fort, correspondant à une systole normale; l'autre faible, correspondant à une extrasystole; il est le signe d'un trouble du rythme, le bigéminisme, dont la cause la plus fréquente est l'intoxication digitalique."],["p","FIG.6. – Palpation du pouls tibial postérieur"],["p","FIG.7. – Recherche des pouls pédieux"],["li","La perception de frémissement ou thrill : un frémissement systolique ou systolodiastolique est retrouvé à la palpation des anévrismes artériels et artério-veineux."],["p","1.3. L'auscultation artérielle : sera faite au mieux avec un stéthoscope à pavillon conique, sans comprimer l'artère."],["p","1.3.1. A l'état normal : les artères sont silencieuses à l'auscultation à condition de ne pas les comprimer."],["p","1.3.2. A l’état pathologique : l'apparition d'un souffle systolique d'éjection, plus rarement systolo-diastolique ou d'un souffle continu est un signe anormal."],["li","Au niveau des artères carotides : dans les gouttières jugulo-carotidiennes un souffle systolique :"],["li","Peut se voir en cas de thrombose de la carotide interne."],["li","Peut être l'irradiation d'un souffle systolique d'éjection d'un rétrécissement aortique."],["li","Au niveau d'un gros tronc artériel :"],["li","Un souffle systolique peut se voir soit en cas d'anévrisme artériel ; soit en cas de rétrécissement artériel d'origine athéromateuse."],["li","Un souffle continu à renforcement systolique disparaissant lors de la pression du doigt peut se voir au cours des anévrismes artério-veineux."],["li","Au niveau d'une artère rénale : souffle systolique unilatéral, latéro-ombilical ou susombilical, en cas de sténose d'une artère rénale, ce souffle sera recherché chez tout hypertendu."],["li","Au niveau de l'artère fémorale, en cas d'insuffisance aortique, on cherchera le double souffle crural de Duroziez, en comprimant l'artère avec le pavillon du stéthoscope, puis en diminuant progressivement la pression, on entend un souffle systolique et un souffle 1.4. La mesure de la tension artérielle (ou pression artérielle) : la pression artérielle est la pression sous laquelle le sang circule à l'intérieur des vaisseaux, elle diminue au fur et à mesure que Ion s'éloigne du cœur. La pression artérielle est habituellement mesurée au niveau de l'artère humérale, elle est exprimée en cm ou en mm de mercure. Elle oscille au cours de la révolution cardiaque entre une valeur maximale ou systolique synchrone de l'arrivée de l'onde systolique et une valeur minimale ou diastolique synchrone du relâchement musculaire ventriculaire. La pression différentielle ou appelée encore couramment différentielle est définie comme l'écart entre la pression maximale et la pression minimale."],["p","1.4.1. Technique de mesure : la pression artérielle se mesure grâce a un sphygmomanométre appelé couramment tensiomètre : il s'agit d'un brassard inextensible recouvrant une chambre pneumatique qui doit être large d'au moins 12 cm et qui est reliée à un manomètre gradué en cm de mercure."],["p","Le brassard est placé au tiers inférieur du bras nu, il doit être bien serré, la poche de caoutchouc étant au contact de la face interne du bras totalement dégonflée, l'aiguille du manomètre doit être sur le zéro."],["p","Le malade est placé au préalable en position couchée confortablement installé en état de résolution musculaire. Les battements artériels sont repérés par la palpation, puis le brassard est gonflé grâce à une poire en caoutchouc jusqu'à une pression de 25 à 30 cm de mercure, suffisante pour que le pouls radial et humerai disparaissent, puis on dégonfle lentement."],["p","La lecture des chiffres tensionnels se fait selon deux méthodes :"],["li","La méthode auscultatoire : le stéthoscope est placé au niveau du pouls humerai."],["li","La pression maxima ou systolique : correspond au moment où l'auscultation de l'artère humérale permet d'entendre le 1er bruit systolique même faible."],["li","La pression moyenne : correspond au moment où les bruits artériels sont au maximum."],["li","La pression minima ou diastolique : correspond au dernier bruit artérieî, elle est parfois difficile à percevoir. La cause d'erreur principale de cette méthode est « le trou auscultatoire », qui consiste en une disparition des bruits artériels dans une zone située juste au-dessous de la maximale"],["p","alors que les battements persistent à la palpation. Le trou auscultatoire peut se rencontrer au cours de l'HTA et du rétrécissement aortique, il peut être évité en gonflant le brassard à une pression suffisamment haute et en dégonflant progressivement et en vérifiant la valeur de la pression maximale par la méthode palpatoire."],["li","La méthode palpatoire :"],["li","La pression maxima : correspond au moment où le pouls réapparaît, elle permet de vérifier les chiffres trouvés par la méthode auscultatoire."],["li","La pression minima : correspond au moment où le doigt perçoit la vibration la plus forte au niveau du pouls huméral ; les chiffres de la minima obtenus par cette méthode sont sousestimés par rapport à ceux obtenus par la méthode auscultatoire."],["p","1.4.2. Résultats :"],["li","Les chiffres normaux de la tension artérielle chez l'adulte varient entre 10 et 15 cm de mercure pour la maxima et 6 à 9 cm de mercure pour la minima. L'écart entre la pression maxima et la pression minima appelé différentielle reste harmonieux chez le sujet normal, il est régi par la relation (formule de Lian) : Mn=Mx + 1 2 La tension artérielle varie en fonction de l'âge ; ainsi les limites supérieures de la pression systolique en fonction de l'âge sont les suivantes :"],["li","Inférieure à 11 pour la 1e décennie."],["li","Inférieure à 12 pour la 2e décennie."],["li","Inférieure à 13 pour la 3e décennie."],["li","Inférieure à 14 pour la 4e décennie."],["li","Inférieure à 15 pour la 5e décennie. La tension artérielle varie également en fonction de la position du sujet, la maxima est plus basse en position debout qu'en position couchée, alors que la minima peut parfois s'élever. Habituellement, les chiffres tensionnels sont identiques au bras gauche et au bras droit, toutefois, une différence de 1 à 2 cm de Hg n'est pas significative."],["li","Les anomalies de la tension artérielle :"],["li","L'hypertension artérielle : est définie selon l'OMS (Organisation Mondiale de la Santé) comme une pression maxima égale ou supérieure à 16cm de Hg et une pression minima égale ou supérieure à 9,5 cm Hg chez l'adulte après 30 ans. Il s'agit d'un symptôme d'une très grande fréquence."],["li","L'hypotension artérielle : est rare; une pression maxima de 10 cm de Hg chez des sujets entre 20 et 40 ans n'est pas pathologique, elle peut se rencontrer surtout chez les sportifs. Seule l'insuffisance surrénale lente peut s'accompagner d'une hypotension permanente. Une hypotension artérielle aiguë, se voit au cours de la syncope et du collapsus cardiovasculaire."],["li","Les anomalies de la différentielle :"],["li","un élargissement de la différentielle est caractéristique de l'insuffisance aortique, cet élargissement est dû à une élévation discrète de la maxima avec surtout baisse importante de la minima (exemple : 15/3);"],["li","un pincement de la différentielle par chute de la maxima se voit essentiellement au cours de l'insuffisance cardiaque grave (exemple : 10/8)."],["h3","2. Les explorations complémentaires de la fonction artérielle"],["p","L'examen clinique des artères pourra être complété par la mesure des oscillations artérielles, l'étude de la débitmétrie ultrasonique par effet Dôppler, et dans des cas particuliers par l'artériographie."],["p","2.1. L'oscillométrie : l'étude des oscillations est faite grâce à l'oscillomètre de Pachon, elle ne sera faite que chez les sujets se plaignant de claudication intermittente, symptôme évocateur d'une artérite des membres inférieurs."],["p","Les oscillations artérielles sont mesurées comparativement aux deux membres inférieurs à trois niveaux : au 1/3 inférieur de la cuisse, au 1/3 supérieur de la jambe et au 1 /3 inférieur de la jambe (fig. 8-1 et 8-2). Il s'agit en fait d'un examen peu précis et peu fiable."],["pre","FIG 8.1. – Courbe d’oscillations               FIG 8.2. – Courbe d’oscillations artérielles\n    artérielles normales                          d’un sujet atteint d’artérite du membre"],["p","inférieur gauche 2.2. La débitmétrie ultrasonique ou « Dôppler » est une méthode non invasive reposant sur la réflexion d'un faisceau d'ultrasons émis en direction d'un vaisseau."],["p","Elle permet d'apprécier la perméabilité d'artères sans pulsations palpables et de mesurer la pression systolique à leur niveau."],["p","Elle permet également de localiser et de préciser l'extension des lésions obstructives et de suivre leur évolution sous traitement."],["p","Elle est utile pour les artères des membres inférieurs, les carotides et les artères vertébrales."],["p","2.3. L'artériographie : qui est l'opacification des artères par un produit de contraste est un examen invasif qui ne sera fait qu'en cas d'obstruction artérielle pour laquelle une indication chirurgicale est discutée."],["h3","3. Les syndromes d'ischémie des membres"],["p","On dit qu'il y a ischémie d'un membre lorsque le flux sanguin artériel au niveau de ce membre n'est pas suffisant pour assurer les besoins métaboliques en toute circonstance. L'ischémie peut être aiguë ou chronique."],["p","3.1. L'ischémie aiguë : réalise une occlusion artérielle brutale par un embole sanguin venant du cœur gauche, il s'agit d'une urgence qui sera reconnue sur les signes suivants :"],["li","Une douleur violente au niveau du membre ischémie."],["li","Une impotence fonctionnelle totale avec troubles neurologiques"],["pre","L'appareil cardio-vasculaire                                                              13 7"],["li","Une pâleur extrême de marbre blanc associée à un refroidissement du membre perçu par le malade et palpé par le médecin."],["li","Une abolition des pouls en aval de l'oblitération."],["li","Une image d'arrêt circulatoire à l'artériographie. En l'absence d'un traitement précoce, l'évolution se fait inexorablement vers la gangrène."],["p","3.2. L'ischémie chronique : réalise une oblitération partielle et progressive d'une artère, c'est l'artérite oblitérante des membres inférieurs. Elle évolue en quatre stades :"],["li","Stade 1 : absence de signes fonctionnels, mais diminution ou abolition d'un ou plusieurs pouls avec diminution des oscillations artérielles du côté atteint."],["li","Stade II ou stade de l'ischémie d'effort : est caractérisé par la claudication intermittente il s'agit d'une douleur à type de crampe sans contracture musculaire qui apparaît à l'effort lors de la marche, surtout si elle est accélérée, qui disparaît lors du repos et qui réapparaît pour le même effort. Cette douleur siège soit à la fesse, soit à la cuisse, soit au mollet. Elle a tendance à s'aggraver avec le temps, apparaissant pour une distance de plus en plus faible : c'est la diminution du périmètre de marche (qui peut être évalué en mètres)."],["li","Stade III ou stade de l'ischémie de repos : est caractérisé par une douleur permanente existant même au repos, exagérée par le décubitus et s'accompagnant de troubles vasomoteurs à type d'érythrocyanose."],["li","Stade IV : c'est le stade de la gangrène qui est la nécrose du segment de membre ischémie; elle évolue en deux phases :"],["li","Phase sèche aseptique : peu douloureuse."],["li","Phase humide : elle s'accompagne d'une infection et les douleurs deviennent très intenses. A ce stade, l'amputation du segment gangrené est indispensable; d'où l'importance du diagnostic précoce d'artérite afin de prévenir l'apparition de la gangrène."],["h2","II. LA SÉMIOLOGIE VEINEUSE"],["p","L'étude de la sémiologie veineuse comprend l'examen des veines jugulaires, l'examen Jes veines des membres inférieurs, la recherche de signes de phlébite, enfin la mesure de la pression veineuse."],["li","1. L'examen des veines s jugulaires : La veine jugulaire externe est superficielle, elle descend sur la face externe du cou en croisant de haut en bas le muscle sterno-cleido-mastoïdien et gagne la partie interne du creux sus-claviculaire. Son aspect reflète les variations de pression de l'oreillette droite."],["p","1.1. Conditions d'examens : le malade est placé en décubitus dorsal horizontal, la tête légèrement soulevée par un petit coussin, la respiration doit être calme, le malade doit être en état de résolution musculaire complète."],["h4","1.2. Résultats"],["p","1.2.1. Pouls veineux normal : la veine jugulaire externe dessine dans les derniers centimètres de son trajet sous-cutané une petite saillie allongée , plus nette à droite qu'à gauche et"],["p","plus visible à l'expiration qu'à l'inspiration ; la veine se gonfle légèrement enfin de diastole : soulèvement présystolique, et elle s'affaisse lors de la systole. Le pouls réalise un mouvement pulsatile doux, diffus, ondulant plus visible que le pouls artériel, mais non palpable."],["p","La compression de la partie proximale de la veine au niveau du creux sus-claviculaire la rend plus saillante, au contraire, la compression de la partie distale provoque son affaissement et sa disparition."],["p","1.2.2. Les pouls veineux pathologiques :"],["li","La distension permanente des jugulaires : dans ce cas la veine jugulaire se distend plutôt lors de l'inspiration profonde ; il s'agit d'un signe retrouvé en cas d'insuffisance ventriculaire droite et dans les péricardites avec épanchement et les péricardites constrictives."],["li","Le reflux hépato-jugulaire : la compression du foie entraîne une augmentation importante de la pression veineuse dans la veine jugulaire droite qui se manifeste par une turgescence prolongée au moins une minute après la cessation de la compression : ce signe traduit également une insuffisance ventriculaire droite."],["li","L'expansion systolique des jugulaires : dans ce cas, la distension veineuse est contemporaine du pouls artériel et de la systole ventriculaire. Il s'agit d'un signe d'insuffisance tricuspidienne fonctionnelle qui s'accompagne le plus souvent d'une expansion systolique du foie."],["li","La dissociation radio-Jugulaire : il s'agit d'un pouls jugulaire indépendant du pouls artériel ; le pouls veineux est soit plus rapide que le pouls artériel ; ce signe est retrouvé au cours du bloc auriculo-ventriculaire du 3e degré et du flutter auriculaire; soit plu s lent que le pouls artériel au cours de la tachycardie ventriculaire."],["h3","2. L'examen des veines des membres inférieurs"],["p","2.1. A l'état normal : les veines des membres inférieurs ne sont pas visibles, sauf au niveau de la malléole interne et du dos du pied."],["p","2.2. Les varices des membres inférieurs : réalisent des dilatations localisées des veines superficielles qui apparaissent sous forme de cordons bleutés de calibre irrégulier dessinant des méandres sous la peau, les varices gonflent sur le sujet debout et disparaissent lors de la surélévation du membre (fig. 9)."],["p","FIG.9 — Varices du membre inférieur apparaissant en position debout, disparaissant quand le membre est surélevé."],["p","2.3. La phlébite des membres inférieurs : c'est l'oblitération d'une veine profonde par un caillot sanguin. Elle sera recherchée systématiquement chez tout sujet alité : postopéré, après l'accouchement et chez tout cardiaque."],["pre","L'appareil cardio-vasculaire                                                              13 9"],["p","Elle évolue en deux phases :"],["p","2.3.1. Phase de début : le malade présente une douleur spontanée au niveau du mollet à type de crampe ou de sensation de lourdeur qui s'accompagne d'une douleur provoquée par la palpation."],["p","La dorsi-flexion du pied entraîne une douleur au niveau du mollet qui limite cette dorsiflexion, c'est le signe de Homans très caractéristique."],["p","Des signes généraux dits signes de pancarte peuvent être retrouvés : ascension thermique et accélération du pouls."],["p","2.3.2. Phase d'état : c'est le stade dephlegmatia alba dolens : le membre est déformé par un œdème avec augmentation de la chaleur locale et hyperesthésie cutanée. Il faut insister sur le risque de complication majeure : l'embolie pulmonaire."],["h3","3. Mesure de la pression veineuse"],["p","3.1. Technique de mesure : la mesure de la pression veineuse périphérique se pratique sur le sujet couché en état de relâchement musculaire complet; elle peut se faire suivant deux méthodes :"],["li","Méthode indirecte : elle est appréciée sur l'état de turgescence de la veine jugulaire qui à l'état normal est peu apparente et limitée, au segment inférieur, sur une longueur de 2 à 4 cm n'atteignant pas le bord postéro-inférieur du relief du muscle sterno-cleido-mastoïdien. Quand la turgescence veineuse atteint le bord antéro-supérieur du relief musculaire, la pression veineuse est augmentée et atteint 15 à 25 cm d'eau, quand la turgescence veineuse atteint l'angle de la mâchoire inférieure, la pression veineuse est entre 25 à 30 cm d'eau. La turgescence des veines jugulaires diminue en positions assise et debout."],["li","Méthode directe (fig. 10) : se fait par ponction d'une veine du bras au pli du coude; elle nécessite une aiguille de calibre 18, un robinet à trois voies, un tube de verre gradué en centimètres dont le zéro est placé au niveau de l'oreillette droite, une seringue de 20 ml contenant du sérum physiologique héparine. On ponctionne la veine, l'aiguille est connectée à la première voie du robinet; le tube de verre dressé verticalement est fixé à la 2e voie et la seringue est adaptée à la 3e voie ; le sérum physiologique qu'elle contient est poussé dans le tube, on ouvre alors la voie livrant passage au sang, le liquide du tube s'écoule jusqu'à un niveau donné qui correspond à 1a pression veineuse. cm H2O"],["p","FIG 10. — Mesure de la pression veineuse périphérique."],["h4","3.2. Résultats"],["p","3.2.1. Normalement : la pression veineuse varie de 3 à 12 cm d'eau. La mesure de la pression veineuse peut se faire en même temps que la compression hépatique."],["p","Cette dernière entraîne à l'état normal, une élévation de 1 à 2 cm de la pression veineuse qui revient rapidement à son niveau de base en moins de 10 secondes."],["p","3.2.2. Les anomalies de la pression veineuse :"],["li","L'hypertension veineuse :"],["li","Généralisée : est certaine quand la pression veineuse est supérieure à 15 cm d'eau. Elle est permanente, elle augmente lors de la compression hépatique de 5 à 10 cm d'eau et de manière durable 15 à 20 secondes ; elle est en rapport avec une cardiopathie droite :"],["li","bloc tricuspide par sténose tricuspide ou tumeur de l'oreillette droite;"],["li","insuffisance ventriculaire droite;"],["li","péricardite avec épanchement et péricardite constrictive."],["li","Localisée aux membres supérieurs : elle s'accompagne d'un œdème de la face et du buste : œdème en pèlerine et d'une circulation veineuse collatérale superficielle, type cave supérieure visible sur la paroi antérieure du thorax et de l'abdomen, le sens du courant sanguin se faisant de haut en bas ; elle est en rapport avec une obstruction de la veine cave supérieure soit par thrombose, soit par compression par une tumeur médiastinale."],["li","Localisée aux membres inférieurs : elle s'accompagne d'œdèmes blancs, bilatéraux et symétriques des membres inférieurs et d'une circulation veineuse collatérale cave inférieure visible sur la paroi abdominale et la paroi antérieure du thorax, le sens du courant sanguin se faisant de bas en haut ; elle est en rapport avec une thrombose de la veine cave inférieure ou avec une compression par une tumeur abdominale ou lombaire."],["li","L'hypotension veineuse : se voit dans deux circonstances : dans les états de choc non cardiogénique (exemple : choc traumatique et choc hémorragique) et au cours des cirrhoses."]]},{"ar":"اضطرابات النظم","fr":"Les troubles du rythme","w":2933,"b":[["p","La fréquence et le rythme sont le plus souvent confondus sous le nom de rythme cardiaque. On appelle trouble du rythme cardiaque toute anomalie de la fréquence ou de la régularité du rythme cardiaque."],["p","Les troubles du rythme ont une traduction clinique, mais leur analyse précise repose sur l'étude de l’enregistrement électrocardiographique."],["h2","I. RAPPEL PHYSIOLOGIQUE DE LA CONDUCTION CARTIAQUE"],["h3","1. L'activation électrique du cœur"],["p","La contraction cardiaque est due au raccourcissement des cellules myocardiaques lorsqu'elles sont excitées."],["li","Pour ce que cette excitation se fasse normalement le cœur dispose :"],["li","D'un centre de commande ou « pace-maker » qui émet automatiquement à intervalles réguliers une onde d'excitation."],["li","D'un système spécialisé : le tissu nodal, qui est un tissu conductif chargé de propager à grande vitesse l'onde d'excitation dans certains secteurs cardiaques."],["li","D'un système régulateur extra-cardiaque : système nerveux sympathique qui accélère la fréquence cardiaque et parasympathique (pneumogastrique) qui ralentit la fréquence cardiaque."],["p","1.1. Le « pace-maker » normal est le nœud sinusal ou nœud de Keith et Flack situé dans la paroi de l'oreillette droite ou voisinage de l'orifice de la veine cave supérieure. La fréquence du nœud sinusal est élevée, elle est de 100 par minute, mais la fréquence cardiaque réelle est plus basse par action constante du pneumogastrique qui réalise le « frein vagal » ramenant le rythme sinusal à 70-75 par minute. La dépolarisation commence au niveau du nœud sinusal et s'étend à l'oreillette droite, puis à l'oreillette gauche. Dans les oreillettes, il n'existe pas de voie de conduction spécifique."],["p","1.2. Le tissu nodal (fig. 1) comprend :"],["p","1.2.1. Le nœud d'Aschoff-Tawara situé dans la partie postéro-inférieure de la cloison interauriculaire, il recueille l'onde d'activation à son pôle supérieur et la conduit jusqu'au faisceau de His."],["p","1.2.2. Le faisceau de His : c'est un pont musculaire reliant les oreillettes et les ventricules, il chemine sur la face droite du septum et se divise en deux branches droite et gauche : la branche droite est longue, la branche gauche se divise en deux branches antérieure et postérieure."],["p","1.2.3. Le réseau de Purkinje : les deux branches du faisceau de His se résolvent en un réseau couvrant l'endocarde des ventricules."],["p","Veine cave supérieure Faisceau de His"],["pre","Nœud de Keith et Flack                        Ventricule gauche"],["p","Nœud de Tawara Oreillette droite"],["pre","BRANCHE DROITE          VENTRICULE DROIT"],["p","FIG. 1. — Le tissu nodal."],["h3","2. L’ECG normal"],["p","Le cheminement de l'onde d'excitation depuis son émission par le nœud sinusal jusqu'à son arrivée aux dernières portions du muscle ventriculaire explique la succession et la morphologie normale des ondes de l'ECG (fig. 2)."],["li","L'onde P : correspond à la dépolarisation des oreillettes, la durée est de 0,08 à 0,10 seconde."],["li","L'espace PR : est mesuré du début de l'onde P au début du complexe QRS, il est fait de l'onde P et du segment iso-électrique qui le suit, il correspond au temps que met le stimulus pour traverser les oreillettes, le nœud d'Aschoff-Tawara et le faisceau de His; il correspond donc à la conduction auriculo-ventriculaire, sa durée normale est de 0,12 à 0,20 seconde."],["li","Le complexe QRS : correspond à la dépolarisation ventriculaire, sa durée normale est de 0,06 à 0,09 seconde. La repolarisation des oreillettes de très faible amplitude est masquée par le complexe QRS."],["li","Le segment ST et l'onde T: le segment ST est un segment iso-électrique qui se termine par l'onde T asymétrique qui correspond à la repolarisation ventriculaire. Le rythme sinusal normal est un rythme régulier, dont la fréquence varie de 60 à 100 par minute. Il existe une onde P avant chaque complexe QRS, l'onde P est positive en D1 et D2, L’espace PR est compris entre 0,12 et 0,20 seconde."],["p","FIG.2. – ECG normal (PR=0.16s, QRS=0.08s)"],["h2","II. MÉTHODES D'ÉTUDE DES TROUBLES DU RYTHME"],["p","Le rythme cardiaque sera étudié par la clinique, l'électrocardiogramme et le réflexe carotidien."],["h3","1. L’étude clinique repose sur"],["p","1.1. L'interrogatoire : recherche d'une part la notion de palpitations et précise leur type, soit à début et fin progressives, soit à début brusque et d'autre part la notion de syncope qui est un signe très évocateur de trouble du rythme."],["p","1.2. L'examen clinique : permet d'apprécier la fréquence cardiaque et de dépister une irrégularité du rythme, mais il ne peut à lui seul permettre d'aboutir à un diagnostic précis."],["h3","2. L'ECG"],["p","Permet lui de faire un diagnostic précis de trouble du rythme en calculant la fréquence cardiaque qui est égale au rapport :"],["pre","______                     300_________                                         _"],["p","Nombre de grands carreaux qui séparent deux complexes QRS (espace R-R) et en analysant l'aspect des ondes P, des complexes QRS et la durée de l'espace P-R."],["h3","3. Le réflexe carotidien"],["p","Est la réponse cardiaque au massage du sinus carotidien qui peut être remplacé par la compression des globes oculaires ; ces deux manœuvres constituent les manœuvres vagales."],["p","3.1. L'arc réflexe se compose (fig. 3) :"],["li","Du sinus carotidien : qui est une dilatation de la carotide primitive en son lieu de bifurcation en carotide externe et interne."],["li","D'une branche afférente qui chemine avec le IX (nerf glosso-pharygien)."],["li","D'un centre bulbaire vaso-moteur et cardio-inhibiteur."],["li","De branches efférentes : le X (nerf pneumogastrique) et les fibres sympathiques."],["p","3.2. Technique de massage du sinus carotidien : le massage du sinus carotidien se fait d'un seul côté pendant un temps court : 5 secondes avec auscultation cardiaque et enregistrement électrocardiographique."],["p","Fibre afférente (IX)"],["p","Fibre efférente excitée (X)"],["p","Fibre sympathique efférente inhibée"],["p","Nœud sinusal"],["p","FIG 3. – Le réflexe carotidien"],["h4","3.3. Résultats"],["p","3.3.1. A l’état normal : le massage du sinus carotidien entraîne le réflexe carotidien qui a pour effet :"],["li","Un ralentissement de la fréquence cardiaque par stimulation vagale qui ralentit la fréquence du nœud sinusal, la diminution de la fréquence est de 6 pulsations par minute."],["li","Un allongement du temps de conduction sino-auriculaire et auriculo-ventriculaire avec allongement de l'espace PR."],["li","Une diminution de la force de contraction des oreillettes."],["li","Une diminution de la tension artérielle (1 cm de Hg) par freination des fibres sympathiques."],["li","Il n'agit pas sur l'activité électrique des ventricules."],["p","3.3.2. A l'état pathologique : au cours des troubles du rythme, l'étude de l'effet du massage sino-carotidien est d'un grand apport et sera envisagé pour chacun des troubles du rythme."],["h2","III. LES DIFFÉRENTS TROUBLES DU RYTHME"],["p","Le rythme cardiaque dépend d'une part de la localisation et de la fréquence des excitations du pace-maker et d'autre part de la manière dont se propage l'excitation émise par le pacemaker."],["p","Ainsi, les troubles du rythme ou arythmies seront classés en :"],["li","Troubles de l'excitabilité : où le pace-maker est soit sinusal : tachycardie ou bradycardie sinusale, soit ectopique : auriculaire extra-sinusal : réalisant les rythmes auriculaires, jonctionnel réalisant les rythmes jonctionnels, ou ventriculaire : réalisant les rythmes ventri-culaires."],["li","Troubles de la conduction : où le pace-maker est normal, mais où la conduction auriculo-ventriculaire de l'excitation est anormale, ralentie ou bloquée : ce sont les blocs auriculo-ventriculaires."],["h3","1. Les troubles de l'excitabilité"],["h4","1.1. Les anomalies du rythme sinusal"],["p","1.1.1. La tachycardie sinusale : réalise un rythme sinusal dont la fréquence est comprise entre 100 et 150 par minute."],["p","C'est une tachycardie régulière qui s'accélère à l'effort et lors des émotions. L'ECG est normal, seule la fréquence est accélérée, cette accélération se fait aux dépens de l'intervalle diastolique. L'effet du massage sino-carotidien : il entraîne une diminution progressive de la fréquence avec retour au statut antérieur progressif."],["p","L'intensité de Bi est variable suivant la cause : intensité forte en cas d'hyperthyroïdie et d'anémie, diminue en cas de choc ou de collapsus."],["p","1.1.2. La brachycardie sinusale : il s'agit d'un rythme sinusal dont la fréquence est comprise entre 40 et 60 par minute."],["p","Elle possède les mêmes caractères que la tachycardie sinusale. Elle se voit chez les sportifs et les sujets vagotoniques : elle n'est pas pathologique."],["p","1.1.3. L'arythmie sinusale : est caractérisée par une irrégularité des battements cardiaques. L'ECG est de morphologie normale, mais les complexes sont irrégulièrement espacés, il existe une accélération du rythme à l'inspiration et un ralentissement lors de l'expiration."],["p","Elle survient souvent chez l'enfant, elle n'est pas pathologique."],["p","1.2. Les extrasystoles : une extra-systole est une contraction cardiaque prématurée qui naît à partir d'un foyer ectopique extra-sinusal dont le siège peut se trouver en un point quelconque du myocarde au niveau de l'oreillette : extra-systole auriculaire, ou au niveau du ventricule : extra-systole ventriculaire."],["p","C'est le plus fréquent des troubles du rythme."],["p","1.2.1. Caractères cliniques : l'extra-systole peut être perçue par le malade sous forme de palpitations."],["p","A l'examen clinique les extra-systoles peuvent être entendues à l'auscultation sous forme d'un battement prématuré suivi d'une pause plus longue qu'entre deux battements normaux."],["p","Seul l’ECG permet de les identifier avec certitude."],["p","1.2.2. Caractères ECG :"],["li","L'extra-systole auriculaire: comporte une onde P prématurée de morphologie anormale suivie d'un complexe QRS de morphologie normale et d'un intervalle P-P plus long que l'intervalle entre deux ondes P sinusales correspondant au repos post-extra-systolique (fig. 4). Elle se voit le plus souvent sur cœur normal."],["li","L'extra-systole ventriculaire : comporte un complexe QRS prématuré de morphologie anormale et large, non précédé d'une onde P, suivi d'une onde T de morphologie anormale et de sens opposé au complexe QRS. Le repos qui suit l'extra-systole ventriculaire est compensateur, c'est-à-dire que la longueur de deux cycles comportant l'extra-systole ventriculaire est égale à la longueur de deux cycles normaux (fig. 5). L'extra-systole ventriculaire peut être :"],["li","Soit isolée : elle apparaît le plus souvent sur cœur sain."],["li","Soit régulière : réalisant le bigéminisme (fîg. 6) qui est la succession régulière d'un complexe QRS normal et d'une extra-systole ventriculaire ; ou plus rarement le trigéminisme (fig. 7) qui est la succession régulière de deux complexes QRS normaux et d'une extra-systole ventriculaire. Le bigéminisme est le signe d'une intoxication digitalique ou d'un trouble métabolique : hypokaliémie."],["h4","1.3. Les rythmes auriculaires"],["p","1.3.1. Le flutter auriculaire : est un trouble du rythme rare. C'est un rythme ectopique d'origine auriculaire extra-sinusale, qui se traduit par des contractions régulières et coordonnées des oreillettes à une fréquence de 300 par minute ; les ventricules ne se contractent qu'une fois sur 2 ou sur 3, car il existe un bloc fonctionnel."],["li","Caractères cliniques : il s'agit d'un trouble du rythme, le plus souvent paroxystique, il peut être reconnu sur la dissociation radio-jugulaire : les battements jugulaires sous la dépendance des oreillettes sont plus rapides que le pouls radial sous la dépendance des ventricules."],["p","II s'agit d'une tachycardie régulière."],["li","Caractères ECG (fig. 8) :"],["li","Les complexes auriculaires sont réguliers, morphologiquement anormaux : onde F de flutter avec aspect en dent de scie, fréquence 300 par minute."],["li","II existe un bloc auriculo-ventriculaire de type 2/1 le plus souvent, parfois de type 3/1 ce qui aboutit à une fréquence ventriculaire, soit de 150 soit de 100 par minute."],["li","Les complexes QRS-T sont normaux."],["li","Le massage sino-carotidien accentue le bloc auriculo-ventriculaire mais ne fait pas céder le flutter."],["li","Circonstances étiologiques : les maladies de la valve mitrale surtout le rétrécisse ment mitral, l'hyperthyroïdie et l'athérosclérose."],["p","1.3.2. La fibrillation auriculaire : est un trouble du rythme fréquent. Elle réalise un état anarchique d'excitation du myocarde des oreillettes aboutissant à des contractions vermiculaires dispersées et inefficaces des oreillettes; les ventricules ne répondant qu'à quelques stimulations auriculaires ce qui aboutit à un rythme irrégulier à type de tachyarythmie le plus souvent."],["li","Caractères cliniques : il s'agit d'un trouble du rythme le plus souvent permanent. Le pouls est irrégulier, rapide, de fréquence inférieure à la fréquence cardiaque; l'intensité de Bi est variable."],["li","Caractères ECG (fig. 9) :"],["li","Les complexes auriculaires sont irréguliers, de morphologie anormale : ondes f de fréquence 400 à 600 par minute, donnant à la ligne iso-électrique un aspect de trémulation."],["li","II existe un bloc auriculo-ventriculaire variable qui aboutit à des complexes QRS inéquidistants souvent rapides 100 à 150 par minute réalisant la tachyarythmie."],["li","Les complexes QRS - T sont morphologiquement normaux mais inéquidistants."],["li","Le massage sino-carotidien est sans effet ou ralentit le rythme ventriculaire par accentuation du bloc, mais il ne fait pas céder la fibrillation."],["li","Circonstances étiologiques : maladie de la valve mitrale surtout RM, hyperthyroïdie, HTA, insuffisance coronarienne, parfois sans étiologie décelable."],["p","1.4. Les rythmes jonctionnels : il s'agit des troubles du rythme où le pace-maker est situé dans le nœud d'Aschoff-Tawara ou dans le tronc du faisceau de His au-dessus de sa division."],["p","Nous n'étudierons que la tachycardie jonctionnelle paroxystique ou Maladie de Bouveret : il s'agit d'une tachycardie paroxystique régulière dont la fréquence varie entre 150 à 250 par minute."],["li","Caractères cliniques : il s'agit d'une crise paroxystique qui débute brusquement le plus souvent sans prodromes, le malade ressent une sorte de déclic. Cette crise de tachycardie est le plus souvent bien supportée : les signes fonctionnels sont discrets : palpitations, un peu d'angoisse; plus rarement elle est mal supportée. La durée de la crise est variable : quelques minutes, quelques heures ou plusieurs jours. La fin de la crise est également brusque, elle est souvent accompagnée d'une polyurie claire."],["li","Caractères ECG (fig. 10) :"],["li","La tachycardie est régulière entre 150 et 250."],["li","Les complexes QRS sont fins de morphologie normale."],["li","Les rapports de P et de QRS varient suivant le siège du stimulus, l'onde P est devant s'il s'agit d'un rythme nodal supérieur :"],["li","l'onde P est cachée par QRS si rythme nodal moyen;"],["li","l'onde P est derrière s'il s'agit d'un rythme nodal inférieur."],["pre","FIG.11. – Tachycardie ventriculaire   FIG.12. – Fibrillation ventriculaire"],["p","L’effet du massage carotidien : il est soit sans effet , soit interrompt brusquement la tachycardie : c’est la loi de tout ou rien."],["li","Circonstances étiologiques : se voit surtout chez des sujets à cœur sain avec un profil psychologique particulier : dystonie neuro-végétative, nervosité ; parfois peut se voir sur cœur pathologique."],["p","1.5. Les rythmes ventriculaires : il s'agit de troubles du rythme où le pace-maker est situe dans les branches de division du faisceau de His ou dans le myocarde ventriculaire."],["p","1.5.1. La tachycardie ventriculaire : elle est réalisée par la succession rapide de complexes QRS qui ont la morphologie d'extra-systoles ventriculaires"],["li","Caractères cliniques : il s'agit d'une tachycardie mal tolérée, elle entraîne une hypotension artérielle, des précordialgies, parfois une insuffisance cardiaque"],["li","L'examen clinique montre :"],["li","Une dissociation radio-jugulaire : les pulsations jugulaires d'origine auriculaire battent entre 60 et 100 par minute, les pulsations radiales synchrones des battements ventriculaires sont plus rapides."],["li","Un affaiblissement des bruits cardiaques."],["li","Caractères ECG (fig. 11) :"],["li","C'est la succession à une fréquence rapide 150 à 220 par minute de complexe QRS élargis (supérieur à 0,12 s) et déformés évoquant la morphologie d'une extra systole ventriculaire."],["li","On doit identifier une activité auriculaire indépendante et régulière."],["li","Ce qui permet d'affirmer la TV, c'est l'existence de « complexe de fusion » qui réalisent un complexe intermédiaire entre le complexe fin et l'extra-systole ventriculaire."],["li","Le massage sino-carotidien est sans effet."],["li","Circonstances étiologiques :"],["li","Insuffisance coronarienne."],["li","Cardiomyopathie."],["li","Intoxication digitalique."],["li","Cœur sain exceptionnellement."],["p","1.5.2. La fibrillation ventriculaire : le rythme cardiaque normal est remplacé par une contraction anarchique désordonnée, désynchronisée des fibres du myocarde ventriculaire. A l’ECG : on constate une trémulation de la ligne iso-électrique (fig. 12). La FV correspond à un arrêt cardiaque, car il n'y a plus de contraction efficace des ventricules."],["li","Circonstances étiologiques :"],["li","Insuffisance coronarienne."],["li","Cardiopathies décompensées."],["h3","2. Les troubles de la conduction"],["p","Sont en rapport avec une anomalie de la conduction auriculo-ventriculaire au niveau du faisceau de His, soit à type de ralentissement : Bloc AV partiel, soit à type de blocage complet : Bloc AV complet; un rythme de remplacement sous-jacent dit idio-ventriculaire se développe spontanément."],["p","Suivant l'importance du trouble de la conduction, on distingue :"],["p","2.1. Le bloc du 1er degré : ralentissement de la conduction dans le faisceau de His qui se traduit à l'ECG par un allongement de l'espace PR supérieur à 0,20s (fig. 13)."],["p","2.2. Le bloc du 2e degré : où il y a blocage de certaines ondes P :"],["li","Type I: période de Luciani-Wenckebach (fig. 14): allongement progressif de l'espace P-R jusqu'au blocage d'une onde P, puis reprise d'un autre cycle, d'où irrégularité du rythme mais sans bradycardie."],["li","Type II : les espaces PR restent fixes et normaux, on assiste au blocage d'une onde P, ce blocage peut être de type 2/1:1 seule contraction ventriculaire pour deux ondes P : d'où bradycardie importante. Les blocs de haut degré sont de type 3/1 ou de type 4/1 : où il existe plus d'ondes P bloquées que d'ondes P normales."],["p","FIG.15. – Bloc auriculo-ventriculaire complet :"],["li","fréquence auriculaire sinusale = 70/mn"],["li","fréquence ventriculaire = 32/mn"],["p","2.3. Le bloc du 3e degré : c'est un bloc A-V complet : il n'y a une dissociation complète entre les activités auriculaires et ventriculaires."],["li","Aspects cliniques :"],["li","Fréquence cardiaque : inférieure à 40 par minute."],["li","Eclat intermittent de B1 : bruit de canon, lorsqu'il y a coïncidence entre la contraction auriculaire et la fermeture des valves A-V."],["li","Perception d'un B4 qui correspond aux contractions auriculaires dans les longues diastoles réalisant la systole en écho."],["li","Souffle systolique éjectionnel dû à une augmentation du débit systolique."],["li","Une dissociation radio-jugulaire : il existe plus de battements jugulaires que de battements artériels."],["li","La complication majeure est la syncope de Stokes-Adams à l'emporte-pièce, elle correspond :"],["li","soit à une bradycardie excessive;"],["li","soit à un arrêt cardiaque."],["li","Aspect ECG (fig. 15) : l'activité auriculaire est de fréquence normale : 70 à 80 par minute, elle est sinusale le plus souvent."],["p","L'activité ventriculaire est un rythme passif idio-ventriculaire 20 à 40 par minute, la morphologie des complexes QRS-T est variable et dépend du siège du pace-maker. Le massage du sinus carotidien est sans effet."],["li","Circonstances étiologiques :"],["li","Congénitales."],["li","Inflammatoire : RAA."],["li","Traumatique : chirurgie cardiaque."],["li","Toxique : intoxication digitalique - quinidine - bêta-bloquants."]]},{"ar":"الدراسة التركيبية: الصمامات والخلقية والتامور والقصور","fr":"Étude synthétique cardio-vasculaire","w":2496,"b":[["p","Cette étude consiste à regrouper pour chacune des principales cardiopathies les signes fonctionnels et physiques qui ont été énoncés lors de l'étude analytique."],["h2","I. LES PRINCIPALES VALVULOPATHIES"],["p","Les valvulopathies réalisent des maladies des valves cardiaques qui peuvent être soit à type de rétrécissement, soit à type d'insuffisance :"],["li","Il s'agit le plus souvent de maladies acquises d'origine rhumatismale :"],["li","Soit atteinte des valves auriculo-ventriculaires mitrales : rétrécissement mitral (RM) et insuffisance mitrale (IM)."],["li","Soit atteinte des valves sigmoïdes aortiques : rétrécissement aortique (RA) et insuffisance aortique (IA)."],["li","Plus rarement d'origine congénitale : atteinte des valves sigmoïdes pulmonaires : rétrécissement pulmonaire (RP)."],["h3","1. Le rétrécissement mitral"],["p","Le rétrécissement de l'orifice mitral par anomalie des valves mitrales entraîne un obstacle au remplissage du ventricule gauche d'où augmentation des pressions en amont au niveau de l'oreillette gauche et des capillaires pulmonaires; ce qui explique que les symptômes fonctionnels qui seront au premier plan sont d'ordre pulmonaire."],["p","1.1. Les signes fonctionnels évocateurs sont :"],["li","La dyspnée d'effort."],["li","Les crises d'œdème aigu du poumon."],["li","Les hémoptysies."],["p","1.2. Les signes physiques : sont mis en évidence par l'examen clinique du cœur, le malade étant placé en décubitus dorsal et surtout en décubitus latéral gauche. Ces signes sont retrouvés au niveau du foyer mitral, c'est-à-dire au niveau de la pointe du cœur."],["p","1.2.1. A la palpation : le frémissement cataire de temps diastolique."],["p","1.2.2. A l’auscultation :"],["li","Le claquement d'ouverture de la mitrale (COM) : bruit protodiastolique, claqué, sec, survenant après B2."],["li","Le roulement diastolique : qui débute après le claquement d'ouverture de la mitrale et qui comporte deux renforcements : le premier proto-diastolique (correspondant à la période de remplissage rapide du ventricule), il est d'emblée maximal et va decrescendo ; un deuxième renforcement présystolique (qui correspond à la contraction auriculaire) et qui disparaît en cas de fibrillation auriculaire. Ce roulement est mieux entendu après l'effort et en expiration forcée."],["li","L'éclat de B1 : à tonalité élevée La triade : COM, roulement diastolique, éclat de B1, réalise le rythme de Duroziez."],["p","1.3. Les signes radiologiques (fig. 1) : se résument à des signes d'hypertrophie dilatation de l'oreillette gauche visible sur la radiographie de face et en OAD."],["li","Radiographie de face : saillie convexe de l'arc moyen gauche à sa partie inférieure et aspect de double contour de l'arc inférieur droit."],["li","OAD : saillie convexe refoulant l'œsophage en arrière."],["h4","1.4. Les signes électriques et phonocardiographiques (fig. 2)"],["p","1.4.1. Les signes électriques : hypertrophie auriculaire gauche : onde P bifide."],["p","1.4.2. Les signes phonocardiographiques : le phonocardiogramme sera enregistré en même temps que l’ECG :"],["li","Il met en évidence les éléments du rythme de Duroziez : le COM, le roulement diastolique avec ses 2 composantes et l'éclat de B1"],["li","Il permet d'apprécier l'intervalle Q-B1 normalement inférieur à 0,07 seconde dont l'allongement est proportionnel au degré de la sténose."],["p","Saillie de l’arc moyen"],["p","OG"],["pre","Face                                        OAD"],["p","FIG. I. — Aspects radiologiques du rétrécissement mitral."],["p","Renforcement pré systolique PCG Roulement diastolique ECG"],["p","FIG. 2. — Aspect électrique et phonocardiographique du RM"],["h3","2. L'insuffisance mitrale"],["p","L'incontinence des valves mitrales entraîne une régurgitation du sang du ventricule gauche vers l'oreillette gauche lors de la systole."],["p","2.1. Les signes fonctionnels : sont discrets ; la dyspnée d'effort est en règle d'apparition tardive."],["p","2.2. Les signes physiques : sont retrouvés à la pointe sur le sujet en décubitus dorsal."],["p","2.2.1. A la palpation : un frémissement systolique est rarement retrouvé; il correspond à un souffle systolique intense."],["p","2.2.2. A l'auscultation, un souffle systolique de régurgitation qui présente les caractères suivants :"],["li","Temps : holosystolique."],["li","Siège : pointe."],["li","Irradiations : aisselle gauche et dos."],["li","Timbre : rude et sec, en jet de vapeur."],["li","Intensité variable. Il est mieux entendu après effort et en expiration forcée."],["p","2.3. Les signes radiologiques (fig. 3) : associent des signes d'hypertrophie, dilatation de l'oreillette gauche et du ventricule gauche."],["li","Radiographie de face : l'hypertrophie de l'oreillette gauche se manifeste par une saillie de l'arc moyen gauche, celle du, ventricule gauche par une saillie de l'arc inférieur gauche."],["li","OAD : saillie convexe de l'oreillette gauche refoulant l'œsophage en arriére."],["h4","2.4. Les signes électriques et phonocardiographiques (fig. 4)"],["p","2.4.1. Les signes électriques : hypertrophie auriculaire gauche associée plus tard à des signes d'insuffisance ventriculaire gauche de type diastolique (ondes Q-R et T de forte amplitude en V5-V6)."],["p","OG"],["pre","Face                                   OAD"],["p","FIG.3. – Aspects radiologiques de l’insuffisance mitrale"],["pre","B1     B2"],["p","PCG"],["p","ECG"],["p","FIG.4. – Aspects électrique et phonocardiographique de l’IM"],["p","2.4.2. Les signes phonocardiographiques : le phonocardiogramme met en évidence l'aspect rectangulaire du souffle systolique de régurgitation."],["h3","3. Le rétrécissement aortique"],["p","Le rétrécissement de l'orifice aortique par remaniement des valves sigmoïdes va entraîner un obstacle à l'éjection du sang du ventricule gauche vers l'aorte, lors de la systole d'où diminution du débit sanguin aortique. Ceci explique que les signes fonctionnels majeurs sont des signes d'ischémie apparaissant à l'effort."],["p","3.1. Les signes fonctionnels :"],["li","Angine de poitrine d'effort (par ischémie coronarienne)."],["li","Syncope d'effort (par ischémie cérébrale)."],["h4","3.2. Les signes physiques"],["p","3.2.1. Les signes cardiaques : seront recherchés au niveau du foyer aortique (2e espace intercostal droit) sur le malade assis penché en avant et en expiration forcée."],["li","A la palpation : un frémissement systolique est fréquemment retrouvé."],["li","A l'auscultation : un souffle systolique d'éjection qui présente lés caractères suivants :"],["li","Temps : mésosystolique."],["li","Siège : 2e espace intercostal droit et foyer d'Erb."],["li","Irradiations : vers la tête des clavicules et les artères carotides et vers la pointe du cœur"],["li","Timbre : grave et râpeux."],["li","Intensité : forte."],["li","Il est associé à une diminution de l'intensité de B2."],["p","3.2.2. Les signes périphériques : le pouls est petit, de faible amplitude, et la tension artérielle est basse."],["p","3.3. Les signes radiologiques (fig. 5) associent des signes de dilatation de l'aorte ascendante et des signes d'hypertrophie du ventricule gauche."],["li","Radiographie de face :"],["li","Saillie de l'arc supérieur droit, traduisant la dilatation de l'aorte ascendante."],["li","Arc inférieur gauche allongé et fortement convexe traduisant l'hypertrophie ventriculaire gauche."],["li","OAG : le contour postérieur atteint ou déborde l'ombre du rachis traduisant l'hypertrophie ventriculaire gauche."],["h4","3.4. Les signes électriques et phonocardiographiques (fig. 6)"],["p","3.4.1. Les signes électriques : l'ECG met en évidence des signes d'hypertrophie ventriculaire gauche de type systolique (disparition de l'onde Q et onde T négative en V5-V6)."],["p","3.4.2. Les signes phonocardiographiques : le phonocardiogramme met en évidence l'aspect losangique du souffle systolique d'éjection et le clic systolique d'éjection survenant après B1 et précédant immédiatement le début du souffle."],["p","Aorte ascendante"],["p","OAG FIG.5. – Aspects radiologiques du rétrécissement aortique"],["p","PCG"],["p","ECG"],["p","FIG.6. – Aspects électriques et phonocardiographiques du rétrécissement aortique"],["pre","FIG.7. – Aspect radiologique de              FIG.8. – Aspect électrique et phonocardiographique\n        L’insuffisance aortique                       de l’insuffisance aortique"],["p","L'incontinence des valves sigmoïdes aortiques entraîne une régurgitation du sang de l'aorte vers le ventricule gauche lors de la diastole d'où diminution de la pression artérielle diastolique et surcharge diastolique du ventricule gauche."],["p","4.1. Les signes fonctionnels : sont longtemps discrets, ils se résument à des palpitations et parfois à une sensation d'hyperpulsation artérielle."],["h4","4.2. Les signes physiques"],["p","4.2.1. Les signes cardiaques : sont recherchés au niveau du foyer aortique sur le malade assis, penché en avant et en expiration forcée."],["li","A la palpation : au niveau de la pointe, le choc de pointe est anormal, il réalise le choc en dôme de Bard ample et globuleux."],["li","A l'auscultation : un souffle diastolique de régurgitation qui présente les caractères suivants :"],["li","Temps : holodiastolique."],["li","Siège : 2e espace intercostal droit et foyer d'Erb."],["p","TABLEAU RÉCAPITULATIF DES SOUFFLES"],["pre","Sanffks                   Type              Temps             Siège         Irradiations     Timbre        Intensité   Phono"],["p","Tête des"],["pre","RA*            Ejection      Méso systolique       2e EICD       calvicules       Grave         Forte       Losange\n                                                                  carotides       râpeux"],["p","pointe"],["pre","RP*            Ejection      Méso-systolique       2E EICG    Sus-clavicul          Grave       Forte       Losange\n                                                              gauche                 râpeux\nIM             Régurgitation Holo-systolique       Pointe        Aisselle           Rude        Variable    Rectangle\n                                                                 dos            jet de vapeur"],["pre","CIV            Régurgitation Holo-systoliquc       4e EICD    Rayons de roue                    Forte
