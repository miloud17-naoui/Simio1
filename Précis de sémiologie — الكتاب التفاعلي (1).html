ans les atteintes bilatérales."],["p","5.1.2. Les hémiplégies : Définition : l'hémiplégie est une paralysie d'un hémicorps, elle est due à une atteinte d'un seul faisceau pyramidal."],["p","_ Etude sémiologique : les hémiplégies sont de plusieurs types : Suivant leur ancienneté on distingue : a) L'hémiplégie flasque : qui est observée à la phase initiale d'une lésion aiguë du faisceau pyramidal."],["li","Elle est facile à reconnaître chez le malade conscient, elle associe :"],["li","Une paralysie flasque d'un hémicorps prédominant sur les extenseurs et les supinateurs au membre supérieur et sur les raccourcisseurs et les abducteurs au membre inférieur."],["li","Une hypotonie."],["li","Une diminution ou une abolition des réflexes ostéo-tendineux."],["li","Un signe de Babinski unilatéral et une abolition des réflexes cutanés abdominaux et crémastériens."],["li","Une paralysie faciale de type central."],["li","Elle est plus difficile à reconnaître chez le malade dans le coma."],["li","Au niveau de la face, on observe :"],["li","une déviation conjuguée de la tête et des yeux (le malade regarde sa lésion cérébrale et se détourne de son hémiplégie);"],["li","une hypotonie de la face du côté paralysé : « le malade fume la pipe » (soulèvement expiratoire de la joue);"],["li","un signe de Pierre Marie et Foix : la compression du nerf facial en arrière de la branche montante du maxillaire inférieur entraîne une grimace du côté sain."],["li","Au niveau des membres, on retrouve une hypotonie des membres plus marquée du côté de l'hémiplégie avec :"],["li","une chute plus rapide et plus lourde des membres du côté paralysé;"],["li","un signe de Raimiste : l'avant-bras étant placé verticalement, la main retombe plus rapidement et plus complètement du côté atteint."],["li","Un signe de Babinski unilatéral."],["li","Les réflexes ostéo-tendineux sont diminués ou abolis. b) L'hémiplégie spasmodique : au bout de quelques semaines, l'hémiplégie passe à la spasmodicité. Elle est caractérisée par une hypertonie de type pyramidale. Le malade marche en fauchant."],["li","Suivant la topographie de la lésion, on distingue : a) L'hémiplégie corticale : elle est partielle, non proportionnelle et incomplète. La lésion siège au niveau du cortex où le faisceau pyramidal est étalé et il ne sera donc atteint qu'en partie : soit atteinte faciale ou brachio-faciale, soit atteinte crurale. Elle est associée à des troubles de la sensibilité profonde avec astéréognosie et à une épilepsie Bravais-Jacksonienne : tous ces signes siègent du côté opposé à la lésion. Lorsque l'hémiplégie est droite, une aphasie est souvent retrouvée."],["p","b) L’hémiplégie capsulaire : elle est totale : proportionnelle et complète. La lésion siège au niveau de la capsule interne, le faisceau pyramidal est donc atteint dans sa totalité."],["p","L'hémiplégie est pure : il n'y a pas de troubles sensitifs associés; elle siège du côté opposé à la lésion."],["p","c) L'hémiplégie capsulo-thalamique : réalise le syndrome de Dejerine-Roussy qui associe :"],["li","Une hémiparésie."],["li","Des troubles visuels à type d'hémianopsie latérale homonyme."],["li","Des troubles sensitifs : troubles de la sensibilité profonde et de la sensibilité thermoalgésique, et troubles sensitifs subjectifs à type d'hyperpathie (perception douloureuse de tous les stimulus). Tous ces signes sont retrouvés du côté opposé de la lésion."],["p","d) Les hémiplégies dues à une atteinte du tronc cérébral réalisent un syndrome alterne qui associe : une hémiplégie du côté opposé à la lésion et une paralysie d'un ou plusieurs nerfs crâniens de type périphérique du côté de la lésion."],["li","Hémiplégie pédonculaire : réalise le syndrome de Weber : paralysie du III du côté de la lésion et hémiplégie controlatérale."],["li","Hémiplégie protubérantielle : réalise le syndrome de Millard-Gubîcr : paralysie du VII de type périphérique avec ou sans paralysie du VI du côté de la lésion et hémiplégie controlatérale."],["li","Hémiplégie bulbaire : paralysie du XII et paralysie du noyau ambigu (IX-X-XI) du côté de la lésion et hémiplégie controlatérale. Une forme particulière, c'est le syndrome de Wallenberg ou syndrome latéral du bulbe qui associe une anesthésie dans le territoire du V du côté de la lésion et une hémiparésie avec hémianesthésie thermo-algésique du tronc et des membres du côté opposé à la lésion."],["p","e) L'hémiplégie spinale : réalise le syndrome de Brown Séquard."],["li","Une paralysie de la motricité volontaire avec troubles de la sensibilité proprioceptive du côté de la lésion."],["li","Des troubles de la sensibilité thermo-algésique du côté opposé à la lésion."],["h4","5.1.3. Les paraplégies"],["p","Définition : la paraplégie est une paralysie des deux membres inférieurs due à l'atteinte bilatérale des faisceaux pyramidaux par lésion médullaire siégeant au-dessous du renfle ment cervical."],["p","Une lésion médullaire siégeant au-dessus du renflement cervical donnera une quadriplégie."],["p","_ Etude sémiologique : suivant leur mode d'installation et leur évolution, on distingue : a) La paraplégie flasque : elle se voit au stade initial des lésions médullaires aiguës (section médullaire traumatique); elle associe :"],["li","Une perte complète de la motricité des membres inférieurs."],["li","Une hypotonie."],["li","Une abolition des réflexes ostéo-tendineux."],["li","Un signe de Babinski bilatéral (qui permet de la différencier d'une atteinte du neurone moteur périphérique)."],["li","Des troubles sensitifs à tous les modes dont la limite supérieure permet de faire le diagnostic topographique de la lésion."],["li","Des troubles sphinctériens. b) La paraplégie spasmodique : elle peut soit succéder à une paraplégie flasque; soit s'observer d'emblée au cours des lésions chroniques essentiellement au cours des compressions médullaires; elle associe :"],["li","Une paralysie prédominant sur les raccourcisseurs et les abducteurs. Au stade de début, la paralysie peut être fruste et réaliser le tableau de la claudication intermittente spinale qui est une fatigabilité à la marche : au bout d'une certaine distance le malade est obligé de s'arrêter, après un repos la marche peut être reprise, il est à noter que cette fatigabilité ne s'accompagne pas de douleur ce qui permet de la différencier de la claudication intermittente d'origine artérielle."],["li","Une hypertonie de type pyramidal prédominant sur les extenseurs et les adducteurs."],["li","L'association de la paralysie et de l'hypertonie va être responsable, lorsque celle-ci est possible, de la démarche particulière sautillante, de gallinacé."],["li","Une hyper-réflectivité ostéo-tendineuse."],["li","Un signe de Babinski bilatéral."],["li","Des troubles sensitifs à tous les modes."],["li","Des troubles sphinctériens. c) La paraplégie en flexion : peut succéder à une paraplégie spasmodique en extension, elle se voit dans les lésions médullaires graves ; elle est caractérisée par une perte de la motricité des membres inférieurs qui sont fixés en triple retrait. Les réflexes ostéo-tendineux sont abolis. Le signe de Babinski est bilatéral."],["p","5.2. Les paralysies de type périphérique : sont en rapport avec une atteinte du motoneurone périphérique : corne antérieure de la moelle, racines rachidiennes, plexus ou nerfs moteurs."],["p","5.2.1. Caractères communs : Troubles moteurs :"],["li","Paralysie flasque avec hypotonie."],["li","Abolition des réflexes ostéo-tendineux dans le territoire paralysé."],["li","Amyotrophie souvent associée à des fasciculations."],["pre","—     Troubles vasomoteurs : cyanose, refroidissement et troubles sudoraux."],["p","Troubles sensitifs :"],["li","Subjectifs à type de douleurs ou de paresthésies."],["li","Objectifs : anesthésie complète portant sur tous les modes de sensibilité."],["p","5.2.2. Le syndrome de la corne antérieure réalise :"],["li","Une paralysie flasque asymétrique intéressant surtout les muscles proximaux : deltoïde au membre supérieur, quadriceps au membre inférieur."],["li","Une atrophie musculaire."],["li","Des troubles vasomoteurs importants."],["li","Une absence de troubles sensitifs objectifs. La valeur sémiologique du syndrome de la corne antérieure est la poliomyélite antérieure aiguë."],["p","5.2.3. Les syndromes radiculaires : Caractères généraux :"],["li","Les troubles sensitifs : sont très importants, dominés par les troubles sensitifs subjectifs à type de douleur dont le trajet est caractéristique, qui est provoquée ou augmentée par la toux, la défécation (manœuvres qui augmentent la pression dans le liquide céphalo-rachidien) et les manœuvres d'élongation de la racine par exemple la manœuvre de Lasègue en cas de sciatique. Les troubles sensitifs objectifs sont absents."],["li","Les troubles moteurs : sont discrets à type de parésie, car chaque muscle est innervé par plusieurs racines sauf les muscles caractéristiques de Shliack."],["li","Aux membres supérieurs : le deltoïde (C5), le biceps (C6), le triceps et l’éminence thénar (C7), l’éminence hypothénar (C8)."],["li","Aux membres inférieurs : le quadriceps (L3), le jambier antérieur (L4), l'extenseur propre du gros orteil (L5), le péronier (SI)."],["li","Les troubles des réflexes ostéo-tendineux correspondant à la racine atteinte. Les différents syndromes radiculaires :"],["li","Le syndrome mono-radiculaire : exemple : la sciatique L5 ou SI par hernie discale (voir sixième partie : appareil locomoteur)."],["li","Le syndrome pluri-radiculaire : le syndrome de la queue de cheval est dû à une lésion du canal rachidien siégeant au-dessous du cône terminal de la moelle : jonction Ll-L2; il s'agit habituellement d'une atteinte des racines sacrées. Ce syndrome associe :"],["li","Des troubles sensitifs : à type de douleurs surtout au début et une anesthésie en selle touchant la région périnéale et les organes génitaux externes."],["li","Des troubles moteurs : paralysie flasque dans le territoire des racines sacrées : muscles fessiers, ischio-jambiers, triceps suraux; avec troubles réflexes : abolition du réflexe achilléen."],["li","Des troubles génito-urinaires : avec impuissance et troubles urinaires avec incontinence ou rétention et perte du besoin d'uriner. Le syndrome de la queue de cheval doit se différencier du syndrome du cône terminal au cours duquel on retrouve un signe de Babinski bilatéral."],["li","Le syndrome radiculaire diffus ou polyradiculonévrite, il associe :"],["li","Des troubles moteurs : paralysies flasques plus ou moins intenses, symétriques avec paralysies des nerfs crâniens."],["li","Des troubles sensitifs : à type de paresthésies."],["li","Des troubles des réflexes ostéo-tendineux qui sont abolis."],["li","Des anomalies du liquide céphalo-rachidien à type de dissociation albumino-cytologique (élévation du taux d'albumine et cytologie normale)."],["p","5.2.4. Les syndromes plexiques : l'atteinte du plexus brachial est la plus fréquente, elle réalise une atteinte pluri-radiculaire ; elle est le plus souvent d'origine traumatique."],["li","Une atteinte globale du plexus brachial réalise une paralysie totale avec anesthésie du membre supérieur."],["li","Une atteinte partielle du plexus brachial va être :"],["li","Soit de type supérieur (C5-C6) : type Duchenne-Erb : va entraîner une paralysie de la racine du membre supérieur."],["li","Soit de type moyen (C7) : type Remak : va se manifester par une paralysie de l'extension du coude, du poignet et des doigts."],["li","Soit de type inférieur (C8-D1) : type Klumpke qui entraîne une paralysie des muscles des doigts et du pouce. Ces atteintes s'accompagnent de troubles sensitifs dans les territoires radiculaires correspondants."],["p","5.2.5. Les syndromes tronculaires : l'atteinte d'un nerf va entraîner la paralysie de plusieurs muscles. Le syndrome tronculaire associe des troubles moteurs et des troubles sensitifs dans le territoire d'innervation cutanée du nerf."],["p","Les principaux nerfs qui peuvent être atteints sont :"],["li","Le nerf radial : qui va donner la main tombante : la main « tombe en fléau » : flexion et pronation (fig. 5)."],["li","Le nerf cubital : se manifeste par la main en griffe : qui réalise une griffe cubitale : flexion des deux derniers doigts (fig. 6)."],["li","Le nerf médian : réalise la main simiesque : qui est la main plate par amyotrophie de l'éminence thénar (fig. 7)."],["li","Le nerf grand dentelé : est responsable de la scapula alata : qui est un décollement et une bascule de l'omoplate en dehors."],["li","Le nerf sciatique poplité externe : réalise le pied tombant qui est responsable du steppage : lors de la marche ou lors de la montée des escaliers, la pointe du pied bute contre le sol du fait de l'atteinte des muscles de la loge antéro-externe de la jambe (fig. 8)."],["li","Le nerf phrénique : va être responsable d'une paralysie de l’hémidiaphragme. L'atteinte diffuse de plusieurs nerfs : lorsqu'elle est symétrique réalise la polynévrite, lorsqu'elle est asymétrique il s'agit d'une multinévrite."],["li","La polynévrite : est un syndrome moteur et sensitif bilatéral et symétrique de topographie distale, avec paresthésie et hypoesthésie tactile « en gant » ou « en chaussette »."],["li","La multinévrite : est un syndrome moteur et sensitif qui est asymétrique. 5.3. Les troubles moteurs d'origine musculaire peuvent être de deux types :"],["p","5.3.1. Atteinte primitive des muscles ou myopathies qui associent :"],["li","Des paralysies progressives prédominant aux racines des membres."],["li","Une atrophie musculaire, parfois une pseudo-hypertrophie."],["pre","FIG 5. – La main tombante                        FIG 6. – La main en griffe\n(paralysie du nerf radial)                        paralysie du nerf cubital)"],["p","FIG. 7. — a) la main normale:"],["p","b) la main simiesque (paralysie du nerf médian)."],["pre","—     L'absence de fasciculations.\n—     L'absence de troubles sensitifs.\n—     Des réflexes ostéo-tendineux qui peuvent être conservés.\n—     L'abolition du réflexe idio-musculaire."],["p","5.3.2. Atteinte de la jonction neuro-musculaire ou myasthénie qui est une fatigabilité à l’effort répété, qui régresse au repos et après injection de Prostigmine. Elle porte essentiellement sur :"],["li","Les muscles oculomoteurs : responsable de diplopie et d'un ptosis."],["li","Les muscles masticateurs : avec gêne à la déglutition."],["li","Les muscles des racines des membres."],["p","FIG 8. — Le pied tombant (paralysie du nerf sciatique poplité externe)."],["h2","II. LES SYNDROMES EXTRA-PYRAMIDAUX"],["p","Les lésions du système extra-pyramidal vont se manifester par des troubles de la motricité involontaire qui réalisent des mouvements anormaux associés à des troubles du tonus à type d'hypotonie ou d'hypertonie avec conservation de la motricité volontaire."],["p","Les syndromes extra-pyramidaux sont dominés par le syndrome parkinsonien, les autres syndromes extra-pyramidaux sont plus rares, ce sont : l’athétose, les dystonies, la chorée et l’hémiballisme."],["h3","1. Rappel anatomo-physiologique du système extra-pyramidal (fig. 9)"],["p","Le système extra-pyramidal est annexé à la voie motrice principale; il aboutit au motoneurone périphérique."],["p","Anatomiquement, il est formé des noyaux gris centraux : noyau caudé, putamen, pallidum, corps de Luys, noyau rouge, locus niger qui aboutissent à une série de faisceaux : rubro-spinal, réticulo-spinal, vestibulo-spinal. Ces faisceaux cheminent dans le cordon antérolatéral de la moelle."],["p","Le rôle du système extra-pyramidal est la régulation du tonus musculaire et son adaptation à la posture et au mouvement."],["h3","2. Les différents syndromes extra-pyramidaux"],["p","2.1. Le syndrome parkinsonien : est en rapport avec des lésions du locus niger, accessoirement du pallidum."],["p","Il est caractérisé par trois signes : le tremblement parkinsonien, l'akinésie et l'hypertonie."],["p","Racine motrice"],["p","FIG. 9. — Le système extra-pyramidal."],["p","2.1.1. Le tremblement parkinsonien : est un tremblement de repos; c'est un mouvement rythmique régulier de fréquence modérée en moyenne six mouvements par seconde, l'amplitude variable le plus souvent modérée, il prédomine aux extrémités distales : il débute à l'extrémité du membre supérieur où il réalise des mouvements alternés de flexion-extension des doigts et d'adduction-abduction du pouce, on dit que le malade « émiette du pain, roule une cigarette ou compte la monnaie ». Au membre inférieur, il réalise un mouvement de flexion-extension du pied : classique mouvement de pédale."],["p","Ce tremblement apparaît au repos, il augmente d'amplitude avec les émotions, la fatigue et l'effort de concentration intellectuelle; il disparaît lors du mouvement volontaire et pendant le sommeil."],["p","2.1.2. L'akinésie : est caractérisée par la réduction et la lenteur des mouvements. Le malade est spontanément immobile, son expression gestuelle est appauvrie :"],["li","Au niveau du visage : on note une rareté du clignement et la réduction de la mimique qui donne au malade un masque, figé, inexpressif, ne reflétant plus les émotions."],["li","Lors de la marche, il existe une diminution du balancement des bras. Le malade a également des difficultés à exécuter de façon rapide les mouvements alternatifs : épreuve des marionnettes, on assiste à une diminution rapide de l'amplitude des mouvements."],["p","2.1.3. L’hypertonie : est une hypertonie de type extra-pyramidal (voir Chapitre II), elle est plastique et diffuse, elle ne s'accompagne pas de déficit moteur et les réflexes ostéo-tendineux sont normaux. L'association de l’akinésie et de l’hypertonie est responsable de l'attitude générale en flexion du parkinsonien : la tête et le tronc sont inclinés en avant, les membres supérieurs demi-fléchis et en adduction, les genoux également demi-fléchis (fig. 10). Cette tendance à la flexion persiste dans le décubitus : c'est le signe de l'oreiller : la tête du malade privée de support ne retombe que lentement sur le plan du lit."],["p","FIG. 10. — Attitude générale en flexion du malade parkinsonien."],["p","2.2. Le mouvement athétosique : est un mouvement involontaire lent et incessant, intéressant les extrémités des membres et la face."],["li","Au membre supérieur : il atteint surtout la main et les doigts : il s'agit de déplacements lents et asynchrones des doigts avec écartement et alternances de flexion extension des articulations métacarpo-phalangiennes comparés à des mouvements de tentacule de pieuvre; le plus caractéristique est un mouvement d'extension et de pronation du poignet réalisant un mouvement de reptation ou d'enroulement."],["li","AU membre inférieur : on note une hyper-extension spontanée des orteils simulant un signe de Babinski."],["li","A la face : le mouvement athétosique siège au niveau de la région buccale réalisant des grimaces lentes. Le mouvement athétosique se développe sur un fond d'hypertonie, il est aggravé par la fatigue et les émotions; il s'atténue au repos et disparaît pendant le sommeil."],["p","2.3. Les dystonies : réalisent des contractions toniques involontaires et intermittentes localisées à certains groupes musculaires. Ces contractions entraînent des déplacements lents et soutenus, sans rythme ; elles surviennent lors du maintien des attitudes ou lors de l'exécution des mouvements volontaires ; elles sont exagérées par les émotions ; elles disparaissent lors du repos et pendant le sommeil."],["p","On distingue :"],["p","2.3.1. La dystonie d'attitude : atteint les muscles de la statique du tronc réalisant des incurvations variées lors de la station debout et de la marche :"],["li","Hyperlordose."],["li","Inflexion latérale."],["li","Rotation (spasme de torsion). Certains mouvements sont capables dé les faire disparaître : la course, la montée des escaliers..."],["p","FIG. 11. — Le torticolis spasmodique"],["pre","a) rotation latérale de la tête;                  b) geste correcteur."],["p","2.3.2. Le torticolis spasmodique : est la forme la plus commune des dystonies; elle est localisée aux muscles du cou, elle entraîne des déviations posturales de la tête; le plus souvent rotation latérale qui s'accompagne d'une saillie du sterno-cléido-mastoïdien."],["p","Ces contractions surviennent par accès durant de 20 à 40 secondes; ils ont tendance à devenir plus fréquents et plus prolongés ; parfois ils peuvent être inhibés par un geste correcteur simple qui est toujours le même pour le même malade : par exemple, le simple contact du doigt sur le menton ou sur la joue (fig. 11)."],["p","2.3.3. Les dystonies de la face : peuvent revêtir plusieurs aspects :"],["li","Crise oculogyres : accès de déviation conjuguée des globes oculaires le plus souvent vers le haut."],["li","Spasme médian de la face : le plus fréquent est le spasme orbiculaire réalisant le blépharospasme qui sont des accès d'occlusion incoercible des paupières."],["li","Crises de protraction de la langue."],["p","2.3.4. Les crampes fonctionnelles : la plus fréquente est la crampe des écrivains : elle affecte les doigts qui se crispent sur le stylo, ainsi que les muscles de l'avant-bras obligeant le malade à interrompre son écriture."],["p","2.4. Le mouvement choréique est une agitation motrice involontaire, incessante et anarchique qualifiée de « folie musculaire »."],["p","Elle est faite de mouvements brusques, explosifs, de durée brève, de siège et d'amplitude changeant sans cesse :"],["li","Au visage : grimaces et mimiques sans rapport avec l'état émotionnel."],["li","Aux membres : mouvements amples de flexion-extension, haussement d'épaules."],["li","Au cou et au tronc : contorsions. Le mouvement choréique s'accompagne d'une hypotonie, il perturbe le mouvement volontaire gênant la marche qui est désordonnée, entrecoupée de sauts ou de brusques enjambées (« danse de Saint-Guy »), les activités manuelles sont entravées : l'habillage, l'alimentation, l'écriture. Il est calmé par le repos et l'isolement, il disparaît pendant le sommeil; il est exagéré par le mouvement volontaire et les émotions. Valeur sémiologique : la chorée est une manifestation transitoire du rhumatisme articulaire aigu, de nature inflammatoire; plus rarement, elle est due à une atteinte dégénérative."],["p","2.5. Le mouvement ballique ou hémiballisme est dû à une hémorragie détruisant le corps de Luys."],["p","Il réalise un mouvement d'apparition brutale et d'une grande violence prédominant à la racine des membres, essentiellement au membre supérieur qui est projeté en avant et en dehors avec tendance à la torsion et à l'enroulement en dedans. Le malade cherche à éviter le mouvement en fixant le bras atteint avec l'autre ou en le calant sous lui. Le mouvement se répète de manière stéréotypée pendant des périodes plus ou moins longues. Dans les formes sévères la mort peut survenir par épuisement."],["p","Le mouvement ballique s'accompagne d'une hypotonie."],["h2","III. LES AUTRES TROUBLES MOTEURS :"],["p","Des troubles moteurs dont le mécanisme physio-pathologique est encore obscur, réalisant des mouvements anormaux, peuvent se voir : ce sont les tremblements, les myoclonies et les tics."],["h3","1. Les tremblements"],["p","Sont les plus fréquents des mouvements anormaux. Ils peuvent être physiologiques chez le sujet normal ou pathologiques, ils se voient alors dans de nombreuses affections."],["p","1.1. Définition : Déjerine les a définis comme : « des oscillations rythmiques involontaires que décrit tout ou partie du corps autour de sa position d'équilibre »."],["p","1.2. Les différents types de tremblement : les tremblements sont classés suivant leur circonstance d'apparition : tremblement d'attitude, tremblement de repos et tremblement d'action ou intentionnel."],["p","1.2.1. Le tremblement d'attitude : il peut être physiologique ou pathologique."],["li","Chez le sujet normal : le maintien d'une attitude : position du serment, bras étendus en avant doigts écartés fait apparaître le tremblement physiologique essentiellement au niveau des mains; sa fréquence varie avec l'âge : 6 cycles/seconde jusqu'à 10 ans, puis 10 cycles/seconde à la puberté, ensuite il diminue de fréquence après l'âge de 50 ans. Il est habituellement invisible à l'œil nu. Il est augmenté par la fatigue et les émotions et il devient alors visible."],["li","Le tremblement d'attitude : exagération du tremblement physiologique se voit au cours de l'éthylisme, de la thyrotoxicose (hyperthyroïdie) et chez les sujets anxieux."],["li","Le tremblement d'attitude sans rapport avec le tremblement physiologique est constitué par des oscillations lentes : 4 cycles/seconde, il apparaît au maintien de l'attitude et persiste pendant le mouvement lent; il disparaît lors du mouvement rapide et au repos il est augmenté par l'émotion; il atteint le membre supérieur, le membre inférieur et la tête, il s'agit d'un phénomène bénin qui chez le sujet âgé porte le nom de tremblement sénile, il peut se voir également chez le sujet jeune, il a dans ces cas un caractère familial. Il est considéré comme d'origine cérébelleuse."],["p","1.2.2. Le tremblement de repos (voir syndrome parkinsonien)."],["p","1.2.3. Le tremblement intentionnel : ou tremblement d'action : il s'agit d'un tremblement qui apparaît dès l'initiation du mouvement, il se poursuit pendant son exécution et peut se prolonger quelques instants après l'arrivée au but. Il est mis en évidence par l'épreuve du doigt sur le nez. Il est le signe d'une atteinte cérébelleuse et de la voie dento-rubrothalamique."],["p","1.2.4. Cas particulier du flapping tremor (tremblement en battements d'ailes) ou astérixis : il est observé au cours de certaines encéphalopathies notamment d'origine hépatique. Il est mis en évidence au niveau de la main étendue à l'horizontale; il consiste en une brusque flexion du poignet avec chute de la main suivie d'un retour à l'horizontale: ces mouvements se répètent à intervalles plus ou moins réguliers en fait il ne s'agit pas d'un vrai tremblement."],["h3","2. Les myoclonies"],["p","2.1. Définition : les myoclonies sont des contractions musculaires brèves et involontaires génératrices ou non d'un déplacement segmentaire."],["p","2.2. Les différents types de myoclonies : selon Gastaut, les myoclonies peuvent être classées :"],["p","2.2.1. Suivant l'étendue et la répartition des territoires musculaires intéressés :"],["li","Les mvoclonies parcellaires : la contraction intéresse un petit muscle ou des faisceaux isolés de muscles plus volumineux ne donnant lieu qu'à un déplacement minime."],["li","Les myoclonies segmentaires : les contractions intéressent plusieurs muscles d'un même segment entraînant un déplacement bref de ce segment. Ces myoclonies peuvent être localisées limitées à un territoire musculaire ou sporadiques atteignant de manière asynchrone plusieurs territoires."],["li","Les myoclonies massives : intéressent de manière simultanée et symétrique plusieurs segments; elles peuvent s'accompagner de chutes ou de projection d'objet."],["p","2.2.2. Suivant la répartition dans le temps :"],["li","Les myoclonies intermittentes : qui surviennent à intervalles longs et irréguliers."],["li","Les myoclonies permanentes : qui surviennent de façon rythmique à des fréquences de 1 à 8 par seconde pendant plusieurs heures ou plusieurs jours."],["p","2.2.3. Suivant les circonstances d'apparition :"],["li","Les myoclonies spontanées : surviennent en l'absence de tout facteur déclenchant décelable."],["li","Les myoclonies provoquées : par des facteurs déclenchants variés : stimulation lumineuse, le mouvement volontaire (myoclonies d'action); plus rarement stimulation sonores ou tactiles."],["h3","3. Les tics"],["p","Ce sont des mouvements involontaires qui se répètent à intervalle variable, sans motivation extérieure, habituellement selon le même type chez un sujet donné, mais variable d'un sujet à l'autre. Ils ne s'accompagnent ni de troubles du tonus, ni de troubles de la motricité."],["p","Le mouvement qui constitue le tic imite le mouvement volontaire; il peut d'ailleurs être reproduit volontairement."],["p","Il s'agit le plus souvent de clins d'yeux, de grimaces, de haussement d'épaules, de mouvements du cou et de la tête. L'apparition du tic est irrégulière et variable suivant l'état psycho-émotionnel du sujet; il peut être suspendu par la volonté ou lors du détournement de l'attention par une activité absorbante; il disparaît au cours du sommeil."],["p","Valeur sémiologique : manifestation névrotique transitoire le plus souvent; plus rarement, il s'agit d'une séquelle d'encéphalite."]]},{"ar":"اضطرابات الحس","fr":"Les troubles de la sensibilité","w":2458,"b":[["pre","I. RAPPEL ANATOMO-PHYSIOLOGIQUE DES VOIES DE LA SENSIBILITÉ                             (fig."],["p","1)"],["p","On distingue deux modes de sensibilité : la sensibilité extéroceptive et la sensibilité proprioceptive."],["li","La sensibilité extéroceptive ou superficielle : recueille les sensations cutanées provoquées par le tact, la douleur, le chaud et le froid."],["li","La sensibilité proprioceptive ou profonde : renseigne sur les attitudes et les déplacements segmentaires. Ces deux types de sensibilité sont véhiculés par deux voies différentes : la voie spinothalamique transmet les sensations thermo-algésiques, la voie lemniscale les sensations proprioceptives. La sensibilité tactile emprunte les deux voies : spino-thalamique et lemniscale."],["h3","1. La voie spino-thalamique"],["p","1.1. Les récepteurs : sont répartis sur l'ensemble des téguments."],["li","Les mécano-récepteurs sont sensibles au tact, à la pression, au déplacement des poils."],["li","Les thermo-récepteurs sont sensibles au froid et au chaud. Il n'y a pas de récepteurs spécialisés pour la douleur."],["p","1.2. Les voies : l'influx nerveux est transmis des récepteurs au premier neurone qui s'articule dans la corne postérieure de l'axe gris du même côté avec le deuxième neurone."],["p","Le deuxième neurone croise la ligne médiane en avant de l'épendyme et gagne le cordon latéral opposé et remonte dans la moelle, le tronc cérébral et se termine au niveau du noyau ventro-postéro-latéral du thalamus."],["p","Au niveau du thalamus, le deuxième neurone s'articule avec le troisième neurone et gagne le cortex pariétal rétro-rolandique dans l'aire 1, 2 et 3 de Brodmann."],["p","Précis de sémiologie"],["p","Ruban de Reil"],["p","Noyau du trijumeau"],["p","Voie lemniscale"],["p","FIG 1. – Les voies de la sensibilité"],["h3","2. La voie lemniscale"],["p","2.1. Les récepteurs : sont situés dans les muscles, les tendons, les capsules et les ligaments articulaires."],["p","2.2. Les voies : l’influx nerveux est transmis des récepteurs au premier neurone ou protoneurone qui monte dans la moelle dans le cordon postérieur homolatéral sans croiser. L'ensemble des protoneurones forme les faisceaux de Goll et Burdach."],["p","Au niveau du bulbe, le protoneurone s'articule avec le deuxième neurone ou deutoneurone qui croise la ligne médiane dans le bulbe et forme le ruban de Reil ou lemniscus médian qui monte dans le tronc cérébral en arrière du faisceau pyramidal d'abord prés de la ligne médiane, puis de plus en plus latéral et se termine dans le noyau ventro-postéro-latéral du thalamus."],["p","Au niveau du thalamus, le deuxième neurone s'articule avec le troisième neurone de la voie spino-thalamique dans son trajet jusqu'au cortex pariétal."],["p","Ainsi, les deux voies lemniscale et spino-thalamique sont nettement séparées dans la moelle et le bulbe, d'où possibilité de troubles sensitifs dissociés."],["p","La longueur du premier neurone de la voie lemniscale qui va de la moelle jusqu'au bulbe le rend plus fragile aux diverses agressions."],["h2","II. ETUDE SÉMIOLOG1QUE"],["p","Elle repose sur l'interrogatoire qui va préciser les troubles sensitifs subjectifs et l'examen clinique qui met en évidence les troubles sensitifs objectifs."],["h3","1. Les troubles sensitifs subjectifs"],["p","Ils peuvent être de deux types : les douleurs et les paresthésies."],["p","1.1. Les douleurs : comme pour toute douleur, il faudra préciser le type, le siège, les circonstances d'apparition et l'évolution."],["p","1.1.1. Le type :"],["li","Douleur pongitive : à type de pesanteur ou d'écrasement."],["li","Douleur lancinante : à type de battement."],["li","Douleur térébrante : est une douleur pénétrante, traversant les tissus en profondeur."],["li","Douleur fulgurante : est une douleur en éclair."],["li","Douleur causalgique : est une douleur à type de cuisson ou de brûlure."],["p","1.1.2. Le siège :"],["li","Il peut être localisé."],["li","Il peut être diffus prédominant aux extrémités ou à un hémicorps."],["li","Il peut suivre le trajet d'une racine rachidienne réalisant une névralgie radiculaire. exemple : la douleur de la sciatique de type L5 qui descend à la fesse, à la face postérieure de la cuisse, à la face externe de la jambe, au dos du pied jusqu'aux premiers orteils."],["p","1.1.3. Les circonstances d'apparition :"],["li","Douleur spontanée."],["li","Douleur déclenchée ou augmentée par certaines manœuvres dans le cas d'une atteinte radiculaire."],["li","Manœuvres qui augmentent la pression du LCR : toux, défécation, effort."],["li","Manœuvre de Lasègue : qui est une manœuvre d'étirement des racines sciatiques (voir sémiologie de l'appareil locomoteur)."],["p","1.1.4. L'évolution :"],["li","Douleur brève en éclair se répétant par accès : douleur de la névralgie du trijumeau."],["li","Douleur prolongée ou permanente : douleur de la polynévrite."],["p","1.2. Les paresthésies : sont des sensations anormales habituellement non douloureuses et non motivées par un stimulus extérieur, de types divers : fourmillements, picotements, sensations de ruissellement, de courant d'air chaud ou froid, de courant électrique."],["h3","2. L'examen clinique"],["p","2.1. Technique (voir examen neurologique : Chapitre II)."],["p","2.2. Résultats : l'examen clinique permet de mettre en évidence les troubles sensitifs objectifs suivants :"],["li","Une hypoesthésie : diminution de la sensibilité."],["li","Une anesthésie : abolition de la sensibilité."],["li","Une anesthésie douloureuse : est l'association dans un même territoire d'une anesthésie et de douleurs spontanées."],["li","Une hyperesthésie : est une sensibilité accrue aux divers modes de stimulation."],["li","Une hyperpathie ou hyperalgésie : est la perception sous forme de douleur d'un stimulus normalement non douloureux : chaud, froid... Les troubles sensitifs objectifs peuvent porter sur tous les modes : sensibilité superficielle et profonde ou être dissociés, c'est-à-dire ne porter que sur l'une des deux."],["h2","III. LES DIFFÉRENTS SYNDROMES SENSITIFS"],["p","Comme les paralysies, nous classons les troubles sensitifs suivant la topographie des lésions en troubles sensitifs périphériques : par atteinte du neurone périphérique et en troubles sensitifs centraux par atteinte des structures centrales."],["h3","1. Les syndromes sensitifs d'origine périphérique"],["p","Ils sont en rapport avec une atteinte soit des troncs nerveux, soit des racines."],["p","1.1. Mononévrite : est l'atteinte d'un seul tronc nerveux."],["li","Signes subjectifs : douleurs et paresthésies dans le territoire de distribution sensitive du nerf atteint. Les douleurs peuvent être déclenchées ou augmentées par la pression du tronc nerveux en certains points de son trajet."],["li","Signes objectifs : hypoesthésie ou anesthésie à tous les modes dans le territoire de distribution sensitive et troubles moteurs dans le territoire de distribution motrice du nerf atteint."],["p","1.2. Polynévrite : est l'atteinte symétrique de plusieurs troncs nerveux, la topographie des troubles est habituellement distale."],["li","Signes subjectifs : douleurs profondes et paresthésies."],["li","Signes objectifs : hypoesthésie cutanée le plus souvent ; parfois troubles de la sensibilité profonde. La distribution des troubles sensitifs subjectifs et objectifs est particulière, elle est bilaté-"],["pre","rale, symétp0\"    distale affectant une topographie « en gant » ou « en chaussette ». Ils sont"],["p","associés à des troubles moteurs localisés à la loge antéro-externe de la jambe au membre inférieur et aux muscles extenseurs des doigts au membre supérieur."],["p","1.3. Monoradiculite : est l'atteinte d'une seule racine."],["li","Signes subjectifs : sont au premier plan, ils sont dominés par la douleur de type radiculaire : cette douleur suit le trajet de la racine, elle est déclenchée ou augmentée par les manœuvres qui augmentent la pression dans le LCR et par les manœuvres d'étirement de la racine. Parfois, on peut retrouver des paresthésies."],["li","Signes objectifs : sont habituellement discrets à type d'hypoesthésie à tous les modes dans le territoire de distribution sensitive de la racine intéressée. Les troubles moteurs sont également habituellement discrets."],["p","1.4. Polyradiculonévrite : est l'atteinte symétrique de plusieurs racines."],["li","Signes subjectifs : sont au premier plan à type de paresthésies et parfois de douleurs."],["li","Signes objectifs : sont habituellement absents; par contre, il existe des troubles moteurs symétriques et diffus intéressant les membres et les nerfs crâniens."],["li","Le LCR est caractéristique, il montre une dissociation albumino-cytologique (hyperalbuminorachie avec cytologie normale)."],["p","1.5. La tétanie : est un syndrome sensitivo-moteur évoluant par crises paroxystiques."],["p","1.5.1. L'accès tétanique : comporte des troubles sensitifs et des troubles moteurs dont la répartition topographique est particulière; ils affectent les extrémités : mains, pieds, et la région péribuccale."],["li","Les troubles sensitifs : sont constants."],["li","Troubles subjectifs : à type de paresthésies : fourmillements et picotements, puis impression d'enraidissement."],["li","Troubles objectifs : hypoesthésie tactile et profonde."],["li","Les troubles moteurs : sont des contractions soutenues, involontaires et incoercibles d'intensité modérée, non douloureuses. La main prend une attitude particulière dite de « main d'accoucheur » (fig. 2) : le pouce en extension et adduction, les doigts serrés les uns contre les autres à demi fléchis, la paume est creusée par le rapprochement de ses deux bords; le poignet peut être en demi-flexion. Lorsque les pieds sont atteints, les orteils se mettent en flexion plantaire serrés les uns contre les autres, la plante est creusée comme la paume de la main. La crise commence par des troubles sensitifs débutant par les doigts et les orteils sans jamais dépasser le coude, ni le genou, puis apparaissent les troubles moteurs. La durée de la crise va de quelques minutes à quelques heures. Chez le jeune enfant, l'attitude du poing est la plus fréquente, la contracture péri buccale peut réaliser des attitudes de moue ou « de museau de carpe » et il existe des risques de laryngospasme entraînant une apnée."],["p","1.5.2. Entre les crises : des troubles sensitifs objectifs à type d'hypoesthésie tactile des doigts peuvent persister. On recherchera le signe de Chvostek qui est la contraction de l'orbiculaire des lèvres lors de la percussion de la joue au milieu d'une ligne unissant le lobule de l'oreille et la commissure labiale; le signe de Weiss qui est la contraction de l'orbiculaire des paupières lors de la percussion de l'angle externe de l'œil et le signe de Lust qui est la contraction des muscles de la loge antéro-externe de la jambe lors de la percussion du sciatique poplité externe au col du péroné. Tous ces signes peuvent être négatifs, on essaiera alors 4onc de déclencher un accès tétanique par l'épreuve du garrot qui consiste à poser sur le bras pendant 10 minutes un garrot ischémiant, puis à l'enlever, chez le tétanique cette manœuvre déclenche un accès c est le signe de Trousseau."],["p","1.5.3. Les causes des tétanies sont l'hypocalcémie, l'alcalose, l'hypokaliémie et les tétanies idiopathiques (sans cause décelable)."],["p","FIG. 2. — Accès tétanique = « la main d'accoucheur »."],["h3","2. Les syndromes sensitifs centraux"],["p","Ils peuvent avoir pour origine une atteinte de la moelle, du bulbe, du thalamus ou du cortex."],["p","2.1. Au niveau de la moelle : on peut observer un syndrome médullaire complet ou un syndrome médullaire partiel."],["p","2.1.1. Le syndrome médullaire complet : se voit dans les paraplégies qui réalisent une lésion complète de la moelle, soit par section médullaire (post-traumatique), soit par compression. On observe alors une anesthésie ou hypoesthésie à tous les modes dans le territoire situé au-dessous de la lésion. La limite supérieure du trouble de la sensibilité à une valeur capitale pour le diagnostic topographique de la lésion médullaire surtout en cas de compression médullaire."],["p","2.1.2. Les syndromes médullaires partiels : peuvent revêtir plusieurs aspects :"],["li","Une lésion de l'hémi-moelle droite ou gauche réalise le syndrome de Brown-Sequard associant :"],["li","Du côté de la lésion : des troubles de la sensibilité profonde et des troubles moteurs à type de paralysie."],["li","Du côté opposé à la lésion des troubles de la sensibilité thermo-algésique."],["li","Une lésion des cordons postérieurs réalise le syndrome cordonal postérieur qui peut s'accompagner de troubles sensitifs subjectifs dont le plus caractéristique est la douleur fulgurante ou douleur en éclair. Les troubles sensitifs objectifs vont porter uniquement sur la sensibilité profonde; ils associent :"],["li","Une ataxie : qui est l'ensemble des troubles moteurs apparaissant lors de la fermeture des yeux (en rapport avec un trouble de la sensibilité profonde) :"],["li","troubles du maintien des attitudes : avec signe de Romberg et signe de la main instable ataxique : on demande au sujet de maintenir ses mains tendues en avant, doigts écartés; lors de la fermeture des yeux, la main et les doigts présentent des oscillations;"],["li","troubles des mouvements : avec troubles de la marche : démarche talonnante et anomalies du mouvement finalisé : le mouvement est mal dirigé, hésitant et le but est manqué : dysmétrie."],["li","Une abolition de la sensibilité vibratoire au diapason."],["li","Une perte du sens de position segmentaire des membres."],["li","Une astéréognosie : perte de la reconnaissance palpatoire des objets. Il n'y aura pas de troubles de la sensibilité thermo-algésique d'où le nom de dissociation tabétique : car ce tableau a d'abord été décrit dans le tabès (syphilis nerveuse), il peut se voir également au cours de l'avitaminose B 12."],["li","Une lésion centro-médullaire : située autour du canal épendymaire, va entraîner des troubles isolés de la sensibilité thermo-algésique « en bande » ou « suspendue » avec conservation de la sensibilité profonde, c'est la classique dissociation syringomyélique ou dissociation thermo-algésique (décrite dans la syringomyélie, maladie qui s'accompagne d'une cavitation centro-médullaire de nature primitive en rapport avec une malformation congénitale). La lésion centro-médullaire intéresse en hauteur seulement quelques segments médullaires au niveau du renflement cervical d'où l'aspect suspendu des lésions et en largeur la lésion va non seulement intéresser les fibres spino-thalamiques, mais aussi la corne antérieure, d'où l'association caractéristique :"],["li","anesthésie thermo-algésique en bande avec conservation de la sensibilité profonde ;"],["li","paralysie avec amyotrophie siégeant au niveau de la ceinture scapulaire, des bras et des mains;"],["li","troubles trophiques des membres supérieurs. Valeur sémiologique : la syringomyélie, les tumeurs intramédullaires."],["p","2.2. Au niveau du bulbe : l'atteinte de la région latérale du bulbe réalise le syndrome de Wallenberg qui est un syndrome alterne sensitif (dû à un ramollissement du bulbe par ischémie artérielle dans le territoire vertébro-basilaire)."],["li","Du côté de la lésion  on observe une hypoesthésie ou une anesthésie thermo-algésique dans le territoire du trijumeau avec conservation de la sensibilité tactile (en effet parmi les noyaux sensitifs du V seul le noyau spinal est touché, car il s'étend sur toute la hauteur du bulbe et il est le relais des afférences thermiques et douloureuses; les autres noyaux du V en particulier, le noyau principal qui est le noyau de la sensibilité tactile siège au niveau de la protubérance), un syndrome de Claude Bernard Horner, un syndrome vestibulaire et un hémisyndrome cérébelleux."],["li","Du côté opposé à la lésion : une hémi-anesthésie thermo-algésique des membres supérieurs et inférieurs réalisant avec / 'anesthésie faciale du côté de la lésion, le syndrome sensitif alterne ; une hémiparésie peut être observée."],["p","2.3. Au niveau du thalamus : c'est le syndrome capsulo-thalamique de Dejerine-Roussy : la lésion intéresse le noyau postéro-ventral du thalamus et déborde sur la capsule interne et les radiations optiques; il va se manifester du côté opposé à la lésion :"],["li","Des troubles sensitifs subjectifs à type d'hyperpathie."],["li","Des troubles de la sensibilité profonde et des troubles de la sensibilité thermo-algésique."],["li","Une hémianopsie latérale homonyme."],["li","Une hémiparésie."],["p","2.4. Au niveau du cortex : des lésions du cortex pariétal vont entraîner des troubles sensitifs de la moitié opposée du corps souvent limités à une partie du corps du fait de l'étalé ment de la représentation somatotopique sensitive. Ces troubles sensitifs portent essentiellement sur la sensibilité profonde : trouble du sens des positions sédentaires et astéréognosie. Les troubles de la sensibilité superficielle sont seulement à type d'hypoesthésie."]]},{"ar":"اضطرابات التناسق والتوازن","fr":"Coordination et équilibration","w":1599,"b":[["h2","I. LES TROUBLES DE LA COORDINATION"],["h3","1. Rappel anatomo-physiologique de la coordination"],["p","La coordination des mouvements nécessite l'intégrité de plusieurs structures. En effet, la coordination sera perturbée dans les atteintes de la motricité, du tonus, de la sensibilité proprioceptive réalisant l'ataxie apparaissant lors de la suppression du contrôle visuel. Mais la coordination motrice est aussi sous la dépendance de l'appareil cérébelleux dont elle constitue une fonction spécialisée."],["p","Le cervelet est situé dans la fosse postérieure, il est branché sur le tronc cérébral par l'intermédiaire de trois paires de pédoncules cérébelleux (fig. 1)."],["li","Supérieurs qui le relient aux pédoncules cérébraux."],["li","Moyens qui le relient à la protubérance."],["li","Inférieurs qui le relient au bulbe. Les voies afférentes : sont vestibulaires, proprioceptives, réticulaires et corticales. Les voies efférentes : gagnent le noyau rouge, les noyaux vestibulaires et la formation réticulaire; à partir de ces structures les messages cérébelleux atteignent le thalamus et le cortex cérébral par la voie rubro-thalamo-corticale; la moelle et les motoneurones par les faisceaux rubro-spinal, vestibulo-spinal et réticulo-spinal. Les fonctions du cervelet :"],["li","Le cervelet a un rôle dans la motricité volontaire portant sur la coordination des différentes phases du mouvement."],["li","Le cervelet a une fonction de régulation du tonus musculaire."],["h3","2. Etude sémiologique"],["p","Le syndrome cérébelleux va comporter deux ordres de troubles : les troubles de la coordination ou incoordination cérébelleuse, des troubles du tonus à type d'hypotonie musculaire et un tremblement."],["p","2.1. L'incoordination cérébelleuse : a pour caractère essentiel d'être indépendante du contrôle visuel, elle se manifeste par des troubles du maintien des attitudes et des troubles des mouvements."],["p","Efférences cérébellà-rubro-thalamiques"],["p","Efférence réticulée Efférence vestibulaire"],["p","2.1.1. Troubles du maintien des attitudes :"],["li","La station debout : démontre l'instabilité du cérébelleux : malgré l'élargissement du polygone de sustentation (écartement des pieds), le sujet présente des oscillations en tous sens; ces oscillations n'entraînent pas de chute et ne sont pas aggravées par l'occlusion des yeux : il n'existe pas de signe de Romberg."],["li","La position assise sans appui dorsal s'accompagne d'oscillations du tronc."],["p","2.1.2. Troubles des mouvements :"],["li","Troubles de la marche :"],["li","Démarche ébrieuse : le sujet marche les pieds écartés, les bras en abduction lui servant de balanciers; il titube comme un homme ivre."],["li","Démarche festonnante : si on demande au sujet de suivre une ligne droite, il zigzague de part et d'autre."],["li","Troubles de l'exécution du mouvement finalisé : dans l'épreuve du doigt sur le nez, du talon sur la rotule : la direction du mouvement est conservée, mais le but est dépassé, il s’agit d'une dysmétrie avec hypermétrie."],["li","L'asynergie est démontrée par les manœuvres suivantes :"],["li","Flexion combinée de la cuisse et du tronc : on demande au sujet allongé, bras croisés de s'asseoir, il ne peut le faire, car ses membres inférieurs restent fixés sur le plan du lit; il ne peut s'asseoir que lorsqu'on maintient ses membres inférieurs soulevés."],["li","Lors de l'accroupissement : le sujet ne décolle pas ses talons du sol."],["li","Lors de l'inclinaison latérale du tronc, les pieds écartés, le sujet ne soulève pas le talon du côté opposé au déplacement."],["li","L'adiadococinésie : est la difficulté ou l'impossibilité d'exécuter les mouvements alternatifs rapides : épreuve de marionnettes (pronation, supination rapidement alternées) ou retourner les mains sur les cuisses ou battre la mesure avec les pieds : le mouvement est de plus en plus maladroit et irrégulier."],["li","La dyschronométrie : est le retard au déclenchement du mouvement et à son arrêt."],["p","2.2. L'hypotonie musculaire : est un symptôme majeur. L'hypotonie est visible et palpable : classique « main de caoutchouc ». Elle donne lieu à une augmentation de la passivité : exagération du ballant de la main : signe du fléau. Elle ne s'accompagne pas d'hyperextensibilité des articulations."],["p","Les réflexes ostéo-tendineux sont diminués et du type pendulaire."],["p","2.3. Le tremblement cérébelleux : est un tremblement intentionnel de grande amplitude, qui commence avec le mouvement et s'exagère lors de son exécution, il est augmenté par les émotions. Il peut être associé à un tremblement d'attitude, ce tremblement cérébelleux disparaît au repos."],["h2","II. LES TROUBLES DE L'ÉQUILIBRATION"],["h3","1. Rappel anatomo-physiologique de l'équilibration"],["p","L'équilibration est le maintien de la projection du centre de gravité du corps à l'intérieur du polygone de sustentation lors du maintien des attitudes et lors du mouvement."],["p","Des troubles de l'équilibration peuvent se voir en cas d'anomalies de la motricité, de la sensibilité proprioceptive, d'anomalies du cervelet et enfin, en cas d'atteinte de l'appareil vestibulaire qui est spécialisé dans la fonction de l'équilibration."],["p","Les récepteurs de l'appareil vestibulaire : les canaux semi-circulaires, l'utricule et le saccule sont situés dans le rocher au voisinage des récepteurs de l'audition (fig. 2)."],["p","Le nerf vestibulaire est formé de fibres partant de ces récepteurs, il chemine dans le conduit auditif interne, le sillon bulbo-protubérantiel et aboutit au bulbe accolé au nerf cochléaire formant la VIIIe paire crânienne. Au niveau du bulbe, il se divise et gagne les noyaux vestibulaires. Les fibres nées des noyaux vestibulaires ont trois destinées :"],["li","Le cervelet."],["li","La corne antérieure de la moelle."],["li","Les noyaux oculomoteurs (III, IV, VI). La fonction de l'appareil vestibulaire est la régulation du tonus de posture en fonction de la position du corps et de ses déplacements dans les différentes positions."],["h3","2. Etude sémiologique"],["p","Le syndrome vestibulaire comporte l'association de vertiges, de troubles de l’équilibration et de nystagmus."],["p","Noyaux vestibulaires"],["p","FIG. 2. — L'appareil vestibulaire."],["p","2.1. Le vertige : est un signe fonctionnel qui sera analysé par l'interrogatoire, le malade ressent une sensation de déplacement des objets environnants par rapport à son corps ou l'inverse, il s'agit d'un déplacement illusoire le plus souvent de type rotatoire avec impression de manège. Les signes accompagnateurs : ressemblent à ceux retrouvés au cours du mal de mer : pâleur, nausées, sueurs, tachycardie. Si le vertige est intense, il peut s'accompagner de chute et confiner le malade au lit."],["p","2.2. Les troubles de l’équilibration : apparaissent au maintien des attitudes et lors des mouvements, ils vont être exagérés par la suppression du contrôle visuel."],["p","2.2.1. Troubles du maintien des attitudes :"],["li","La station debout : s'accompagne d'une inclinaison lente du corps vers le côté de la lésion : c'est le signe de Romberg vestibulaire ou signe de Romberg latéralisé: il est majoré lors de la fermeture des yeux."],["li","L'épreuve des index : on demande au sujet debout, pieds écartés, de placer les bras tendus, les index en face de ceux de l'examinateur, on observe alors une déviation des index vers le côté lésé qui apparaît lors de la fermeture des yeux."],["p","2.2.2. Troubles des mouvements : sont mis en évidence par l'épreuve de la marche aveugle', elle consiste à demander au sujet d'effectuer alternativement quelques pas en avant et quelques pas en arrière, après lui avoir bandé les yeux ; le trajet parcouru se fait toujours dans le même sens et dessine une étoile, c'est « la démarche en étoile » de Babinski-Weill."],["p","2.2.3. Le nystagmus : est un trouble de la motilité oculaire qui se manifeste par des oscillations involontaires rythmiques des globes oculaires faites de deux composantes lentes dans un sens et rapides dans l'autre."],["p","Technique de recherche : on demande au sujet de fixer un point éloigné, le nystagmus apparaît soit dans une position latérale, c'est le nystagmus horizontal (droit ou gauche), soit dans une position verticale, c'est le nystagmus vertical (supérieur ou inférieur), enfin il peut être rotatoire (horaire ou anti-horaire)."],["p","Il doit être distingué des mouvements pendulaires des globes oculaires rencontrés lors de la baisse importante de l'acuité visuelle."],["p","L'étude sémiologique de l'appareil vestibulaire peut être précisée par des épreuves instrumentales qui seront effectuées en service spécialisé (ORL) qui sont les épreuves de stimulation labyrinthique calorique et rotatoire."],["h3","3. Les syndromes vestibulaires"],["p","En fonction du siège de la lésion, on distingue les syndromes vestibulaires périphériques et les syndromes vestibulaires centraux."],["p","3.1. Le syndrome vestibulaire périphérique : la lésion siège soit au niveau des récepteurs (labyrinthe), soit au niveau du nerf vestibulaire. Les symptômes sont les suivants :"],["li","Vertiges rotatoires intenses, déclenchés par les changements de position accompagnés de nausées et de vomissements."],["li","Troubles importants de l'équilibration avec déviation des index."],["li","Nystagmus horizontal."],["li","Les épreuves instrumentales montrent une hypo-excitabilité ou une inexcitabilité unilatérale. Le syndrome vestibulaire périphérique réalise un syndrome vestibulaire harmonieux, car il y a concordance entre les signes cliniques et le résultat des manœuvres instrumentales. Les causes du syndrome vestibulaire périphérique sont variées :"],["li","Les causes labyrinthiques sont : traumatiques (fracture du rocher), infectieuses (otite, mastoïdite), vasculaires (hémorragies labyrinthiques) et le syndrome de Ménière. Le syndrome de Ménière ou Vertige de Ménière : semble en rapport avec des poussées d'hyperpression du liquide endolymphatique, chaque poussée se traduit par de grands épisodes vertigineux associés à une atteinte cochléaire avec hypoacousie."],["li","L'atteinte du nerf vestibulaire se voit au cours du zona, du traitement par la Streptomycine."],["p","3.2. Le syndrome vestibulaire central : la lésion siège soit au niveau des noyaux vestibulaires, soit au niveau des connexions centrales."],["p","Les symptômes sont les suivants :"],["li","Les vertiges sont discrets."],["li","Les troubles de l'équilibration ne sont pas franchement latéralisés, ils sont multidirectionnels."],["li","Le nystagmus est très marqué : il est le plus fréquemment horizontal, il est parfois vertical, il signe une atteinte pédonculaire ou rotatoire, il signe alors une atteinte bulbaire."],["li","Les épreuves instrumentales sont le plus souvent normales, ce qui a valu au syndrome vestibulaire central le qualificatif de dysharmonieux."],["li","L'atteinte du nerf cochléaire est rare."],["li","Signes associés : ce sont des signes d'atteinte du tronc cérébral : troubles oculomoteurs et troubles cérébelleux. Les causes du syndrome vestibulaire central sont variées : vasculaires (hémorragie ou ischémie du tronc cérébral), la sclérose en plaques, les tumeurs du tronc cérébral."]]}]},{"ic":"🦴","ar":"الجهاز الحركي","fr":"L'appareil locomoteur","c":"#64748B","ch":[{"ar":"سيميولوجيا الجهاز الحركي","fr":"L'appareil locomoteur","w":2627,"b":[["p","L'étude sémiologique de l'appareil locomoteur repose sur l'interrogatoire, l'examen clinique des os et des articulations et l'examen radiologique."],["p","L L'INTERROGATOIRE Il permettra de retrouver un signe fonctionnel fondamental, la notion de douleur : douleur des membres et douleurs vertébrales associées ou non à une limitation des mouvements."],["h3","1. Les douleurs des membres"],["p","Elles peuvent être en rapport avec :"],["p","1.1. Une anomalie articulaire : douleur articulaire"],["li","Soit douleur articulaire isolée sans signes physiques de souffrance articulaire associés : il s'agit d'une arthralgie."],["li","Soit douleur articulaire associée à des signes physiques d'inflammation en cas d'arthrite."],["p","1.2. Une anomalie osseuse : douleur osseuse"],["li","Douleur observée au cours des fractures."],["li","Douleur accompagnant une infection osseuse au cours de l'ostéomyélite aiguë."],["li","Douleur associée à une tumeur osseuse : il s'agit le plus souvent alors d'une tumeur maligne."],["p","1.3. Une anomalie neurologique : douleur neurologique ou névralgie"],["li","Douleur accompagnant l'atteinte d'un tronc nerveux dont la topographie correspond à ta distribution sensitive de ce nerf."],["li","Douleur radiculaire, exemple : névralgie sciatique dont le trajet suit celui de la racine mais dont la cause est en fait vertébrale."],["p","1.4. Une anomalie vasculaire : douleur vasculaire (voir sémiologie vasculaire)."],["li","Douleur d'origine artérielle : dont la plus caractéristique est la claudication intermittente de l’artérite oblitérante des membres inférieurs qui réalise une douleur à type de crampe sans contracture musculaire apparaissant à la marche et disparaissant au repos."],["li","Douleur d'origine veineuse : douleur observée au cours de la phlébite des membres inférieurs."],["p","1.5. Une anomalie à distance des membres, il s'agit d'une douleur rapportée : exemple : douleur localisée au membre supérieur gauche le long de son bord interne au cours de l'angine de poitrine ; douleur des deux membres supérieurs lors de l'infarctus du myocarde."],["h3","2. Les douleurs vertébrales ou douleurs du dos"],["p","Elles sont très fréquentes, elles peuvent siéger au niveau du rachis cervical, dorsal ou lombaire. Les douleurs les plus fréquentes sont les douleurs lombaires ou lombalgies. Les lombalgies peuvent être dues à plusieurs mécanismes :"],["li","Douleur due à une irritation des terminaisons nerveuses au niveau du rachis lombaire réalisant la lombalgie pure."],["li","Douleur due à une compression d'une racine à l'intérieur du canal rachidien réalisant la douleur radiculaire."],["li","Douleur en rapport avec une atteinte d'un viscère à distance, il s'agit d'une douleur rapportée."],["li","Douleur sans cause décelable 2.1. La lombalgie pure : elle réalise une douleur aiguë, permanente, diffuse, prédominant au niveau de la zone atteinte, variable avec les mouvements; augmentée par la pression de la zone atteinte et s'accompagnant d'une contracture musculaire, elle peut s'accompagner d'une douleur à distance : au niveau de la face antérieure des cuisses et des jambes en cas de lésion lombaire haute; au niveau de la face postérieure des cuisses et des jambes en cas de lésion lombaire basse. La cause la plus fréquente est la hernie discale à son stade de début : stade de protrusion discale sans hernie vraie (fig. 1 -1) ; les autres causes sont plus rares : ce sont les spondylites infectieuses (tuberculose, staphylococcie, salmonnellose), les affections rhumatismales de la colonne vertébrale : spondylarthrite ankylosante et l'arthrose vertébrale; dans ce cas la lombalgie s'accompagne d'une raideur vertébrale."],["h4","2.2. La douleur radiculaire"],["p","2.2.1. Caractères communs : il s'agit d'une douleur aiguë, très intense; irradiant au rachis lombaire suivant le trajet de la racine au niveau du membre inférieur {ce trajet va permettre de reconnaître la racine atteinte) ; cette douleur est augmentée par les manœuvres qui élèvent la pression du LCR (toux, défécation et effort) et par les manœuvres d'étirement de la racine."],["p","2.2.2. Caractères particuliers : suivant la racine intéressée, on distingue : a) La sciatique de type L5 : la douleur partant du point d'émergence de la racine L5 va suivre le trajet suivant : fesse, face postérieure de la cuisse, face externe de la jambe, face dorsale du pied et premiers orteils."],["p","b) La sciatique de type SI : la douleur partant du point d'émergence de la racine S1 va suivre le trajet suivant : fesse, face postérieure de la cuisse, face postérieure de la jambe, talon, bord externe du pied et derniers orteils."],["p","La sciatique de type SI s'accompagne d'une abolition du réflexe achiléen. Le signe commun à ces deux types de sciatique est l'accentuation de la douleur par la manœuvre de Lasègue qui consiste, sur le malade en décubitus dorsal, à fléchir le membre inférieur étendu sur le bassin (fig. 2)."],["p","c) La névralgie crurale : est une douleur radiculaire en rapport avec une souffrance de la racine L4 ; elle se manifeste par une douleur débutant au point d'émergence de la racine L4 et va suivre le trajet suivant : face antérieure de la cuisse, face antérieure du genou et face interne de la jambe."],["p","La douleur est augmentée par la manœuvre de Lasègue inverse qui consiste, sur le malade en décubitus ventral, à pratiquer une hyper-extension de la cuisse sur le bassin (fig.3)."],["p","La cause la plus fréquente de douleur radiculaire est la hernie discale avec protrusion discale qui se latéralisé et vient comprimer la racine L5 (hernie du disque L4-L5), la racine SI (hernie du disque L5-S1), la racine L4 (hernie du disque L3-L4) (fig. 1-2)."],["pre","FIG 1-1. – Hernie discale : stade de début           FIG 1-2. – Hernie discale\n          Ou stade de protrusion                        stade de hernie vraie"],["p","FIG. 2. — Manœuvre de Lasègue."],["p","FIG. 3. — Manœuvre de Lasègue inverse."],["p","2.3. La douleur rapportée : est une lombalgie en rapport avec une atteinte soit de l'appareil uro-génital, soit de l'appareil digestif : ulcère, pancréatite, pathologie colique."],["p","2.4. Lombalgie d'origine psychique : souvent déclenchée par un surmenage physique ou psychique."],["h2","II. L’EXAMEN CLINIQUE"],["p","Il consiste à apprécier la démarche, à examiner les membres et le rachis, afin de rechercher des anomalies."],["h3","1. La démarche"],["p","L'examen clinique de l'appareil locomoteur doit toujours débuter par l'étude de la démarche."],["p","1.1. A l’état normal : la démarche est régulière, rythmée et souple."],["h4","1.2. Les démarches pathologiques"],["p","1.2.1. La claudication ou boiterie est un signe qui permet de dépister une anomalie de l'appareil locomoteur. On parle de claudication lorsque la démarche devient irrégulière. Elle peut être due :"],["li","Soit à une douleur qui entraîne une diminution de la période d'appui du côté du membre douloureux."],["li","Soit à un raccourcissement d'un membre."],["li","Soit à une réduction de la mobilité d'une articulation par anomalie de la capsule, des ligaments ou des tendons."],["p","1.2.2. La démarche peut être anormale en cas d'atteinte neurologique."],["li","Démarche ataxique par atteinte de la sensibilité profonde."],["li","Démarche ébrieuse par atteinte cérébelleuse."],["li","Steppage dû à une paralysie des muscles de la loge antéro-externe de la jambe."],["li","Unilatéral : par paralysie du nerf sciatique poplité externe."],["li","Bilatéral : en cas de polynévrite."],["h3","2. L'examen des membres"],["p","Il aura trois objectifs : la recherche de déformations, les mensurations des membres et l'étude des articulations."],["p","2.1. Recherche de déformations qui peuvent être récentes ou anciennes."],["p","2.1.1. Déformation post-traumatique récente en cas de fracture : il s'agit d'un malade qui lors d'un traumatisme d'un membre a présenté une douleur intense avec impotence fonctionnelle complète."],["li","A l'inspection : l'attitude du sujet est caractéristique : il soutient son membre blessé, l'avant-bras fléchi sur le bras avec la main du côté indemne en cas de fracture du membre supérieur; s'il s'agit d'une fracture du membre inférieur, le sujet est allongé et l'on constate d'emblée une déformation avec perte de l'axe normal du membre et un raccourcissement du membre atteint. L'aspect des téguments est caractéristique : on note un gonflement de la région et souvent la présence d'ecchymoses et de phlyctènes."],["li","La palpation : permet de mettre en évidence l’œdème de la région et une douleur exquise provoquée qui permet de préciser le siège du trait de fracture. On ne recherchera pas la mobilité anormale. L'examen clinique devra toujours rechercher des signes de choc : pouls : rapide, petit, chute de la tension artérielle, tendance à l'hypothermie. La radiographie du membre permettra de préciser le trait de fracture et l'importance des déplacements."],["p","2.1.2. Déformation post-traumatique ancienne en cas de fracture mal traitée : déformation «en crosse» à convexité antéro-externe dans certaines fractures du fémur; en « recurvatum » à convexité antéro-interne dans les fractures de jambes. Ces déformations se voient lorsque la réduction de la fracture a été insuffisante et elles s'accompagnent d'un raccourcissement du membre."],["p","2.1.3. Les autres déformations :"],["li","Déformation en varus : qui est une déviation anormale du membre vers la ligne médiane (en dedans) : exemple : pied varus (fig. 4)."],["li","Déformation en valgus : qui est une déviation anormale du membre à l'opposé de la ligne médiane (en dehors) : exemple : pied valgus (fig. 5)."],["li","Déformation en équin : est une déformation qui fait que le pied pointe vers le bas, il n'est plus à angle droit sur la jambe (fig. 6)."],["li","Déformation en talus : est une déformation qui fait que le pied pointe vers le haut et le talon repose sur le sol par sa partie la plus distale (fig. 7)."],["li","Le pied bot : qui peut être congénital ou acquis notamment après un traumatisme, est une déformation qui est le plus souvent de type varus équin, beaucoup plus rarement de type talus valgus."],["p","2.2. Les mensurations des membres : est la seule technique qui permette d'affirmer de manière certaine le raccourcissement d'un membre."],["p","2.2.1. Le membre supérieur : se mesure en position d'extension complète du coude, depuis l'acromion jusqu'à l'extrémité de l'apophyse cubitale."],["p","2.2.2. Le membre inférieur : se mesure en position d'extension complète de la hanche et du genou, de l'épine iliaque antérieure et supérieure jusqu'à la malléole interne."],["p","2.2.3. On peut également mesurer le périmètre des membres : du bras. de l'avant-bras au membre supérieur en prenant pour repère fixe l'olécrane: de la cuisse et du mollet au membre inférieur en prenant pour repère fixe la rotule."],["p","2.3. L'étude des articulations : consiste à apprécier le degré de mobilité des articula lions et à rechercher des modifications pathologiques."],["p","2.3.1. Le degré de mobilité des articulations : ce degré varie avec chaque articulation ; il peut être vérifié sur des tables. Il pourra être apprécié de manière grossière chez un individu donné en faisant un examen comparatif de chaque articulation : à l'état normal la mobilité articulaire est symétrique pour chaque articulation."],["pre","FIG. 4. — Pied varus.                        FIG. 5. — Pied valgus."],["pre","FIG. 6. — Pied en équin.                   FIG. 7. — Pied talus."],["p","2.3.2. Les modifications pathologiques :"],["li","La raideur articulaire : est une limitation de la mobilité articulaire lorsqu'elle est ancienne, elle peut s'accompagner d'une amyotrophie."],["li","L'épanchement liquidien intra-articulaire du genou : sera soupçonné devant toute augmentation de volume du genou; il sera vérifié par la recherche du choc rotulien (fig. 8). L'examinateur se place du même côté que le genou malade, le membre est placé en extension et en état de relâchement musculaire; il se recherche en empaumant de la main gauche le cul-de-sac sous-quadricipital et de la main droite, le cul-de-sac inférieur, de sorte que le liquide contenu dans la cavité articulaire est mis sous tension et soulève la rotule. Avec l'index, l'examinateur appuie brusquement sur la face antérieure de la rotule. La rotule ainsi déprimée vient heurter la surface intercondylienne. La nature de l'épanchement sera précisée par la ponction articulaire qui mettra en évidence :"],["li","Soit un liquide citrin : il s'agit d'une hydarthrose."],["li","Soit du sang : il s'agit d'une hémarthrose qui peut être post-traumatique ou se voir chez le sujet de sexe masculin porteur d'une coagulopathie congénitale : l'hémophilie."],["li","Soit du pus : il s'agit d'une arthrite purulente."],["li","L'arthrite : est une inflammation de l'articulation qui est reconnue sur (augmentation de volume de l'articulation associée à des signes inflammatoires : douleur augmentation de la chaleur locale et rougeur, elle peut être unique, il s'agit d'une monoarthrite ou au contraire toucher simultanément plusieurs articulations, il s'agit alors d'une polyarthrite."],["h3","3. L'examen du rachis"],["p","Dans tous les cas, il faut examiner le rachis dans sa totalité en mettant le malade debout, puis on étudie les mouvements du rachis en position debout et en position couchée."],["p","3.1. Examen du rachis en position debout : le malade est placé debout, les bras le long du corps; il est examiné de face (face postérieure du rachis) et de profil."],["p","FIG. 8. — Technique de recherche du choc rotulien."],["p","FIG. 9-1. — Sujet normal. FIG. 9-2. — Disparition de la lordose lombaire normale."],["p","FIG. 10. — Inclinaison latérale du tronc."],["p","3.1.1. Chez le sujet normal (fig. 9-1) : on observe une légère cyphose dorsale, courbure à convexité postérieure de la région dorsale et une lordose lombaire courbure à concavité postérieure de la région lombaire. Il n'y a pas d'inclinaison latérale : un fil à plomb tendu de la 7e vertèbre cervicale (qui est la vertèbre proéminente à la base du cou) doit suivre la ligne des épineuses et tomber exactement sur la ligne du pli interfessier."],["p","3.1.2. Les anomalies vertébrales : on peut observer plusieurs anomalies morphologiques du rachis."],["li","Une disparition de la lordose lombaire normale (fig. 9-2) : qui est un signe objectif précieux accompagnant une anomalie de la colonne lombaire, il a une grande valeur en cas de lombalgie."],["li","Une inclinaison latérale du tronc (fig. 10) par contraction musculaire d'un côté, il s'agit d'un signe objectif d'une atteinte de la colonne lombaire et peut donc accompagner une lombalgie et une disparition de la lordose lombaire."],["li","Une cyphose ou dos rond ou dos voûté est l'exagération de la courbure à convexité postérieure que présente normalement la région dorsale (fig. 11)."],["li","Une scoliose (fig. 12) grâce au fil à plomb, on constate une déviation dorsale (par exemple à convexité dorsale droite) qui va être compensée par une déviation lombaire (à convexité gauche)."],["li","Une gibbosité (fig. 13) est une angulation du rachis qui siège an niveau du rachis dorsal; la cause la plus fréquente est le mal de Pott."],["pre","FIG.     FIG 11. – Cyphose dorsale pathologique         fig. 12. — Scoliose."],["pre","Dorsale haute                 Dorsale basse"],["p","FIG. 13. — Gibbosité."],["h4","3.2. Examen des mouvements du rachis"],["p","3.2.1. Sur le malade debout : la flexion en avant sera étudiée en demandant au sujet de se pencher en avant et de ramasser un objet posé à terre, devant lui."],["p","Un sujet normal arrive à ramasser cet objet d'une main ou de l'autre, les genoux en extension et sans prendre de point d'appui et lors de ce mouvement de flexion, le rachis forme une courbe convexe régulière."],["p","3.2.2. Sur le malade en décubitus :"],["li","En décubitus ventral : on demande au sujet de placer ses mains derrière le dos, on lui maintient les chevilles, puis on lui demande de soulever le buste en creusant les reins, on observe ainsi le mouvement d'hyper-extension ; normalement, la région lombaire se déprime fortement. C'est dans cette position que l'on pratiquera la manœuvre de Lasègue inverse (qui est une manœuvre d'élongation de la racine L4)."],["li","En décubitus dorsal : le sujet normal présente au niveau de la région lombaire un hiatus qui normalement ne laisse pas passer la main. La manœuvre suivante doit être exécutée, on demande au sujet de croiser les bras et d'essayer de s'asseoir alors que ses chevilles sont maintenues sur le plan du lit par l'examinateur : le sujet normal parvient à s'asseoir aisément. C'est dans cette position que l'on pratiquera la manœuvre de Lasègue (qui est une manœuvre d'élongation des racines L5 et SI)."],["h2","III. L’EXAMEN RADIOLOGIQUE"],["p","Est le complément essentiel de l'étude sémiologique de l'appareil locomoteur."],["h3","1. Radiographies des membres"],["p","Elles seront prises de face et de profil et toujours comparatives."],["h3","2. Radiographies du rachis"],["p","Elles seront prises de face et de profil et seront centrées sur les zones anormales précisées par l'interrogatoire et l'examen clinique. En cas de lombalgie, la radiographie du rachis sera toujours complétée par une radiographie du bassin de face afin de visualiser les articulations sacro-iliaques."]]}]},{"ic":"💧","ar":"البولي والتناسلي","fr":"L'appareil génito-urinaire","c":"#0891B2","ch":[{"ar":"الجهاز التناسلي","fr":"Sémiologie de l'appareil génital","w":2664,"b":[["h2","I. SÉMIOLOGIE DE L'APPAREIL GÉNITAL FÉMININ"],["h3","1. Rappel physiologique"],["p","1.1. La puberté : les premiers signes de puberté apparaissent vers l'âge de 10 à 11 ans par le développement mammaire."],["p","La première menstruation se produit deux ans après le début du développement des seins vers l'âge de 12 à 13 ans. La pilosité pubienne et axillaire se complète en 2 à 3 ans."],["p","1.2. Le cycle menstruel : dure normalement de 28 à 30 jours, il se termine par la menstruation qui dure en moyenne 4 à 6 jours."],["p","La quantité de sang perdue à chaque menstruation est en moyenne de 50 ml. Le cycle se divise en quatre phases :"],["li","La phase pré-ovulatoire du 5e au 14e jour : c'est la phase proliférative qui est sous la dépendance des œstrogènes."],["li","L'ovulation : qui se situe entre le 14e et le 16e jour est provoquée par une décharge brutale de LH."],["li","La phase post-ovulatoire : du 17e au 28e jour : c'est la phase sécrétoire qui est sous la dépendance de la progestérone et des œstrogènes."],["li","La menstruation : du 1er au 5e jour est une élimination de la muqueuse de l'endomètre s'accompagnant d'hémorragie. La période ovulatoire peut être déterminée sur la courbe thermique (fig. 1); elle est marquée par une ascension thermique : la température du matin inférieure à 37° (36 8° en moyenne) dans la période préovulaire s'élève au-dessus de 37° (37 2° en moyenne) au moment de l'ovulation. La sécrétion des hormones ovariennes : œstrogènes et progestérones est sous la dépendance des stimulines anté-hypophysaires FSH et LH."],["h3","2. Etude sémiologique"],["p","Elle repose sur l'interrogatoire et l'examen gynécologique."],["pre","14                  28 Jours"],["p","FIG. I. — Courbe thermique au cours du cycle menstruel."],["p","2.1. L'interrogatoire : doit préciser les antécédents physiologiques, les antécédents pathologiques et les signes fonctionnels orientant vers une anomalie de l'appareil génital."],["p","2.1.1. Les antécédents physiologiques : il s'agit en fait de préciser les épisodes de la vie génitale de la femme des premières régies jusqu'à la ménopause."],["li","La ménarchie : correspond à l'apparition des premières régies. L'âge d'apparition des premières règles est variable, il se situe entre 10 et 16 ans (en moyenne vers l'âge de 12 à 13 ans)."],["li","Le cycle menstruel : seront précisés : le rythme (normalement tous les 28 jours à 30 jours), la durée des règles (normalement 3 à 6 jours), l'abondance des règles (appréciée en demandant le nombre de garnitures nécessaires chaque jour : normalement abondantes les deux premiers jours, puis diminuent ensuite), la date des dernières règles afin de dépister un début de grossesse, ce qui est capital, car en pratique, une grossesse au début contre-indique formellement certaines investigations notamment radiologique et isotopique et certains médicaments."],["li","Le nombre de grossesses et le nombre d'accouchements, le nombre d'enfants vivants, le nombre d'enfants décédés et la cause du décès, la recherche d'avortement, la recherche d'accouchement prématuré (au-delà du sixième mois de gestation), la notion d'enfant mort-né."],["li","La notion de contraception : dispositif intra-utérin (stérilet), contraceptifs oraux, ligature des trompes."],["li","La ménopause : est la disparition définitive des règles ; elle correspond à l'arrêt de la fonction cyclique des ovaires. L'âge de la ménopause est très variable, il se situe entre 40 et 50 ans."],["p","2.1.2. Les antécédents pathologiques :"],["li","Notion d'intervention sur le petit bassin : hystérectomie, intervention pour kyste de l'ovaire, césarienne."],["li","Des antécédents d'infection génitale."],["p","2.1.3. Les signes fonctionnels : peuvent être à type de douleurs, de pertes, d'hémorragies génitales et de troubles de la menstruation."],["p","a) Les douleurs : évocatrices sont les douleurs pelviennes de siège hypogastrique et au niveau des fosses iliaques, à noter dans ces cas, la grande fréquence des douleurs lombaires associées."],["p","La dyspareunie est une douleur ressentie au niveau du vagin ou au niveau du petit bassin lors des rapports sexuels; elle peut être fonctionnelle ou révéler une affection organique."],["p","b) Les pertes vaginales ou leucorrhées représentent un symptôme fréquent classiquement, il s'agit de pertes blanches, mais en fait elles sont de couleur variable."],["li","Blanchâtres : caillebottées (ressemblant à du lait caillé), abondantes, s'accompagnant d'un prurit intense avec à l'examen, une rougeur vulvaire et vaginale ; elles sont dues à une mycose (Candida-Albicans). Elles se voient surtout au cours de la grossesse et du diabète."],["li","Blanc-jaunâtre : plus fluides, odorantes, parfois mousseuses ; elles s'accompagnent d'un prurit et de brûlure vulvaire avec à l'examen un piqueté rouge vaginal et cervical ; elles sont dues au trichromonas vaginal."],["li","Franchement purulentes : jaunâtres ou verdâtres ne s'accompagnant ni de prurit, ni de sensation de brûlure, elles doivent évoquer une infection bactérienne au niveau du col : exocervicite (due à une entérocoque ou un colibacille; plus rarement au gonocoque)."],["li","Transparentes, visqueuses, filantes et sans odeur : c
