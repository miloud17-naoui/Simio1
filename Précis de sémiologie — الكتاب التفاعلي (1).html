e sont des sécrétions génitales physiologiques survenant 2 à 3 jours avant l'ovulation."],["p","c) Les hémorragies génitales : peuvent être extériorisées ou non."],["li","Les hémorragies non extériorisées : c'est essentiellement la rupture de grossesse extrautérine (GEU) qui est une urgence chirurgicale. La grossesse extra-utérine est la nidation de l'œuf fécondé en dehors de la cavité utérine, localisée au niveau de la trompe; elle entraîne lors de sa croissance, une déchirure de la trompe sur laquelle elle s'est insérée : c'est la rupture de grossesse tubaire qui est un drame chirurgical réalisant un hémopéritoine avec tableau clinique d'hémorragie interne intense (pâleur, soif vive, pouls rapide, chute de la TA). L'interrogatoire retrouve la notion d'un retard ou d'une irrégularité des règles, suivi de petites pertes sanglantes noirâtres ou sepia, des douleurs pelviennes latérales et parfois la notion de syncopes à répétition. L'examen clinique montre à la palpation de l'abdomen une sensibilité hypogastrique, le toucher vaginal va permettre le diagnostic en réveillant une douleur atroce au niveau du culde-sac postérieur : c'est le cri du Douglas qui est associé à des signes de grossesse : col utérin ramolli, utérus un peu gros et mou. L'intervention d'urgence s'impose."],["li","Les hémorragies extériorisées sont des pertes sanglantes (fig. 2) : suivant leur date de survenue par rapport aux règles, elles peuvent être de trois types : les ménorragies, les métrorragies et les méno-métrorragies."],["li","Les ménorragies: sont des règles trop abondantes ou trop prolongées. Elles doivent faire rechercher un fibrome utérin."],["li","Les métrorragies : sont des hémorragies génitales se produisant en dehors des règles ; elles peuvent être spontanées ou provoquées par les rapports sexuels ou par le toucher vaginal. Leur aspect est variable, elles peuvent être faites de sang rouge ou de caillots noirâtres. Les métrorragies doivent faire rechercher un cancer génital."],["li","Les méno-métrorragies : associent des règles abondantes ou prolongées et des hémorragies génitales en dehors des règles. Suivant leur abondance, les hémorragies génitales peuvent être soit de petite ou de moyenne abondance, mais répétées entraînant au bout de quelques semaines à quelques mois une anémie ferriprive; soit de grande abondance s'accompagnant d'anémie aiguë posthémorragique."],["p","FIG. 2. — Les hémorragies renfla/es extériorisées."],["p","d) Les troubles de la menstruation :"],["li","Les ménorragies (voir hémorragies génitales)."],["li","La pollakiménorrhée : ce sont des régies trop rapprochées par raccourcissement de la durée des cycles menstruels."],["li","La spanio-ménorrhée : ce sont des régies trop espacées par allongement de la durée des cycles menstruels."],["li","L'oligoménorrhée : ce sont des régies trop courtes."],["li","L'oligo-spanio-ménorrhée : ce sont des régies trop courtes et trop espacées."],["li","L'aménorrhée : c'est l'absence des régies pendant la période génitale active; elle peut être :"],["li","Primaire : par absence de ménarchie."],["li","Secondaire : la cause la plus fréquente est la grossesse, les autres causes sont pathologiques : la tuberculose, après hystérectomie, après un curetage par synéchies (adhérences) au niveau de l'isthme utérin, d'origine psychique."],["li","La dysménorrhée : réalise des menstruations douloureuses. Ces douleurs peuvent soit précéder de quelques jours la menstruation, soit être contemporaines de celle-ci."],["h4","2.2. L'examen gynécologique"],["p","2.2.1. Les conditions de l'examen : la malade doit être examinée soit sur une table gynécologique, soit sur une table d'examen ; en décubitus dorsal, les cuisses à demi fléchies, en abduction, les jambes fléchies (fig. 3)."],["p","Il est indispensable que la malade vide préalablement sa vessie et son rectum. Le matériel nécessaire est le suivant : un spéculum (fig. 4) et un doigtier à deux doigts stérile, un produit lubrifiant."],["p","2.2.2. Conduite de l’examen :"],["li","L'inspection : va apprécier les caractères sexuels secondaires : les seins, la pilosité axillaire, la pilosité pubienne qui est triangulaire et les organes génitaux externes (fig. 5) : les grandes lèvres sont normalement charnues, les petites lèvres sont pigmentées et humides."],["p","FIG 3. _ Malade en position d'examen gynécologique."],["p","_ L'examen de l'abdomen :"],["li","La palpation permet de rechercher l'existence de zones douloureuses dans les fosses iliaques ou la région sus-pubienne; peut révéler l'existence d'une tumeur abdomino-pelvienne."],["li","La percussion est utile dans les tumeurs abdomino-pelviennes, elle permet de différencier un volumineux kyste de l'ovaire à développement abdominal d'une ascite. _ L'examen au spéculum : doit précéder le toucher vaginal; il permet d'apprécier l'aspect du col (fig. 6) de l'utérus."],["li","Sa situation : centrale ou déviée latéralement."],["li","Sa forme : conique chez la nullipare, cylindrique chez la multipare, atrophique chez la femme ménopausée."],["li","Son orifice externe : recherche de lésion traumatique à type de déchirure, d'érosions : qui sont le signe d'une exocervicite, d'ulcérations ou tumeur proliférante devant faire penser en premier lieu à un cancer du col. La lésion la plus banale est constituée par les œufs de Naboth qui sont des micro-kystes de la taille d'une tête d'épingle, disséminés à la surface du col dus à l'obturation des glandes cervicales."],["p","FIG. 6. — Aspect du col utérin vu au spéculum."],["p","Il permet également d'effectuer des frottis vaginaux (fig. 7) qui consiste à étaler sur une lame les cellules desquamées du col et du vagin et à les examiner au microscope ; il permet de pratiquer une colposcopie qui est l'examen du col à la loupe binoculaire après avoir badigeonné le col utérin avec une solution du Lugol (test de Schiller) : normalement le col prend une coloration brun-acajou ; les zones suspectes sont rosés, blanchâtres ou jaunâtres. Enfin, il permet d'effectuer des biopsies du col sous contrôle de la vue lorsqu'il existe des lésions suspectes."],["p","_ Le toucher vaginal : se fait avec le doigtier stérile à deux doigts en utilisant un produit lubrifiant (vaseline), l'index et le majeur sont introduits dans le vagin et vont apprécier :"],["li","L'état du col utérin : sa situation, sa consistance : normalement souple; ferme et élastique comparable au cartilage nasal; chez la femme enceinte, il est mou."],["li","L'état des culs-de-sac vaginaux : culs-de-sac latéraux et postérieur : leur souplesse et leur vacuité."],["p","Le toucher vaginal combiné au palper abdominal (fig. 8) permet d'apprécier l'utérus : son siège, sa forme, son volume, sa consistance et sa sensibilité et d'explorer les annexes : les ovaires normaux ne sont habituellement pas perçus sauf chez la femme maigre : ils sont retrouvés dans les culs-de-sac latéraux, ils ont la taille d'une amande et sont de consistance élastique."],["p","FIG. 7. — Technique des frottis vaginaux."],["p","FIG. 8. — Le toucher vaginal combiné au palper abdominal."],["p","Le toucher vaginal associé au toucher rectal permet d'apprécier l'état de la cloison rectovaginale. Enfin, on n'omettra pas de noter l'aspect du doigtier : normalement propre ou au contraire souillé de sang ou de leucorrhées. Chez la jeune fille, le toucher vaginal sera remplacé par le toucher rectal."],["h2","II. SÉMIOLOGIE DE L'APPAREIL GÉNITAL MASCULIN"],["h3","1. Rappel physiologique"],["p","Les premiers signes de la puberté apparaissent chez le garçon à l'âge de 13 ans, ils se manifestent par un développement de la verge, du scrotum et de la pilosité pubienne."],["p","La spermatogenèse est complète vers l'âge de 16 à 17 ans."],["pre","La pilosité des aisselles, de la face et du corps n'atteint son plein développement que   ans"],["p","après le début de la puberté soit à l'âge de 18 ans."],["h3","2. Etude sémiologique"],["p","Elle repose essentiellement sur l'examen clinique."],["p","2.1. L'inspection va apprécier l'aspect de la pilosité pubienne qui a normalement une forme losangique."],["p","2.2. L'inspection associée à la palpation de la verge : va rechercher en premier lieu, l'existence d'une circoncision."],["p","2.2.1. Si le sujet est circoncis : le méat est visible, on recherche à son niveau un écoulement urétral ou une inflammation."],["p","2.2.2. Si le sujet n'est pas circoncis :"],["li","Le prépuce doit être rétracté pour exposer le méat et rechercher un écoulement urétral ou une inflammation."],["li","Lorsque le prépuce ne peut être rétracté derrière le gland : il s'agit d'un phymosis."],["li","Lorsque le prépuce est déjà rétracté et resserré, de sorte qu'on ne peut le ramener sur le gland : il s'agit d'un paraphymosis."],["p","2.2.3. Dans tous les cas, on recherche :"],["li","Une ulcération du prépuce et du gland qui est indolore en cas de chancre syphilitique (lésion primaire); l'examen au microscope sur fond noir du produit de sécrétion de l'ulcération doit être systématique pour rechercher les tréponèmes."],["li","Une lésion tumorale."],["p","2.2.3. Une anomalie particulière peut être observée : le priapisme qui réalise une érection irréductible permanente et douloureuse en rapport avec une thrombose des corps caverneux."],["p","2.3. L'inspection associée à la palpation du scrotum : va rechercher :"],["p","2.3.1. Normalement sous la peau scrotale :"],["li","La vaginale : qui est la séreuse d'enveloppe du testicule et que l'on peut normale ment pincer."],["li","Les deux testicules qui normalement sont descendus à la naissance et qui sont sensibles à la pression."],["li","L'épididyme est couché sur le bord postéro-supérieur du testicule, il peut être identifié entre deux doigts qui peuvent le saisir après avoir glissé de bas en haut et d'avant en arrière le long des deux faces du testicule."],["li","Le segment inférieur du canal déférent fait suite à la queue de l’épididyme, il donne une sensation particulière de « corde à fouet »."],["p","Fi G.9. — Ectopie testiculaire."],["p","Epanchement séreux"],["p","Testicules"],["pre","FIG. 10.   - Hydrocèle."],["p","2.3.2. Les anomalies :"],["li","Une ectopie testiculaire ou cryptorchidie (fig. 9) qui est une anomalie de migration du testicule qui peut être uni ou bilatéral : absence d'un ou de deux testicules dans les bourses. A l'examen, la bourse est vide, on recherche le ou les testicules dans la région inguinale, lorsqu'il est retrouvé, il ne peut être abaissé à la main à sa place normale."],["li","Une hydrocèle (fig. 10) est un épanchement séreux de la vaginale: elle réalise une tuméfaction rénitente, non réductible, non impulsive à la toux, ce qui permet de la différencier d'une hernie inguinale."],["li","Un gros testicule : une tuméfaction intrascrotale surmontée d'un épididyme normal qui peut être pincé est un gros testicule (signe de Chevassu); lorsque la tuméfaction testiculaire est isolée chez un homme jeune, il faut penser en premier lieu au cancer du testicule."],["li","Une orchi-épididymite aiguë : réalise une tuméfaction du scrotum qui devient rouge, œdématié, chaud et douloureux, l’épididyme est épaissi et douloureux. Les signes accompagnateurs sont la fièvre et l'infection urinaire."],["p","2.4. Appréciation de la prostate par le toucher rectal : Le toucher rectal peut se faire soit en position genu-pectorale ou en décubitus dorsal en position gynécologique. Il permet la palpation de la prostate située contre la paroi antérieure du rectum."],["p","2.4.1. Normalement : la glande est petite, symétrique, mobile, de consistance élastique, en forme de carte à jouer ou en châtaigne, avec un sillon médian vertical (fig. 11)."],["p","Prostate normale"],["p","FIG 11. – Prostate normale"],["p","Adénome"],["p","FIG. 12. — Adénome de la prostate."],["p","2.4.2. A l'état pathologique : toute protrusion de la prostate dans la lumière rectale est l'indice d'une hypertrophie. Il s'agit soit d'un adénome, soit d'un cancer."],["li","L'adénome de la prostate : se manifeste par des signes fonctionnels urinaires : pollakiurie, rétention aiguë d'urine ou rétention chronique incomplète et au TR la prostate est augmentée de volume, dans son ensemble, elle est bombante, volumineuse, arrondie en balle de tennis, ferme et élastique régulière, le sillon médian n'est plus perceptible (fig. 12)."],["li","Le cancer de la prostate : peut être révélé par des signes fonctionnels urinaires : pollakiurie, dysurie et hématurie. Le TR met en évidence soit une prostate contenant un ou plusieurs nodules d'une dureté pierreuse, soit une prostate augmentée de volume avec conservation du sillon médian mais uniformément indurée, de consistance pierreuse."]]},{"ar":"الجهاز البولي","fr":"Sémiologie de l'appareil urinaire","w":2435,"b":[["p","L'étude de la sémiologie urinaire repose sur l'interrogatoire, l'examen clinique, un examen des urines et des examens complémentaires."],["h2","I. LES SIGNES FONCTIONNELS"],["p","L'interrogatoire va rechercher la notion de douleurs, de troubles de la miction et d'anomalies quantitatives de la diurèse."],["h3","1. Les douleurs"],["p","La douleur la plus typique est la douleur de la colique néphrétique qui réalise un syndrome douloureux paroxystique."],["p","1.1. Les circonstances déclenchantes sont :"],["li","Les micro-traumatismes : tel un long voyage en voiture."],["li","Une cure thermale."],["li","Un écart alimentaire : tel un repas riche en viande."],["p","1.2. Les prodromes : douleurs lombaires vagues, brûlures à la miction, parfois hématurie."],["p","1.3. Le début est le plus souvent brutal : la crise de colique néphrétique associe la douleur et les troubles de la miction."],["li","La douleur :"],["li","Siège : lombo-iliaque unilatérale à irradiations descendantes vers la région inguinogénitale."],["li","Type : sensation de déchirement, de brûlure ou de piqûre."],["li","Intensité : extrême, douleur atroce, permanente avec paroxysmes, le malade est agité, anxieux, cherchant en vain une position antalgique, d'où le nom de « colique frêne tique »."],["li","Les troubles de la miction : envie impérieuse d'uriner se terminant par l'émission de quelques gouttes d'urine très foncées (oligurie), contenant du sang (hématurie)."],["p","1 .4. L'examen clinique est normal : il n'y a pas de contracture abdominale."],["p","1.5. L'évolution de la crise est favorable en quelques heures, en moyenne huit heures. La fin de la crise est marquée par une polyurie véritable débâcle urinaire, qui s'accompagne parfois de l'élimination d'un calcul."],["p","1.6. Les examens complémentaires :"],["li","Au moment de la crise : la radiographie de l'appareil urinaire sans préparation peut montrer l'opacité d'un calcul ; l'urographie intraveineuse (UIV) montrera un rein muet du côté de la douleur."],["li","Après la crise : l'UIV pourra objectiver le ou les calculs."],["p","1.7. Valeur sémiologique : c'est essentiellement la lithiase urinaire, les autres causes sont : la migration d'un caillot sanguin, une coudure urétérale, une ptôse rénale."],["h3","2. Les troubles de la miction"],["p","2.1. La miction normale : le sujet urine 3 à 5 fois dans la journée et une fois la nuit. haque miction a un volume compris entre 100 et 300 ml. La miction normale se fait sans effort avec un jet régulier et sans fuite post mictionnelle."],["p","2.2. Les troubles de la miction :"],["li","Les brûlures mictionnelles : doivent faire rechercher une infection urinaire."],["li","La dysurie : est définie comme une difficulté à la miction, la vessie se vide avec effort, lentement, en plusieurs temps: l'existence d'une dysurie oriente vers un obstacle urétroprostatique."],["li","La pollakiurie : est définie comme la fréquence exagérée des mictions, elle est surtout nocturne prédominant dans la deuxième partie de la nuit. Elle peut être en rapport avec :"],["li","Une polyurie : excès de boisson, diabète, insuffisance rénale."],["li","Une réduction de la capacité vésicale : par anomalie de la vessie ou par compression extrinsèque."],["li","Une stagnation vésicale : au cours de la rétention chronique incomplète d'urine."],["li","La rétention chronique incomplète des urines : est due à un obstacle à l'évacuation vésicale réalisé par l'adénome de la prostate. Elle évolue en deux phases :"],["li","Phase de stagnation vésicale sans distension : le malade présente une pollakiurie avec dysurie."],["li","Phase de stagnation vésicale avec distension : le malade urine sans arrêt en perdant quelques gouttes, c'est la miction par regorgement qui réalise une pseudo incontinence."],["li","La rétention chronique complète des urines : elle survient chez un malade ayant un long passé de dysurie, elle est peu douloureuse, elle est soulagée passagèrement par le sondage vésical qui n'entraîne pas de reprise de la miction spontanée."],["li","La rétention aiguë d'urine : est un accident aigu, c'est l'impossibilité de vider la vessie pleine, elle se présente comme une envie d'uriner douloureuse : douleur hypogastrique intense accompagnée d'agitation et d'angoisse. La palpation de l'hypogastre retrouve le globe vésical. Le sondage vésical doit être fait d'urgence, il va être suivi d'une reprise normale de la diurèse."],["p","Les causes principales sont : traumatiques : rupture de l'urètre, atteinte de la commande nerveuse après fracture du rachis, post-opératoires réflexes."],["p","Les autres causes sont chez l'homme : le rétrécissement urétral et l'adénome prostatique; chez la femme : une compression de l'urètre par un utérus gravide ou une tumeur pelvienne."],["p","_ La pyurie : c'est la présence de pus dans les urines ; les urines ont un aspect trouble qui persiste après acidification (quelques gouttes d'acide acétique)."],["p","L'examen cyto-bactériologique des urines mettra en évidence la présence de polynucléaires plus ou moins altérés (plus de 10 leucocytes par mm3 ou plus de 10 000 par ml) et la présence de germes en grande quantité (supérieure à 100000 bactéries par ml)."],["p","Elle traduit une infection de l'appareil urinaire. _ L'hématurie ; est définie comme la présence de sang dans les urines. On distingue deux types d'hématurie :"],["li","L'hématurie macroscopique : les urines sont colorées en rouge vif ou sombre ; elle devra être distinguée d'une hémoglobinurie, d'une coloration alimentaire ou médicamenteuse, d'où l'importance de l'examen cytologique au microscope qui mettra en évidence les hématies ou globules rouges."],["li","L'hématurie microscopique : les urines sont claires, l'hématurie n'est décelable que par l'examen cytologique des urines : soit numération des hématies par mm3 qui sera supérieure à 5 hématies par mm3 ; soit par le compte d'Addis qui est la mesure du débit des hématies par minute qui sera supérieur à 5 000 hématies par minute. Afin de préciser l'origine de l'hématurie, on procédera à l'épreuve des trois verres. Le malade doit uriner successivement dans trois verres au cours de la même miction. Le premier verre recueille le début de la miction ou premier jet, le deuxième verre : la presque totalité de la miction et le troisième, la fin de la miction. Cette épreuve permet de distinguer trois types d'hématurie :"],["li","L'hématurie initiale (fig. 1-1) : seul le premier verre est teinté, c'est le premier jet qui rince la lésion : l'hématurie est d'origine urétro-prostatique."],["li","L'hématurie terminale (fig. 1 -2) : seul le troisième verre est teinté, la vessie en se vidant saigne; l'hématurie est d'origine vésicale."],["li","L'hématurie totale (fig. 1 -3) : elle teinte les trois verres, le sang provenant du rein est mélangé à l'urine : l'hématurie est d'origine rénale. En cas d'hématurie abondante, l'épreuve des trois verres est inutile, car quelle que soit son origine l'hématurie est toujours totale. L'hématurie impose un examen complet : recherche d'un gros rein, des points douloureux urétéraux, le TR et un examen général. Lorsque la cause n'est pas évidente, la cystoscopie est indispensable. Les causes des hématuries sont :"],["li","Urétro-cervico-prostatiques : adénome de la prostate et cancer de la prostate."],["li","Vésicales : les cystites aiguës ou chroniques, la lithiase vésicale, la bilharziose et les tumeurs."],["li","Rénales : la lithiase, la tuberculose, le cancer du rein, la maladie polykystique des reins."],["h3","3. Les anomalies quantitatives de la diurèse"],["p","La diurèse est la quantité d'urine éliminée par 24 heures. Normalement, la diurèse est en moyenne de 1,5 litre."],["p","3.1. La polyurie : c'est une augmentation importante de la diurèse qui devient supérieure à 3 litres par 24 heures. Elle peut relever de plusieurs causes :"],["li","Un excès de boisson, c'est la potomanie."],["li","Le diabète sucré : l'hyperglycémie entraîne une diurèse osmotique."],["li","Le diabète insipide par anomalie de la post-hypophyse (insuffisance de sécrétion d'ADH) : la diurèse est très abondante 4 à 5 litres par 24 heures faite d'urines très claires, de densité faible. La polyurie ne diminue pas lors de la restriction des boissons. L'administration d'ADH permet d'obtenir une diurèse normale."],["li","Le diabète insipide d'origine rénale : par anomalies du tube distal ou du tube collecteur, elle a les mêmes caractères que la précédente, mais elle n'est pas modifiée par l'administration d'ADH."],["p","3.2. L'oligo-anurie :"],["li","L'oligurie : est une diminution importante de la diurèse qui devient inférieure à 300 ml par 24 heures."],["li","L’anurie : on parle d'anurie toutes les fois que la sonde introduite dans la vessie d'un malade qui n'a pas uriné depuis quelques heures ou quelques jours ne ramène pas d'urine ; ce qui permet d'éliminer une rétention d'urine. L'oligurie et l'anurie sont deux symptômes qui ont la même valeur sémiologique, ils traduisent un dysfonctionnement rénal : soit une insuffisance rénale aiguë, soit une insuffisance rénale chronique à sa phase terminale."],["li","L'insuffisance rénale aiguë : qui peut relever de trois mécanismes : a) une chute de la tension artérielle inférieure à 6 cm de Hg par exemple en cas de collapsus cardio-vasculaire secondaire à une hémorragie ou à une déshydratation : il s'agit d'une insuffisance rénale fonctionnelle ou anurie pré-rénale; b) une anomalie anatomique du parenchyme rénal : néphropathie tubulo-intersticielle aiguë par exemple intoxication par les sulfamides : il s'agit d'une anurie dite rénale', c) une obstruction de la voie excrétrice : par exemple, par un calcul urétéral : il s'agit d'une anurie post-rénale. Quel que soit le mécanisme, l'anurie va évoluer en trois phases : la phase initiale est la phase de tolérance où il n'y a aucun trouble; la deuxième phase est celle où apparaissent : des signes digestifs : anorexie, vomissements, des signes nerveux : asthénie, crampes, et des"],["p","signes respiratoires : respiration de Kussmaul; la troisième phase est celle du coma urémique qui est un coma vigil Les examens biologiques vont montrer une augmentation de l'urée sanguine, de la créatinémie, une hyperkaliémie et une acidose métabolique."],["li","L'insuffisance rénale chronique à sa phase terminale : va comporter essentiellement des troubles digestifs : vomissements, des signes hémorragiques, une pâleur importante due à une anémie, un frottement péricardique intense et souvent un œdème aigu du poumon."],["h2","II. L'EXAMEN CLINIQUE DE L'APPAREIL URINAIRE"],["p","Doit comporter un examen des fosses lombaires à la recherche d'un gros rein; la recherche de points douloureux urétéraux et la recherche d'un globe vésical."],["h3","1. La recherche d'un gros rein"],["p","1.1. Technique : la palpation des fosses lombaires se fait sur le malade placé en décubitus dorsal, une main est placée dans la fosse lombaire; l'autre main palpe la paroi abdominale au niveau de l'hypocondre appuyant à chaque inspiration à la rencontre de la main postérieure."],["p","1.2. Résultats :"],["li","A l'état normal : les fosses lombaires sont libres et dépressibles ; un rein normal n 'est pas palpable."],["li","Le rein devient palpable lorsqu'il est ptôse ou lorsqu'il est augmenté de volume."],["li","Les caractères sémiologiques d'un gros rein sont :"],["li","Le contact lombaire : la main postérieure sent le gros rein sur une large surface."],["li","Le ballottement rénal (fig. 2) : lorsque la main postérieure imprime une brève secousse à la masse, celle-ci vient heurter la main antérieure placée dans l'hypocondre."],["p","FIG. 2. — Recherche du contact et du ballottement rénal."],["li","A la percussion de l'abdomen, le gros rein est barré par la sonorité colique."],["li","Enfin, il faut préciser que le rein, comme le foie et la rate, est mobile lors des mouvements respiratoires."],["li","Les causes de gros rein sont dominées : par le cancer du rein : qui donne un gros rein unilatéral associé à une hématurie, de la fièvre et parfois un varicocèle qui est une dilatation des veines du cordon spermatique chez l'homme, Les autres causes sont : le kyste solitaire du rein : tuméfaction unilatérale et la maladie polykystique qui intéresse les deux reins."],["h3","2. La recherche des points douloureux urétéraux"],["p","2.1. Le point urétéral supérieur : est situé dans l'angle costo-musculaire (fig. 3-1), il correspond au rein, au bassinet et à l'extrémité supérieure de l'uretère."],["p","2.2. Le point urétéral moyen : est situé sur la paroi abdominale à l'union du 1/3 moyen et du 1/3 externe de la ligne unissant les épines iliaques antérieures et supérieures (fig. 3-2); il correspond à la jonction de la portion lombaire et de la portion pelvienne de l'uretère."],["p","2.3. Le point urétéral inférieur : est perçu au toucher rectal, il correspond à la portion terminale de l'uretère."],["p","L'existence d'un point douloureux urétéral traduit soit l'existence d'une lithiase urétérale; soit d'une inflammation."],["p","Angle costo-musculaire = point urétéral supérieur"],["p","FIG 3.1.- Le point urétéral supérieur"],["p","Epine iliaque antéro-supérieure"],["p","FIG. 3.2. — Le point"],["p","urétéral moyen."],["h3","3. La recherche d'un globe vésical"],["p","Elle se fait par l'inspection, la palpation et la percussion."],["p","3.1. L'inspection : recherche une distension de la région hypogastrique."],["p","3.2. La palpation : met en évidence une tuméfaction, lisse, sensible, rénitente."],["p","3.3. La percussion : montre une matité sous-ombilicale à limite supérieure convexe vers le haut, ce qui permet de la différencier d'une ascite de moyenne abondance."],["h2","III. L'EXAMEN DES URINES"],["p","L'examen de l'appareil urinaire doit être complété par un recueil des urines de 24 heures qui permettra :"],["li","De mesurer la diurèse."],["li","D'apprécier l'aspect macroscopique des urines : Urines jaune clair : urines normales. Urines rouges : hématurie ou hémoglobinurie. Urines foncées : riches en pigments biliaires dans les ictères rétentionnels. Urines foncées, bouillon sale : évocatrices de glomérulonéphrite aiguë. Urines troubles, délavées : pyurie."],["li","De faire un examen au lit du malade à l'aide des bandelettes réactives (exemple, Labstix) qui permet de détecter : une albuminurie, une glycosurie et la présence de sang. Certaines bandelettes réactives (exemple : Combur 9) permettent de détecter les nitrites et les globules blancs témoins d'une infection urinaire."],["li","De faire un Uricult qui est la recherche d'une infection urinaire par la technique de la lame immergée, mais qui ne permet pas d'identifier le germe."],["li","De prélever un échantillon afin de l'envoyer pour analyse plus précise au laboratoire en cas d'anomalie décelée par les méthodes de dépistage pour examen chimique et cytobactériologique."],["h2","IV. LES AUTRES EXAMENS COMPLÉMENTAIRES"],["p","Comportent des examens biochimiques et des examens visant à visualiser les reins et les voies excrétrices."],["h3","1. Les examens biochimiques"],["p","1.1. Les examens sanguins : permettent de préciser la fonction rénale, ce sont essentiellement le dosage de l'urée sanguine et celui de la créatinémie."],["p","1.2. L'examen des urines : comporte le dosage de l'albuminurie des 24 heures et l'examen cyto-bactériologique des urines."],["h3","2. Les examens visualisant l'appareil urinaire"],["p","2.1. La radiographie de l’appareil urinaire sans préparation : permet d'évaluer la taille des reins et de mettre en évidence des calculs."],["p","2.2. L'urographie intraveineuse (UIV) : est la radiographie minutée de l'appareil urinaire prés injection intraveineuse de produit opaque éliminé par les reins, cet examen permet de visualiser les voies excrétrices : calices, bassinet, uretères et vessie et d'avoir une image indirecte des reins."],["p","2.3. La cystoscopie : est l'examen endoscopique de la vessie, il permet de la visualiser et de biopsier une éventuelle tumeur."],["p","2.4. L'échotomographie : permet grâce aux ultrasons de visualiser les reins et d'y déterminer une éventuelle formation kystique ou tumorale."],["p","2.5. L'artériographie rénale : est un examen invasif qui ne sera fait que lorsqu'une anomalie du rein ou d'une artère rénale aura été dépistée par les autres investigations."]]}]},{"ic":"🩸","ar":"أمراض الدم","fr":"La sémiologie hématologique","c":"#BE123C","ch":[{"ar":"سيميولوجيا الدم: فقر الدم والنزف","fr":"La sémiologie sanguine","w":4253,"b":[["p","L'étude de la sémiologie sanguine comporte deux volets : l'étude des anémies et celle des syndromes hémorragiques."],["h2","I. LES ANÉMIES"],["h3","1. Rappel physiologique des constituants du sang"],["p","Le sang circulant comporte deux phases :"],["li","Une phase liquide : le plasma."],["li","Une phase solide : les éléments figurés qui sont les globules rouges, les globules blancs et les plaquettes. Ces deux phases peuvent être séparées in vitro par centrifugation du sang veineux recueilli sur anticoagulant, on obtient une colonne de globules rouges, surmontée d'une bande mince blanchâtre contenant les globules blancs et les plaquettes et au-dessus le plasma."],["p","1.1. Le plasma : contient de l'eau, des protéines, des électrolytes et les facteurs de la coagulation."],["h4","1.2. Les éléments figurés"],["p","1.2.1. Les globules rouges ou hématies sont des cellules dépourvues de noyau qui contiennent l'hémoglobine protéine spécialisée dans le transport de l'oxygène : véritable poumon tissulaire."],["p","La quantité de globules rouges peut être évaluée grâce à trois paramètres :"],["li","La numération des globules rouges par mm3 : les chiffres normaux sont :"],["li","Chez la femme : 4 à 5,5 millions par mm3."],["li","Chez l'homme : 4,5 à 6,5 millions par mm3."],["li","Le taux d'hématocrite : exprimé en pourcentage, qui est le volume occupé par les globules rouges par rapport au sang total; les chiffres normaux sont :"],["li","Chez la femme : 38 à 47 %."],["li","Chez l'homme: 42 à 54%."],["p","Le taux d'hémoglobine exprimé en grammes pour 100 ml; les valeurs normales sont :"],["li","Chez la femme: 12à 16g/100ml."],["li","Chez l'homme: 14 à 18 g/100 ml. Ces trois paramètres permettent de calculer les indices hématimétriques :"],["li","Le volume globulaire moyen (VGM) qui est le rapport de l'hématocrite sur ! nombre de globules rouges exprimé en million que multiplie 10; il est normalement compris entre 80 et 95 femtolitres. Hématocrite"],["pre","VGM =                               X 10 = 80 à 95 fl"],["p","Nb dr GR en million"],["li","La concentration corpusculaire moyenne en hémoglobine (CCMH) qui est le rapport du taux d'hémoglobine sur le taux d'hématocrite que multiplie 100; il est normalement compris entre 32 et 36 %. Hémoglobine"],["pre","CCMH =                              X 100 = 32 à 36 %"],["p","Hématocrite"],["p","Normalement, les globules rouges sont normocytaires (VGM : normal) et normochromes (CCMH : normale)."],["p","Ces données numériques peuvent être vérifiées par l'étude morphologique des globules rouges sur le frottis sanguin."],["p","1.2.2. Les globules blancs ou leucocytes : sont des cellules nucléées, spécialisées dans les réactions de défense de l'organisme."],["p","Le chiffre normal est compris entre 4 000 et 10000 par mm3. Ils sont de trois types :"],["li","Les polynucléaires ou granuleux : représentent 50 à 70 % des globules blancs; ils assurent la défense immédiate contre les bactéries par phagocytose."],["li","Les lymphocytes : représentent 20 à 40 % des globules blancs ; ils assurent la défense contre des antigènes déjà connus : les lymphocytes B en sécrétant des anticorps, c'est l'immunité humorale, les lymphocytes T directement mais de manière retardée, c'est l'immunité cellulaire."],["li","Les monocytes : représentent 6 à 8% des globules blancs; ils participent aux réactions de défense en aidant à l'identification des antigènes."],["p","1.2.3. Les plaquettes : sont des fragments de cytoplasme, elles ont un rôle prépondérant dans l'hémostase primaire, leur taux normal est compris entre 200 000 et 400 000 par mm3, il sera vérifié par l'évaluation sur le frottis sanguin. Ainsi, en résumé, le sang assure plusieurs fonctions :"],["li","Transport de l'oxygène aux tissus grâce à l'hémoglobine contenue dans les globules rouges."],["li","Défense de l'organisme contre les antigènes grâce aux globules blancs."],["li","Arrêt des hémorragies lors d'une blessure grâce aux plaquettes et aux facteurs de la coagulation. Le lieu de fabrication des éléments figurés est la moelle osseuse."],["h3","2. Définition de l'anémie"],["p","L'anémie est définie comme une diminution du nombre de globules rouges, du taux d'hémoglobine et du taux d'hématocrite. La meilleure définition de l'anémie est la diminution du taux d'hémoglobine, car cette dernière reflète la valeur fonctionnelle des globules rouges."],["p","Il s'agit d'un symptôme et non d'une maladie; ce symptôme biologique se manifeste par un symptôme clinique la pâleur des téguments et des muqueuses. Ce symptôme est fréquent et relève de plusieurs mécanismes."],["h3","3. Physiopathologie"],["p","3.1. A l'état normal : les globules rouges sont fabriqués par la moelle, c'est l'érythropoïèse qui nécessite des matériaux indispensables."],["li","Le fer qui permet la synthèse de l'hémoglobine."],["li","Les facteurs anti-pernicieux : acide folique et vitamine B 12 qui sont indispensables à la synthèse de l'ADN et donc à la multiplication cellulaire. Ces matériaux sont apportés par l'alimentation. L'érythropoïèse est réglée par une hormone : l’érythropoïétine d'origine rénale qui stimule l'érythropoïèse; son taux augmente en cas d'hypoxie. D'autres hormones ont un effet stimulant les hormones thyroïdiennes, la STH, les androgènes. La durée de vie normale des globules rouges est de 120 jours au terme desquels ils sont détruits : c'est l'hémolyse physiologique. A l'état normal : il y a un équilibre parfait entre l'érythropoièse : chaque jour, la moelle osseuse libère environ 1 % de réticulocytes (précurseurs immédiats des globules rouges) et l'hémolyse."],["p","3.2. l'anémie résulte de la rupture de cet équilibre : elle peut relever de plusieurs mécanismes."],["p","3.2.1. Soit par raccourcissement de la durée de vie des globules rouges : c'est l'hémolyse pathologique qui peut être due à une anomalie corpusculaire du globule rouge intéressant soit la membrane, soit les enzymes, soit l'hémoglobine; définissant les anémies hémolytiques congénitales', elle peut être aussi d'origine extra-corpusculaire due à un facteur plasmatique anormal réalisant une anémie hémolytique acquise."],["p","3.2.2. Soit par perte excessive de globules rouges : par hémorragie abondante Dans ces deux cas, le mécanisme de l'anémie est périphérique, la moelle osseuse est normale; aussi, elle va tenter de compenser le déficit périphérique en multipliant sa production, d'où l'hyperréticulocytose observée définissant les anémies régénératives."],["p","3.2.3. Soit par insuffisance de production médullaire :"],["li","Par insuffisance de matériaux : anémie par carence en fer et anémie par carence en facteurs anti-pernicieux."],["li","Par anomalie de sécrétion de l'érythropoïétine : anémie de l'insuffisance rénale."],["li","Par anomalie de la moelle osseuse : qui peut être envahie par des cellules malignes : leucémie aiguë ou par anomalie primitive réalisant l'insuffisance médullaire. Cette insuffisance de production médullaire réalise une anémie de mécanisme central, au cours de laquelle le taux de réticulocytes est bas; il s'agit d'anémies arégénératives,"],["h3","4. Etude sémiologique"],["p","L'anémie sera suspectée cliniquement et sera prouvée biologiquement."],["p","4.1. Cliniquement : l'anémie se manifeste surtout par des signes cutanés et par des signes cardio-vasculaires."],["p","4.1.1. Signes cutanés :"],["li","La pâleur : est le signe capital, la pâleur cutanée peut être masquée par une hyperpigmentation, un ictère; de plus, elle n'est pas toujours le signe d'une anémie. Un sujet anémique présente toujours une décoloration des muqueuses, ainsi l'examen des muqueuses est plus fidèle que celui de la peau. La pâleur lorsqu'elle est discrète est recherchée dans des endroits privilégiés :"],["li","Au niveau du lit unguéal dont la coloration normalement rosée disparaît."],["li","Au niveau des muqueuses : lèvres, gencives, conjonctives."],["li","Au niveau de la paume des mains : ainsi la disparition de la teinte plus foncée des lignes de la main indique une perte de 50 % du taux d'hémoglobine."],["li","Les autres signes cutanés : la peau est sèche, écailleuse, possibilité d'ulcères chroniques de jambe (anémie hémolytique congénitale)."],["li","Les troubles des phanères :"],["li","Les poils et les cheveux deviennent fins, secs et rares."],["li","Les ongles deviennent fragiles, cassants, striés, parfois concaves, c'est la koïlonychie qui est surtout évocatrice de carence en fer."],["p","4.1.2. Signes cardio-vasculaires : l'intensité des signes cardio-vasculaires dépend du mode d'installation de l'anémie et de son intensité."],["li","Une anémie aiguë : d'installation brutale (exemple : hémorragie abondante) s'accompagne d'un état de choc avec : polypnée, refroidissement des extrémités, agitation, pouls rapide petit filant, TA abaissée, oligurie, veines périphériques collabées et pression veineuse centrale diminuée."],["li","Une anémie chronique : d'installation progressive, les signes cardio-vasculaires vont être fonction de l'intensité de l'anémie."],["li","Anémie modérée : se manifeste par des signes fonctionnels apparaissant à l'effort : dyspnée d'effort, palpitations; par des signes physiques : souffle systolique de pointe d'insuffisance mitrale fonctionnelle; parfois souffle à la base; par des signes radiologiques : augmentation de l'indice cardio-thoracique et par des signes électriques : troubles de la repolarisation."],["li","Anémie sévère : elle réalise un tableau d'insuffisance cardiaque globale avec dyspnée permanente, tachycardie, hépatomégalie congestive, œdèmes des membres inférieurs et douleurs angineuses chez le sujet âgé."],["p","4.1.3. Autres signes :"],["pre","— Signes neurologiques : céphalée, vertiges, lipothymie.                  1 Plus rarement,"],["p","paresthésies qui font évoquer une carence en vitamine B12 au cours de laquelle on recherchera un syndrome cordonal postérieur."],["li","Signes gastro-intestinaux : la glossite qui est une inflammation de la langue avec atrophie des papilles, va se manifester par des sensations de brûlures déclenchées par les mets chauds ou épicés; une dysphagie, des nausées, une diarrhée.'"],["li","Une splénomégalie : de taille variable, peut se voir au cours des anémies hémolytiques chroniques, des hémopathies malignes et des anémies par carence en fer."],["p","4.2. Biologiquement : l'anémie suspectée par la clinique est prouvée par la biologie, par la mesure des trois paramètres : numération des globules rouges, taux d'hématocrite et surtout taux d'hémoglobine qui permettront de calculer les indices hématimétriques dont le résultat sera indispensable pour classer l'anémie et avoir une orientation étiologique."],["p","En fait, ces signes biologiques ne seront constants qu'en cas d'anémie chronique."],["p","En effet, en cas d'anémie aiguë par hémorragie abondante au cours des premières heures, les trois paramètres restent normaux, car il y a eu une perte proportionnelle de plasma et de globules rouges et si l'on veut apprécier la perte sanguine, on devra se baser sur la clinique : en recherchant l'existence de signes de choc ou sur la mesure du volume sanguin total. Les signes biologiques classiques de l'anémie n'apparaîtront que plusieurs heures après lorsque les phénomènes compensateurs ayant pour but de rétablir la volémie auront eu lieu : passage de l'eau des secteurs extra-vasculaires et liquides perfusés."],["h3","5. Enquête étiologique"],["p","Elle repose sur l'interrogatoire, l'examen clinique et les examens biologiques."],["p","5.1. L'interrogatoire précisera :"],["li","L'alimentation du malade : recherche de carences."],["li","Les antécédents personnels :"],["li","Chez la femme : le nombre de grossesses, la notion de troubles des régies : ménorragies."],["li","Chez l'homme : la notion d'hémorragies digestives."],["li","Les antécédents familiaux : notion d'anémie familiale, de consanguinité des parents;"],["li","le mode d'installation : installation brutale : anémie aiguë; installation progressive : anémie chronique."],["p","5.2. L'examen clinique : recherchera les signes associés à l'anémie qui peuvent orienter vers une étiologie précise."],["li","Splénomégalie et subictére : anémie hémolytique chronique."],["li","Douleurs osseuses : anémie hémolytique congénitale : drépanocytose ou bien leucémie aiguë."],["li","Fièvre et hémorragies cutanéo-muqueuses : insuffisance médullaire."],["li","Adénopathie-splénomégalie : leucémie aiguë."],["h4","5.3. Les examens biologiques"],["p","5.3.1. Les indices hématimétriques : permettent de classer l'anémie :"],["li","VGM normal et CCMH normale : anémie normocytaire normochrome."],["li","VGM diminué et CCMH diminuée : anémie microcytaire et hypochrome."],["li","VGM augmenté et CCMH normale : anémie macrocytaire et normochrome."],["p","5.3.2. L'examen du frottis sanguin : permet de vérifier la taille et la coloration des globules rouges; d'apprécier les globules blancs et les plaquettes et de rechercher des cellules anormales : leucémies."],["p","5.3.3. Les autres examens :"],["li","Le taux de réticulocytes : compris entre 0,5 et 2 % soit 75 000 par mm3 en valeur absolue va permettre de dire si une anémie est régénérative, c'est-à-dire d'origine périphérique, le taux de réticulocytes est alors élevé supérieur à 120000 par mm3 ou si l'anémie est arégénérative. c'est-à-dire d'origine centrale, le taux de réticulocytes est alors inférieur à 120000 par mm3."],["li","Le dosage de la bilirubine indirecte : supérieure à 5 mg par litre dans l'hémolyse pathologique."],["li","Le fer sérique : normalement de 100//g pour 100 ml. Il est bas dans les carences martiales."],["li","L'électrophorèse de l'hémoglobine qui permet de dépister une anomalie de"],["h3","6. Les différentes causes"],["p","6.1. Les anémies chroniques : sont soit d'origine centrale, soit d'origine périphérique."],["p","6.1.1. Les anémies par carences enfer : les causes les plus fréquentes sont les hémorragies génitales chez la femme et les hémorragies digestives chez l'homme."],["p","Biologiquement, l'anémie est de type microcytaire hypochrome avec hyposidérémie (diminution du fer sérique)."],["p","6.1.2. Les anémies par carence en facteur anti-pernicieux :"],["li","Soit par carence en acide folique : déficit d'apport qui est démasqué par les grossesses."],["li","Soit par carence en vitamine B12 : par malabsorption. Elles se manifestent cliniquement par une anémie profonde associée à des signes digestifs et à des signes neurologiques : syndrome cordonal postérieur en cas d'avitaminose B12. Biologiquement : l'anémie est de type macrocytaire normochrome."],["p","6.1.3. L'anémie hémolytique chronique :"],["li","Cliniquement : on retrouve la triade classique : pâleur, subictére et splénomégalie."],["li","Biologiquement : l'anémie est associée à une augmentation de la bilirubine indirecte, à une augmentation des réticulocytes et à un fer sérique variable soit normal, soit augmenté. La cause la plus fréquente en Algérie est l'anémie hémolytique congénitale due à une anomalie de l'hémoglobine : l'anémie est observée chez l'enfant qui présente souvent un retard stature-pondéral, il s'agit :"],["li","Soit d'une thalassémie avec aspect particulier du faciès de type mongoloïde."],["li","Soit d'une drépanocytose avec douleurs osseuses et disparition de la splénomégalie audelà de l'âge de 10 ans."],["p","6.1.4. L'anémie au cours des leucémies aiguës :"],["li","Cliniquement : on retrouve l'association évocatrice de pâleur, fièvre, syndrome hémorragique, douleurs osseuses, adénopathies et splénomégalie."],["li","Biologiquement : le frottis sanguin montre la présence de cellules malignes."],["p","6.2. Les anémies aiguës : elles sont toujours d'origine périphérique."],["p","6.2.1. Les anémies post-hémorragiques : les plus fréquentes sont les hémorragies digestives."],["li","Cliniquement : tableau de choc hémorragique."],["li","Biologiquement : l'hémoglobine, l'hématocrite et le nombre de globules rouges sont normaux pendant les premières heures."],["p","6.2.2. L'anémie hémolytique aiguë : peut relever de causes diverses; l'exemple le plus caractéristique est l'accident transfusionnel par transfusion de sang incompatible dans le système ABO."],["li","Cliniquement : le sujet présente des douleurs lombaires, une fièvre, une tendance au collapsus et ses urines sont rouges porto ou rouge selecto (coloration due à l'hémoglobinurie)."],["li","Biologiquement : l'anémie est associée à une hémoglobinurie, puis au bout de quelques heures, les autres signes d'hémolyse apparaissent."],["h2","II. LES SYNDROMES HÉMORRAGIQUES"],["h3","1. Rappel physiologique de l'hémostase et des méthodes d'exploration"],["p","1.1. Définition de l'hémostase : L'hémostase permanente est l'ensemble des phénomènes qui permettent que le sang reste fluide à l'intérieur des vaisseaux. L'hémostase réactionnelle est l'ensemble des phénomènes qui permettent l'arrêt d'une hémorragie secondaire à une brèche dans un vaisseau de petit calibre."],["h4","1.2. Les différents temps de l'hémostase"],["p","1.2.1. L'hémostase primaire : ou temps vasculo-plaquettaire nécessite l'intégrité des vaisseaux et des plaquettes. A l'état normal, les plaquettes tapissent d'un film continu la surface de l'endothélium des petits vaisseaux en assurant ainsi l'étanchéité. En effet, on sait que les cellules endothéliales des petits vaisseaux ne sont pas jointives et ménagent entre elles des espaces (fig. 1)."],["p","Film plaquettaire"],["p","Cellule endothéliale"],["p","FIG. 1. — Coupe transversale d'un capillaire."],["p","Lors d'une brèche vasculaire intéressant un vaisseau de petit calibre, on observe :"],["li","Une vaso-constriction du vaisseau lésé, ce qui entraîne un ralentissement de la circulation : c'est le temps vasculaire."],["li","Puis, les plaquettes adhérent à la brèche et s'agrègent formant le thrombus blanc ou clou plaquettaire : c'est le temps plaquettaire. En fait, ces deux temps vasculaire et plaquettaire sont intriqués."],["p","1.2.2. La coagulation : est assurée par des protéines plasmatiques spécialisées qui sont les facteurs de la coagulation (13 facteurs de 1 à XIII). La coagulation aboutit à la formation du thrombus rouge qui est le résultat de la transformation du fibrinogène soluble en fibrine insoluble dont les mailles enserrent les globules rouges et les globules blancs : ce caillot sanguin assure une hémostase durable."],["p","La coagulation est un ensemble de réactions complexes en cascades qui se déroule en trois temps : le premier temps, la thromboplastino-formation aboutit à la formation de prothrombinase suivant deux voies : une voie exogène et une voie endogène ; le deuxième temps est la thrombino-formation sous l'action de la prothrombinase; enfin, le troisième temps est la fibrine-formation sous l'action de la thrombine (fig. 2)"],["p","1.2.3. La post-coagulation ou fibrinolyse : va assurer la reperméabilisation du vaisseau par dissolution du caillot, elle a lieu lors de la cicatrisation vasculaire."],["pre","Voie endogène                                    Voie exogène"],["p","Thromboplastine tissulaire"],["pre","              XII                                                VII\nTCK          XI                                                                  TP"],["p","IX VIII"],["pre","X + V + phospholipide    = prothrombinase"],["pre","Prothrombine                    Thrombine"],["pre","Fibrinogène                  Fibrine"],["p","FIG 2. – Schéma de la coagulation"],["h4","1.3. L'exploration de l’hémostase"],["p","1.3.1. L'exploration de l'hémostase primaire : se fait par le signe du lacet, le temps de saignement et la numération des plaquettes."],["li","Le signe du lacet : se fait au lit du malade à l'aide du brassard du tensiomètre maintenu gonflé pendant 5 minutes à la pression moyenne, puis on le dégonfle et on observe la peau de l'avant-bras située au-dessous du brassard et on compte le nombre de pétéchies apparues à ce niveau (fig. 3). A l'état normal : il n'existe aucune pétéchie ou moins de 10. Le test est peu spécifique, il sera positif au cours des anomalies de la paroi vasculaire et au cours des anomalies plaquettaires."],["li","Le temps de saignement (TS) : par la méthode de Duke, consiste à pratiquer à l'aide d'un vaccinostyle une incision horizontale du lobule de l'oreille longue de 1 cm et profonde de 1 mm; les gouttes de sang sont recueillies sur un buvard toutes les 30 secondes. Le TS normal est de 2 à 4 minutes. On considère qu'il est pathologique lorsqu'il est supérieur à 5 minutes, il est alors le signe d'une anomalie plaquettaire."],["li","La numération des plaquettes : le taux normal des plaquettes est compris entre 200 000 et 400 000 par mm3. La numération sera contrôlée par l'examen des plaquettes sur le frottis sanguin."],["p","1.3.2. L'exploration de la coagulation : repose sur trois tests principaux, le temps de Howell, le taux de prothrombine et le temps de céphaline-kaolin."],["li","Le temps de Howell est le temps de coagulation du plasma recalcifié; comparé à celui d'un témoin, il explore l'ensemble de la coagulation; il s'agit d'un test peu sensible et peu reproductible. Normalement, il est compris entre 1 mn 30 s et 2 mn."],["p","Tensiomètre"],["p","FIG 3. – LE SIGNE DU LACET"],["li","Le taux de prothrombine (TP) ou temps de Quick explore la voie exogène de la thromboplastino-formation, c'est à-dire le complexe prothrombinique. Il est également interprété par rapport à un témoin. Il est normalement compris entre 11 et 13 secondes, ce qui correspond à un taux de prothrombine entre 70 et 100 %. On considère qu'il est pathologique au-dessous de 70 %."],["li","Le Temps de céphaline-kaolin (TCK) explore la voie endogène de la thromboplastinoformation. Il est également interprété par rapport à un témoin. Il est normalement compris entre 50 et 70 secondes. On considère qu'il est pathologique lorsqu'il y a une différence supérieure a 10 secondes par rapport au temps du témoin."],["h3","2. Mécanismes des syndromes hémorragiques"],["p","2 1 Le mécanisme le plus fréquent est le syndrome hémorragique de cause locale par brèche vasculaire, il réalise une hémorragie localisée d'abondance variable."],["p","2.2. Le deuxième mécanisme plus rare est une anomalie de l'un des temps de l'hémostase."],["p","2.2.1. Anomalie de l'hémostase primaire :"],["li","Soit d'origine vasculaire : réalisant le purpura vasculaire."],["li","Soit d'origine plaquettaire : le plus souvent en rapport avec une diminution importante du taux des plaquettes (thrombopénie) : réalisant le purpura thrombopénique, dans ce cas, les hémorragies sont spontanées et diffuses car le film plaquettaire n'assure plus l'étanchéité des capillaires cutanés et muqueux."],["p","2.2.2. Anomalie de la coagulation : réalisant le p'us souvent des hémorragies provoquées par des traumatismes minimes, ce sont les coagulopathies dont le type le plus caractéristique est l'hémophilie qui est une coagulopathie héréditaire transmise par les filles, atteignant les garçons, due à un déficit du facteur anti-hémophilique A ou du facteur anti-hémophilique B (facteurs intervenant au niveau de la voie endogène de la tnromboplastino-formation)."],["h3","3. Etude sémiologique"],["p","Elle va comporter l'étude du purpura et celle des coagutopathîes."],["h4","3.1. Le purpura"],["p","3.1.1. Définition : le purpura est une extra-vasation du sang hors des capillaires cutanés, il peut être isolé ou associé à des hémorragies muqueuses et viscérales réalisant le purpura hémorragique. Il s'agit le plus souvent d’affections acquises qui sont dues à une anomalie de l'hémostase primaire dans l'un de ses deux temps. Il s'agit d'hémorragies spontanées."],["p","3.1.2. Les signes cutanés :"],["li","Le purpura : est une hémorragie cutanée spontanée ne s'effaçant pas à la vitro-pression; il doit être différencié de l'érythème et des télangiectasies qui s'effacent à la vito-pression. Il peut se présenter sous trois aspects :"],["li","Les pétéchies : il s'agit de macules rouge vif, punctiformes, dont le diamètre est inférieur à 1 cm, prédominant au niveau des membres inférieurs."],["li","Les vibices : sont des hémorragies cutanées linéaires, en stries, siégeant surtout au niveau des plis de flexion."],["li","Les ecchymoses : ou « bleus » sont des hémorragies cutanées qui siègent au niveau de l'hypoderme, de coloration bleu foncé et qui évoluent comme les bleus traumatiques en passant par toutes les teintes de la biligénie : violet, vert et jaune."],["li","Les autres signes cutanés : des macules, des papules, des vésicules et des bulles peuvent être associées au purpura."],["p","3.1.3. Les hémorragies muqueuses :"],["li","Bulles sanglantes au niveau de la muqueuse buccale."],["li","Epistaxis."],["li","Gingivorragies."],["li","Hémorragies génitales : le plus souvent à type de ménorragies."],["p","3.4.4. Les hémorragies viscérales sont plus rares :"],["li","Hémorragies digestives."],["li","Hémorragies rétiniennes : sont graves, car elles risquent d'entraîner une cécité définitive."],["li","Les hémorragies méningées : sont également très graves, car elles risquent d'entraîner la mort."],["h4","3.2. Les coagulopathies"],["p","3.2.1. Définition : les coagulopathies réalisent des hémorragies cutanées à type d'hématomes, des hémorragies muqueuses surtout à type d'épistaxis et des hémorragies profondes : musculaires et articulaires; ces hémorragies sont le plus souvent provoquées. Elles sont le plus souvent congénitales, la plus fréquente est l'hémophilie; elles peuvent être acquises : traitement aux anticoagulants."],["p","3.2.2. Etude clinique : elle repose sur l'interrogatoire et l'examen clinique."],["li","L'interrogatoire : va préciser les circonstances d'apparition des hémorragies."],["li","Les traumatismes accidentels : seules les blessures profondes vont s'accompagner d'une hémorragie persistante. Les blessures superficielles, par exemple coupure de rasoir au niveau du visage, saignent pendant un temps normal."],["li","Les extractions dentaires : vont mettre en évidence la tendance hémorragique du sujet. Chez le sujet normal, une extraction dentaire entraîne un saignement qui dure environ 30 minutes et ensuite qui s'arrête rapidement. Au cours des coagulopathies, le saignement immédiat est identique à celui du sujet normal mais après un arrêt, le saignement reprend et persiste pendant plusieurs jours."],["li","Les interventions chirurgicales : deux circonstances privilégiées fréquentes chez l'enfant peuvent faire découvrir une coagulopathie en particulier une hémophilie."],["li","l'amygdalectomie;"],["li","la circoncision. Ces deux interventions vont s'accompagner d'hémorragies prolongées et abondantes pouvant mettre en danger la vie du malade. _ L'examen clinique : va préciser l'aspect des hémorragies; celles-ci sont variables selon l'âge."],["li","Hématomes cutanés : chez le nourrisson au niveau du front, au niveau des membres."],["li","Hémarthroses, qui sont des hémorragies intra-articulaires, vont apparaître plus tard, lorsque l'enfant marche, il s'agit d'un signe caractéristique de coagulopathie."],["li","Hématomes profonds : qui siègent dans les espaces cellulo-aponévrotiques et qui surviennent après un traumatisme ou injection intramusculaire : ils sont volumineux et douloureux pouvant entraîner des phénomènes de compression nerveuse au niveau des membres ou bien simuler une urgence chirurgicale : exemple : l'hématome du psoas qui peut simuler une appendicite aiguë."],["li","Les hématuries : sont fréquentes ; elles se voient au cours des coagulopathies congénitales mais elles sont également le premier signe d'un surdosage d'anticoagulants."],["h3","4. Les différents syndromes hémorragiques"],["p","4.1. Causes locales : par brèche vasculaire sont de loin les hémorragies les plus fréquentes. Elles sont localisées. Elles sont en rapport avec un traumatisme ou une lésion vasculaire d'un viscère : hémorragie digestive par ulcère gastrique ou duodénal ou par rupture de varices œsophagiennes au cours de l'hypertension portale."],["h4","4.2. Syndromes hémorragiques liés à une anomalie de l'hémostase"],["p","4.2.1. Les purpuras : par anomalie de l'hémostase primaire."],["li","Les purpuras vasculaires :"],["li","Le purpura rhumatoïde : qui se voit chez l'enfant :"],["li","cliniquement, il s'agit d'un purpura pétéchial associé à d'autres lésions cutanées de nature inflammatoire : érythème, macules et papules ; ce purpura est associé à des arthralgies ou des arthrites et à des signes abdominaux : crises douloureuses avec parfois hémorragies digestives à type de méléna; il s'agit d'un purpura aigu allergique;"],["li","biologiquement, le signe du lacet peut être positif, mais le temps de saignement et la numération des plaquettes sont normaux."],["li","Le purpura sénile : qui se voit chez le vieillard cliniquement, il réalise soit un purpura pétéchial, soit des hémorragies cutanées en plaques qui siègent sur le dos des mains et la face dorsale des avant-bras."],["li","Le purpura thrombopénique :"],["li","Cliniquement : il s'agit d'un purpura hémorragique associant un purpura pétéchial et ecchymotique et des hémorragies muqueuses."],["li","Biologiquement : le signe du lacet est souvent positif, le temps de saignement est allongé et le chiffre des plaquettes est effondré égal ou inférieur à 50000 par mm3 (thrombopénie)."],["p","4.2.2. Les coagulopathies : peuvent être congénitales ou acquises."],["li","Congénitales : l'hémophilie qui atteint les garçons, elle se manifeste habituellement précocement. Une circonstance de découverte fréquente est l'hémorragie prolongée lors de la circoncision. La manifestation clinique la plus évocatrice est l'hémarthrose à répétition qui siège au niveau des grosses articulations : genoux, chevilles, et coudes. Biologiquement, les tests de l'hémostase primaire sont normaux et parmi les tests explorant la coagulation seuls le temps de Howell et le TCK sont allongés, le TP est normal."],["li","Acquises : le traitement aux anticoagulants lors d'un surdosage."],["li","Soit par l'Héparine : qui est une antithrombine."],["li","Soit par les antivitamines K : qui perturbent la synthèse par la cellule hépatique des facteurs du complexe prothrombinique. D'où nécessité impérieuse d'un contrôle biologique strict et régulier au cours de ces traitements."]]},{"ar":"الجهاز اللمفاوي: الغدد والطحال","fr":"Sémiologie lympho-ganglionnaire","w":4279,"b":[["p","La sémiologie de l'appareil lympho-ganglionnaire comporte l'étude des ganglions et de la rate : les ganglions pathologiques sont hypertrophiés, lorsque leur diamètre est égal ou supérieur à un centimètre, ils réalisent les adénopathies ; la rate lorsqu'elle est le siège d'un processus pathologique augmente habituellement de volume et devient palpable, elle réalise une splénomégalie. Nous étudierons successivement les adénopathies et les splénomégalies."],["h2","I. LES ADÉNOPATHIES"],["h3","1. Rappel anatomo-pathologique"],["li","Il existe 500 à 600 ganglions répartis dans tout l'organisme, ils mesurent quelques millimètres de diamètre."],["li","Normalement, ils ne sont pas palpables: toutefois, ils peuvent être palpables dans certains cas, mais leur diamètre reste inférieur à un centimètre, ils réalisent alors des microadénopathies."],["li","Chez l'adulte : au niveau des aires inguinales."],["li","Chez l'enfant : au niveau de toutes les aires ganglionnaires. Ces micro-adénopathies sont dépourvues de signification pathologique. Les ganglions drainent la lymphe des différents organes, cette lymphe est véhiculée à travers les vaisseaux lymphatiques jusqu'au canal thoracique qui se jette dans le creux sus claviculaire gauche au niveau du confluent de Pirogoff: une partie de la lymphe provenant du médiastin est drainée par la grande veine lymphatique qui se jette dans le creux sus claviculaire droit. Les ganglions sont répartis en ganglions superficiels répartis essentiellement dans les aires cervicales, axillaires et inguinales (fig. 1) et en ganglions profonds qui sont les ganglions médiastinaux et les ganglions abdominaux. Le ganglion lymphatique comporte deux sortes de tissus :"],["li","Le tissu lymphoïde dont la disposition est folliculaire: ce tissu lymphoïde est le support des réactions immunitaires à médiation humorale par l'intermédiaire des lymphocytes B qui sécrètent les anticorps et à médiation cellulaire grâce aux lymphocytes T."],["li","Le tissu réticulo-histiocytaire qui a une fonction de macrophagie, il exerce une fonction de filtre."],["p","FIG. 1. — Les adénopathies superficielles."],["h3","2. Physio-pathologie des adénopathies"],["p","Une adénopathie peut être due à deux mécanismes principaux :"],["p","2.1. Une infection : qui peut être soit locale et qui entraîne une adénopathie réactionnelle dans le territoire correspondant ; soit générale et qui s'accompagnera alors d'adénopathies diffuses."],["p","2.2. Une prolifération maligne au sein du ganglion :"],["li","Soit à partir des cellules lymphoïdes réalisant une prolifération lymphoïde maligne ou lymphome."],["li","Soit à partir de cellules malignes extra-ganglionnaires qui ont migré à partir d'un cancer viscéral de voisinage réalisant une métastase ganglionnaire."],["h3","3. Etude sémiologique"],["p","Nous étudierons successivement les différentes adénopathies : superficielles et profondes et leurs caractères sémiologiques."],["p","G. prétragien G. occipitaux G. parotidien G. jugulo-carotidiens"],["pre","G. sus-claviculaire                                      sous-maxillaires"],["p","FIG 2. – Les ganglions cervicaux 3.1. Les différentes adénopathies 3.1.1. Les adénopathies superficielles (fig. 1) sont reconnues par l'examen clinique :"],["li","L'inspection peut mettre en évidence l'augmentation d'un ou plusieurs ganglions sous forme d'une masse de volume et de forme variables; l'adénopathie sera visible surtout lorsqu'elle est volumineuse, elle soulève alors la peau. L'inspection permet également d'étudier les téguments qui recouvrent l'adénopathie ; la peau peut être :"],["li","soit normale;"],["li","soit amincie et ulcérée : adénite tuberculeuse."],["li","La palpation doit être pratiquée en faisant relâcher les muscles qui recouvrent la région observée; la palpation permet de préciser les caractères suivants des adénopathies : leur siège et leur aspect : taille, consistance, sensibilité, mobilité par rapport à la peau et aux plans profonds. a) Les adénopathies cervicales (fig. 2) :"],["li","Technique de recherche : le sujet est assis face à l'examinateur la tête penchée en avant et tournée vers le côté à examiner, ce qui permet d'obtenir un relâchement des muscles du cou, notamment du sterno-cléido-mastoïdien. La main palpe les différentes régions : prétragienne, parotidienne, sous-occipitale, sous-maxillaire et sous-mentonnière en plaçant les doigts en crochet et la région jugulo-carotidienne. Les adénopathies sus-claviculaires seront recherchées au mieux en se plaçant derrière le sujet, les creux sus-claviculaires seront explorés avec les doigts recourbés en crochet."],["li","Résultats :"],["li","Les ganglions sous-mentonniers : drainent les lèvres et les gencives."],["li","Les ganglions sous-maxillaires : drainent les lèvres, les gencives, les joues, le plancher de la bouche, la langue, les glandes sous-maxillaires et le massif facial. Ils doivent être différencié d'une tuméfaction de la glande sous-maxillaire due à une lithiase."],["li","Les ganglions prétragiens et parotidiens : drainent les conjonctives, le cuir chevelu, les parotides et l'oreille moyenne."],["li","Les ganglions sous-occipitaux : drainent le cuir chevelu et le naso-pharynx."],["li","Les ganglions jugulo-carotidiens : drainent le voile du palais, le larynx, le pharynx et les amygdales. Ils doivent être différenciés d'un kyste congénital du cou,d'un kyste de la thyroïde"],["p","dans ce cas la tuméfaction est mobile avec les mouvements de la déglutition, d'un lipome."],["li","Le ganglion sus-claviculaire droit : draine l'oesophage, la thyroïde, le sein droit, le poumon droit et la moitié inférieure du poumon gauche."],["li","Le ganglion sus-claviculaire gauche : draine le sein gauche, la thyroïde, la moitié supérieure du poumon gauche, le tube digestif et les organes génitaux. Une adénopathie sus claviculaire gauche réalise le ganglion de Troisier qui doit faire évoquer un cancer digestif ou un cancer génital. b) Les adénopathies axillaires :"],["li","Technique de recherche : cette recherche peut se faire sur le sujet couché ou assis, l'examinateur soulève de sa main gauche le bras du sujet et palpe avec sa main droite en introduisant ses doigts au sommet de la pyramide axillaire et en redescendant le long de la paroi thoracique."],["li","Résultats : les ganglions axillaires drainent les seins, la paroi thoracique, les membres supérieurs et la paroi abdominale supérieure. Ils doivent être différenciés d'une hydrosadénite (inflammation d'une glande sudoripare), chez la femme d'un prolongement de la glande mammaire et d'un lipome. c) Les adénopathies inguinales (fig. 3) :"],["li","Technique de recherche : le sujet est examiné en décubitus dorsal, la cuisse en position normale d'extension; la main palpe au-dessus du pli inguinal pour rechercher les ganglions profonds rétro-cruraux ; puis on palpe le pli inguinal et enfin la face antéro-interne de la cuisse."],["li","Résultats : les ganglions inguinaux sont répartis en deux groupes :"],["li","Les deux groupes inférieurs sont situés verticalement dans le triangle de scarpa, ils drainent les lymphatiques du membre inférieur."],["li","Les deux groupes supérieurs sont orientés parallèlement à l'arcade crurale, ils drainent les lymphatiques de l'appareil génital externe et de l'anus. Ces ganglions sont eux-mêmes drainés dans les ganglions profonds rétro-cruraux. Ils doivent être différenciés d'une hernie inguinale : molle, impulsive à la toux et réductible; d'une ectopie testiculaire par la palpation systématique des testicules dans les bourses; d'un kyste du canal inguinal chez la femme ou du cordon spermatique chez l'homme : le diagnostic est le plus souvent opératoire."],["p","Ganglions rétro-cruraux"],["p","Ganglions inguinaux"],["p","FIG 3. – Les ganglions inguinaux"],["p","d) Les autres adénopathies :"],["li","Ganglions épitrochléens : sont recherchés les doigts en crochet au-dessus de l'épitrochlée le long de la face postéro-interne du bras; ils drainent la main."],["li","Les ganglions poplités : sont recherchés dans le creux poplité, les jambes étant à demi fléchies; ils drainent la jambe."],["p","3.1.2. Les adénopathies profondes : sont les adénopathies médiastinales et les adénopathies abdominales."],["p","a) Les adénopathies médiastinales : peuvent être suspectées cliniquement lorsqu'elles sont volumineuses, car elles entraînent alors un syndrome de compression de la veine cave supérieure associant un œdème en pèlerine, une augmentation de la circulation thoracique veineuse superficielle et des télangiectasies rosées basi-thoraciques."],["p","Le plus souvent, les adénopathies médiastinales sont découvertes sur le téléthorax, elles sont précisées par les tomographies du médiastin; elles peuvent être :"],["li","Latéro-trachéales : hautes."],["li","Hilaires : interbronchiques et sus-bronchiques."],["li","Plus rarement, inter-trachéo-bronchiques."],["p","b) Les adénopathies abdominales :"],["li","Les adénopathies intra-péritonéales quand elles sont volumineuses peuvent entraîner des troubles du transit et la palpation de l'abdomen peut alors les mettre en évidence. Lorsqu'elles sont de volume modéré, elles ne sont pas palpables et aucune investigation complémentaire ne peut les mettre en évidence, seule la laparotomie permet de les visualiser et de les prélever."],["li","Les adénopathies rétro-péritonéales : pourront être mises en évidence radiologiquement par la lymphographie anatomique qui consiste à injecter du lipiodol ultra-fluide dans un lymphatique du dos du pied, le lipiodol suit le courant lymphatique et va opacifier les ganglions inguinaux, iliaques, lombo-aortiques et le canal thoracique."],["h4","3.2. Les caractères sémiologiques"],["p","3.2.1. Leur topographie :"],["li","Localisée : adénopathie occupant une seule aire ganglionnaire."],["li","Loco-régionale : adénopathies occupant plusieurs aires ganglionnaires d'un même côté du diaphragme soit sus-diaphragmatique, soit sous-diaphragmatique."],["li","Généralisée : adénopathies occupant plusieurs aires ganglionnaires de part et d'autre du diaphragme."],["p","3.2.2. Leur aspect :"],["li","La taille précise mesurée en centimètres."],["li","La consistance : qui peut être molle ou rénitente, ferme et élastique ou dure."],["li","La sensibilité."],["li","La mobilité par rapport à la peau et aux plans profonds, la mobilité des adénopathies ou bien au contraire l'existence d'une périadénite qui soude entre eux les ganglions."],["li","L'état de la peau qui les recouvre : normale, rouge luisante, siège d'une fistule : orifice par lequel s'écoule du pus ou encore siège d'une écrouelle : cicatrice ombiliquée d'une ancienne fistule tuberculeuse."],["h3","4. Enquête étiologîque"],["p","Elle repose sur l'interrogatoire, l'examen clinique et les examens complémentaires."],["p","4.1. L'interrogatoire : recherche la notion de vaccination au BCG, vérifiée par la recherche d'une cicatrice à la face antérieure de l'avant-bras, la notion de contage tuberculeux; il précise la date d'apparition des adénopathies et vérifie l'existence d'un traitement antérieur."],["p","4.2. L'examen clinique comporte deux temps :"],["p","4.2.1. Un examen systématique des territoires drainés par l’adénopathie : exemple, en cas d'adénopathie axillaire : examen du sein, de la paroi thoracique, de la paroi abdominale supérieure et du membre supérieur."],["p","4.2.2. Un examen général : à la recherche de signes généraux : fièvre, sueurs nocturnes, amaigrissement et d'autres signes cliniques accompagnateurs : splénomégalie, signes hémorragiques, pâleur cutanéo-muqueuse."],["p","4.3. Les examens complémentaires :"],["p","4.3.1. Les examens simples seront pratiqués systématiquement :"],["li","L'hémogramme ou NFS (numération formule sanguine)."],["li","L'intra-dermo-réaction à la tuberculine (IDR)."],["li","La ponction ganglionnaire : va permettre d'apprécier l'aspect du produit de ponction."],["li","Soit suc ganglionnaire."],["li","Soit pus franc."],["li","Soit caséum : pus blanchâtre, lié, grumeleux. et de faire un examen cytologique et bactériologique."],["p","4.3.2. La biopsie ganglionnaire : exérèse du ganglion sous anesthésie locale permet de faire l'examen anatomo-pathologique; elle ne sera faite que lorsque le diagnostic n'aura pu être posé par l'interrogatoire, l'examen clinique et les examens simples."],["h3","5. Les différentes causes"],["p","Les adénopathies peuvent être bénignes ou malignes."],["p","5.1. Les adénopathies bénignes : sont de nature inflammatoire :"],["li","Les adénopathies inflammatoires aiguës"],["li","Elles sont le plus souvent localisées, en rapport avec une infection de voisinage : elles réalisent une adénopathie sensible, augmentant rapidement de volume, la peau qui la recouvre est rouge et luisante, elle peut évoluer vers une fistulisation à la peau. La ponction ramène du pus franc. Exemples : adénopathies sous-maxillaire : carie dentaire; adénopathie axillaire : plaie infectée de la main ou abcès du sein; adénopathie inguinale : plaie infectée du pied."],["li","Elles peuvent être généralisées accompagnant une maladie infectieuse le plus souvent virale, exemple : la mononucléose infectieuse."],["p","_ Les adénopathies inflammatoires subaiguës ou chroniques : essentiellement la tuberculose ganglionnaire :"],["li","Il s'agit le plus souvent d'une adénopathie localisée unique jugulo-carotidienne haute, de consistance molle parfois rénitente, la peau qui la recouvre devient mince et luisante et l'évolution non traitée se fait vers la fistulisation qui laisse couler le caséum."],["li","L'IDR à la tuberculine : est positive supérieure à 7mm de diamètre; souvent supérieure ou égale à 15 mm."],["li","La ponction ganglionnaire : ramène du caséum."],["p","5.2. Les adénopathies malignes : elles peuvent être une métastase d'un cancer de voisinage ou une prolifération lymphoïde maligne au cours d'une hémopathie maligne."],["p","_ Métastase d'un cancer de voisinage : il s'agit d'une adénopathie ferme ou dure, fixée aux plans profonds."],["li","Adénopathie jugulo-carotidienne haute : cancer du cavum."],["li","Adénopathie sus-claviculaire gauche : ganglion de Troisier : cancer digestif ou cancer génital."],["li","Adénopathie axillaire : cancer du sein. _ Hémopathies malignes :"],["li","Leucémie aiguë : les signes cliniques accompagnateurs des adénopathies sont la pâleur, la fièvre, les hémorragies, la splénomégalie et les douleurs osseuses, le diagnostic est apporté par l'hémogramme et le médullogramme."],["li","Leucémie lymphoïde chronique : les adénopathies superficielles sont généralisées, bilatérales et symétriques, il existe souvent une splénomégalie et il s'agit d'un sujet âgé. Le diagnostic est apporté par l'hémogramme et le médullogramme."],["li","Les lymphomes : proliférations malignes primitives des ganglions : ce sont la maladie de Hodgkin et les lymphomes non hodgkiniens. Les adénopathies sont le plus souvent localisées ou loco-régionales, fermes et mobiles. La biopsie ganglionnaire est indispensable."],["h2","II. LES SPLÉNOMÉGALIES"],["h3","1. Rappel anatomo-physiologique"],["p","1.1. Anatomie de la rate : la rate est située dans l'hypocondre gauche derrière 1  'vent costal entre la 9e et la 11e côte transversalement entre la ligne axillaire moyenne et la .igné axillaire postérieure sur une hauteur de 5 à 6 cm. Elle est limitée en haut par le diaphragme, en bas par l'angle colique gauche, en dedans par l'estomac et en arrière par le rein gauche (fig. 4). Normalement, la rate pèse de 150 à 200g, elle ne déborde pas le rebord costal gauche; sauf chez le nourrisson et le jeune enfant chez lesquels le pôle inférieur peut être palpé lors de l'inspiration profonde. La rate a la forme d'un tétraèdre à grand axe oblique en bas, en avant et en dehors : la face postéro-externe convexe (diaphragmatique) et la face antéro-interne concave (gastrique) sont séparées par le bord antérieur ou bord crénelé qui présente des incisures caractéristiques (fig. 5)."],["h4","1.2. Les fonctions de la rate"],["p","1.2.1. Fonction hématopoïétique :"],["li","A l'état normal chez le fœtus, la rate a une fonction hématopoïétique (production de globules rouges, de globules blancs et de plaquettes) entre le 5e et le 7e mois, puis cette fonction diminue et disparaît avant la naissance."],["p","Diaphragme gauche"],["p","Rate"],["pre","Estomac                                                Angle colique gauche"],["p","FIG 4. – Situation de la rate normale"],["p","Face gastrique Face rénale"],["p","Face colique"],["p","Vue interne"],["p","Face diaphragmatique"],["pre","Hile                                       Bord antérieur crénelé"],["p","Vue antéro-gauche"],["p","FIG 5. – Aspect morphologique de la rate normale"],["li","Dans certains cas pathologiques, cette fonction hématopoïétique réapparaît notamment au cours de certaines hémopathies."],["p","1.2.2. Fonction de défense : est sous la dépendance du tissu lymphoïde et du tissu réticuloendothélial. Cette fonction de la rate est surtout importante chez l'enfant."],["p","1.2.3. Fonction hémolytique :"],["li","A l'état normal : les globules rouges arrivés au terme de leur vie de 120 jours sont détruits dans la moelle (50 %), le foie (25 %) et la rate (25 %)."],["li","Au cours de l'hémolyse pathologique : les globules rouges anormaux sont préférentiellement détruits au niveau de la rate."],["p","1.2.4. Fonction hémodynamique : la rate est branchée en dérivation sur le système porte; elle contribue à l'équilibre du flux sanguin portai et elle en subit les variations de pression."],["h3","2. Physio-pathologie des splénomégalies"],["p","Une hypertrophie de la rate peut être due à plusieurs mécanismes."],["p","2.1. Une hémopathie dans ce cas, la rate peut :"],["li","Soit reprendre sa fonction hématopoïétique, il en est ainsi chez l'adulte au cours de l’ostéomyélo-fibrose ou splénomégalie myéloïde où la rate prend le relais de la moelle osseuse pour assurer l'hématopoïèse."],["li","Soit être le siège d'une prolifération maligne lymphoïde : lymphome et leucémie lymphoïde chronique ou myéloïde : leucémie myéloïde chronique."],["p","2.2. Une hyperhémolyse : au cours des anémies hémolytiques, la rate, lieu de destruction privilégié des globules rouges pathologiques s'hypertrophie. Ainsi, les splénomégalies dites hématologiques sont dues à une hémopathie ou à une hyperhémolyse."],["p","2.3. Une infection sévère : notamment au cours des septicémies, la rate assure ses fonctions de défense et s'hypertrophie, réalisant une splénomégalie dite infectieuse."],["p","2.4. Une maladie de surcharge : les cellules macrophagiques du système réticuloendothélial de la rate assurent leur fonction d'épuration réalisant une splénomégalie de surcharge."],["p","2.5. Une hypertension portale : la rate subit l'augmentation de pression qui règne dans le système porte et s'hypertrophie : réalisant une splénomégalie dite congestive."],["h3","3. Etude sémiologique"],["p","L'examen clinique va permettre le plus souvent de reconnaître la splénomégalie et d'en préciser les caractères; dans les cas difficiles, certains examens complémentaires seront nécessaires pour différencier la splénomégalie des autres tumeurs de l’hypocondre gauche."],["h4","3.1. Reconnaître la splénomégalie"],["p","3.1.1. L'examen clinique :"],["li","L'inspection : a peu d'intérêt en pratique; une volumineuse splénomégalie peut être visible à jour frisant sous forme d'une voussure de l'hypocondre gauche."],["li","La percussion :"],["li","Une rate normale est percutable entre la 9e et la 11e côte, il est recommandé de pratiquer la percussion sur le malade en position debout, en expiration afin de dégager la rate des sonorités gastrique, colique et pulmonaire."],["li","Une splénomégalie qui déborde largement le rebord costal gauche est mate à la percussion."],["li","La palpation est le temps essentiel de l'examen clinique pour reconnaître la splénomégalie et en préciser les caractères."],["li","Techniques de palpation : en décubitus dorsal (fig. 6) : le malade est allongé sur un plan dur, les oreillers auront été enlevés, l'examinateur se place à droite du malade, la palpation commence au niveau de la fosse iliaque gauche et remonte vers le haut pour rencontrer le pôle inférieur de la rate qui vient buter contre les doigts lo
