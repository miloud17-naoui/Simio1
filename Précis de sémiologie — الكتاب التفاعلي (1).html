 Rectangle"],["pre","IA             Régurgitation Holo diastolique      2e EICD        Bord gauche    Doux           Faible      Triangle\n                                                         et        sternum    humé aspiratif\n                                                   3e EICG        et pointe"],["pre","  RM            Remplissage Holo-diastolique        Pointe        0                Grave         Forte       Double\n(Roulement)                                                                        sourd                     triangle"],["p","* Manœuvre de Valsalva,"],["li","Irradiations : le long du bord gauche du sternum vers la pointe."],["li","Timbre : doux, humé, aspiratif."],["li","Intensité : faible. Il est associé au niveau de la base à un souffle systolique d'éjection d'intensité modérée et au niveau de la pointe à un roulement de Flint télédiastolique dû au RM fonctionnel."],["p","4.2.2. Les signes périphériques associent :"],["li","Un élargissement de la différentielle avec élévation modérée de la pression systolique et surtout effondrement de la pression diastolique."],["li","Une hyperpulsatilité artérielle qui se traduit par :"],["li","Le pouls de Corrigan : pouls artériel ample, bondissant, dépressible."],["li","La danse des artères visible au niveau des carotides pouvant réaliser le signe de Musset."],["li","Le pouls de Quincke : qui est un pouls capillaire se manifestant par des alternances de rougeur et de pâleur synchrone du pouls visible sous l'ongle légèrement comprimé."],["p","4.3. Les signes radiologiques (fig. 7) se résument à une hypertrophie, dilatation du ventricule gauche."],["p","4.4. Les signes électriques et phonocardiographiques (fig. 8) :"],["li","Les signes électriques : l'ECG met en évidence des signes de surcharge diastolique du ventricule gauche."],["li","Les signes phonocardiographiques : le phonocardiogramme met en évidence l'aspect triangulaire du souffle diastolique de régurgitation, associé à un souffle d'éjection de forme losangique."],["h2","II. LES CARDIOPATHIES CONGÉNITALES"],["p","Elles sont nombreuses ; les plus fréquentes sont d'une part le rétrécissement pulmonaire et la coarctation de l'aorte et d'autre part, parmi les cardiopathies avec shunt gauche-droit : la communication interventriculaire et la persistance du canal artériel."],["h3","1. Le rétrécissement pulmonaire"],["p","Sera reconnu sur les signes suivants :"],["p","1.1. Signes physiques : un souffle systolique d'éjection maximum au foyer pulmonaire (2e espace intercostal gauche) irradiant vers la clavicule gauche et le dos, pouvant s'accompagner d'un frémissement systolique, il sera différencié du souffle du rétrécissement aortique par la manœuvre de Valsalva."],["p","1.2. Signes radiologiques : saillie de l'arc moyen gauche qui traduit la dilatation poststénotique du tronc de l'artère pulmonaire (fig. 9)."],["p","1.3. Signes électriques : l'ECG met en évidence des signes d'hypertrophie ventriculaire droite de type systolique (grande onde R - et onde T négative en V1)."],["p","Dilatation de l'artère pulmonaire"],["p","FIG. 9. — Aspect radiologique du rétrécissement pulmonaire."],["h3","2. La coarctation de l'aorte"],["p","Est un rétrécissement de l'aorte siégeant au niveau de l'isthme au pied de la sous-claviére gauche (fig. 10). La coarctation entraîne en amont de la sténose une hypertension artérielle et en aval une hypotension."],["p","Artère sous-claviére gauche"],["p","Coarctation de l’isthme"],["p","FIG. 10. - Coarctation de l'aorte."],["p","Elle sera reconnue sur les signes suivants :"],["p","2.1. Hypertension artérielle systolo-diastolique aux deux membres supérieurs."],["p","2.2. Diminution ou abolition des pouls fémoraux."],["p","2.3. L'existence d'un souffle systolique d'éjection dont le maximum est à cheval sur le 2e bruit, siégeant prés de la clavicule et irradiant le long du bord gauche du sternum et dans la gouttière inter-scapulo-vertébrale gauche; d'intensité modérée."],["p","2.4. L'aspect phonocardiographique : il s'agit d'un souffle losangique à cheval sur le 2e bruit (fig. 11)."],["pre","FIG. 11.   Aspect phonocardiographique de la coarctation de l’aorte."],["h3","3. Les cardiopathies avec shunt gauche-droit"],["p","3.1. La communication interventriculaire : entraîne une régurgitation du sang du ventricule gauche vers le ventricule droit, lors de la systole; elle sera reconnue sur le souffle systolique de régurgitation qui possède les caractères suivants :"],["li","Temps : holosystolique."],["li","Siège : maximum au 4e espace intercostal le long du bord gauche du sternum ou dans la région méso-cardiaque."],["li","Irradiations : en rayons de roue."],["li","Intensité le plus souvent forte s'accompagnant alors d'un frémissement."],["li","Aspect phonocardiographique : c'est un souffle rectangulaire."],["p","3.2. La persistance du canal artériel : la persistance anormale du canal artériel après la naissance permet le passage du sang de l'aorte vers l'artère pulmonaire, aussi bien pendant la systole que pendant la diastole."],["p","Elle sera reconnue sur l'existence d'un souffle continu qui possède les caractères suivants :"],["li","Temps : continu à maximum télésystolique et protodiastolique."],["li","Siège : maximum sous la clavicule gauche."],["li","Irradiations : vers les deux creux sus-claviculaires et dans le dos au niveau de la fosse sus-épineuse gauche."],["li","C'est un souffle tunnellaire."],["li","Intense et frémissant."],["h2","III. LES PÉRICARDITES"],["p","On opposera les péricardites aiguës et les péricardites constrictives."],["h3","1. Les péricardites aiguës"],["p","Sont en rapport avec une inflammation des deux feuillets du péricarde; elle peut être sèche ou au contraire s'accompagner d'un épanchement liquidien dans l'un et l'autre cas le malade présentera :"],["p","1.1. Les signes fonctionnels suivants : une dyspnée et une douleur thoracique de siège anginoïde, de durée infarctoïde, soulagée par la position penchée en avant."],["p","1.2. Les signes physiques : sont fonction de la présence ou de l'absence de liquide."],["p","1.2.1. La péricardite sèche : elle sera reconnue sur le frottement péricardique."],["p","1.2.2. La péricardite avec épanchement : va s'accompagner d'une diminution du choc de pointe à la palpation et d'un assourdissement des bruits du cœur à l'auscultation et de signes d'hypertension veineuse périphérique avec hépatomégalie congestive."],["h3","2. La péricardite constrictive"],["p","Est en rapport avec une symphyse des feuillets du péricarde qui entraîne une gêne au remplissage du cœur; elle sera reconnue sur les signes suivants :"],["p","2.1. Les signes cardiaques :"],["li","Assourdissement des bruits du cœur."],["li","La vibrance péricardique ou claquement péricardique."],["p","2.2. Les signes périphériques : réalisant le syndrome de Pick ;"],["li","Turgescence spontanée des jugulaires."],["li","Hépatomégalie congestive."],["li","Œdèmes des membres inférieurs."],["li","Ascite. Et augmentation de la pression veineuse périphérique."],["h2","IV. LES INSUFFISANCES CARDIAQUES"],["p","Elles peuvent être gauche, droite ou globale."],["h3","1. L'insuffisance ventriculaire gauche"],["p","Est l'aboutissement de nombreuses maladies cardiaques : la plupart des valvulopathies, l'hypertension artérielle et l'insuffisance coronarienne."],["p","Elle s'accompagne d'une augmentation de la pression dans le ventricule gauche, dans l'oreillette gauche et les capillaires pulmonaires d'où manifestations pulmonaires au 1er plan;"],["p","1.1. Les signes fonctionnels : sont des signes essentiellement pulmonaires"],["li","Dyspnée d'effort."],["li","Dyspnée paroxystique à type d'OAP et d'asthme cardiaque."],["p","1.2. Les signes cardiaques suivants seront retrouvés au niveau de la pointe."],["li","A la palpation : choc de pointe dévié vers le bas."],["li","A l'auscultation : tachycardie, galop gauche siégeant à la pointe soit présystolique, soit proto-diastolique et souffle systolique d'insuffisance mitrale fonctionnelle. \\ 2. L'insuffisance ventriculaire droite Est l'aboutissement soit d'une maladie pulmonaire : insuffisance respiratoire chronique, soit d'un rétrécissement mitral. Elle s'accompagne d'une gêne au retour veineux, d'où manifestations périphériques au 1er plan."],["p","2.1. Les signes périphériques sont les suivants :"],["li","Turgescence spontanée des jugulaires."],["li","Hépatomégalie congestive."],["li","Oligurie."],["li","Œdème des membres inférieurs, parfois ascite."],["p","2.2. Les signes cardiaques suivants seront retrouvés :"],["li","A la palpation :"],["li","Choc de pointe dévié en dehors."],["li","SignedeHarzer."],["li","A l'auscultation :"],["li","Tachycardie."],["li","Galop droit xyphoïdien présystolique ou protodiastolique."],["li","Souffle systolique d'insuffisance tricuspidienne fonctionnelle."],["li","Eclat de B2 au foyer pulmonaire en rapport avec l'hypertension artérielle pulmonaire."],["h3","3. L'insuffisance cardiaque globale"],["p","Est le terme ultime d'un grand nombre de cardiopathies. Elle associe les manifestations pulmonaires de l’IVG et les manifestations périphériques de l’IVD."],["p","Les signes cardiaques sont les suivants :"],["p","3.1. A la palpation : diminution du choc de pointe qui est dévié en bas et en dehors."],["p","3.2. A l'auscultation : tachycardie, assourdissement des bruits du cœur, galop gauche et souffle systolique."],["p","3.3. Tension artérielle : pincée."]]}]},{"ic":"🫃","ar":"الجهاز الهضمي","fr":"L'appareil digestif","c":"#B45309","ch":[{"ar":"الدراسة التحليلية","fr":"Étude analytique","w":10995,"b":[["p","On entend par appareil digestif : le tube digestif proprement dit qui va de la bouche à la marge anale et les organes annexes : les glandes salivaires, le foie et les voies biliaires et le pancréas (la rate sera étudiée avec l'appareil lympho-ganglionnaire)."],["p","L'étude sémiologique de l'appareil digestif comporte l'interrogatoire qui recherche les différents signes fonctionnels et l'examen clinique qui met parfois en évidence des signes physiques évocateurs. Les résultats ainsi obtenus permettront de décider de l'indication des investigations complémentaires spécialisées."],["h2","I. LES SIGNES FONCTIONNELS"],["p","L'analyse des troubles fonctionnels est faite au cours de l'interrogatoire qui est le temps capital de l'examen de l'appareil digestif; c'est de ce dernier essentiellement que dépendront l'orientation diagnostique et l'indication des investigations complémentaires."],["p","Les troubles fonctionnels digestifs sont : les troubles de l'appétit, la dysphagie, les vomissements, les troubles du transit intestinal : constipation et diarrhée, les douleurs abdominales et les hémorragies digestives : hématémèse, méléna et rectorragie."],["h3","1. Les troubles de l'appétit"],["p","1.1. L'anorexie est la diminution ou la perte de l'appétit. Elle peut être globale : intéressant tous les aliments, ou élective : ne portant que sur certains aliments; exemple : anorexie intéressant la viande et s'accompagnant souvent d'un dégoût du tabac au cours de l'hépatite virale."],["p","L'anorexie peut témoigner d'une affection dîgestive : ulcère gastro-duodénal, cancer digestif."],["p","Elle peut avoir d'autres origines :"],["li","Une origine psychique : anorexie mentale qui se rencontre surtout chez la femme ou la jeune fille, déclenchée par un choc émotif et s'accompagnant d'un amaigrissement important."],["li","Une maladie infectieuse; exemple : la tuberculose."],["p","1.2. La polyphagie : est une augmentation de l'appétit. Elle se voit au cours du diabète sucré, où elle est associée à une polydipsie (augmentation de la soif entraînant l'absorption de quantité importante de boisson). Au cours de certaines obésités : suralimentation entrant dans le cadre d'habitudes familiales."],["h3","2. La dysphagie"],["p","2.1. Définition : la dysphagie se définit comme une gêne à la déglutition."],["p","2.1.1. Elle peut être d'origine pharyngée \\ par exemple, l'angine streptococcique est une angine érythémateuse qui s'accompagne d'une dysphagie douloureuse passagère dont la durée maximale est de 2 à 3 jours."],["p","2.1.2. Elle est le plus souvent d'origine œsophagienne :"],["li","Soit mécanique par anomalie organique de l'œsophage : cancer ou sténose, ou bien due à une compression de l'œsophage par un organe de voisinage; exemple : une tumeur médiastinale ou un cancer de la thyroïde. La dysphagie est alors permanente et d'intensité progressive."],["li","Soit fonctionnelle par anomalie de la contractilité de la musculature œsophagienne : spasme siégeant au niveau du tiers inférieur de l'œsophage ou au niveau du cardia s'accompagnant d'un relâchement de la musculature sus-jacente avec dilatation de l'œsophage définissant le méga-œsophage. La dysphagie est alors intermittente et capricieuse."],["p","2.1.3. Elle peut être due enfin à une anomalie du cardia ou de la grosse tubérosité."],["p","2.2. L'étude sémiologique : repose sur l'interrogatoire qui va préciser :"],["li","La date de début : récente évoque en premier lieu un trouble mécanique, ou ancienne de plusieurs années évoque un trouble fonctionnel."],["li","Le mode de début :"],["li","Brutal : après une émotion ou après la déglutition trop rapide d'un gros repas, le malade brusquement ne peut plus rien avaler, même une gorgée d'eau, elle cède par des manœuvres diverses, et se voit au cours du méga-œsophage."],["li","Progressif : d'abord simple sensation d'accrochage pour les grosses bouchées, puis la gêne devient plus précise et élective pour les aliments solides : pain et viande; se voit au cours du cancer de l'œsophage."],["li","Le degré de la dysphagie :"],["li","Minime : simple accrochage lors de la déglutition des grosses bouchées, qui a une grande valeur sémiologique, car peut être le premier signe d'un cancer de l'œsophage au début."],["li","Importante : dysphagie interdisant la déglutition des solides."],["li","Aphagie : stade ultime qui est l'impossibilité absolue d'avaler."],["li","Le siège de la dysphagie : Le malade peut localiser le siège de la dysphagie qui correspond au siège de la lésion :"],["li","Cervicale souvent accompagnée de toux obligeant le malade à sortir de table."],["li","Thoracique : rétrosternale."],["li","Abdominale haute : rétro-xiphoïdienne."],["p","Parfois, la dysphagie est projetée : c'est-à-dire que la sensation d'obstacle localisée par le patient est au-dessus du siège réel de la lésion, ceci se voit surtout dans les lésions du cardia."],["li","Les signes accompagnateurs :"],["li","Les régurgitations : c'est le reflux vers la bouche sans effort de vomissement de débris alimentaires contenus dans l'oesophage; elles surviennent soit immédiatement après l'ingestion d'un aliment, soit plus tard, notamment lorsque le malade s'allonge."],["li","La douleur œsophagienne : s'observe lorsqu'il y a distension de la musculature œsophagienne en amont d'un obstacle, elle siège en général au tiers moyen de l'œsophage, elle peut irradier vers la gorge et les mâchoires, elle cède habituellement après la régurgitation."],["li","L 'hypersialorrhée : est provoquée par le réflexe œsophago-salivaire qui est dû à l'obstacle œsophagien."],["li","Les éructations douloureuses : le renvoi d'air venant de l'estomac provoque une douleur irradiant vers le rachis."],["li","L'évolution :"],["li","Permanente : continue, quotidienne et progressive survenant d'abord pour les aliments solides, puis semi-liquides, enfin également pour les liquides 'aboutissant à l’aphagie; très caractéristique du cancer de l'œsophage, mais hélas signe tardif de cancer très évolué."],["li","Intermittente : capricieuse qui évoque un trouble fonctionnel, mais peut se voir aussi au cours du cancer. Toute dysphagie dépistée à l'interrogatoire doit entraîner un examen clinique complet qui sera plus attentif au niveau de la gorge et du cou et sera suivi systématiquement d'examens complémentaires : radiographie après opacification barytée de l'œsophage et examen endoscopique avec biopsie des lésions suspectes."],["h4","2.3. Les principales causes de dysphagie"],["p","2.3.1. Causes mécaniques : dysphagie le plus souvent progressive, permanente."],["li","Les compressions extrinsèques :"],["li","Anomalie cervicale : cancer volumineux de la thyroïde."],["li","Anomalie thoracique qui sera visible à l'examen radiologique du thorax : cœur (exemple : grosse oreillette gauche d'un RM), gros vaisseaux (anévrisme de l'aorte), tumeur du médiastin."],["li","Le cancer de l'œsophage et le cancer du cardia."],["li","Les rétrécissements cicatriciels qui sont une séquelle après ingestion de caustique (esprit- de sel)."],["li","La hernie hiatale compliquée d'œsophagite peptique."],["p","2.3.2. Causes fonctionnelles : dominées par les dyskinésies œsophagiennes et les spasmes de l'œsophage chez les sujets neurotoniques et le méga-œsophage idiopathique. Elles réalisent une dysphagie le plus souvent intermittente et capricieuse. 3. Les vomissements 3.1. Définition : le vomissement, c'est le brusque rejet par la bouche d'une partie ou de la totalité du contenu gastrique."],["p","Il est souvent précédé, accompagné ou remplacé par des nausées qui sont des sensations de menace de vomissement ressenties à la gorge et à l'épigastre."],["p","II s'agit d'un symptôme fonctionnel dénué de spécificité qui peut accompagner des maladies digestives et des maladies extra-digestives. Il doit être différencié :"],["li","Des régurgitations : reflux des aliments de l'œsophage vers la bouche sans effort de vomissement, dues à une anomalie de l’œsophage ou du cardia."],["li","De la rumination ou mérycisme qui est physiologique chez le nourrisson; chez l'adulte, elle se traduit par la remontée dans la bouche d'un fragment d'aliments ingéré plusieurs heures auparavant et elle est associée à des éructations."],["p","3.2. Physio-pathologie : le vomissement débute par une inspiration profonde avec fermeture de la glotte puis expiration, il existe une brusque augmentation de la pression abdominale due à la contraction des muscles abdominaux et du diaphragme, une fermeture du pylore alors que le cardia est ouvert et l'œsophage en état d'hypotonie : le contenu gastrique est alors projeté violemment dans l'œsophage et évacué par la bouche, après un ou plusieurs efforts d'expulsion."],["p","Il s’agit d'un acte réflexe : ce réflexe est formé :"],["li","De zones sensibles à partir desquelles partent les excitations; ces zones sensibles sont nombreuses : tout le tube digestif, depuis le pharynx jusqu'au côlon, le péritoine, le cœur et l'appareil vestibulaire."],["li","Une voie afférente ou centripète : constituée par le nerf pneumogastrique et le nerf glosso-pharyngien."],["li","Une centre situé dans le plancher du 4e ventricule."],["li","Une voie efférente ou centrifuge : constituée par le nerf phrénique et les nerfs moteurs des muscles de l'abdomen et le X qui commande l'ouverture du cardia."],["p","3.3. Etude sémiologique : l'interrogatoire va préciser :"],["li","Circonstances d'apparition : repas, prise de médicament, femme en état d'aménorrhée, vomissement du premier trimestre de la grossesse."],["li","L'horaire du vomissement :"],["li","Matinal chez le sujet à jeun : grossesse, éthylisme."],["li","Post-prandial précoce : lié souvent à un trouble fonctionnel."],["li","Post-prandial tardif : souvent en rapport avec une cause organique."],["li","Le nombre et l'abondance :"],["li","Vomissement aigu épisodique : le plus souvent unique ou peu nombreux et peu abondant, symptomatique d'une affection aiguë."],["li","Vomissement chronique : le plus souvent multiple, quotidien plus ou moins abondant, symptomatique d'une affection chronique digestive ou neurologique."],["li","La nature du vomissement : le contenu gastrique rejeté peut être de nature :"],["li","Alimentaire :"],["li","précoce : aliments peu fragmentés;"],["li","tardif : aliments digérés qui ont été ingérés 1 à 2 jours auparavant : vomissements de stase qui témoignent d'un obstacle à l'évacuation gastrique; exemple : sténose du pylore."],["li","Aqueux : la pituite est le rejet par la bouche, le matin à jeun, d'un liquide filant, aqueux, alcalin, symptomatique d'une gastrite le plus souvent éthylique."],["li","Bilieux :"],["li","le rejet de bile peut survenir normalement à la fin d'un vomissement alimentaire;"],["li","vomissement bilieux d'emblée doit faire suspecter un obstacle sous-vatérien."],["li","Hématiques : hématémèses : vomissement de sang plus ou moins digéré souvent accompagné de débris alimentaires."],["li","Fécaloïde : rejet de matières fécales, se voit au cours des occlusions intestinales aiguës très avancées."],["li","Corps étrangers : parasite : ascaris. L'examen clinique doit être complet, il permettra d'apprécier : le retentissement des vomissements sur l'état général du malade : signes de dénutrition avec amaigrissement important et des signes de déshydratation surtout extra-cellulaire et de rechercher une étiologie surtout digestive, neurologique ou gynécologique chez la femme."],["h4","3.4. Les causes des vomissements"],["p","3.4.1. Les causes digestives :"],["li","Gastrique : la sténose du pylore va se traduire par des vomissements alimentaires faits d'aliments digérés : vomissements de stase qui vont être chroniques. Cliniquement : on recherchera une distension abdominale sus-ombilicale, des ondulations péristaltiques, un durcissement intermittent de l'épigastre et un clapotage à jeun. Les examens complémentaires :"],["li","Le tubage gastrique : qui permet de mesurer la quantité de liquide de stase."],["li","Le transit gastro-duodénal : va montrer un estomac dilaté contenant du liquide de stase, la baryte ne franchit pas le pylore."],["li","La fibroscopie gastrique : qui visualise la sténose."],["li","Biliaire : la colique hépatique due à une lithiase des voies biliaires."],["li","Intestinale : l'occlusion intestinale aiguë."],["li","Péritonéale : péritonite."],["p","3.4.2. Les causes extra-digestives :"],["li","Neurologique : il s'agit de vomissements faciles dit « en fusée », ils se voient au cours de l'hypertension intracrânienne par tumeur cérébrale et du syndrome méningé."],["li","Gynécologique : la grossesse au premier trimestre."],["li","Autres causes : Cardio-vasculaire : infarctus du myocarde. Respiratoire : toux émétisante et quinteuse de la coqueluche. ORL : vertige. Intoxication médicamenteuse. Psychique."],["h3","4. Les troubles du transit intestinal"],["p","Après un bref rappel du transit intestinal normal, nous étudierons ses troubles : la diarrhée et la constipation."],["p","4.1. Rappel du transit intestinal normal : la durée normale du transit digestif est de 24 heures."],["p","Les selles normales sont émises 1 à 2 fois par jour, elles sont homogènes et moulées, formées de 78 % d'eau et de 22 % de matières sèches représentées par des résidus cellulosiques indigestibles et par les produits de la desquamation muqueuse, le pH est neutre, leur couleur est donnée par le stercobilinogène (produit de dégradation de la bilirubine)."],["p","La couleur peut varier avec les aliments : après ingestion de betteraves, les selles sont rougeâtres; lors de la prise de certains médicaments : fer, bismuth et charbon, les selles sont alors noirâtres."],["h4","4.2. La diarrhée"],["p","4.2.1. Définition : la diarrhée se définit comme une accélération du transit avec émission de selles trop liquides et trop fréquentes ou trop volumineuses (supérieures à 250 g par jour)."],["p","L'évacuation fréquente de selles normales n'est pas une diarrhée."],["p","4.2.2. Physio-pathologique : la diarrhée est en règle en rapport avec un trouble des mécanismes principaux de la digestion."],["li","Trouble de la motilité : diarrhée par hyperkinésie."],["li","Trouble des sécrétions digestives : diarrhée par hypersécrétion."],["li","Trouble de l'absorption intestinale par lésion de la muqueuse intestinale : c'est la diarrhée par malabsorption."],["li","Trouble de la digestion proprement dite : c'est la diarrhée par maldigestion due à une insuffisance enzymatique ou à une anomalie de la flore microbienne. Les deux premiers mécanismes, hypersécrétion et hypermotricité, sont retrouvés dans les diarrhées infectieuses."],["p","4.2.3. Etude sémiologique :"],["li","L'interrogatoire va préciser les caractères suivants de la diarrhée :"],["li","La date de début récent : quelques heures : diarrhée aiguë, ou ancien : plusieurs semaines ou mois : évoquant une diarrhée chronique."],["li","Le nombre de selles par 24 heures."],["li","L'horaire : matinal, post-prandial, nocturne."],["li","L'aspect : importance de voir la selle du malade :"],["li","couleur et consistance : pâteuse avec parfois présence de graisse qui confère aux selles un aspect luisant; liquide;"],["li","recherche d'éléments anormaux : sang, pus, glaires enrobant la selle ou l'accompagnant."],["li","Evolution : aiguë : début brutal, durée quelques heures à quelques jours : chronique : durée prolongée plusieurs semaines à plusieurs mois, parfois épisodes de diarrhée séparés par des phases de transit normal."],["li","Signes accompagnateurs : douleurs abdominales, nausée ou vomissement."],["li","L'examen clinique a deux objectifs :"],["li","Rechercher le retentissement sur l'état général : signes de déshydratation qui sont retrouvés au cours des diarrhées aiguës, signes de dénutrition avec amaigrissement et parfois œdèmes carentiels retrouvés au cours des diarrhées chroniques."],["li","Rechercher la cause : par l'examen de l'appareil digestif y compris le toucher rectal dans les diarrhées chroniques."],["p","4.2.4. Le diagnostic différentiel : la diarrhée doit être différenciée :"],["li","De la fausse diarrhée : qui survient après quelques jours de constipation, c'est une selle de constipation diluée dans un liquide d'hypersécrétion provenant de la muqueuse irritée par la stase."],["li","Du syndrome dysentérique qui réalise :"],["li","L'émission de selles afécales faites de glaires, de pus et de sang."],["li","Avec des signes accompagnateurs caractéristiques à type :"],["li","d'épreinte : besoin irrésistible d'exonérer suivi ou non de l'émission d'une selle dysentérique : faux besoin;"],["li","ténesme : sensation douloureuse de tension ou sensation de corps étranger intra-rectal."],["li","Les causes : dysenterie amibienne, dysenterie bacillaire, recto-colite hémorragique."],["p","4.2.5. Les différents types de diarrhée : suivant l'évolution, on distingue :"],["li","Les diarrhées aiguës :"],["li","Caractères communs :"],["li","mode de début brutal;"],["li","présence habituelle d'un facteur déclenchant : alimentaire, infectieux, médicamenteux ou toxique;"],["li","aspect : selles liquides;"],["li","risque de déshydratation surtout chez le vieillard et le nourrisson."],["li","Les principales causes sont infectieuses :"],["li","bactériennes : toxi-infection alimentaire : action du germe lui-même ou de sa toxine; notion d'atteinte collective, survient rapidement après la prise alimentaire : quelques heures, précédée de vomissement, accompagnée de douleurs abdominales, parfois de fièvre, l'évolution est rapidement favorable, fièvre thyhoi'de : à la période d'état au 2e septénaire : diarrhée ocre ou jaune orangé, « jus de melon, non accompagnée de douleur, choléra : diarrhée constante, faite d'abord de selles fécales, puis diarrhée riziforme opaline dans laquelle on retrouve des grains blanchâtres qui ressemblent aux grains de riz, s'accompagne d'un retentissement sur l'état général : déshydratation et collapsus ;"],["li","autres types : virales, mycosiques, parasitaires."],["li","Les diarrhées chroniques peuvent revêtir plusieurs types :"],["li","Diarrhée colique : est une diarrhée matinale, impérieuse, faite d'une selle moulée suivie de plusieurs selles molles ou liquides, elle s'accompagne de douleurs à type de colique, elle alterne avec des périodes de constipation, elle n'entraîne pas de retentissement sur l'état général. Ses causes sont : le cancer du côlon et du rectum, la diverticulose et l'amibiase."],["li","Diarrhée grêlique : est dominée par la malabsorption : elle réalise une diarrhée avec stéatorrhée : selles molles, volumineuses, pâles et luisantes, d'odeur fétide, émises sans douleur; elle est accompagnée d'une anorexie et d'un amaigrissement important. Elle se voit au cours de l'ictère par rétention, de l'insuffisance pancréatique exocrine et au cours des anomalies de la muqueuse du grêle."],["li","Diarrhée motrice : est une diarrhée hydro-électrolytique, elle est liquide, postpran-diale immédiate ou précoce 30 minutes à 1 heure après le repas, elle peut contenir des fragments alimentaires, elle est impérieuse, accompagnée de coliques, elle ne retentit pas sur l'état général, elle se voit au cours du diabète (neuropathie diabétique) et au cours de l'hyperthyroïdie, enfin, elle peut être d'origine psychique."],["h4","4.3. La constipation"],["p","4.3.1. Définition : c'est un retard de l'évacuation des résidus fécaux : transit prolongé et surdigestion des résidus d'où déshydratation : donc selles surdigérées et déshydratées parfois riches en eau réalisant une fausse diarrhée."],["p","4.3.2. Physio-pathologie : la constipation peut se produire par deux mécanismes :"],["li","Par anomalie de la progression : par stase colique dans ce cas, la motilité colique est diminuée."],["li","Par retard à l'évacuation : dyschésie pelvi-rectale, elle réalise une stagnation des matières fécales dans le sigmoïde et le rectum par trouble de la défécation."],["p","4.3.3. Etude sémiologique repose sur l'interrogatoire :"],["p","Ø Mode et date de début :"],["li","Aigu, récent et transitoire : accompagne une affection aiguë."],["li","Récente et persistante : évoque une cause organique et doit faire rechercher un cancer digestif : côlon ou rectum."],["li","Ancienne et chronique : évoque une cause fonctionnelle. Ø Caractères des selles :"],["li","Selles régulières peu abondantes, dures, sèches, en scybales."],["li","Selles espacées de plusieurs jours."],["li","Fausse diarrhée : selles liquides dans lesquelles on retrouve des fragments de selles dures. Ø Signes accompagnateurs : ballonnement abdominal. L'examen du tube digestif est indispensable et surtout le toucher rectal qui a deux objectifs :"],["li","Préciser le type de la constipation d'une part, en effet le TR met en évidence :"],["li","Soit un rectum plein en faveur de la dyschésie pelvi-rectale."],["li","Soit un rectum vide : évoquant une anomalie de la progression colique."],["li","Et d'autre part rechercher une tumeur rectale."],["p","4.3.4. Les causes :"],["li","Causes organiques : cancer du côlon et du rectum, les colites ; exemple : colite parasitaire."],["li","Causes fonctionnelles :"],["li","Constipations transitoires : maladie aiguë fébrile, insuffisance cardiaque, suites d'une intervention chirurgicale, grossesse."],["li","Constipation chronique : erreur diététique, insuffisance de la paroi abdominale, déséquilibre neuro-végétatif cause la plus fréquente, déséquilibre hormonal, insuffisance thyroïdienne."],["h3","5. Les hémorragies digestives"],["p","5.1. Définition : une hémorragie digestive est le rejet soit par la bouche, soit par l'anus de sang provenant d'un point quelconque du tube digestif. Les hémorragies digestives groupent : l'hématémèse, le méléna isolé ou associé à une hématémèse et la rectorragie."],["p","II s'agit de symptômes de grande valeur, dont il faudra toujours rechercher l'étiologie précise et parfois de symptômes revêtant une extrême gravité pouvant mettre la vie du malade en danger."],["h4","5.2. Physio pathologie"],["p","5.2.1. Mécanismes de production de l'hémorragie :"],["li","Le mécanisme le plus fréquemment en cause est l'effraction d'un vaisseau : artère ou veine."],["li","Saignement artériel : pouvant survenir chez le malade atteint d'ulcère gastrique ou duodénal."],["li","Saignement veineux : par rupture de varices (veines sous-muqueuses dilatées) essentiellement varices œsophagiennes chez le sujet atteint d'hypertension portale."],["li","Plus rarement, il s'agit d'un saignement en nappe : muqueuse gastrique « pleurant » du sang au cours de la gastrite hémorragique."],["p","5.2.2. Conséquences physio-phatologiques de l'hémorragie : elles peuvent être de deux ordres l'anémie et l’hypovolémie."],["li","L'anémie : la perte de globules rouges va entraîner suivant l'abondance de l'hémorragie une anémie soit aiguë, soit chronique, cette anémie n'est pas constante."],["li","Une hémorragie de petite abondance, mais répétée, va entraîner une anémie chronique longtemps bien toléré de type ferriprive en rapport avec l'épuisement des réserves en fer de l'organisme."],["li","Une hémorragie de grande abondance va entraîner une anémie aiguë mal tolérée."],["li","L'anémie est inconstante, elle n'apparaîtra pas en cas d'hémorragie de petite et de moyenne abondance, non répétée dans le temps."],["li","L'hypovolémie : n'apparaît que dans les hémorragies de grande abondance, elle va être responsable du collapsus cardio-vasculaire qui accompagne le tableau d'anémie aiguë 5.3. Le diagnostic d'hémorragie digestive : va se poser dans deux circonstances différentes, il s'agit soit d'une hémorragie extériorisée de diagnostic facile, le plus souvent évident, soit d'un tableau d'anémie chronique ou aiguë qui va faire rechercher une hémorragie non extériorisée."],["p","5.3.1. Hémorragie digestive extériorisée : le sang est rejeté soit par voie haute : hématémèse, soit par voie basse : méléna et rectorragie."],["p","a) Hématémèse :"],["li","Définition : l'hématémèse est le rejet par la bouche au milieu d'efforts de vomissement d'une quantité variable de sang rouge ou noirâtre, non spumeux, mêlé de caillots et de débris alimentaires. Elle traduit une lésion digestive haute : œsophage, estomac, duodénum. Une partie du sang stagne dans l'estomac et est éliminée dans les heures qui suivent par l'anus sous forme de sang digéré : le méléna qui suit constamment l'hématémèse : Ø Diagnostic différentiel : l'hématémèse doit être différenciée de :"],["li","L'hémoptysie : hémorragie de sang rouge rutilant, aéré, spumeux rejeté au cours d'effort de toux suivie de la queue de l'hémoptysie."],["li","L'hémosialémèses : rejet par la bouche de sang mêlé de salive provenant des gencives ou du pharynx, fréquente surtout chez les névropathes."],["li","L'épistaxis : surtout postérieure déglutie et vomie secondairement."],["p","b) Méléna :"],["li","Définition : le méléna est l'émission par l'anus de selles noires, plus ou moins liquides, faites de sang digéré, se voit dans deux circonstances, soit il accompagne une hématémèse et il est d'origine haute : sus-mésocolique, soit il est isolé, il est alors aussi le plus souvent d'origine haute : œsophage, estomac, duodénum, ou plus rarement d'origine basse : sousmésocolique, intestin grêle, côlon. Le méléna se présente sous deux aspects sémiologiques :"],["li","Le méléna franc : émission par l'anus d'un liquide épais, noirâtre, poisseux, ressemblant au goudron, d'odeur fade, puis fortement nauséabonde."],["li","La selle mélanique : correspond à l'émission de selles de couleur noire."],["li","Diagnostic différentiel : les selles peuvent être colorées par des médicaments : fer, bismuth, charbon et par des aliments : betteraves. Le diagnostic sera posé grâce à l'interrogatoire, sur l'aspect de la selle : la selle mélanique est de teinte plus foncée et enfin si l'on délaie la selle mélanique dans l'eau, une teinte hématique apparaît."],["p","c) Rectorragie :"],["li","Définition : la rectorragie est l'émission par l'anus de sang rouge non digéré, soit sous forme de sang pur, soit sous forme de sang mélangé avec la selle, soit sous forme de sang arrosant la selle. La rectorragie traduit une lésion basse : du colon, du rectum, de l'anus; elle peut se voir également mais exceptionnellement, au cours des hémorragies hautes massives."],["li","Diagnostic différentiel : la rectorragie doit être différentiée de la selle dysentérique et des hémorragies d'origine génitale ou urinaire, parfois difficiles à différencier chez les malades frustes 5.3.2. Hémorragie digestive non extériorisée : a) Une hémorragie minime et chronique : hémorragie distillante sera recherchée systématiquement devant un tableau d'anémie chronique de type ferriprive : les selles sont alors de coloration normale (hémorragie occulte), c'est la recherche de sang dans les selles après 3 jours de régime sans viande par la classique réaction de Weber, actuellement peu utilisée remplacée par les bandelettes réactives : Hémocult, d'utilisation simple pouvant être réalisé par le médecin ou l'infirmier. b) Une hémorragie massive qui n'a pas le temps de s'extérioriser et qui va se traduire d'emblée par une anémie aiguë avec un état de choc, le diagnostic sera posé sur le tubage gastrique qui va ramener du sang ou sur le toucher rectal qui ramène du méléna ou du sang rouge ou sur le lavement évacuateur."],["p","5.4. L'appréciation de l'importance de la spoliation sanguine est le temps essentiel qui suit immédiatement le diagnostic. L'hémorragie digestive peut être de grande, de moyenne ou de petite abondance."],["p","5.4.1. L'hémorragie de grande abondance : une hémorragie est dite de grande abondance, quand elle est égale ou supérieure à 1 litre. La quantité de sang rejetée est difficile à apprécier de manière précise, car elle est soit surestimée, le sang rejeté étant mélangé à des sécrétions digestives, soit sous-estimée, le sang est souvent non entièrement extériorisé."],["p","L'examen clinique est fondamental, l'existence d'un tableau d'anémie aiguë et de signes de choc hypovolémique permet d'affirmer l'hémorragie de grande abondance sur les critères suivants :"],["li","Signes fonctionnels : lipothymie ou syncope, agitation, angoisse, vertiges, sensation de soif vive, polypnée avec « soif d'air », palpitations, troubles sensoriels : bourdonnements d'oreilles et troubles visuels."],["li","Signes physiques : le pouls accéléré, petit, filant, parfois imperceptible; tension artérielle abaissée : chute de la maxima avec pincement de la différentielle (les chiffres doivent être rapportés aux chiffres antérieurs), une maxima inférieure à 8 est un signe de gravité; refroidissement des extrémités avec sueurs froides; pâleur cutanéo-muqueuse; bruits du cœur assourdis et rapides, veines périphériques collabées, le malade devient impossible à piquer, oligurie."],["li","Signes biologiques :"],["li","L'hémogramme : taux d'hématocrite, numération des GR et taux d'hémoglobine sont normaux dans les premières heures (fig. 1), car la perte de GR est proportionnelle à la perte de plasma, secondairement s'installe une hémodilution avec apparition d'une anémie."],["li","La mesure de la masse sanguine : au cours des premières heures est seule capable d'apprécier avec exactitude la perte sanguine : on utilise l'albumine marquée à l'iode 131 qui permet de mesurer le volume plasmatique et de calculer à l'aide du taux d'hématocrite le volume sanguin total ou masse sanguine."],["li","Critères évolutifs : la quantité de sang transfusée au malade lorsqu'elle est supérieure à 1,5 litre par 24 heures est un critère d'hémorragie de grande abondance."],["p","Volume globulaire 45%"],["pre","N                  1                  2"],["p","Hgie de GA FÏG. 1. — Normalement : VG = 45 %."],["p","Hgie de G.A. (1-2)"],["li","1. Diminution volume sg total, mais VG= 45 %."],["li","2. Après quelques heures = Diminution VG."],["p","5.4.2. L'hémorragie, de moyenne abondance : est définie comme une hémorragie dont la quantité est inférieure à un litre, en moyenne 300 à 400 ml. Si elle est isolée, elle n'aura pas de retentissement, par contre, si elle se répète, elle va entraîner une anémie d'apparition rapide, ce type d'hémorragie ne nécessite pas de transfusion abondante."],["p","5.4.3. Hémorragie de petite abondance : peut être isolée sans retentissement, au contraire si elle se répète, elle aboutit à un état d'anémie chronique."],["h4","5.5. Les causes des hémorragies"],["p","5.5.1. L'hématémèse suivie de méléna : est toujours d'origine sus-mésocolique, les deux étiologies les plus fréquentes sont l'ulcère gastro-duodénal et la rupture de varices œsophagiennes."],["li","L'ulcère gastro-duodénal : sera recherché par l'interrogatoire, notion de douleur épigastrique caractéristique , notion de prise médicamenteuse agissant comme facteur"],["pre","1 76                                                                   Précis de sémiologie"],["p","déclenchant de l'hémorragie : salicylés, anti-inflammatoires et anticoagulants. A noter qu'une hémorragie digestive peut être le symptôme révélateur d'un ulcère. C'est l'endoscopie digestive : fibroscopie œso-gastro-duodénale qui permettra de faire le diagnostic rapide et précis."],["li","La rupture de varices œsophagiennes : survient dans un contexte d'hypertension portale, associant une splénomégalie, une ascite et une circulation veineuse collatérale abdominale. La fibroscopie œso-gastro-duodénale permet également de faire le diagnostic."],["li","Les autres causes : sont plus rares : gastrite, tumeurs malignes."],["p","5.5.2. Le méléna isolé : est dans 90 % des cas, comme l'hématémèse d'origine susmésocolique, donc on recherchera systématiquement d'abord un ulcère gastro-duodénal et une rupture des varices œsophagiennes et pour cela, on pratiquera en urgence une fibroscopie œso-gastro-duodénale. Dans 10 % des cas, il est d'origine sous-méso-colique et fera rechercher :"],["li","D'abord une cause colique : par le lavement baryte et la coloscopie à la recherche de tumeurs bénignes ou malignes."],["li","En dernier lieu, une anomalie du grêle tumeur bénigne ou maligne par le transit du grêle."],["li","Cas particulier : dans un contexte fébrile penser aux complications hémorragiques intestinales de la fièvre typhoïde."],["p","5.5.3. La rectorragie : est toujours d'origine basse : côlon, rectum, anus. L'interrogatoire doit rechercher une notion du trouble du transit : diarrhée ou constipation, l'examen clinique doit comporter un examen de la marge anale et un toucher rectal et enfin les examens complémentaires permettront de préciser la cause du saignement : cause anale par l'anuscopie, rectale par la rectoscopie, ou enfin colique : le lavement baryte et coloscopie."],["li","Une cause anale : doit être recherchée : en premier : hémorroïdes surtout."],["li","Une cause rectale : ulcération traumatique thermométrique, cancer du rectum, polype, recto-colite hémorragique."],["li","Une cause colique : cancer du côlon, polype, recto-colite hémorragique."],["h3","6. Les douleurs abdominales"],["p","Les douleurs abdominales constituent un motif très fréquent de consultation. Bien qu'elles soient le plus souvent d'origine abdominales, elles ne sont pas spécifiques d'une atteinte abdominale, elles peuvent prendre naissance dans un organe extra-abdominal : il s'agit alors d'une douleur rapportée; enfin une douleur abdominale peut être d'origine métabolique ou neurologique."],["p","6.1. L'analyse sémiologique de la douleur abdominale repose sur l'interrogatoire qui constitue l'étape essentielle, lui seul donne une orientation et permet de choisir les examens complémentaires nécessaires au diagnostic et sur l'examen clinique."],["p","6.1.1. L'interrogatoire va s'attacher à préciser les caractères suivants :"],["li","Le siège : la douleur est le plus souvent localisée à l'un des neuf quadrants de l'abdomen (fig. I) : épigastre, hypocondres, flancs, fosses iliaques, région péri-ombilicale et région hypogastrique. En cas de douleur diffuse, on doit demander au malade de préciser avec le doigt le point le plus douloureux. L'interrogatoire va préciser également les irradiations de la douleur : ascendante, descendante, postérieure ou suivant le cadre colique."],["pre","L'appareil digestif                                                                          17 7"],["p","Ø Le type :"],["li","Crampe : est une sensation de torsion profonde, elle peut être calmée par l'ingestion alimentaire réalisant « la faim douloureuse » retrouvée au cours de l'ulcère."],["li","Brûlure : comparée souvent par le malade à des « aigreurs », elle s'accompagne souvent de pyrosis (remontée de liquide acide dans la bouche avec sensation de brûlure œsophagienne)."],["li","Colique : est une sensation d'ondes douloureuses croissantes et décroissantes, donnant au malade l'impression d'aller d'un point à un autre ; elle prend naissance au niveau de l'intestin, des voies biliaires ou des voies urinaires."],["li","Douleur déchirante : en coup de poignard, qui évoque la perforation d'un organe creux."],["li","Pesanteur : n'est pas une douleur : c'est une sensation de lourdeur; sensation fausse de retard à l'évacuation gastrique."],["li","Douleur battante : dans la région épigastrique, provenant des battements de l'aorte abdominale ressentis comme une douleur. Ø L'intensité : L’intensité est un caractère purement subjectif, qui varie avec chaque individu. Une douleur est certainement très intense, lorsqu'elle a un retentissement détectable objectivement pâleur, agitation... Ø Evolution dans le temps : L’interrogatoire doit préciser l'évolution de la douleur dans la journée et dans l'année :"],["li","Dans la journée : c'est la notion de rythmicité : douleur rythmée par les repas :"],["li","post-prandiale précoce : survenant immédiatement après les repas;"],["li","post-prandiale tardive : survenant à distance des repas."],["li","Dans l'année : c'est la notion de périodicité : la douleur survient par poussées durant plusieurs jours au cours desquels elle se répète quotidiennement, ces périodes douloureuses sont séparées par des périodes de rémission complète. Enfin, la douleur peut être d'évolution permanente ou au contraire paroxystique : douleur intense à début brutal dont la durée va de quelques minutes à quelques heures. Ø Facteurs déclenchants : Prise d'aliments, épices, repas gras. Prise médicamenteuse : aspirine, anti-inflammatoires. Ø Facteurs sédatifs : Prise d'aliments. Vomissements, émission de selles. Pansements gastriques. Repos. Ø Signes accompagnateurs :"],["li","Troubles digestifs : vomissements, hémorragies digestives, troubles du transit intestinal : diarrhée, constipation."],["li","Autres signes : fièvre, signes de choc, signes de déshydratation."],["p","6.1.2. L'examen clinique : l'interrogatoire sera complété par un examen clinique centré sur la palpation de l'abdomen et le toucher rectal."],["li","La palpation de l'abdomen va chercher à mettre en évidence des points douloureux particuliers (fig. 2)."],["li","Douleur à la palpation de l'épigastre : c'est une douleur qui n'est ni d'origine gastrique, ni d'origine pancréatique, elle est en rapport avec un syndrome solaire fait de douleurs pulsatiles, la palpation retrouve une zone de battement sensible qui correspond aux battements exagérés de l'aorte abdominale."],["p","Aorte abdominale"],["p","FIG.2. – Topographie de la paroi abdominale"],["li","Le point douloureux vésiculaire : la palpation de l'hypocondre droit peut mettre en évidence un point douloureux vésiculaire par la manœuvre de Murphy : la palpation appuyée d'un point situé dans l'angle formé par le bord inférieur du foie et la limite externe du muscle grand droit peut déclencher une douleur vive inhibant l'inspiration profonde."],["li","Le point douloureux appendiculaire : la palpation de la fosse iliaque droite peut mettre en évidence une douleur au point de Mac Burney situé sur une ligne à mi-distance entre l'ombilic et l'épine iliaque antéro-supérieure droite."],["li","Le toucher rectal : il est normalement indolore, il peut déclencher une douleur au niveau du cul-de-sac de Douglas, qui est l'indice d'une irritation péritonéale."],["p","6.2. Les douleurs d’origine abdominale peuvent être gastrique, biliaire, pancréatique. intestinale, péritonéale, vasculaire ou pariétale."],["p","6.2.1. Douleurs gastriques :"],["li","Douleur ulcéreuse : due à un ulcère gastrique ou duodénal."],["li","Type : crampe qui peut être remplacée par une sensation de faim douloureuse."],["li","Siège : épigastrique avec irradiation soit en barre vers les deux hypocondres, soit uniquement vers l'hypocondre droit, soit dorsale."],["li","Horaire : douleur rythmée par les repas, post-prandiale tardive : ulcère de l'estomac :1 h 30 après les repas; ulcère duodénal : 4 heures après les repas."],["li","Evolution : périodique dans l'année."],["li","Agents sédatifs : prise d'aliments, repos et pansements gastriques."],["li","Signes accompagnateurs : constipation, vomissements et hémorragies digestives : hématémèse et méléna."],["li","Examen complémentaire : la fibroscopie œso-gastro-duodénale permet de voir l'ulcère."],["li","Douleur de la perforation : complication de l'ulcère, elle réalise un drame abdominal."],["li","Type : douleur déchirante en coup de poignard, inhibant la respiration profonde."],["li","Siège : épigastrique au début, puis diffuse secondairement à tout l'abdomen."],["li","Signes accompagnateurs : vomissements et parfois des signes de choc : pâleur, sueurs, refroidissement des extrémités et pouls rapide."],["li","L'examen clinique est fondamental, il met en évidence trois signes :"],["li","la contracture abdominale;"],["li","la disparition de la matité hépatique;"],["li","la douleur au niveau du cul-de-sac de Douglas au toucher rectal."],["li","La radio de l'abdomen sans préparation faite sur le malade debout montre le croissant gazeux inter-hépatico-diaphragmatique en rapport avec le pneumo-péritoine qui est caractéristique de la perforation."],["li","Douleur de la gastrite : Siège : épigastrique, n'irradiant pas. Type : brûlure, souvent accompagnée de pyrosis (sensation de brûlure qui remonte le long de l'oesophage et s'accompagne de renvois de liquide acide). Horaire : rythmée par les repas, post-prandiale précoce. Evolution : n'est pas périodique. Facteurs de sédation : pansements gastriques. Facteurs déclenchants : les repas. Examen complémentaire : la fibroscopie œso-gastro-duodénale apporte le diagnostic."],["li","Douleurs du cancer gastrique : elles est atypique, elle peut ressembler à la douleur ulcéreuse ou être d'horaire irrégulier non influencée par les repas; elle n'est pas périodique. Intérêt majeur de la fibroscopie œso-gastro-duodénale devant tout syndrome douloureux épigastrique persistant qui permettra de voir la lésion et de faire des biopsies."],["p","6.2.2. Douleur pancréatique au cours de la pancréatite aiguë :"],["li","Type : crampe ou broiement à début brutal, la douleur est intense, intolérable, transfixiante."],["li","Siège : épigastrique avec irradiation sous-costale gauche, lombo-thoracique et scapulaire gauche."],["li","Evolution : prolongée de plusieurs heures à plusieurs jours sans accalmie, elle reste à son intensité maxima."],["li","Facteurs sédatifs : diminuée par la position penchée en avant et par la compression de l’épigastre avec le poing."],["li","Signes accompagnateurs : vomissements, état de choc."],["li","Examen complémentaire : PASP est normal, hyperamylasémie et hyperamylasurie."],["p","6.2.3. Douleur biliaire : elle est en rapport avec une lithiase des voies biliaires : vésicule ou cholédoque."],["li","Douleur vésiculaire :"],["li","Type : réalise la crise de colique hépatique : douleur de type paroxystique à début brutal, très intense avec inhibition respiratoire appelée aussi « colique pathétique »."],["li","Siège : hypocondre droit avec irradiation postérieure vers la pointe de l’omoplate droite et antérieure vers l'épaule droite réalisant la classique douleur en bretelle."],["li","Facteur déclenchant les repas gras."],["li","Signes accompagnateurs : nausée, vomissement et parfois fièvre."],["li","L'examen clinique : met en évidence un point douloureux vésiculaire avec manœuvre de Murphy positive."],["li","Examens complémentaires : cholécystographie qui peut être remplacée par l’échotomographie abdominale."],["li","Douleur cholédocienne : a les mêmes caractères que la douleur vésiculaire. Elle est le plus souvent associée à de la fièvre et à un ictère; la succession chronologique de ces trois signes : douleur, fièvre et ictère en moins de 48 heures réalise le syndrome cholédocien typique. Examen complémentaire : intérêt majeur de l’échotomographie abdominale et de la CPRE."],["p","6.2.4. Douleurs intestinales :"],["li","Douleur colique :"],["li","Type : colique."],["li","Siège : localisée ou suivant le trajet du cadre colique irradiant vers les lombes."],["li","Horaire : nocturne, vers 3 à 4 heures du matin."],["li","Facteurs sédatifs : émission de selles et de gaz. Un aspect particulier la douleur de l'occlusion intestinale aiguë douleur colique très intense accompagnée de vomissement et d'un signe majeur : l'arrêt des matières et des gaz. L'examen clinique met en évidence un météorisme abdominal. La radio de l'abdomen sans préparation : montre des niveaux hydro-aériques."],["li","Douleur du grêle réalise un aspect particulier, le syndrome de Koenig :"],["li","Type : crise douloureuse paroxystique à type de coliques se prolongeant 30 minutes à 2 heures, se terminant brusquement par l'émission de gaz et parfois de matières et une sensation de gargouillements."],["li","Siège : para-ombilical et hypogastrique remarquablement fixe pour un même malade."],["li","Horaire : post-prandiale plus ou moins tardive."],["li","Signes accompagnateurs : gonflement abdominal localisé, nausées ou vomissements à l'acmé de la douleur. Ce syndrome témoigne d'une obstruction incomplète du grêle."],["li","Douleur appendiculaire : est caractéristique de l'appendicite aiguë qui réalise une inflammation aiguë de l'appendice. Cette douleur siège dans la fosse iliaque droite, elle est accompagnée de nausées et ou de vomissements, de trouble du transit intestinal à type de constipation et de fièvre. L'examen clinique met en évidence quatre signes importants :"],["li","Une hyperesthésie cutanée."],["li","Une défense pariétale localisée."],["li","Une douleur provoquée au point de Mac Burney (point appendiculaire). , • U*ne douleur au cul de sac de Douglas au toucher rectal. L'hémogramme montre une hyperleucocytose avec polynucléose neutrophile."],["p","6.2.5. Douleur péritonéale : est en rapport avec une irritation du péritoine réalisant péritonite aiguë qui est secondaire, soit à la perforation d'un organe creux, soit à une affection de voisinage : appendicite."],["p","Elle réalise une douleur d'intensité variable qui dépend de la nature de l'épanchemeni intra-péritonéal et de la rapidité de son apparition, c'est une douleur permanente, localisée au début, puis diffuse à tout l'abdomen secondairement."],["p","Elle est augmentée par la toux, l'éternuement, la palpation et la défécation : tout ce qui produit une augmentation de la pression dans la cavité péritonéale."],["p","L'examen clinique met en évidence deux signes importants :"],["li","Une contracture abdominale, invincible, généralisée."],["li","Une douleur au cul de sac de Douglas au toucher rectal."],["p","6.2.6. Douleur vasculaire : se voit dans deux circonstances en cas d'infarctus mésentérique, occlusion artérielle aiguë et au cours de l'athérosclérose mésentérique réalisant une diminution de calibre de l'artère et responsable de « l'angor abdominal »."],["li","Douleur de l’angor abdominal : elle réalise une crampe péri-ombilicale et épigastrique, post-prandiale précoce, disparaissant avec le jeûne."],["li","Douleur de l’infarctus mésentérique : elle réalise une douleur atroce, angoissante, permanente, diffuse à tout l'abdomen, irradiant dans les lombes, accompagnée de signes de choc : pouls filant, hypotension artérielle, pâleur et refroidissement des extrémités."],["p","6.2.7. Douleur pariétale : peut être le symptôme d'un hématome des grands droits qui peut se voir au cours des syndromes hémorragiques ou comme complication hémorragique d'un traitement anticoagulant."],["p","La douleur siège le plus souvent dans la moitié inférieure de l'abdomen, elle est permanente, augmentée par les mouvements et la pression."],["p","6.3. Les douleurs rapportées : il s'agit de douleurs abdominales dont la cause est extraabdominale, elle peut être d'origine thoracique, génitale ou vertébrale."],["p","6.3.1. Origine thoracique : devant une douleur abdominale pour laquelle il n'y a pas d'explication locale, il faut penser en premier lieu à une cause thoracique :"],["li","Cardiaque : infarctus du myocarde ou péricardite."],["li","Pulmonaire : pneumonie, épanchement pleural liquidien ou aérien."],["li","Œsophagienne."],["p","6.3.2. Origine génitale : prenant naissance au niveau de l'appareil génital féminin : il s'agit d'une douleur abdominale irradiant vers les lombes ou le sacrum."],["p","6.3.3. Origine vertébrale : la douleur abdominale aura alors les caractères d'une douleur radiculaire : augmentée par la toux, l'éternuement et toutes les manœuvres entraînant une augmentation de la pression du LCR."],["h4","6.4. Les autres douleurs"],["p","6.4.1. Douleur abdominale d'origine métabolique : au cours du diabète sucré, du saturnisme : classique « colique de plomb »."],["p","6.4.2. Douleur abdominale d'origine neurologique :"],["li","Manifestation abdominale de l'épilepsie."],["li","Origine psychique : se voit surtout chez l'adolescent et la femme : douleur abdominale traduisant un trouble psychologique."],["h2","II. L’EXAMEN CLINIQUE DE L'APPAREIL DIGESTIF"],["p","L'examen clinique de l'appareil digestif commence à la bouche et se termine à l'anus, il comporte donc un examen de la cavité buccale, de l'abdomen, de la marge anale et un toucher rectal. 1. Examen de la bouche L'examen de la bouche comprend l'examen des dents et des gencives, de la langue, de la muqueuse buccale et sera complété par l'examen de la gorge."],["p","1.1. Les dents :"],["li","Normalement : l'adulte possède 32 dents, réparties en 2 arcs supérieurs droit et gauche et 2 arcs inférieurs ; chaque arc comporte 8 dents : 1 incisive centrale, 1 incisive latérale, 1 canine, 2 prémolaires et 3 molaires; l'enfant a lui, 20 dents de lait : 1 incisive centrale, 1 incisive latérale, 1 canine et 2 prémolaires."],["li","Chez le malade : on établit la formule dentaire, on précise le nombre de caries et on examine l'état des gencives : recherche d'ulcérations et d'une inflammation (gingivite), d'hémorragies gingivales (gingivorragies)."],["h4","1.2. La langue et le plancher de la bouche"],["p","1.2.1. La langue :"],["li","Technique de l'examen et résultats normaux : on demande au sujet de tirer la langue et on étudie la face dorsale et les bords; normalement, la langue est recouverte de papilles, elle est humide et de couleur rosée."],["li","Anomalies : la langue peut être :"],["li","Sèche, rôtie : état de déshydratation."],["li","Lisse, dépapillée : c'est la glossite s'accompagnant d'une sensation de brûlure au contact des mets épicés ou acides : signe évocateur d'une carence en facteur antipernicieux (Vitamine B12 - Acide folique)."],["li","Lisse, luisante, rouge carmin : au cours de la cirrhose."],["li","Blanche, dite saburrale : au cours des maladies infectieuses."],["li","Epaisse, augmentée de volume : c'est la macroglossie qui peut se voir au cours de l'hypothyroïdie et de l'amylose."],["li","Turgescente avec empreintes des dents visibles sur les bords : signe d'hyperhydratation intracellulaire."],["p","1.2.2. Le plancher de la bouche : on demande au sujet de placer le bout de la langue contre la voûte du palais et on observe la face inférieure de la langue avec ses veines linguales proéminentes, le frein de la langue et le plancher de la bouche. La muqueuse de la face inférieure de la langue et du plancher de la bouche est normale ment rosé et humide ; de chaque côté du frein se trouve l'orifice des glandes sous maxillaires. C'est au niveau de la muqueuse de la face inférieure de la langue que l'on recherchera un subictére."],["p","1.3. La muqueuse buccale : est examinée au niveau de la face interne des joues, elle est normalement humide et rosée."],["li","Anomalies :"],["li","Elle peut être :"],["li","sèche : signe de grande valeur de déshydratation intracellulaire:"],["li","rouge : inflammatoire, parsemée de petits points blanchâtres : c'est le signe de Koplick : énanthème de la rougeole."],["li","Elle peut présenter des taches pigmentaires : taches bleu ardoisé au cours de la maladie d'Addison (insuffisance surrénale lente)."],["p","1.4. La gorge : l'examen de la cavité buccale sera complété par un examen du pharynx. qui comporte un examen du voile du palais, de la luette et des amygdales."],["p","Il sera effectué à l'ide d'une lampe de poche et d'un abaisse langue placé sur le tiers moyen de la langue, qui sera abaissé et on demande au sujet de dire : AA"],["li","Normalement : les amygdales sont petites, de couleur rosée, elles présentent des cryptes peu profondes de coloration rosée."],["li","Anomalies : elles peuvent être :"],["li","Augmentées de volume : hypertrophie amygdalienne."],["li","Cryptiques : cryptes profondes, comblées par des débris épithéliaux apparaissant sous forme de points blancs."],["li","Inflammatoires, rouge vif : angine érythémateuse."],["li","Rouges et parsemées d'éléments blancs : angine érythémato-pultacée."],["li","Recouvertes de fausses membranes : rougeur diffuse et pellicules blanchâtres ou grises : angine diphtérique."],["h3","2. Examen de l'abdomen"],["p","2.1. La topographie générale de l'abdomen : Plusieurs divisions topographiques de l'abdomen sont possibles; nous utiliserons celle qui divise l'abdomen en 9 quadrants au moyen de 2 lignes verticales passant par le milieu des arcades crurales et de 2 lignes horizontales, la supérieure passant pas l'extrémité externe des rebords costaux et l'inférieure par les épines iliaques antéro-supérieures (fig. 2)."],["li","Hypocondre droit : bord inférieur du foie, VB, angle colique droit."],["li","Epigastre : estomac, bulbe duodénal, pancréas, aorte abdominale."],["li","Hypocondre gauche : estomac, queue du pancréas, angle colique gauche."],["li","Flanc droit : côlon ascendant, uretère D."],["li","Région ombilicale : intestin grêle, aorte abdominale à sa bifurcation."],["li","Flanc gauche : côlon descendant, uretère G."],["li","Fosse iliaque D : caecum, appendice, annexes chez la femme."],["li","Région hypogastrique : vessie, utérus."],["li","Fosse iliaque G : sigmoïde, annexes."],["p","Point douloureux vesiculaire"],["p","Point douloureux appendiculaire"],["p","FIG. 3. — Points douloureux particuliers."],["p","2.2. Les conditions de l'examen clinique :"],["li","Pièce chauffée, bien éclairée."],["li","Malade placé en décubitus dorsal, le tronc entièrement dévêtu, la tête reposant sur le plan du lit, les membres supérieurs du patient sont placés sur le thorax ou étendus à plat de chaque côté du corps, les membres inférieurs légèrement fléchis."],["li","Le malade doit être mis en confiance et rassuré; on lui demande de respirer calmement la bouche entrouverte."],["li","L'examinateur s'assied à droite du malade, les bras du médecin demi-fléchis doivent être à hauteur de l'abdomen du malade."],["p","2.3. L'examen clinique de l'abdomen : comporte 4 temps : l'inspection, la palpation, la percussion et l'auscultation. Le temps essentiel étant la palpation."],["p","2.3.1. L'inspection : doit précéder impérativement les autres temps et en particulier la palpation ; elle permettra de parler au malade et de le mettre en confiance, elle s'attachera à observer : l'aspect de la peau, la morphologie et les mouvements de l'abdomen."],["li","L'examen de la peau : normalement la peau de l'abdomen a le même aspect que sur le reste du corps. Les signes anormaux peuvent être les suivants :"],["li","Une cicatrice d'intervention chirurgicale sur l'abdomen."],["li","Des vergetures : stries verticales siégeant au niveau des quadrants inférieurs de l'abdomen secondaires à une grossesse ou à une augmentation importante de poids."],["li","Une dilatation des veines abdominales superficielles indiquant une augmentation de la circulation veineuse collatérale due à un obstacle sur la circulation porte (hypertension portale)."],["li","L'aspect morphologique de l'abdomen : à l'état normal : la morphologie de l'abdomen dépend du morphotype du sujet : longiligne ou bréviligne. L'inspection peut révéler les anomalies morphologiques suivantes :"],["li","Abdomen étalé, appelé abdomen de batracien : se voit chez le sujet âgé ou en cas d'ascite de moyenne abondance."],["li","Abdomen distendu : peut se voir en cas de météorisme abdominal et d'ascite de grande abondance."],["li","Asymétrie de l'abdomen : voussure localisée qui peut être l'indice d'une tumeur ou de l'hypertrophie d'un organe par exemple une voussure de l'hypocondre droit peut se voir en cas d'hépatomégalie importante; elle peut être aussi le signe d'une hernie."],["li","Les mouvements de l'abdomen : normalement la paroi abdominale est mobile lors des mouvements respiratoires, des mouvements anormaux peuvent s'observer :"],["li","Des pulsations visibles au niveau du creux épigastrique réalisant le syndrome de l'aorte battante."],["li","Une tuméfaction apparaissant lors de l'effort ou lors de la toux est le signe d'une hernie."],["li","Des ondulations péristaltiques : qui sont des mouvements de reptation spontanés ou provoqués par une petite chiquenaude, sont les signe d'un obstacle :"],["li","soit sténose de pylore : les ondulations péristaltiques sont de siège épigastrique, elles sont associées à une distension abdominale sus-ombilicale, un durcissement inter mittent de l'épigastre et un clapotage à jeun;"],["li","soit occlusion intestinale aiguë : les ondulations péristaltiques sont diffuses, associées à une distension abdominale, elles sont inconstantes. 2.3.2. La palpation : est l'étape essentielle de l’examen clinique de l'abdomen, mais il s'agit d'une étape difficile."],["li","Technique : la palpation doit être effectuée sur un sujet parfaitement détendu, l'examinateur doit palper avec les deux mains réchauffées, posées à plat sur l'abdomen, la palpation se fait avec la pulpe des doigts en commençant par les zones les moins douloureuses,"],["p","tout en parlant au malade, la palpation doit être douce et prolongée. Elle apprécie le tonus de la paroi, elle recherche le bord inférieur du foie (voir chapitre des hépatomégalies)."],["li","Résultats :"],["li","A l'état normal : la paroi est souple, la palpation ne déclenche aucune douleur, le bord inférieur du foie n'est pas palpable."],["li","A l'état pathologique : la palpation peut mettre en évidence des modifications du tonus de la paroi abdominale, une hypertrophie d'un viscère ou une tumeur, l'existence d'une douleur provoquée et de points douloureux particuliers et la présence d'une hernie."],["li","des modifications du tonus de la paroi abdominale : sont souvent dues à une atteinte inflammatoire d'un viscère intra-abdominal ou à une irritation du péritoine ainsi on peut observer : * la défense pariétale : qui correspond à une diminution de la souplesse de la paroi, le plus souvent localisée en regard d'un foyer inflammatoire : exemple au cours de l'appendicite aiguë : existence d'une défense pariétale au niveau de la fosse iliaque droite ; cette défense pariétale doit être différenciée d'une contraction volontaire des muscles qui est engendrée par la crainte ou la nervosité du malade ou par un palper trop brutal; * la contracture abdominale : c'est une contraction invincible des muscles abdominaux qui sont tendus et rigides : classique « ventre de bois », cette contracture augmente si on cherche à la vaincre, elle est due à une irritation du péritoine; exemple au cours de la péritonite par perforation d'un ulcère gastro-duodénal."],["li","Palpation d'un viscère hypertrophié ou d'une masse tumorale : * recherche d'un hépatomégalie : dont on apprécie la consistance du bord inférieur, l'aspect de la surface : régulière ou irrégulière, la consistance et la sensibilité: * recherche d'une vésicule palpable : sous forme d'une tuméfaction rénitente de 6 à 8cm de hauteur mobile avec la respiration, solidaire du bord inférieur du foie; * recherche d'une masse tumorale dont on apprécie le siège, la taille, la forme, la consistance, l'aspect de la surface, la mobilité et la sensibilité."],["li","Recherche de l'existence d'une douleur provoquée et de points douloureux particuliers : * la palpation peut exacerber une douleur spontanée ou déclencher une douleur dite provoquée qui possède moins de valeur que la douleur spontanée; * une douleur provoquée à la décompression est le signe d'une irritation pèritonéale : elle s'obtient en déprimant fortement la paroi en un point éloigné de la région douloureuse et en relâchant brusquement la pression, le malade ressent une douleur très vive au point douloureux; * recherche des points douloureux particuliers : le point appendiculaire n'a de valeur en faveur d'une appendicite que s'il est associé aux autres signes, le point vésiculaire recherché par la manœuvre de Murphy. douleur à la palpation de l'épigastre : sous forme d'une zone de battement sensible qui correspond aux battements exagérés de l'aorte abdominale."],["li","Recherche d'une hernie : la hernie possède les caractères communs suivants : il s'agit d'une tuméfaction molle, impulsive à la toux et réductible. Suivant le siège, on distingue : la hernie ventrale, la hernie inguinale et la hernie crurale. * hernie ventrale : tuméfaction molle qui fait saillie sur la paroi abdominale antérieure : au niveau des points faibles : cicatrices d'intervention chirurgicale, au niveau de l'ombilic, au niveau de la ligne blanche, à ce niveau, elle peut s'accompagner d'une solution de continuité dans l'aponévrose : diastasis grands droits qui se voit surtout chez les multipares :"],["p","* la hernie inguinale : est la plus fréquente : elle réalise une protrusion du péritoine à travers la paroi abdominale dans la région du canal inguinal : on recherche la hernie inguinale sur le malade debout, cuisse légèrement fléchie du côté à examiner, on introduit le petit doigt de la main droite dans l'anneau inguinal externe en refoulant la peau libre à partir du scrotum, on demande au malade de pousser et de tousser, la hernie est ressentie sous forme d'une masse molle : * hernie crurale : située sous l'arcade crurale dans le triangle fémoral, sous forme d'une tuméfaction molle qui augmente de volume avec l'effort ou la toux."],["p","2.3.3. La percussion : doit être douce. il s'agit d'une percussion médiate, elle permet :"],["li","Chez le sujet normal : de déterminer la limite supérieure de la matité hépatique sur la ligne médio-claviculaire droite qui correspond au bord supérieur du foie, située normalement au niveau du 5e espace intercostal, par ailleurs, l'abdomen est normalement sonore dans son ensemble."],["li","Des anomalies peuvent être mises en évidence :"],["li","Disparition de la matité hépatique en cas de perforation d'ulcère."],["li","Existence de matités anormales :"],["li","ascite : qui réalise une matité déclive à limite supérieure concave vers le haut, mobile;"],["li","globe vésical : matité hypogastrique à limite supérieure convexe vers le haut, très sensible."],["p","2.3.4. L'auscultation apporte peu de renseignements : à l'état normal : on entend un bruit de gargouillements. L'auscultation peut mettre en évidence des modifications pathologiques :"],["li","Silence auscultatoire : au cours de l'occlusion intestinale aiguë."],["li","Souffle : en cas de tumeur hypervascularisée, en cas de rétrécissement artériel ou en cas d'anévrysme abdominal."],["h3","3. Examen ano-rectal"],["p","3.1. Examen de la marge anale : l'inspection de la marge anale va rechercher :"],["li","Des hémorroïdes externes : qui sont des varices ano-rectales (dilatations veineuses)."],["li","Une fissure : ulcération linéaire très douloureuse, située dans un pli radié de l'anus."],["li","Une fistule : orifice faisant communiquer la marge de l'anus et le rectum."],["p","3.2. Le toucher rectal : est d'une importance capitale."],["p","3.2.1. Matériel : doigtier et lubrifiant (vaseline)."],["p","3.2.2. Positions du malade :"],["li","Décubitus latéral gauche : cuisses et genoux en flexion : qui permet la recherche d'une tumeur intrarectale : face postérieure et latérale du rectum (fig. 4)."],["li","Position genu-pectorale : le malade est à genoux, les épaules et la tête reposant sur la table d'examen : qui permet d'apprécier le volume de la prostate (fig. 5)."],["li","Décubitus dorsal : cuisses fléchies sur le tronc, les genoux repliés tenus par les mains du malade : qui permet d'explorer la face antérieure du rectum et le cul de sac de Douglas."],["p","3.3.3. Technique : l'index recouvert d'un doigtier lubrifié est appliqué doucement sur le sphincter anal qui se relâche, le doigt est alors introduit sans douleur dans le canal anal et le rectum."],["p","On note le tonus du sphincter et on recherche un rétrécissement. Le doigt palpe les parois latérales et postérieures à la recherche de tumeur ou de polype, le doigt palpe ensuite la paroi antérieure afin d'évaluer chez l'homme le volume, la forme et la consistance de la prostate, chez la femme, le col utérin est palpé sous forme d'une petite masse ronde."],["p","Puis, on demande au malade de pousser, ce qui peut faire descendre le rectum de 7 à 10cm et qui permet d'explorer une plus grande partie de ce dernier."],["p","Au retrait du doigtier, on note l'aspect des selles. Après une défécation, le rectum doit être vide, s'il persiste des selles, il s'agit d'une constipation par dyschésie pelvi-rectale."],["p","Les hémorroïdes internes ne sont pas mises en évidence au toucher rectal, sauf si elles sont thrombosées."],["p","FIG. 4. — Toucher rectal en décubitus latéral."],["p","FIG. 5. — Toucher rectal en position genu -pectorale."],["h2","III. LES PRINCIPALES INVESTIGATIONS COMPLÉMENTAIRES"],["h3","1. Les explorations du tube digestif"],["h4","1.1. Les examens radiographiques"],["p","1.1.1. La radiographie de l'abdomen sans préparation : ASP se fait sur le malade en position debout."],["p","Elle doit être systématique en cas d'urgence abdominale."],["p","1.1.2. Les radiographies du tube digestif : se font après introduction d'un produit opacifiant, la baryte, au niveau de l'organe à étudier."],["p","Actuellement, l'introduction de baryte en couche mince est à associer à l'introduction d'air, ce sont les radiographies à double contraste qui permettent d'obtenir de meilleures images."],["li","Transit œso-gastro-duouénal : permet de visualiser l'oesophage, l'estomac et le duodénum."],["li","Transit du grêle : visualise l'intestin grêle. L'introduction de la baryte se fait par la bouche :"],["li","Lavement baryte : visualise le colon après introduction de la baryte par l'anus."],["p","1.2. Les examens endoscopiques : sont réalisés grâce à des endoscopes qui sont des tubes munis d'un système d'éclairage; ces tubes sont soit rigides : anuscope et rectoscope; soit souples, ce sont les fibroscopes : œsophago-gastro-duodénoscope et coloscope."],["p","Outre leur intérêt dans la vision directe des lésions des organes explorés, ils permettent d'une part de pratiquer des biopsies des lésions suspectes et d'autre part, de surveiller les malades sous traitement."],["h4","1.3. Les examens biologiques fonctionnels"],["p","1.3.1. L'examen du liquide gastrique : prélevé par tubage avec dosage de l'acidité gastrique de base et après stimulation à l'histamine et à la pentagastrine."],["p","1.3.2. L'examen des selles :"],["li","Examen parasitologique : qui se fait immédiatement après l'émission des selles."],["li","Recherche de germes : par coproculture."],["li","Recherche de sang : après 3 jours de régime sans viande, ni poisson, ni légume riche en chlorophylle (haricots verts) et sans brossage des dents : le sang est recherché par la classique réaction de Weber ou plus simplement grâce à des bandelettes réactives (Hémocult)."],["p","1.3.3. Les tests d'absorption intestinale :"],["li","Test au D-xylose : qui consiste à mesurer la xylosémie et la xylosurie après prise orale de D xylose qui est normalement absorbé au niveau de la muqueuse intestinale."],["li","Test de Schilling : test d'absorption de la vitamine B12 marquée au cobalt radio actif, qui consiste à mesurer la radioactivité urinaire après prise orale de vitamine B12 marquée. Pour que la vitamine B 12 soit absorbée et retrouvée dans les urines, il faut que le facteur intrinsèque soit normalement sécrété par les cellules fundiques de l'estomac et il faut que la muqueuse du grêle soit normale."],["h3","2. les explorations du foie et des voies biliaires"],["h4","2.1. L'exploration fonctionnelle hépatique"],["p","2.2.1. Rappel physiologique des fonctions hépatiques : le foie possède des fonctions métaboliques, un rôle de stockage, des fonctions d'épuration et une fonction biliaire."],["li","Les fonctions métaboliques :"],["li","Le métabolisme glucidique : le foie de par sa fonction glycogénique assure le maintien de la glycémie à un niveau normal."],["li","Le métabolisme protidique :"],["li","synthèse des protides : de l'albumine, des facteurs de la coagulation : fibrinogène et prothrombine; la prothrombine est synthétisée par la cellule hépatique en présence de vitamine K (vitamine liposoluble apportée par l'alimentation et absorbée au niveau du tube digestif en présence des sels biliaires);"],["li","catabolisme des protides : aboutit à la formation de l'urée sanguine, à partir de l'ammoniac provenant lui-même de la dégradation des acides aminés : c'est l'uréogenèse qui est une des principales fonctions du foie."],["li","Le métabolisme des lipides : le foie assure en partie la régulation du taux de lipides, de triglycérides et de cholestérol dans le sang."],["li","Le rôle de stockage :"],["li","La cellule hépatique est le lieu de stockage du fer et des facteurs antipernicieux : vitamine B12 et acide folique."],["li","Elle contient également des enzymes :"],["li","les transaminases : enzymes de cytolyse qui ne peuvent être libérées dans le sang qu'après destruction de la cellule hépatique; transaminase glutamino-pyruvique : SGPT surtout d'origine hépatique; transaminase oxalo-acétique : SGOT d'origine surtout musculaire;"],["li","les phosphatases alcalines : sont d'origine hépatique et osseuse ; elles ont pour particularité d'être éliminées dans la bile donc elles seront augmentées dans le sang en cas de cholestase, mais cette augmentation n'est pas spécifique de la cholestase, elle peut se voir également au cours des affections osseuses;"],["li","la gamma-glutamyl-transpeptidase ou gamma-GT dont le site de production est encore mal connu est plus spécifique du foie, elle est augmentée dans les syndromes de cholestase dont elle paraît représenter le meilleur index."],["li","La fonction d'épuration : le foie possède une fonction d'épuration du sang pour certains produits toxiques et médicamenteux et pour des colorants, par exemple, la bromo-sulfonephtaléine (BSP) qui est employée à des fins diagnostiques."],["li","La fonction biliaire : une des fonctions principales du foie est la formation de la bile qui contient :"],["li","Les pigments biliaires : bilirubine conjuguée qui provient de la dégradation de l'hémoglobine."],["li","Les sels biliaires : qui ont un rôle important dans la digestion et dans l'absorption des substances liposolubles : vitamines K, D, E et A."],["li","Les phosphatases alcalines, la gamma G T."],["li","Le cholestérol."],["p","2.2.2. Etude analytique de l'exploration fonctionnelle hépatique :"],["li","Tests globaux : l'épreuve à la BSP permet d'étudier la fonction d'épuration plasma tique, ce test est inutile en cas d'ictère car il est toujours perturbé (sauf en cas d'ictère héréditaire : maladie de Dubin Johnson); il peut même alors être dangereux, car nsque de"],["pre","manifestations allergiques.                                   .."],["p","On injecte 1 ml pour 10 kg de poids d'une solution de BSP dosée a 5 % par voie intraveineuse et on pratique un prélèvement sanguin au b
