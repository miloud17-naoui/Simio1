és dans les ganglions axillaires et susclaviculaires."],["p","1.2. Chez l'homme et la petite fille : le sein est réduit, le corps du seul a une largeur de 1,5 cm et une épaisseur de 0,5 cm."],["pre","FIG. 9-2.   Mobilité du sein."],["h3","2. Méthodes d'examen"],["p","2.1. L'inspection : se fait sur la malade dévêtue jusqu'à la ceinture, en position assise face à l'examinateur, les mains posées sur les genoux joints, puis les bras levés au-dessus de la tête (fig. 10-1 et 10-2) de manière comparative."],["p","FIG. 10-1. — Inspection des seins : malade assise bras le long du corps."],["p","FIG. 10-2. — Inspection des seins : malade assise bras levés au-dessus de la tête."],["p","2.2. La palpation du sein : se fait sur la malade assise les bras baissés, puis les bras levés au-dessus de la tête et en position couchée en plaçant un petit coussin sous l'épaule du côté du sein que l'on veut examiner; ainsi le sein s'étale sur la paroi thoracique, ce qui facilite l'examen."],["p","La palpation doit être douce, elle se pratique avec la pulpe des doigts dans un mouvement rotatoire de va-et-vient (fig. 11-1, 11-2 et 11-3), elle doit être systématique explorant chaque quadrant."],["p","La palpation des creux axillaires et des creux sus-claviculaires doit être systématique à la recherche d'adénopathies (fig. 12-1 et 12-2)."],["pre","Fie. 11 -1. — Palpation des seins :     FIG. 11-2. — Palpation des seins :\n malade assise, bras pendants,          malade assise, bras levés."],["p","FIG. 11-3. — Palpation des seins : malade couchée."],["h3","3. Résultats"],["p","3.1. A l’étât normal chez la femme après la puberté, les seins vont subir des modifications au cours de la vie génitale."],["p","3.1.1. Au cours du cycle menstruel : après l'ovulation dans la deuxième partie du cycle, on note une augmentation de volume des seins qui atteint son maximum dans la période prémenstruelle, les seins sont alors engorgés, lobulés et douloureux."],["p","Dans la première partie du cycle le sein est plus souple et plus homogène."],["p","3.1.2. Au cours de la grossesse : les seins augmentent de volume, l'aréole s'agrandit et elle est hyperpigmentée, cette hypertrophie intéresse le tissu mammaire présent dans le creux axillaire, ainsi les aisselles paraissent plus remplies."],["p","A la palpation, les seins sont fermes et nettement lobulés."],["p","3.1.3. Après la ménopause : les seins ont une consistance fibreuse et nodulaire."],["p","3.2. A l'état pathologique : les seins peuvent être le siège de différents remaniements pathologiques : l'abcès du sein, les tumeurs et la gynécomastie."],["p","3.2.1. L'abcès du sein : survient essentiellement en période d'allaitement, il va évoluer en 2 phases :"],["li","Au début : la malade présente une douleur très vive, qui l'oblige à suspendre l'allaitement, et une hyperthermie. La palpation douce retrouve, à la partie inféro-externe le plus souvent du sein atteint, une tuméfaction dure, très douloureuse. Par le mamelon s'écoule, lors de l'expression douce du sein, du lait mélangé à du pus."],["li","En l'absence de traitement, quelques jours plus tard apparaît, une rougeur cutanée, à la palpation la tuméfaction devient fluctuante et on retrouve une adénopathie axillaire."],["p","FIG. 12-1. — Palpation du creux axillaire."],["p","FIG. 12-2. — Palpation du creux sus-claviculaire."],["p","Sein normal"],["p","FIG. 13. — Ligaments suspenseurs du sein."],["p","3.2.2. La tumeur bénigne : à l'inspection une tumeur bénigne n'entraîne pas de modification de la morphologie du sein; à la palpation elle réalise une tuméfaction bien limitée, mobile par rapport à la peau et par rapport au plan musculaire."],["p","Il n’existe jamais d’adénopathie axillaire. Dans le cancer du sein, l’inspection peut mettre en évidence :"],["li","Une rétraction cutanée ou fossette qui est un signe important de malignité, elle se manifeste sous forme d'une dépression de la peau au niveau du sein qui peut être accompagnée d'une déviation du mamelon dirigée vers la lésion, elle est due à la traction anormale exercée par la tumeur sur les ligaments suspenseurs du sein (fig. 13), elle se recherche soit en demandant à la malade de lever les bras au-dessus de la tête, soit de presser fortement les paumes des mains l'une contre l'autre (ce qui entraîne une contraction des pectoraux et exagère ainsi le phénomène de rétraction) (fig. 14-1 et 14-2)."],["pre","FIG. 14-1. — Rétraction du sein droit mise               FIG. 14-2. — Rétraction du sein droit mise\n  en évidence à l'inspection : la malade bras              en évidence à l'inspection : la malade\n      levés,                                                   presse la paume de ses mains."],["p","FIG. 14-3. — Rétraction du mamelon droit en rapport avec un cancer du sein sous- jacent."],["li","Une rétraction du mamelon : suivant le siège de la tumeur, la rétraction cutanée peut être remplacée par une rétraction du mamelon (fig. 14-3)."],["li","Le signe de « la peau d'orange » est en rapport avec un lymphœdème (oedème causé par l'obstruction des canaux lymphatiques); à l'inspection il se traduit par des pores et des follicules pileux plus prononcés et à la palpation la peau paraît épaissie capitonnée (fig. 15). La palpation va retrouver une tuméfaction de consistance variable qui se mobilise en masse avec le sein; parfois cette tuméfaction est adhérente au muscle sous-jacent que l'on met en tension par la manœuvre de l'adduction contrariée de Tillaux : le médecin s'oppose à l'adduction du bras de la malade (ce qui met en tension le muscle grand pectoral); on pince alors la glande à pleine main et on essaie de la mobiliser en cas de cancer, la mobilité est diminuée ou abolie; enfin la palpation du creux axillaire peut mettre en évidence une adénopathie. A noter que tous ces signes sont ceux d'un cancer du sein à un stade avancé ; au début un cancer du sein peut avoir tous les caractères d'une tumeur bénigne et seules les investigations paracliniques : la mammographie, la ponction mais surtout l'examen anatomo-pathologique après exérèse permettront de trancher."],["p","3.2.4. La gynécomastie : est définie comme une hypertrophie mammaire pathologique apparaissant soit chez l’homme soit chez la petite fille avant la puberté. Elle peut être due à un traitement hormonal par les œstrogènes ou accompagner un cancer ou une cirrhose."]]}]},{"ic":"🫁","ar":"الجهاز التنفسي","fr":"L'appareil respiratoire","c":"#2563EB","ch":[{"ar":"الدراسة التحليلية: العلامات والفحوص","fr":"Étude analytique","w":9901,"b":[["h2","I. SIGNES FONCTIONNELS"],["p","Les signes fonctionnels qui amènent le malade à consulter et qui orientent l'attention du médecin vers l'appareil respiratoire sont : la dyspnée, la douleur thoracique, la toux, l'expectoration, la vomique, l'hémoptysie et les troubles de la voix."],["p","Il faut insister d'emblée sur le fait que certains de ces symptômes fonctionnels ne sont pas spécifiques d'une atteinte de l'appareil respiratoire et se voient aussi fréquemment au cours d'une anomalie de l'appareil cardio-vasculaire ou plus rarement d'un appareil extrathoracique."],["p","C'est leur analyse sémiologique minutieuse associée aux résultats de l'examen clinique qui permettra de les rattacher à l'un ou à l'autre de ces appareils."],["h3","1. La dyspnée"],["p","1.1. Définition : la dyspnée, c'est la difficulté ou gêne à respirer : la respiration devient d'une part consciente et volontaire et d'autre part pénible. Elle doit être essentiellement différenciée de l'hyperventilation qui est une augmentation de l'amplitude respiratoire ne s'accompagnant pas de gêne respiratoire et qui se voit dans les fausses dyspnées d'origine métabolique sans atteinte respiratoire."],["p","1.2. Rappel physiologique de la respiration :"],["p","La respiration normale est automatique, donc involontaire et inconsciente, elle comprend deux temps :"],["li","L'inspiration: est le temps actif, elle est possible grâce à la contraction du diaphragme muscle inspiratoire, elle s'accompagne d'une augmentation de volume de la cage thoracique rendant possible la pénétration de l'air. Les muscles accessoires de l'inspiration (sternocléido-mastoïdiens, scalènes, grand dorsal, grand pectoral) n'interviennent pas ou très peu lors de la respiration normale au repos : ils se contractent lors de l'effort ou dans les gênes pathologiques affectant l'inspiration."],["li","L'expiration : est le temps passif, grâce à l'élasticité pulmonaire la cage thoracique reprend sa position initiale ce qui rend possible la sortie de l'air."],["p","Normalement, le temps expiratoire est plus long que le temps inspiratoire. Les muscles expiratoires (petit et grand oblique, petit dentelé inférieur et transverse) ne seront mis enjeu que dans les gênes pathologiques affectant l'expiration."],["p","La respiration est un acte réflexe qui comprend :"],["li","Des voies centripètes : comprenant des fibres d'origine corticale, des fibres d'origine pulmonaire et des fibres d'origine sino-carotidienne, les deux dernières cheminant dans le tronc du pneumogastrique."],["li","Un centre respiratoire : bulbaire situé dans le plancher du ventricule. Ce centre est excité directement par la pression partielle de gaz carbonique et le pH sanguin et indirectement par l'intermédiaire des fibres centripètes d'origine sino-carotidienne par l'hypoxie (baisse de la pression partielle d'oxygène)."],["li","Des fibres centrifuges : la principale est le nerf phrénique qui innerve le diaphragme. Le mécanisme de la respiration est le suivant : l'inspiration appelle l'expiration, c'est le réflexe de Héring-Breuer : au cours de l'inspiration les fibres d'origine pulmonaire sont excitées par la distension du poumon, elles envoient un influx inhibiteur au centre respiratoire qui suspend son activité rendant ainsi possible l'expiration; au cours de l'expiration le centre ne reçoit plus cet influx inhibiteur, il reprend son activité et excite le nerf phrénique d'où inspiration. La fréquence respiratoire : nombre de mouvements respiratoires par minute varie avec l'âge du sujet, au repos elle est de :"],["li","14 à 22 mouvements/minute chez l'adulte;"],["li","22 à 30 mouvements/minute chez l'enfant. File varie et augmente normalement à l'effort et en altitude."],["p","1.3. Analyse sémiologique de la dyspnée : La dyspnée, qui est une perception consciente d'une gêne respiratoire, est donc bien un signe subjectif ou fonctionnel. Elle sera donc analysée par un interrogatoire soigneux comportant : la date de début, le mode de début : brutal ou progressif, les circonstances d'apparition : le caractère spontané ou provoqué (effort, fumée, saison), l'évolution dans le temps : permanente ou paroxystique (évolution par accès ou crises durant de quelques minutes à quelques heures), l'horaire dans le nycthémère (diurne ou nocturne), l'existence de signes accompagnateurs : toux, expectoration... La dyspnée signe fonctionnel s'accompagne toujours de modifications objectives de la respiration portant sur la fréquence, l'amplitude et la durée des deux temps de la respiration ; ces modifications seront analysées lors de l'inspection, premier temps de l'examen clinique de l'appareil respiratoire."],["p","1.4. Les différents types de dyspnée : Au terme de l'interrogatoire et de l'inspection du malade plusieurs types de dyspnée peuvent être individualisés."],["li","Selon le mode de début :"],["li","Dyspnée aiguë : début brutal la dyspnée est d'emblée à son maximum."],["li","Dyspnée chronique : début progressif le plus souvent."],["li","Selon les circonstances d'apparition :"],["li","la dyspnée d'effort : c'est une dyspnée chronique induite par des efforts très limités et courants, qui se prolonge au-delà de la durée normale (plus de 5 minutes) après la cessation de l'effort et qui va en augmentant dans le temps pour des efforts de plus en plus restreints. Il est important de préciser l'intensité de cette dyspnée en faisant préciser au malade le type d'effort qui la fait apparaître : nombre d'étages, nombre de marches ou le nombre de mètres parcourus; parfois effort moindre : effort d'habillage. C'est la première manifestation de l'insuffisance ventilatoire."],["p","Fig1. Les différents types de respiration."],["li","Selon le mode d'évolution :"],["li","Dyspnée paroxystique : crises de dyspnée durant de quelques minutes à quelques"],["p","heures séparées  par des intervalles de respiration normale : exemple : la crise d'asthme."],["li","Dyspnée permanente : ou dyspnée de repos, apparaît au terme d'une période plus ou moins longue de dyspnée d'effort; elle se manifeste surtout dans le décubitus imposant parfois la position assise, buste vertical, qui la soulage : c'est l'orthopnée."],["li","Selon la fréquence respiratoire :"],["li","Polypnée : lorsque la fréquence respiratoire augmente et devient supérieure à 22 mouvements/minute chez l'adulte et à 30 mouvements/minute chez l'enfant (fig. 1 b)."],["li","Bradypnée : lorsque la fréquence respiratoire diminue respectivement au-dessous de 14 chez l'adulte et 22 chez l'enfant (fig. le)."],["li","Selon le temps respiratoire :"],["li","Bradypnée inspiratoire : se voit lorsqu'il y a un obstacle à la pénétration de l'air : obstruction laryngée par une inflammation du larynx (laryngite), par des fausses membranes (diphtérie laryngée ou croup) ou par un corps étranger. Cette bradypnée inspiratoire est une dyspnée aiguë, elle s'accompagne souvent d'un cornage : bruit inspiratoire caractéristique et d'un tirage qui réalise une dépression inspiratoire des parties molles : sus-sternale, sous-sternale et intercostale."],["li","Bradypnée expiratoire : se voit lorsqu'il y a un obstacle à la sortie de l'air par atteinte diffuse des bronches de tous calibres, ce qui est réalisé dans la crise d'asthme (où il y a broncho-constriction et œdème de la muqueuse bronchique). Cette bradypnée expiratoire est une dyspnée paroxystique, elle s'accompagne de sifflements expiratoires : respiration sifflante entendue à l'examen clinique du thorax, ce sont les râles sibilants et même parfois à distance."],["p","1.5. Les fausses dyspnées ou dyspnées sine materia, sans substratum anatomique, ne s'accompagnent pas de gêne respiratoire."],["li","La respiration de Kussmaul c'est une hyperventilation réalisant une respiration lente, régulière et profonde, égale aux deux temps qui sont séparés par une pause d'où le nom de respiration en créneau. Elle s'observe dans les états d'acidose métabolique diabétique ou rénale, elle est liée à la baisse des bicarbonates sanguins, d'où baisse du pH (fig. 1d)."],["li","La respiration périodique de Cheyne-Stokes : elle est le témoin d'un désordre nerveux central. C'est une irrégularité du rythme respiratoire qui se caractérise par des cycles respiratoires d'amplitude croissante devenant bruyants, puis d'amplitude décroissante aboutissant à une pause complète de quelques secondes ou apnée. Cette périodicité apparaît du fait de l'alternance de phases d'hypercapnie et d'hypo-capnie qui provoquent successivement une hyperventilation puis une hypoventilation (fig. 1e)."],["li","La respiration périodique du syndrome de Pickwick : est également une irrégularité du rythme respiratoire, elle se voit chez certains obèses, elle est alors associée à une somnolence diurne. Cette respiration périodique s'observe la nuit, elle est faite de la succession de cycles caractérisés par une inspiration lente et profonde, suivie de mouvements respiratoires courts et"],["pre","rapides et d'une apnée expiratoire complète        (fig. 1f)."],["h3","2. Les douleurs thoraciques"],["p","Les douleurs thoraciques s'observent surtout au cours des affections de la plèvre et du parenchyme pulmonaire juxta-cortical, car les autres structures de l'arbre respiratoire sont dépourvues de sensibilité douloureuse. Ces douleurs d'origine respiratoire devront être distinguées des douleurs d'origine pariétale et des douleurs d'origine cardiaque (ces dernières seront étudiées ultérieurement)."],["p","L'analyse des douleurs thoraciques repose sur l'interrogatoire, on précisera la topographie de la douleur, le siège superficiel ou profond et les irradiations, le mode de début brutal ou progressif, les signes accompagnateurs en particulier la dyspnée."],["p","Au terme de cet interrogatoire, on peut distinguer :"],["p","2.1. Les douleurs thoraciques ayant pour origine l'appareil respiratoire : ce sont des douleurs profondes. Elles ont en commun 2 caractères essentiels :"],["li","Elles sont exacerbées par la toux, l'inspiration profonde et les changements de position."],["li","Elles réalisent une douleur unilatérale à type de « point de côté »."],["p","2.1.1. Douleurs d'origine pleurale : le point de côté siège à la base du thorax."],["li","Epanchement pleural aérien ou pneumothorax : c'est l'irruption brutale de l'air dans l'espace pleural normalement virtuel après rupture de la plèvre viscérale avec collapsus pulmonaire. Il s'agit d'un accident aigu qui va s'accompagner d'une douleur déchirante avec angoisse et dyspnée, et parfois d'une perte de connaissance. Après une période d'adaptation de quelques minutes, la douleur diminue et devient supportable mais reste permanente."],["li","Epanchement pleural liquidien : la symptomatologie douloureuse varie en fonction de la nature du liquide :"],["li","Liquide inflammatoire ou exsudât (pleurésie séro-flbrineuse). La douleur est d'intensité modérée, à début progressif, signe accompagnateur : fébricule ou fièvre en règle modérée."],["li","Liquide purulent (pleurésie purulente). La douleur est d'intensité variable, le début est brutal, signes accompagnateurs : fièvre élevée et altération de l'état général."],["li","Epanchement sanglant : hémothorax : la douleur est d'intensité variable, le début est brutal, le plus souvent post-traumatique, signes accompagnateurs : pâleur, parfois signes de choc avec pouls rapide, filant, tension artérielle effondrée."],["p","2.1.2. Douleur d'origine parenchymateuse : essentiellement dans la pneumonie franche lobaire aiguë. La douleur est d'intensité vive, à début brutal, de siège sous-mamelonnaire, durée 48 heures, signes accompagnateurs : fièvre élevée, toux, expectoration : crachats « rouilles » de Laennec."],["p","2.1.3. Un aspect particulier : la douleur de l'embolie pulmonaire : l'embolie pulmonaire est due à la migration d'un embol le plus souvent un caillot sanguin dans une artère pulmonaire ou l'une de ses branches. Elle peut être suivie, mais non constamment, au bout de 24 à 36 heures d'un infarctus pulmonaire."],["p","La douleur est d'intensité variable, le plus souvent vive, à début brutal, de siège basithoracique ou parfois dans les formes massives de siège parasternal avec irradiation en demiceinture."],["p","Les signes accompagnateurs sont :"],["li","Dans l'immédiat : une dyspnée à type de polypnée, une ascension thermique et une accélération de la fréquence cardiaque, parfois des signes d'insuffisance ventriculaire droite aiguë."],["li","Au bout de 24 à 36 heures : de manière inconstante, une toux avec une expectoration hémoptoïque. L'embolie pulmonaire survient dans un contexte étiologique particulier : accouchement récent, intervention chirurgicale récente ou lors d'un alitement prolongé. Une phlébite des membres inférieurs point de départ de l'embol devra être recherchée systématiquement."],["p","2.2. Les douleurs thoraciques d'origine pariétale : sont des douleurs superficielles."],["p","2.2.1. Douleur thoracique post-traumatique: s'accompagne cliniquement d'une ecchymose cutanée."],["p","2.2.2. Névralgie intercostale : douleur localisée qui s'accompagne souvent d'une douleur provoquée à la pression du thorax au point d'émergence d'un nerf intercostal."],["p","2.2.3. Névralgie phrénique : douleur thoracique basse, intense, irradiant le long du bord externe du sternum vers l'épaule et s'accompagnant d'un point douloureux provoqué sur le trajet du nerf phrénique."],["p","2.2.4. Zona : c'est une maladie infectieuse due à un virus à tropisme neuro-ectodermique qui se manifeste par une éruption érythémato-vésiculeuse de trajet radiculaire et par une douleur thoracique à type de causalgie : sensation de cuisson ou parfois à type de névralgie."],["p","2.2.5. Syndrome de Tietze : douleur localisée au niveau d'une articulation chondro-sternale ou chondro-costale s'accompagnant d'une tuméfaction de cette articulation."],["h3","3. La toux"],["p","3.1. Définition: La toux est une brusque, bruyante et brève expiration à travers la glotte rétrécie. La toux peut être volontaire, le plus souvent elle est involontaire, c'est un acte réflexe de défense destiné :"],["li","A empêcher la pénétration de corps étrangers dans les voies respiratoires."],["li","A expulser les mucosités qui s'y trouvent accumulées (exemple : hypersécrétion bronchique)."],["p","3.2. Physiopathologie : La toux est un acte réflexe qui se déroule en trois phases :"],["li","Inspiration profonde."],["li","Fermeture de la glotte."],["li","Brusque contraction des muscles de la paroi abdominale, d'où augmentation de la pression intra-abdominale et refoulement violent et passif du diaphragme vers le haut qui aboutit à l'expulsion de l'air sous pression. Ce réflexe : est déclenché par l'irritation de l'épithélium des voies respiratoires, des zones dites tussigènes : larynx, bifurcation trachéale, éperons de division des grosses bronches. Le point de départ du réflexe peut se trouver en dehors des zones tussigènes : muqueuse nasale et pharyngée et séreuse pleurale, ou à distance de l'arbre respiratoire : estomac, vésicule biliaire, utérus, ovaires. L'excitation déclenchante peut être due soit à une inflammation, soit à un corps étranger, soit à un exsudât jouant le rôle de corps étranger. La voie centripète : est constituée par le pneumogastrique, qui transmet les informations recueillies à partir des zones sensibles par ses rameaux terminaux. Le centre : est constitué par le noyau du pneumogastrique situé dans le plancher du quatrième ventricule. Les voies centrifuges : sont la moelle et les nerfs rachidiens moteurs des muscles abdominaux."],["p","3.3. Les différents types de toux : Les différents types de toux seront précisés par l'interrogatoire. On distingue :"],["p","3.3.1. Selon le degré de sécheresse ou d'humidité :"],["li","La toux sèche : bruit sonore plus ou moins éclatant; elle est soit brève, soit quinteuse (plusieurs secousses de toux), elle n'est pas suivie d'expectoration."],["li","La toux humide ou grasse : c'est une toux dite productive, elle s'accompagne du déplacement bruyant de mucosités plus ou moins abondantes émises avec plus ou moins de facilité; donc elle peut être accompagnée d'une expectoration. Cette toux doit être respectée contrairement à la toux sèche."],["p","3.3.2. Selon le timbre de la toux :"],["li","La toux bitonale : la toux présente un double timbre aigu et grave lié à la paralysie d'une corde vocale par compression d'un nerf récurrent."],["li","La toux rauque : toux à tonalité étouffée en cas d'inflammation du larynx, elle est associée à une voix claire dans la laryngite striduleuse, à une voix éteinte dans le croup."],["p","3.3.3. Selon le rythme de la toux :"],["li","La toux monilifonne : 1 à 2 secousses de toux irrégulièrement espacées de temps à autre."],["li","La toux quinteuse ou spasmodique : dont le type est la toux observée au cours de la coqueluche, qui survient par accès ou quintes constituées par une série de secousses expiratoires entrecoupées d'une inspiration profonde ou reprise bruyante appelée « chant du coq». Une toux quinteuse observée en dehors de la coqueluche est appelée toux coqueluchoide."],["p","3.3.4. Selon les signes accompagnateurs :"],["li","La toux émétisante : est une toux responsable de vomissements, elle s'observe au cours de la coqueluche : c'est une toux quinteuse et émétisante."],["h3","4. L'expectoration"],["p","C'est le satellite de la toux sauf chez les femmes et les enfants au-dessous de 12 ans qui toussent sans cracher; chez ces sujets les exsudais bronchiques ou pulmonaires sont déglutis et ne pourront être recueillis que par tubage gastrique à jeun."],["p","Normalement l'expectoration est composée de mucus bronchique, de déchets alvéolaires et de protéines provenant de l'exsudation capillaire et d'éléments cellulaires. Elle peut être mélangée à des sécrétions bucco-pharyngées."],["p","L'expectoration pathologique est la conséquence :"],["li","Soit de l'augmentation d'une des composantes normales : exemple, expectoration muqueuse de la crise d'asthme ou expectoration séreuse au cours de l'œdème aigu du poumon."],["li","Soit d'une suppuration bronchique ou pulmonaire."],["p","4.1. La valeur sémiologique de l'expectoration est fondamentale : d'où l'importance du recueil et de l'examen attentif qualitatif et quantitatif quotidien de l'expectoration, au mieux dans un verre gradué."],["p","On notera :"],["p","4.1.1. L'abondance : la quantité est variable, de quelques centimètres cubes à plusieurs centaines de centimètres cubes."],["p","4.1.2. La couleur : blanchâtre : crachat muqueux; jaune : crachat purulent..."],["p","4.1.3. L'odeur : en général nulle, parfois odeur fade de plâtre frais : en cas de suppuration bronchique."],["p","4.1.4. La transparence, la consistance et l'aération : sont trois caractères qui se combinent : expectoration séreuse de l'œdème aigu du poumon qui est transparente, fluide et mousseuse; crachats épais de la tuberculose cavitaire."],["p","4.1.5. L'horaire : expectoration matinale qui correspond à la toilette des bronches. 4.2."],["p","Les différents types d'expectoration :"],["p","4.2.1. L'expectoration muqueuse : est formée de mucus. Les crachats sont transparents, visqueux, aérés, adhérents au crachoir et filants comme du blanc d'œuf."],["p","Cette expectoration traduit l'hypersécrétion de mucus bronchique non accomagnée d'infection. Elle peut contenir des petits fragments de mucus plus concrètes en grain de . tapioca, encore appelés crachats perlés de Laennec."],["p","Cette expectoration survient à la fin de la crise d'asthme. Enfin cette expectoration muqueuse peut prendre l'aspect de moules bronchiques faits de mucus concrète : dans l'asthme et la bronchite chronique."],["p","4.2.2. L'expectoration purulente est faite de pus franc qui provient d'un foyer de suppuration pulmonaire (abcès du poumon), elle est inodore ou putride (abcès à anaérobies)."],["p","4.2.3. L'expectoration muco-purulente : est très fréquente, c'est le type d'expectoration le plus répandu; suivant son abondance on distingue :"],["li","L'expectoration muco-purulente de petite abondance: c'est une expectoration muqueuse mêlée d'îlots de pus jaune verdâtre plus ou moins abondants."],["li","L'expectoration muco-purulente de grande abondance: 150 à 200cm3 par 24 heures, c'est la bronchorrhée, elle sédimente en 4 couches :"],["li","Une couche profonde : faite de pus épais, jaune verdâtre."],["li","Une couche muqueuse : couche transparente parfois teintée de sang."],["li","Une couche muco-purulente : faite de mucus contenant des globules de pus en suspension."],["li","Une couche spumeuse ou mousseuse, aérée. Cette bronchorrhée est caractéristique de la dilatation des bronches et de la bronchite chronique."],["p","4.2.4. L'expectoration séreuse : c'est une expectoration liquide, très fluide, homogène, le plus souvent teintée en rosé (dite saumonnée) par la présence de quelques globules rouges, mousseuse, abondante, riche en albumine."],["p","Cette expectoration séreuse est caractéristique de l'œdème aigu du poumon (qui est une inondation alvéolaire par du sérum survenant lorsque la pression hydrostatique dans les capillaires pulmonaires devient supérieure à la pression oncotique)."],["p","4.2.5. L'expectoration hémoptoique : c'est une hémoptysie de petite abondance (voir hémoptysie)."],["li","5. La vomique : La vomique est une variété d'expectoration caractérisée par son apparition brutale et le plus souvent massive : c'est le brusque rejet par la bouche d'une grande quantité de pus ou de liquide ayant pénétré par effraction dans les bronches (elle ressemble à un vomissement). On distingue :"],["p","5.1. Suivant la qualité du liquide rejeté :"],["li","La vomique purulente : c'est le rejet de pus provenant du poumon (abcès du poumon), de la plèvre (pleurésie purulente) ou de la région sous-phrénique (abcès sous-phrénique)."],["li","La vomique eau de roche : c'est le rejet d'un liquide clair, eau de roche, de saveur salée, il peut s'accompagner d'un choc anaphylactique. Elle se voit lors de rupture d'un kyste hydatique intraparenchymateux dans les bronches."],["p","5.2. Suivant la quantité de liquide rejeté :"],["li","La vomique massive : elle revêt une allure dramatique, lors d'un effort ou d'une quinte de toux, le malade ressent une douleur thoracique déchirante et rejette un flot de pus par la bouche, au milieu de quintes de toux, parfois d'efforts de vomissement."],["li","La vomique fractionnée : c'est le rejet de liquide le plus souvent de pus par petites quantités mais de manière répétée."],["li","La vomique nummulaire ou masquée : elle est réduite à de simples crachats purulents plus ou moins nombreux, plus ou moins rapprochés. Ces deux derniers types sont moins caractéristiques que la vomique massive ; trois faits essentiels doivent être recherchés pour reconnaître une vomique :"],["li","Le mode de début toujours subit."],["li","En cas de vomique purulente il s'agit de pus franc."],["li","La quantité rejetée dans les 24 heures est en général abondante."],["h3","6. L'hémoptysie"],["p","6.1. Définition :"],["p","C'est le rejet par la bouche, dans un effort de toux de sang provenant des voies aériennes sous-glottiques."],["p","Il s'agit d'un symptôme toujours alarmant pour le malade et qui peut être dû soit à une maladie aiguë ou chronique des voies aériennes ou du parenchyme pulmonaire, soit à une maladie cardio-vasculaire."],["p","6.2. Les différents types d’hémoptysie : suivant l'abondance on distingue :"],["p","6.2.1. L'hémoptysie de grande abondance : elle est heureusement rare. Elle survient brutalement sans avertissement, une brusque quinte de toux est suivie du rejet d'une grande quantité de sang (plus de 300 cm3) qui coule à flots. Elle s'accompagne d'un tableau d'anémie aiguë avec pâleur, refroidissement des extrémités, agitation, pouls filant, tension artérielle effondrée."],["p","L'hémoptysie de grande abondance peut être foudroyante : mort par asphyxie avant l'extériorisation de l'hémorragie."],["p","6.2.2. L'hémoptysie de moyenne abondance : c'est la plus fréquente. Elle se déroule de la manière suivante :"],["li","Les signes annonciateurs ou prodromes sont les suivants : sensation de chaleur rétrosternale, saveur métallique dans la bouche, angoisse, gêne respiratoire, picotement laryngé."],["li","L'hémoptysie : une toux quinteuse ramène brusquement du sang pur rouge rutilant, aéré, spumeux, de 100 à 300 cm3."],["li","Les signes accompagnateurs : sont une angoisse, une pâleur du visage et une dyspnée."],["li","L'évolution : les quintes de toux s'espacent, la quantité de sang rejetée diminue, au bout de quelques heures le malade expectore des crachats hémoptoïques qui vont persister deux à trois jours : c'est la queue de l'hémoptysie."],["p","6.2.3. L'hémoptysie de petite abondance : elle peut revêtir plusieurs aspects :"],["li","Crachats sanglants, isolés, expectorés en petit nombre entre des expectorations mucopurulentes."],["li","Parfois un seul crachat homogène, rouge, entièrement teinté de sang."],["li","Deux aspects particuliers peuvent être rencontrés :"],["li","Le «crachat hémoptoique» de Laennec qui est une expectoration faite de crachats mucosanglants, noirâtres, très visqueux et adhérents au crachoir, d'odeur aigrelette appelés par Laennec « crachats hémoptoïques » : s'observent 24 à 36 heures après une embolie pulmonaire, lorsqu'il y a constitution d'un infarctus pulmonaire."],["li","Le « crachat rouillé» qui est une expectoration faite de crachats visqueux de couleur orangée ou ocre apparaissant au troisième jour de la pneumonie franche lobaire aiguë. L'hémoptysie de petite abondance a la même valeur sémiologique que les hémoptysies de grande et de moyenne abondance. Elle doit être distinguée de certaines expectorations striées de sang sous forme de filaments qui ne doivent pas être systématiquement considérées comme de véritables hémoptysies."],["p","6.3. Le diagnostic différentiel : le diagnostic d'hémoptysie est facile lorsqu'on assiste à l'épisode hémorragique, sinon il est plus difficile; il repose alors sur un interrogatoire minutieux qui permettra d'éliminer ce qui n'est pas une hémoptysie."],["li","Hémorragie d'origine buccale ou pharyngée : qui s'évacue par simple expulsion sans qu'il y ait toux. L'examen minutieux de la cavité bucco-pharyngée permet de retrouver la source du saignement."],["li","L'épistaxis postérieure : où le sang coulant sur le larynx peut provoquer un réflexe de toux, il existe en général une épistaxis antérieure associée."],["li","L’hématémèse : est le diagnostic qui demande le plus d'attention."],["li","Les prodromes : troubles digestifs et nausées (qui remplacent le chatouillement laryngé)."],["li","Le rejet de sang s'accompagne d'efforts de vomissement (qui remplacent les quintes de toux)."],["li","Le rejet de sang n'est pas aéré, mousseux, mais contient des débris alimentaires. Parfois le diagnostic est difficile : hémoptysie abondante partiellement déglutie et ensuite vomie, hématémèse abondante dont le sang est rouge non acide parce qu'il n'a pas séjourné dans l'estomac. D'où l'importance de l'observation du malade au lendemain de l'accident :"],["li","Regarder le crachoir, s'il contient des crachats teintés de sang : c'est la queue de l'hémoptysie."],["li","Regarder les selles, si les selles sont noires : il s'agit d'un mélœna, donc l'hémorragie présentée par le malade était une hématémèse."],["p","6.4. Recherche de l'étiologie : la recherche de la cause repose sur l'interrogatoire, l'examen clinique et des examens complémentaires : téléthorax, examen des crachats pour la recherche de bacille de Koch."],["p","La cause la plus fréquente est la tuberculose pulmonaire', les autres causes sont essentiellement : le rétrécissement mitral, le cancer bronchique et la dilatation des bronches."],["h3","7. Les troubles de la voix"],["p","Il existe différentes variétés de troubles de la voix ou dysphonie :"],["p","7.1. La voix peut être rauque ou éteinte : ceci se voit au cours de la laryngite diphtérique ou croup."],["p","7.2. La voix nasonnée : est présente en cas d'encombrement du cavum et en cas de paralysie du voile du palais."],["p","7.3. La voix bitonale : est une voix alternativement élevée et grave, appelée aussi « voix de fausset ». Elle traduit le plus souvent la paralysie d'une corde vocale."],["h2","II. SIGNES PHYSIQUES"],["p","L'examen clinique de l'appareil respiratoire comprend quatre temps : l'inspection, la palpation, la percussion et l'auscultation."],["p","Cet examen clinique se fait sur un malade dévêtu jusqu'à la ceinture, dans une pièce suffisamment chauffée et bien éclairée, le malade est en position assise."],["h2","I. L'inspection"],["p","C'est le premier temps de l'examen, elle va permettre d'apprécier l'aspect général des téguments, la morphologie du thorax, l'aspect des mouvements respiratoires et enfin elle permettra de rechercher des signes anormaux extra-thoraciques."],["p","1.1. L'examen du revêtement cutané et des parties molles : va s'attacher à rechercher les signes pathologiques suivants :"],["li","Une cicatrice, témoin d'une intervention (thoracotomie) ou d'un traumatisme ancien."],["li","Des angiomes stellaires, siégeant sur la face antérieure du thorax évocateurs d'une cirrhose."],["li","Un œdème localisé : soit discret se manifestant par un comblement des creux susclaviculaires, soit important cervical inférieur, préthoracique et intéressant toute la ceinture scapulaire : œdème dit en pèlerine, associé à une dilatation des veines superficielles et à des télangiectasies rosées basi-thoraciques, le tout évoquant un syndrome de compression de la veine cave supérieure."],["li","Une gynécomastie unilatérale chez l'homme qui peut accompagner un cancer bronchique."],["li","Un tirage : qui est une dépression des parties molles lors de l'inspiration intéressant les creux sus-sternal et sous-sternal et les espaces intercostaux ; ce tirage traduisant une obstruction en un point quelconque de la trachée, du larynx ou des grosses bronches ; ou une perte d'élasticité pleuro-pulmonaire."],["p","1.2. L'étude de la morphologie thoracique :"],["p","1.2.1. La morphologie normale :"],["li","Le thorax normal :"],["li","Chez le sujet normal, il existe une grande diversité de forme et de grosseur du thorax."],["li","Chez l'adulte normal : le thorax est à peu prés elliptique, le diamètre antéro-postérieur est nettement inférieur au diamètre transverse."],["li","Chez l'enfant : le thorax est cylindrique."],["li","Les variations de forme en fonction du type du sujet :"],["li","Le thorax longiligne : s'observe chez le sujet grand et maigre : c'est un thorax étroit et long."],["li","Le thorax bréviligne : s'observe surtout chez le sujet obèse : c'est un thorax large et court."],["p","1.2.2. Variations pathologiques :"],["li","La scoliose : c'est une incurvation de la colonne vertébrale dans le sens transversal ; cette incurvation entraîne des courbures de compensation avec rupture de la symétrie du thorax, abaissement d'une épaule et élévation de l'autre (fig. 2-1)."],["li","La cyphose : c'est l'accentuation de la convexité normale de la colonne dorsale (Fig. 2-2)."],["li","Le thorax en bréchet : est une saillie en avant du sternum comparable au bréchet de l'oiseau, appelé aussi thorax « en caréné », alors que normalement le sternum est légèrement enfoncé par rapport aux deux hémithorax."],["li","Le thorax en entonnoir ou pectus excavatum : dans ce cas le sternum est anormalement enfoncé entre les deux hémithorax, au maximum l'importance de cet enfoncement peut entraîner une gêne au fonctionnement cardiaque."],["li","Le thorax en tonneau : est une distension thoracique avec augmentation du diamètre antéro-postérieur qui peut devenir égal ou parfois même supérieur au diamètre transversal. Cette distension s'accompagne d'une horizontalisation des côtes, alors qu'à l'état normal, les côtes forment avec l'épine dorsale un angle de 45 degrés. Cette anomalie est caractéristique de F emphysème pulmonaire (fig. 3-2)."],["pre","FIG. 2-1. — Scoliose.                FIG. 2-2. — Cyphose dorsale."],["p","FIG. 3-1. — Thorax normal, FIG.3-2. — Thorax emphysémateux."],["p","Une asymétrie thoracique :"],["li","la distension d'un hémithorax : peut s'observer lors d'un épanchement pleural liquidien de grande abondance ou lors d'un épanchement pleural aérien;"],["li","la rétraction d'un hémithorax : peut s'observer au cours d'une atélectasie massive d'un poumon, d'un rétrécissement fibreux de la plèvre ou comme séquelle d’une pneumectomie;"],["li","une voussure localisée : peut se voir au cours d'une tumeur de la paroi ou peut être secondaire à une hypertrophie cardiaque chez l'enfant."],["p","1.3. L'étude des mouvements respiratoires : se fait sur le sujet au repos en état de résolution musculaire, à distance de tout effort; elle évalue le type respiratoire, l'amplitude respiratoire et le rythme respiratoire."],["p","1.3.1. A l'état normal :"],["li","Le type respiratoire : varie avec le sexe et l'âge, il est de :"],["li","Type costal chez la femme, avec soulèvement des seins lors de chaque inspiration."],["li","Type diaphragmatique chez l'homme et l'enfant, l'abaissement inspiratoire du diaphragme coïncidant avec un gonflement abdominal."],["li","Le rythme respiratoire :"],["li","La fréquence respiratoire varie avec l'âge, elle est au repos de 14 à 22 par minute chez l'adulte, se rapprochant de 14 chez l'homme et de 22 chez la femme et elle est de 22 à 30 par minute chez le nourrisson et le jeune enfant. Le rapport de la fréquence respiratoire à la fréquence cardiaque est de 1 sur 4. La fréquence respiratoire augmente avec l'effort et avec la fièvre (elle augmente de 4 cycles respiratoires par minute pour chaque degré au-dessus de la normale)."],["li","La durée respective des deux temps de la respiration : l'expiration est normalement plus longue que l'inspiration."],["li","L'amplitude respiratoire ou ampliation thoracique : à l'état normal les deux hémithorax bougent de façon synchrone et régulière aussi bien lors d'une respiration calme, qu'au cours d'une respiration profonde."],["p","1.3.2. A l'état pathologique : on peut observer :"],["li","Des modifications de la fréquence s'accompagnant de gêne respiratoire : polypnée et bradypnée."],["li","Des modifications de la durée respective des deux temps respiratoires avec gêne respiratoire :"],["li","Bradypnée inspiratoire par gêne à la pénétration de l'air : exemple, dyspnée laryngée s'accompagnant du tirage."],["li","Bradypnée expiratoire par gêne à la sortie de l'air : exemple, la crise d'asthme."],["li","Des modifications de l'amplitude respiratoire : visibles à l'inspection lors de la respiration normale, mieux extériorisées par la respiration profonde. Ces modifications seront mieux appréciées par la mesure de l'indice de Hirtz qui consiste à mesurer le périmètre de la cage thoracique au niveau de la ligne mamelonnaire à la fin d'une inspiration forcée et à la Un d'une expiration forcée; la différence obtenue représente l'indice de Hirtz qui est normalement de 6 à 7 cm, il est abaissé lorsqu'il est inférieur à 6 cm."],["li","Diminution bilatérale de l'ampliation thoracique : certains thorax apparaissent comme distendus même en fin d'expiration : thorax bloqués en inspiration, cet état traduit soit un certain degré d'obstruction bronchique (crise d'asthme), soit une perte de l'élasticité pulmonaire (emphysème)."],["li","Diminution unilatérale de l'ampliation thoracique : un des hémithorax ayant une expansion inspiratoire diminuée (épanchement pleural liquidien ou aérien)."],["li","Une hyperventilation : qui est une augmentation de l'amplitude respiratoire ne s'accompagnant pas de gêne respiratoire : c'est la respiration de Kussmaul."],["li","Des irrégularités du rythme respiratoire ne s'accompagnant pas de gêne respiratoire : ce sont les respirations périodiques de Cheynes-Stokes et du syndrome de Pickwick."],["p","1.4. Les signes anormaux extrathoraciques : ces signes qui peuvent être le témoin d'une anomalie respiratoire sont : la cyanose, l'hippocratisme digital et le syndrome de Claude Bernard-Horner."],["p","1.4.1. La cyanose :"],["li","Définition : la cyanose est une coloration bleu violacé des téguments et des muqueuses témoin d'une hypoxie capillaire, elle apparaît quand la teneur en hémoglobine réduite du sang capillaire est supérieure à 5 g pour 100 ml. A l'état normal, la teneur du sang capillaire en hémoglobine réduite est inférieure à 2,5 g pour 100 ml et la peau est de couleur rosée."],["li","Caractères sémiologiques : la cyanose est une coloration qui s'efface à la vitro-pression, elle est d'intensité variable :"],["li","Soit discrète : elle sera alors visible au niveau du lit unguéal et apparaîtra mieux après effort."],["li","Soit modérée : elle se recherche alors au niveau des extrémités : doigts, orteils, nez et oreilles et au niveau des muqueuses : labiale (lèvres), buccale et conjonctivale."],["li","Soit intense et généralisée : elle est alors évidente. Suivant son intensité la cyanose varie du mauve pâle au bleu noir. L'apparition de la cyanose est fonction de la quantité absolue d'hémoglobine réduite du sang capillaire, ainsi à désaturation égale un sujet anémique ayant peu d'hémoglobine peut ne pas être cyanosé alors qu'au contraire, un sujet polyglobulique le sera."],["li","Les mécanismes de la cyanose : la cyanose peut relever de deux grands mécanismes : cyanose de type central et cyanose de type périphérique."],["li","Les cyanoses d'origine centrale : sont dues à une désaturation en oxygène du sang artériel qui peut se voir dans les circonstances suivantes :"],["li","diminution de la teneur en oxygène de l'air inspiré, exemple : séjour en haute altitude;"],["li","insuffisance respiratoire aiguë ou chronique;"],["li","cardiopathies congénitales cyanogènes avec shunt droit-gauche dans lesquelles il y a contamination du sang artériel par du sang veineux. Ces cyanoses d'origine centrale ne s'accompagnent pas de refroidissement cutané : ce sont des cyanoses dites chaudes. Lorsque la cause de cette cyanose est d'évolution chronique, la cyanose est alors associée à une polyglobulie qui se manifeste cliniquement par une érythrose."],["li","Les cyanoses d'origine périphérique : sont dues à un ralentissement de la circulation dans les capillaires périphériques entraînant une stase locale. Dans ce cas la saturation en oxygène du sang artériel est normale. Elle s'accompagne d'un refroidissement cutané : ce sont des cyanoses dites froides. Elles se voient dans les circonstances suivantes :"],["li","insuffisance cardiaque globale;"],["li","syndrome de Raynaud : qui est un trouble circulatoire des extrémités (doigts, orteils) avec cyanose et refroidissement."],["li","Les cyanoses mixtes : sont des cyanoses où il y a association des deux mécanismes ainsi dans le cœur pulmonaire chronique décompensé il existe une cyanose centrale due à l'insuffisance respiratoire et une cyanose périphérique due à l'insuffisance ventriculaire droite s'accompagnant de stase veineuse."],["p","1.4.2. L'hippocratisme digital : * Définition : c'est une déformation de l'extrémité des doigts qui associe une hypertrophie de la pulpe des dernières phalanges qui sont élargies en « baguettes de tambour » et une incurvation unguéale longitudinale et transversale d'où l'aspect des ongles « en verre de montre » (fig. 4)."],["p","* Les causes de l’hippocratisme digital :"],["li","L'hypoxie chronique : l'hippocratisme digital apparaît au-delà de 6 mois d'évolution d'une hypoxie chronique, il est alors toujours associé à une cyanose et parfois à une polyglobulie qui se manifeste cliniquement par une érythrose."],["li","Autres causes : le cancer bronchique, dans ce cas l'hippocratisme digital est soit isolé : soit associé à d'autres signes réalisant le syndrome de Pierre Marie ou ostéopathie hypertrophiante pneumique (hippocratisme digital, syndrome articulaire des poignets et des chevilles, épaississement du périoste des os longs). L'hippocratisme digital peut se voir aussi au cours de la cirrhose."],["p","1.4.3. Le syndrome de Claude Bernard Horner qui associe :"],["li","Un rétrécissement de la fente palpébrale par ptôse de la paupière supérieure."],["li","Une enophtalmie."],["li","Un myosis (diminution du diamètre pupillaire). Ce syndrome est en rapport avec une compression du sympathique cervical qui peut être due à une tumeur du sommet du poumon."],["p","FIG. 4. — Hippocratisme digital."],["h3","2. La palpation"],["p","Deuxième temps de l'examen clinique apportera des renseignements sur le revêtement cutané, le rythme respiratoire et la transmission des vibrations vocales."],["p","2.1. Le revêtement cutané : la palpation du thorax permettra :"],["li","De préciser les caractères d'une tuméfaction localisée superficielle."],["li","De mettre en évidence un emphysème sous-cutané : présence de fines bulles d'air dans le tissu sous-cutané, qui se manifeste par une sensation de crépitation neigeuse : forte sensation de craquement provoquée par la pression de la région atteinte (l’emphysème souscutané est dû au passage anormal de l'air des poumons vers les tissus sous-cutanés, il peut se voir après traumatisme thoracique ou après thoracotomie)."],["p","2.2. Le rythme respiratoire : sera au mieux apprécié en posant la main bien à plat sur la région sternale, à chaque inspiration la main est soulevée ce qui permet d'évaluer avec précision la fréquence respiratoire qui est normalement de :"],["li","14 à 22 inspirations par minute chez l'adulte."],["li","22 à 30 inspirations par minute chez l'enfant"],["p","Face palmaire des deux mains Face palmaire des doigts"],["p","Bord cubital de la main"],["p","Fig. 5. — Techniques de recherche des vibrations vocales."],["h4","2.3. La transmission des vibrations vocales"],["h4","2.3.1. Technique de recherche (fig. 5)"],["p","On demande au sujet de répéter à voix haute un son guttural le chiffre 33 en français ou le chiffre 44 en arabe. Les vibrations vocales sont perçues sous forme d'un frémissement en appliquant la main bien à plat ou son bord cubital successivement sur chaque hémithorax, de haut en bas, de manière comparative."],["h4","2.3.2. Résultats"],["li","Chez le sujet normal : les vibrations vocales produites par le larynx sont transmises à la paroi sous forme d'un frémissement. Ces vibrations ont une intensité variable d'un sujet à l'autre, elles peuvent être faibles chez l'obèse ou le sportif dont la paroi thoracique est épaisse et chez la femme et l'enfant à faible gravité vocale."],["li","Variations pathologiques :"],["li","Diminution ou abolition des vibrations vocales : elle traduit l'interposition entre le parenchyme pulmonaire et la paroi thoracique d'un épanchement liquidien ou gazeux, elle sera donc un signe clinique important retrouvé au cours des syndromes d'épanchements pleuraux liquidien et aérien."],["li","Augmentation des vibrations vocales : elle traduit l'existence au sein du parenchyme pulmonaire d'une condensation, elle sera donc retrouvée au cours de la pneumonie et de l'infarctus pulmonaire. La palpation sera complétée par l'étude des creux sus-claviculaires et axillaires à la recherche d'adénopathies."],["li","3. La percussion : Est un temps capital de l'examen de l'appareil respiratoire, car certaines anomalies pulmonaires se bornent à une modification de la sonorité thoracique."],["p","3.1. Technique : la percussion peut se faire selon deux techniques :"],["li","La percussion immédiate : se pratique en frappant directement la paroi thoracique avec l'extrémité des doigts recourbés en crochet en des points symétriques de chaque hémithorax de haut en bas (fig. 6)."],["p","FIG. 6 — Percussion immédiate."],["li","La percussion médiate : se fait en frappant la paroi thoracique par l'intermédiaire d'un plessimètre placé sur le thorax. Habituellement, le plessimètre est le médius de la main gauche de l'examinateur placé successivement au niveau de chaque espace intercostal de chaque hémithorax de haut en bas. Le percuteur est le médius de la main droite recourbé à angle droit et frappant la phalangine du médius de la main gauche. Pendant la percussion le poignet de la main droite doit être mobile, l'avant-bras ne doit pas participer à la percussion (le doigt percuteur doit effectuer le même geste que les doigts du pianiste tapant sur les touches). Enfin chaque espace intercostal de chaque hémithorax doit être percuté à deux ou trois reprises de manière égale et régulièrement espacée (fig. 7). La percussion médiate donne des renseignements plus précis que la percussion immédiate et de plus elle est mieux supportée par le malade car moins traumatisante."],["p","Fig 7. - Percussion médiate."],["h4","3.2. Résultats"],["p","3.2.1. Chez le sujet normal : la percussion permet de recueillir deux types de sensation : une sensation tactile et une sensation auditive."],["li","La sensation tactile : est une sensation d'élasticité."],["li","La sensation auditive : est une sensation de sonorité. Ces deux sensations sont provoquées par l'ébranlement de la colonne d'air intrapulmonaire par le choc produit par la percussion. La sonorité thoracique est normalement variable :"],["li","D'un sujet à l'autre : en fonction de l'épaisseur de la paroi thoracique. Donc l'interprétation de là percussion n'aura de valeur que pour un sujet donné en comparant les résultats obtenus en percutant les deux hémithorax de manière symétrique."],["li","Suivant la région du thorax percuté (fig. 8) :"],["li","La matité hépatique : sera retrouvée en percutant la face antéro-inférieure de l'hémithorax droit du 5e espace intercostal droit sur la ligne médio-claviculaire jusqu'au rebord costal."],["p","Sonorité ___i Sonorité"],["pre","                                    normale J                       Matité cardiaque\nnormale pulmonaire         pulmonaire        /"],["p","Matité hépatique"],["p","Tympanisme (espace de Traube)"],["p","Matité splénique"],["p","FIG. 8. — Résultats de la percussion d'un thorax normal."],["li","La matité splénique : est mise en évidence en percutant la face antéro-externe et inférieure de l’hémithorax gauche entre la 9e et la 11e côte entre la ligne axillaire moyenne et postérieure."],["li","La matité cardiaque : est située au niveau du 5e espace intercostal à gauche du sternum sur 2 cm en dedans de la ligne médio-claviculaire, il s'agit en fait d'une submatité."],["li","La sonorité thoracique normale : est retrouvée en percutant la face postérieure des deux hémithorax."],["li","Le tympanisme : est une hypersonorité qui est mise en évidence normalement en percutant l'espace de Traube situé à la partie antéro-inférieure de l’hémithorax gauche aux environs de la 6e côte sur la ligne médio-claviculaire, elle correspond à la poche à air gastrique."],["p","3.2.2. En pathologie : on distinguera la matité, la submatité, le tympanisme et le skodisme."],["li","La matité : est une diminution franche de la sonorité normale, quand elle est absolue elle donne une sensation de résistance au doigt, on dit que c'est une matité franche « de bois »; ce type de matité se voit au cours de l'épanchement pleural liquidien. Dans ce cas la matité occupe la partie inférieure d'un hémithorax, son étendue est fonction de l'abondance de l'épanchement, dans un épanchement de moyenne abondance, la limite supérieure de la matité a la forme d'une parabole à sommet axillaire : c'est la courbe de Damoiseau (fig. 9). C'est sur la ligne axillaire moyenne qu'il faut rechercher la matité des épanchements de petite abondance."],["li","La submatité : est une diminution moins nette et moins franche de la sonorité que la matité. Elle est retrouvée au cours du syndrome de condensation pulmonaire, elle est maximale, soit en avant, soit en arrière et de plus elle apparaît le plus souvent suspendue dans un hémithorax suivant le lobe ou le ou les segments atteints."],["li","Le tympanisme : est un signe difficile à reconnaître car la sonorité du thorax normal est déjà importante du fait du contenu essentiellement aérique des poumons."],["li","Un tympanisme unilatéral est retrouvé sur la totalité d'un hémithorax lors d'un épanchement pleural aérien."],["li","Un tympanisme bilatéral peut être mis en évidence au niveau de la totalité des deux hémithorax dans l'emphysème pulmonaire; ce tympanisme est accompagné d'une sensation de résistance au doigt en rapport avec une perte de l'élasticité pulmonaire."],["li","Le skodisme : du nom de Skoda (médecin tchèque qui l'a décrit), consiste en un bruit clair et vibrant obtenu en percutant la partie supérieure du thorax dans la région sousclaviculaire correspondant au sommet du poumon situé au-dessus d'un épanchement pleural liquidien."],["h3","4. L'auscultation"],["p","Consiste à écouter les sons produits par un organe et transmis à l'oreille de l'examinateur à travers la paroi."],["p","4.1. Technique : d'une manière générale l'auscultation peut être pratiquée de deux manières."],["p","4.1.1. L'auscultation immédiate : l'oreille est appliquée directement sur la paroi recouverte d'un linge."],["p","4.1.2. L'auscultation médiate : se fait par l'intermédiaire d'un stéthoscope biauricu-laire comprenant un diaphragme relié à des écouteurs par l'intermédiaire de tubes de caoutchouc. Il permet la transmission claire des sons et l'élimination des bruits extérieurs."],["p","L'auscultation pulmonaire doit répondre à deux règles :"],["li","Elle doit se faire de manière comparative au niveau des deux hémithorax de haut en bas comme pour la palpation et la percussion, y compris dans les creux sus-claviculaires et les aisselles."],["li","On demandera au sujet de respirer la bouche ouverte plus profondément que d'habitude, de tousser 1 fois sur 3 ou 4 respirations et enfin on terminera l'auscultation en demandant au malade de parler d'une voix normale. Les zones de projection stéthacoustiques des différents lobes sont :"],["li","Pour les lobes inférieurs : les zones dorso-basales."],["li","Pour le lobe moyen et la lingula : les zones sous-mamelonnaires."],["li","Pour les lobes supérieurs : en avant les zones sus-claviculaires et sous-claviculaires et en arrière la fosse sus-épineuse."],["p","4.2.1. Chez le sujet normal : l'auscultation pulmonaire permet d'entendre les bruits respiratoires normaux appelés habituellement murmure vésiculaire."],["p","Le murmure vésiculaire est produit par le mouvement de l'air dans l'arbre respiratoire : trachée, bronches et alvéoles :"],["li","A l'inspiration : il est doux, humé."],["li","A l'expiration : il est plus intense, mais s'éteint très vite; l'expiration paraît plus courte que l'inspiration. L'auscultation de la voix normale met en évidence la résonance vocale qui est le résultat de la transmission par les voies respiratoires à la paroi thoracique des vibrations produites par le larynx lors de la phonation. Les sons de la voix sont donc entendus au stéthoscope mais les mots ne sont pas aussi distincts que lorsqu'on les entend directement et on ne peut comprendre ce que dit le malade. Enfin, chez le sujet normal il existe des variations d'intensité du murmure vésiculaire et de la résonance vocale qui sont fonction de l'épaisseur de la paroi thoracique."],["p","4.2.2. A l'état pathologique : plusieurs anomalies peuvent être retrouvées à l'auscultation :"],["li","Une inversion du rythme respiratoire, des modifications du murmure vésiculaire, des bruits surajoutés et des modifications à l'auscultation de la voix et de la toux."],["li","Une inversion du rythme respiratoire : se manifeste à l'auscultation par une expiration prolongée qui paraît plus longue que l'inspiration; cette anomalie est retrouvée dans l'emphysème et la crise d'asthme."],["li","Des modifications du murmure vésiculaire :"],["li","Une diminution du murmure vésiculaire : est retrouvée sur toute l'étendue des deux hémithorax dans l'emphysème pulmonaire, traduisant l'hypoventilation alvéolaire."],["li","Une abolition du murmure vésiculaire traduit :"],["li","soit un arrêt complet de la ventilation dans un territoire donné en cas d'atélectasie ;"],["li","soit une interposition aérique en cas d'épanchement pleural aérien;"],["li","soit une interposition liquidienne en cas d'épanchement pleural liquidien;"],["li","soit une condensation pulmonaire au cours de laquelle le murmure vésiculaire est masqué par des bruits surajoutés."],["li","Des bruits surajoutés : qui sont essentiellement les souffles, les râles et les frottements."],["li","Les souffles : A l'état normal le souffle glottique ou laryngo-trachéal produit par le passage de l'air dans l'orifice glottique est entendu à l'auscultation sur la ligne médio-sternale, mais il n'est pas entendu à l'auscultation des deux hémithorax. Les souffles représentent la transmission anormale du souffle glottique dans des zones du thorax où il n'est pas habituellement entendu, en raison d'une anomalie du poumon ou de la plèvre. L'analyse sémiologique d'un souffle devra en rechercher les caractères suivants : le temps respiratoire, l'intensité, la tonalité, le timbre; ces caractères sont conditionnés par la nature de l'atteinte pulmonaire ou pleurale à travers laquelle se propage le souffle glottique et qui en assure la transmission jusqu'à l'oreille de l'examinateur."],["p","Les différents souffles :"],["li","Le souffle tubaire : il ressemble au bruit effectué en soufflant dans un tube creux. Le temps respiratoire : il est perçu aux deux temps de la respiration, mais il est à prédominance inspiratoire. L'intensité : c'est un bruit intense."],["p","La tonalité : est élevée. Le timbre : est rude, en U. Valeur sémiologique : il est retrouvé dans le syndrome de condensation pulmonaire, exemple : la pneumonie."],["li","Le souffle pleurétique : possède les caractères suivants : Le temps respiratoire : c'est un souffle expiratoire. L'intensité : il est doux, lointain, voilé. La tonalité : est élevée. Le timbre : est aigre, en « é ». La valeur sémiologique : il traduit l'existence d'un épanchement pleural liquidien et s'entend habituellement a la limite supérieure d'un épanchement de petite ou de moyenne abondance, il est le plus souvent localisé. Il est absent dans les épanchements de grande abondance."],["li","Le souffle amphorique : il ressemble au bruit obtenu en soufflant dans une jarre ou amphore. Le temps respiratoire : il est perçu aux deux temps de la respiration, mais il est à prédominance expiratoire. L'intensité : est faible. La tonalité : est élevée. Le timbre : est métallique : d'où le nom de souffle amphore-métallique. Valeur sémiologique : épanchement pleural aérien."],["li","Le souffle cavitaire est caractérisé par : Le temps respiratoire : il est surtout inspiratoire. L'intensité : c'est un bruit intense. La tonalité : est basse. Le timbre : est creux avec parfois une résonance métallique. La valeur sémiologique : il traduit l'existence d'une condensation pulmonaire creusée en son centre d'une cavité ce qui est réalisé par la caverne tuberculeuse. TABLEAU RÉCAPITULATIF 1 : LES DIFFÉRENTS SOUFFLES"],["pre","S. Tubaire         S. Pleurétique       S. Amphorique           S. Cavitaire"],["pre"," Temps            Inspiratoire      Expiratoire            Expiratoire        Inspiratoire Intense\nIntensité           Intense      Doux-lointain voilé         Faible                  Basse\n Tonalité            Elevée            Elevée                Elevée                 Creux\n Timbre              Rude              Aigre               Métallique"],["pre","Valeur sémiologique   Condensation     Épanchement pleural   Épanchement pleural   Caverne tuberculeuse\n                       pulmonaire           liquidien              aérien"],["li","Les râles : Les râles sont des bruits surajoutés, intermittents, en rapport avec la mobilisation des sécrétions pathologiques dans les bronches ou dans les conduits bronchio-alvéolaires. Ce sont des bruits surajoutés d'origine bronchique ou d'origine parenchymateuse."],["li","Les râles bronchiques : sont les plus fréquents ; ce sont les râles ronflants et les râles sibilants. Ils sont dus à la vibration de la colonne d'air traversant une bronche rétrécie ou enflammée. Suivant le calibre des bronches où ils prennent naissant ces râles ont un timbre plus ou moins grave. Ils ont des caractères communs : ce sont des râles secs; ils sont entendus aux deux temps de la respiration mais ils sont plus nets à l'expiration."],["li","Les râles ronflants ou ronchus : ont un timbre grave, ils ressemblent au ronflement nasal. Ils prennent naissance dans les gros troncs bronchiques."],["li","Les râles sibilants : ont un timbre aigu, ils réalisent des sifflements aigus, plus ou moins prolongés et ressemblent parfois au miaulement d'un chat. Ils prennent naissance dans les ramifications bronchiques de plus petit calibre. Les râles ronflants et les râles sibilants peuvent être associés, ils sont entendus sur l'ensemble des deux hémithorax à la phase catarrhale de la crise d'asthme réalisant « un bruit de pigeonnier » caractéristique. Dans le cas où il existe une exsudation très abondante, les râles bronchiques deviennent humides et gras et réalisent les râles muqueux qui sont difficiles à distinguer des râles souscrépitants."],["li","Les râles parenchymateux : sont essentiellement de deux types : les râles crépitants et les râles sous-crépitants."],["li","Les râles crépitants : sont des bruits particuliers qui donnent à l'oreille la sensation de crépitations sèches, très serrées, qui ressemble au bruit que fait le froissement d'une mèche de cheveux prés de l'oreille ou au bruit que font les crépitations du sel mis sur le feu. Ce sont des râles fins, secs, égaux entre eux, régulièrement espacés, ils s'entendent à la fin de l'inspiration et ils sont plus nets après la toux et lors de l'inspiration profonde. Ils traduisent l'existence d'un exsudât ou d'un transsudat dans les alvéoles pulmonaires. Ils sont :"],["li","soit localisés : en foyer, au centre duquel on peut parfois entendre un souffle tubaire et sont alors caractéristiques d'une condensation pulmonaire, par exemple dans la pneumonie où les alvéoles sont le siège d'un exsudât épais;"],["li","soit généralisés : aux deux poumons débutant aux deux bases pulmonaires et envahissant secondairement la totalité des deux hémithorax, classique « marée montante » des râles crépitants, caractéristique de l'inondation alvéolaire par un transsudat au cours de l'œdème aigu du poumon."],["li","Les râles sous-crépitants ou râles bulleux : sont les râles les plus fréquents, ce sont des râles humides, qui donnent à l'oreille la sensation des bulles éclatant à intervalles plus ou moins serrés. Ils s'entendent aux deux temps de la respiration mais sont plus nets à l'inspiration, ils sont modifiés par la toux. Ils traduisent l'existence dans les alvéoles et les bronchioles de sécrétions fluides telles qu'on les observe dans les suppurations pulmonaires."],["li","Les râles consonants ou râles caverneux : réalisent une variété particulière de râles sous-crépitants dont le timbre est particulièrement fort, à la fois humide et métallique. Ils sont retrouvés dans les condensations pulmonaires creusées d'une cavité et sont alors associés à un souffle cavitaire, l'ensemble réalisant « un bruit de gargouillement » qui a été décrit par Laennec dans les cavernes tuberculeuses."],["li","Les frottements :"],["li","Les frottements pleuraux : sont des bruits pathologiques dus au frottement des deux feuillets de la plèvre lorsqu'ils sont le siège d'une inflammation. En effet à l'état normal, les deux feuillets de la plèvre glissent silencieusement l'un sur l'autre grâce à un film de sérosité ; lorsqu'une lésion de la plèvre altère la régularité des surfaces en contact, il se produit un frottement lors des mouvements respiratoires. Les frottements pleuraux réalisent un bruit superficiel, entendu aux deux temps de la respiration, non modifié par la toux, disparaissant en apnée, d'intensité variable, de timbre également variable allant du crissement du cuir neuf à l'impression du froissement de la soie. Les frottements pleuraux peuvent être perçus à la palpation lorsqu'ils sont très intenses. Ils seront entendus à la phase de début de la pleurésie, ils disparaissent lorsque l'épanchement liquidien est de moyenne abondance; ils peuvent parfois réapparaître lors de la résorption du liquide."],["p","TABLEAU RÉCAPITULATIF II : LES RÂLES"],["pre","Râles sibilants                  Râles ronflants                Râles crépitants         Râles sous crépitants             Râles consonants"],["p","Degré d’humidité                   Secs                               Secs                        Secs               Humides Prédominance               Humides Prédominance Temps             Prédominance expiratoire          Prédominance expiratoire          Fin inspiration               inspiratoire             inspiratoire Forts, humides et"],["pre","                                                                                                                                 Bulleux                     métalliques\nAspect stéthacoustique              Aigus                             Graves                     Fins."],["p","Valeur sémiologique            Bronches de moyen et petits      Grosses bronches           Alvéoles                      Alvéoles     et   bronchioles       Alvéoles et bronchioles"],["pre","calibres                  Crise d'asthme             OAP                           Suppurations pulmonaires           Caverne tuberculeuse\nCrise d'asthme                                       Condensation pulmonaire"],["p","Les autres bruits surajoutés sont beaucoup plus rares :"],["li","le « Wheezing » : est un bruit qui ressemble au sifflement du vent qui souffle à travers un orifice étroit; le temps est essentiellement inspiratoire, il est perçu en un point fixe du thorax; il traduit l'existence d'une sténose trachéale ou d'une bronche de gros calibre;"],["li","la succussion hippocratique : réalise un bruit de clapotis, elle est entendue à l'auscultation de la base thoracique lorsque simultanément on imprime une secousse au thorax du malade; elle traduit la présence dans la cavité pleurale d'un épanchement aéro-liquidien."],["li","Modifications de l'auscultation de la voix et de la toux :"],["li","La bronchophonie : est la transmission de la voix haute selon une intensité accrue, mais souvent confuse. Elle traduit une condensation pulmonaire."],["li","La pectoriloquie : est la transmission nettement articulée de la voix haute qui devient plus distincte et prend un timbre grave à tonalité renforcée. Elle traduit l'existence d'une cavité creusée au sein d'une condensation pulmonaire : caverne tuberculeuse."],["li","La pectoriloquie aphone : est la transmission nettement articulée de la voix chuchotée. Elle traduit l'existence d'un épanchement pleural liquidien."],["li","L'égophonie : est la transmission de la voix haute selon un mode chevrotant (voix de chèvre) et nasillard à timbre plus ou moins aigu. Elle traduit l'existence d'un épanchement pleural liquidien."],["li","Le retentissement métallique de la voix et de la toux : est fréquent au cours du pneumothorax."],["li","La toux est déchirante, intense, pénible à ausculter au cours de la condensation pulmonaire."],["p","En conclusion : L'examen clinique de l'appareil respiratoire permet de poser un certain nombre de diagnostics avant tout examen radiologique, le meilleur exemple en est le diagnostic d'épanchement pleural liquidien, mais l'examen clinique a des limites, ainsi 50 % des cavernes tuberculeuses sont muettes à l'auscultation. ."],["h2","III. LES PRINCIPALES EXPLORATIONS"],["p","Les explorations de l'appareil respiratoire peuvent être classées en examens de pratique courante et examens spécialisés."],["h3","1. Les examens de pratique courante"],["p","1.1. La radioscopie : est un examen rapide qui permet de visualiser la cage thoracique et son contenu, elle seule permet d'étudier la cinétique respiratoire."],["p","1.2. La radiographie :"],["li","Le téléthorax de face : se prend en inspiration forcée, les membres supérieurs en pronation forcée les paumes en dehors."],["li","Le cliché de profil : se prend le côté malade sur la plaque, les bras levés. Les radiographies de face et de profil permettent d'analyser avec précision les affections parenchymateuses et pleurales."],["p","1.3. Les tomographies : sont des radiographies de plan de coupe des poumons, elles permettent de préciser les caractères d'une image anormale d'interprétation difficile sur le cliché standard."],["p","1.4. L'intra-dermo-réaction à la tuberculine (IDR) : permet de tester la sensibilité du sujet à la tuberculine, elle se lit à la 72e heure, elle est positive quand l'induration cutanée est égale ou supérieure à 7 mm."],["p","1.5. La bacilloscopie : c'est la recherche de bacille de Koch (B.K) dans les crachats par examen direct sur lame et culture sur milieu de Lowenstein."],["p","1.6. La ponction pleurale ou thoracentèse : la ponction se fait avec une aiguille de Kuss, on pique à la limite supérieure de la matité de l’épanchement pleural liquidien en rasant le bord supérieur de la côte pour éviter de blesser la paquet vasculo-nerveux intercostal qui chemine au bord inférieur de la côte. La ponction pleurale permet l'étude du liquide :"],["li","Aspect macroscopique : il est jaune citrin ou purulent ou sanglant."],["li","Etude chimique : réaction de Rivalta et dosage du taux de protides, ce qui permet en cas de pleurésie à liquide clair (jaune citrin) de différencier un transsudat pauvre en protides (taux inférieur à 30 g/1) et Rivalta négatif d'un exsudât riche en protides (taux supérieur à 30 g/1) et Rivalta positif."],["li","Etude cytologique :"],["li","En cas de transsudat : présence de quelques cellules endothéliales."],["li","En cas d'exsudat, il existe plusieurs possibilités :"],["li","majorité lymphocytaire en faveur de la pleurésie tuberculeuse;"],["li","majorité de polynucléaires neutrophiles au cours des pleurésies bactériennes;"],["li","présence de cellules malignes dans les pleurésies cancéreuses."],["h3","2. Les examens spécialisés"],["p","2.1. La bronchographie lipiodolée : consiste à introduire à l'aide d'une sonde du lipiodol à l'orifice des bronches souches, ce qui permet l'opacification de l'arbre bronchique et son étude morphologique."],["p","2.2. La bronchoscopie : consiste à introduire dans la trachée jusqu'aux bronches, de gros calibre un bronchoscope qui est un tube muni d'un système optique. Elle permet la visualisation directe de la muqueuse bronchique et la pratique de biopsie."],["p","2.3. L'exploration de la plèvre :"],["li","La biopsie pleurale : se pratique en cas de pleurésie à l'aide d'une aiguille spéciale : aiguille d'Abrams; elle permet l'examen anatomo-pathologique d'un fragment de plèvre."],["li","La thoracoscopie : consiste à introduire dans la cavité pleurale un tube fin muni d'un système optique, elle permet la visualisation directe de la plèvre et la pratique de biopsies sous le contrôle de la vue."],["h4","2.4. L'exploration fonctionnelle respiratoire"],["p","2.4.1. La spirographie : a pour but d'étudier les volumes pulmonaires, les capacités pulmonaires et les débits (fig. 10)."],["li","Les volumes pulmonaires :"],["li","Le volume courant (VT) est le volume d'air mobilisé au cours d'un cycle respiratoire au repos (500 ml)."],["li","Le volume de réserve inspiratoire (VRI) est le volume d'air mobilisé au cours d'une inspiration forcée (2 000 ml)."],["li","Le volume de réserve expiratoire (VRE) est le volume d'air mobilisé au cours d'une expiration forcée (1 000ml)."],["li","Le volume résiduel : est le volume d'air restant dans les voies respiratoires à la fin d'une expiration forcée (1 200ml)."],["li","Les capacités pulmonaires :"],["li","La capacité vitale est la somme du volume courant du volume de réserve inspiratoire et du volume de réserve expiratoire."],["li","La capacité pulmonaire totale est la somme de la capacité vitale et du volume résiduel."],["li","Les débits :"],["li","Le VEMS : volume expiratoire maximal par seconde est le volume d'air expulsé dans la première seconde d'une expiration forcée succédant à une inspiration forcée."],["li","L'indice de Tiffeneau est le rapport entre le VEMS et la capacité vitale ( VEMS = 75%)"],["pre","exprime le fait qu'un sujet est capable d'expulser 75 % de sa capacité            CV"],["p","vitale dans la première seconde d'une expiration forcée."],["p","2.4.2. L'étude des gaz du sang : qui se fait sur le sang artériel :"],["li","Mesure de la Pa O2 (pression partielle en oxygène) = 95 mm Hg."],["li","Mesure de la Sa O2 (saturation en oxygène de l'hémoglobine) = 97 %."],["li","Mesure de la Pa CO2 (pression partielle en gaz carbonique) = 40 mm Hg."],["li","Mesure du pH : 7,40. L'exploration fonctionnelle respiratoire permet de mesurer le degré d'une insuffisance respiratoire et de déterminer son mécanisme : exemple l'emphysème entraîne une insuffisance respiratoire de type obstructif s'accompagnant d'une diminution du VEMS et de l'indice de Tiffeneau, ainsi que d'une hypoxie avec hypercapnie (augmentation de la pression partielle en CO2)."],["p","Matité franche"],["pre","FIG.9. – Courbe de Demoiseau                          FIG. 10. - Spirographie"]]},{"ar":"الدراسة التركيبية: المتلازمات","fr":"Étude synthétique","w":2698,"b":[["h2","I. LES SYNDROMES PLEURAUX"],["h3","1. Le syndrome d'épanchement pleural liquidien"],["p","Quelle que soit la nature du liquide, l'existence d'un épanchement pleural liquidien sera mise en évidence p La symptomatologie clinique va varier en fonction de l'abondance de l’épanchement."],["p","1.1. Épanchement pleural liquidien de moyenne abondance : c'est le plus fréquent et le plus typique, il est 1.1.1. Inspection : diminution de l'ampliation thoracique s'accompagnant d'une dilatation de l’hémithora espaces intercostaux."],["p","1.1.2. Palpation : Abolition des vibrations vocales."],["p","1.1.3. Percussion : est le temps fondamental de l'examen, elle révèle la matité franche de bois, dont la lim courbe parabolique à sommet axillaire : courbe de Damoiseau (fig. 9), surmontée d'un skodisme sous-clavicu 1.1.4. Auscultation : abolition du murmure vésiculaire : parfois le souffle pleurétique (doux, lointain, voil de timbre aigre en «é») entendu à la limite supérieure de la matité accessoirement la pectoriloquie aphone et l'auscultation de la voix chuchotée et de la voix haute."],["p","L'épanchement pleural liquidien de moyenne abondance est reconnu essentiellement à l'examen cliniq associant :"],["li","Abolition des vibrations vocales (palpation)."],["li","Matité franche de bois, dont la limite supérieure décrit la courbe de Damoiseau (percussion)."],["li","Abolition du murmure vésiculaire (auscultation)."],["p","1.1.5. Le téléthorax de face : va montrer une opacité de la base dont la limite supérieure est nette à concav"],["p","FIG 11-1 — Epanchement pleural liquidiende moyenne abondance."],["p","FIG. 11-2. — Epanchement pleural liquidien"],["pre","de moyenne abondance                                           de grande abondance."],["p","FIG. 11-3. — Epanchement pleural liquidien de petite abondance."],["h4","1.2. Epanchement pleural liquidien de grande abondance"],["p","1.2.1. Les résultats de l'inspection et de la palpation sont identiques à ceux retrouvés dans l'épanchement pleural de moyenne abondance."],["p","1.2.2. La percussion : retrouve une matité occupant tout un hémithorax, dont la limite supérieure atteint ou dépasse l'épine de l'omoplate en arrière et la clavicule en avant; cette limite supérieure est horizontale; on ne retrouve pas de skodisme sous-claviculaire."],["p","1.2.3. L'auscultation : révèle une abolition du murmure vésiculaire de tout un hémithorax, le souffle pleurétique n'est jamais retrouvé."],["p","1.2.4. L'abondance de l'épanchement sera jugée cliniquement sur :"],["li","L'existence de signes fonctionnels : dyspnée importante."],["li","La présence d'une cyanose."],["li","La limite supérieure de la matité."],["li","L'existence de signes cardio-vasculaires : déplacement du choc de pointe vers la droite en cas d'épanchement gauche, vers la gauche en cas d'épanchement droit, tachycardie."],["p","1.2.5. Le téléthorax de face : va montrer une opacité de l’hémithorax dépassant la clavicule à limite supérieure peu nette (fig. 11-2), parfois un refoulement du médiastin."],["p","1.3. L'épanchement pleural liquidien de petite abondance : les éléments cliniques du syndrome d'épanchement pleural ne sont pas toujours retrouvés :"],["li","La diminution de l’ampliation thoracique est inconstante."],["li","La percussion peut montrer une submatité de la base."],["li","L'auscultation pourra retrouver une diminution du murmure vésiculaire et parfois un souffle pleurétique à la limite supérieure de la submatité de la base; mais surtout l'existence de frottements pleuraux localisés, le plus souvent postérieurs et fixes chez un même malade, disparaissant en apnée, non modifiés par la toux. Le téléthorax de face : va montrer le comblement du cul-de-sac costo-diaphragmatique ; la flexion latérale du tronc permet de mieux mettre en évidence l’épanchement (fig. 11 -3). Dans tous les cas le diagnostic clinique et radiologique devra être confirmé par la ponction pleurale (thoracentèse) qui permettra de connaître la nature du liquide."],["h3","2. Le syndrome d'épanchement pleural aérien ou pneumothorax"],["p","II est en rapport avec la présence d'air entr
