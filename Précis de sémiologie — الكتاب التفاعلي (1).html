e les deux feuillets de la plèvre par rupture de la plèvre viscérale."],["p","2.1. Il est suspecté sur les signes fonctionnels : d'apparition brutale :"],["li","Douleur thoracique à type de point de côté, douleur déchirante avec dyspnée et angoisse."],["li","Toux sèche."],["p","2.2. Il est reconnu sur les signes physiques suivants :"],["p","2.2.1. Inspection: diminution de l’ampliation thoracique ou immobilité de l’hémithorax atteint."],["p","Dilatation de cet hémithorax avec élargissement des espaces intercostaux."],["p","2.2.2. Palpation : abolition des vibrations vocales 2.2.3. Percussion : tympanisme ou seulement augmentation de la sonorité normale du côté atteint qui ne pourra être appréciée que par comparaison avec le côté sain."],["p","2.2.4. Auscultation : abolition du murmure vésiculaire : parfois on pourra entendre le souffle amphorique (d'intensité faible, à tonalité élevée, de timbre métallique, à maximum expiratoire), accessoirement on peut mettre en évidence un retentissement métallique de la voix et de la toux. Le syndrome d'épanchement pleural aérien est reconnu essentiellement à l’examen clinique sur le trépied de Gaillard associant :"],["li","Abolition des vibrations vocales (palpation)."],["li","Tympanisme (percussion)."],["li","Abolition du murmure vésiculaire (auscultation). Ces signes sont retrouvés sur toute Retendue de l’hémithorax atteint. A noter que le temps de l’examen clinique qui permet de différencier le syndrome d'épanchement pleural liquidien du syndrome d'épanchement pleural aérien est la percussion."],["pre","FIG. 12-1. — Pneumothorax.   FIG. 12-2. —Epanchement pleural mixte"],["p","aéro-liquidien"],["p","2.3. Le téléthorax de face : va confirmer l'existence du pneumothorax en montrant (fig.12-1):"],["li","Une hyperclarté d'un hémithorax."],["li","Le moignon pulmonaire rétracté dans la région hilaire."],["h3","3. Le syndrome d'épanchement pleural mixte aéro-liquidien"],["p","Il réalise une complication fréquente du pneumothorax, il s'agit soit d'un hydropneumothorax (liquide clair), soit d'un pyo-pneumothorax (liquide purulent)."],["p","3.1. Quelle que soit la nature du liquide, l'existence de l’épanchement pleural mixte est reconnue à l'examen clinique sur les signes physiques suivants :"],["p","3.1.1. Palpation : abolition des vibrations vocales sur toute la hauteur de l'hémithorax atteint."],["p","3.1.2. Percussion : matité franche de bois de la partie inférieure de l'hémitorax à limite supérieure horizontale, surmontée d'un tympanisme ou d'une hypersonorité."],["p","3.1.3. Auscultation : abolition du murmure vésiculaire sur toute la hauteur de l'hémithorax et succussion hippocratique : bruit de clapotement comparable à celui qui se produit dans une carafe à moitié pleine qu'on agite fortement, entendu à la base thoracique lorsqu'on secoue le malade par les épaules."],["p","3.2. Le téléthorax de face : montre l'existence d'une opacité franche, homogène de la base du poumon, comblant le sinus costo-diaphragmatique, à limite supérieure horizontale, surmontée d'une hyperclarté (fig. 12-2)."],["h2","II. LES SYNDROMES PULMONAIRES"],["h3","1. Les syndromes de condensation pulmonaire"],["p","La condensation pulmonaire est une densification du parenchyme pulmonaire intéressant le plus souvent un lobe qui ressemble alors macroscopiquement à du parenchyme hépatique d'où le terme d'hépatisation."],["p","Le parenchyme pulmonaire, siège d'une hépatisation, perd son élasticité et il ne flotte plus dans l'eau."],["p","La condensation pulmonaire peut être due :"],["li","Soit à une infection bactérienne du parenchyme : c'est la pneumonie franche lobaire aiguë."],["li","Soit à une embolie artérielle : c'est l'infarctus pulmonaire. Ces deux premiers types réalisent un syndrome de condensation pulmonaire non rétractile."],["li","Soit à une obstruction bronchique : réalisant l'atélectasie qui est l'absence de ventilation dans le territoire pulmonaire dépendant de la bronche obstruée : réalisant un syndrome de condensation pulmonaire rétractile."],["p","1.1. Les syndromes de condensation pulmonaire non rétractiles : quel que soit le mécanisme : infection bactérienne responsable de la pneumonie franche lobaire aiguë ou embolie artérielle pulmonaire responsable de l'infarctus pulmonaire, le syndrome de condensation pulmonaire non rétractile sera reconnu sur les signes suivants :"],["li","Cliniquement : il associe les signes physiques suivants :"],["li","palpation : augmentation des vibrations vocales;"],["li","percussion : matité ou submatité à limites nettes;"],["li","auscultation : abolition du murmure vésiculaire et présence de râles crépitants dus à l'exsudation alvéolaire associés secondairement à un souffle tubaire."],["li","Radiologiquement : sur le téléthorax de face, présence d'une opacité homogène plus ou moins dense, bien limitée, dont la topographie sera précisée par le cliché de profil (Fig. 13-1)."],["p","FIG. 13-1. - Condensation pulmonaire non rétractile : lobite supérieure droite."],["p","1.1.1. Pneumonie franche lobaire aiguë : est reconnue"],["li","A la phase de début :"],["li","Sur les signes fonctionnels : douleur thoracique à type de point de côté sousmamelonnaire, toux sèche."],["li","Sur la fièvre."],["li","Sur les signes physiques : à l'examen clinique on retrouve la triade classique du syndrome de condensation pulmonaire avec à l'auscultation des râles crépitants (fins-secs"],["li","égaux entre eux — régulièrement espacés - éclatant en bouffée en fin d'inspiration) mais pas de souffle tubaire."],["pre","•   A la phase d'état : à partir du troisième jour."],["li","Sur les signes fonctionnels : persistance de la toux qui ramène l'expectoration caractéristique : « les crachats rouillés » de Laennec : crachats visqueux, adhérents, de couleur orangée ou ocre."],["li","Sur la fièvre qui persiste."],["li","Sur les signes physiques : à l'auscultation apparition d'un souffle tubaire (intense à tonalité élevée — de timbre rude à prédominance inspiratoire) qui refoule les râles crépitants à la périphérie ; accessoirement une bronchophonie et un retentissement de la toux."],["p","1.1.2. L'infarctus pulmonaire : succède à une embolie pulmonaire et apparaît 24 à 36 heures après celle-ci."],["li","L'embolie pulmonaire est suspectée : chez un opéré récent, une accouchée ou un sujet alité sur l'apparition brutale :"],["li","De signes fonctionnels : douleur thoracique à type de point de côté basi-thoracique ou para-sternale avec polypnée et angoisse."],["li","De signes généraux : pouls rapide — élévation de la température."],["li","De signes physiques : recherche de signes de phlébite des membres inférieurs : signe de Homans (douleur provoquée à la dorsi-flexion du pied). L'examen pleuro-pulmonaire est normal."],["li","Les signes d'infarctus pulmonaire : apparaissent au bout de 24 à 36 heures."],["li","Signes fonctionnels : persistance de la toux qui ramène une expectoration hémoptoïque caractéristique : crachats peu nombreux, épais, visqueux, adhérents, noirâtres, d'odeur alliacée."],["li","La fièvre persiste."],["li","Signes physiques : foyer de condensation pulmonaire typique avec râles crépitants et souffle tubaire."],["h4","1.2. Le syndrome de condensation pulmonaire rétractile ou atélectasie"],["p","1.2.1. Lorsque l’atélectasie intéresse un lobe : on retrouve les signes suivants :"],["li","Palpation : les vibrations vocales sont soit normales, ou augmentées, soit le plus souvent diminuées (ce qui peut s'expliquer par l'obstruction de la bronche)."],["li","Percussion : matité franche."],["li","Auscultation : abolition du murmure vésiculaire."],["p","1.2.2. Lorsque l'atélectasie intéresse tout un champ pulmonaire : aux signes précédents retrouvés sur toute la hauteur de l'hémithorax s'ajoutent à l'inspection : une immobilité et une rétraction de l'hémithorax correspondant avec pincement des espaces intercostaux."],["p","FIG. 13-2. Atélectasie"],["p","1.2.3. La radiographie va montrer une opacité dense, homogène systématisée et rétractée avec pincement des espaces intercostaux, attraction des organes de voisinage vers le territoire atélectasié : déplacement du médiastin, surélévation de l'hémicoupole diaphragmatique si 1'atélectasié intéresse un hémithorax."],["p","Lorsque l'atélectasie atteint un lobe pulmonaire la rétraction s'exerce sur la scissure qui apparaît arciforme à convexité dirigée vers le centre de l'opacité (fig. 13-2)."],["li","2. Le syndrome cavitaire :"],["p","2.1. Définition : il réalise le plus souvent un syndrome de condensation pulmonaire excavée caractéristique de la caverne tuberculeuse et de l'abcès du poumon à la phase de foyer ouvert."],["p","2.2. Il est reconnu sur les signes physiques associant des :"],["p","2.1.1. Signes de condensation pulmonaire :"],["li","Palpation : augmentation des vibrations vocales."],["li","Percussion : matité."],["li","Auscultation : abolition du murmure vésiculaire."],["p","2.1.2. Les signes propres à l'excavation sont retrouvés à l'auscultation."],["li","Le souffle cavitaire : intense, à tonalité basse, de timbre creux, à prédominance inspiratoire."],["li","Les râles consonants : sont des râles forts, humides et métalliques. L'association du souffle cavitaire et des râles consonants réalise lors de la reprise de la toux « un bruit de gargouillement » caractéristique de l'excavation de la lésion."],["p","2.3. Les signes radiologiques : le téléthorax montre une cavité circulaire aérique entourée d'une plage de condensation dense plus ou moins étendue. Cette cavité est parfois de type hydro-aérique avec une opacité inférieure à limite supérieure horizontale surmonté d'une hyperclarté (fig. 13-3)."],["p","FIG. 13-3. — Syndrome cavitaire."],["h3","3. L'emphysème"],["p","3.1. Définition : c'est une dilatation anormale des cavités aériennes distales au-delà des bronchioles terminales avec lésions destructrices des alvéoles. Il réalise un syndrome de distension alvéolaire."],["p","3.2. Il est reconnu sur les signes cliniques suivants :"],["p","3.2.1. Inspection:"],["li","Modification morphologique du thorax : réalisant le thorax en tonneau."],["li","Diminution de l'ampliation thoracique appréciée par la mesure de l'indice de Hirtz qui est très diminué, entre 2 à 4 cm (au lieu de 7 cm chez le sujet normal)."],["li","Tirage intercostal et sus-stemal."],["p","3.2.2. Palpation :"],["li","Diminution des vibrations vocales au niveau des deux hémithorax."],["li","Diminution du choc de pointe."],["p","3.2.3. Percussion :"],["li","Hypersonorité des deux hémithorax."],["p","3.2.4. Auscultation :"],["li","Diminution du murmure vésiculaire au niveau des deux hémithorax."],["li","Inversion du rythme respiratoire avec expiration prolongée."],["li","Diminution de l'intensité des bruits du cœur qui paraissent assourdis."],["p","3.3. Les signes radiologiques sont les suivants :"],["p","3.3.1. La radioscopie : va surtout permettre de visualiser la diminution de l'amplitude respiratoire :"],["li","Les coupoles diaphragmatiques sont abaissées et aplaties."],["li","La course diaphragmatique est diminuée, elle est de 2 à 3 cm au lieu de 8 à 10 cm chez le sujet normal."],["p","3.3.2. La radiographie va montrer :"],["li","Un élargissement des espaces intercostaux et une horizontalisation des côtes."],["li","Une hyperclarté du parenchyme pulmonaire."],["p","3.4. L'exploration fonctionnelle respiratoire : va montrer un syndrome de type obstructif associant :"],["p","3.4.1. Une diminution de la capacité vitale par diminution du volume de réserve expiratoire."],["p","3.4.2. Une diminution importante du VEMS et diminution de l'indice de Tiffeneau."],["p","3.4.3. La mesure des gaz du sang va objectiver une hypoxie (diminution de la p O2) avec diminution de la saturation en oxygène de l'hémoglobine et souvent une hypercapnie (augmentation de la p CO2)."],["h2","III. LES SYNDROMES BRONCHIQUES"],["p","Que nous envisagerons seront la crise d'asthme, la bronchite chronique et la dilatation des bronches."],["h3","1. La crise d'asthme"],["p","Est en rapport avec une broncho-constriction soudaine mais transitoire; la bronchoconstriction se traduit par un signe physique essentiel, l'existence de râles sibilants à l'auscultation."],["p","La crise d'asthme réalise une crise de dyspnée paroxystique survenant au repos qui évolue en deux phases."],["p","1.1. La phase sèche : le début est brutal, le plus souvent nocturne, il s'agit d'une bradypnée expiratoire avec orthopnée , la fréquence respiratoire est diminuée entre 10 et 12 mouvements par minute, l'inspiration est brève, l'expiration est difficile, prolongée, volontaire et bruyante; le malade ne peut supporter la position de décubitus."],["p","L'examen clinique va mettre en évidence :"],["p","1.1.1. A l'inspection : une diminution de l'ampliation thoracique avec thorax distendu, bloqué en inspiration forcée et horizontalisation des côtes."],["p","1.1.2. A la percussion : une hypersonorité des deux hémithorax."],["p","1.1.3. A l'auscultation : une inversion du rythme respiratoire, l'expiration devient plus longue que l'inspiration, une diminution du murmure vésiculaire et surtout la présence de râles sibilants qui réalisent des sifflements expiratoires aigus et prolongés."],["p","1.2. La phase catarrhale : au bout de 2 à 3 heures apparaît une hypersécrétion bronchique qui se manifeste par :"],["p","1.2.1. Une toux productive: avec expectoration muqueuse faite de crachats peu nombreux et peu abondants, blanc grisâtre et translucides, visqueux, réalisant les « crachats perlés » de Laennec. Plus rarement l'expectoration est abondante de type séro-muqueux."],["p","1.2.2. L'apparition de râles ronflants qui viennent s'ajouter aux râles sibilants réalisant un « bruit de pigeonnier »."],["p","1.3. Après la crise dans les heures qui suivent et le lendemain, l'auscultation retrouve l'existence de râles sibilants qui permettent de poser le diagnostic d'asthme si on n'a pas assisté à la crise."],["p","1.4. Le téléthorax : montre un élargissement des espaces intercostaux avec horizontalisation des côtes et une hyperclarté du parenchyme pulmonaire."],["p","1.5. L'exploration fonctionnelle respiratoire permettra de faire le diagnostic d'asthme en dehors de la crise, elle va montrer une diminution du VEMS provoquée par l'acétylcholine."],["h3","2. La bronchite chronique"],["p","Est caractérisée par une hypersécrétion muqueuse au niveau des bronches, elle est souvent compliquée d'infection d'où l'expectoration muco-purulente abondante à type de bronchorrhée souvent retrouvée. Elle est définie par l'existence chez un malade d'une toux productive chronique ou récidivante observée pendant au moins 3 mois non forcément"],["p","consécutifs dans l'année et pendant au moins 2 années successives, après avoir éliminé toute autre maladie broncho-pulmonaire en particulier la dilatation des bronches et la tuberculose pulmonaire. Elle sera donc reconnue essentiellement sur les signes fonctionnels :"],["li","Toux productive."],["li","Expectoration : muqueuse ou muco-purulente souvent abondante à type de bronchorrhée. L'examen clinique est pauvre, il peut mettre en évidence des râles bronchiques surtout à type de râles ronflants au moment des poussées infectieuses."],["h3","3. La dilatation des bronches"],["p","Est définie comme une dilatation permanente du calibre de plusieurs bronches de moyen calibre."],["p","Fie. 14. — Dilatation des bronches (Rronchographie lipiodolée)."],["p","3.1. Elle sera reconnue essentiellement sur des signes fonctionnels :"],["li","Toux quotidienne et matinale."],["li","Expectoration caractéristique muco-purulente abondante réalisant la bronchorrhée sédimentant en quatre couches."],["p","3.2. Elle sera affirmée par la bronchographie lipiodolée visualisant l'augmentation du diamètre bronchique avec diminution ou disparition des ramifications de la bronche pathologique (fig. 14)."]]}]},{"ic":"❤️","ar":"القلب والأوعية","fr":"L'appareil cardio-vasculaire","c":"#DC2626","ch":[{"ar":"الديناميكا الدموية داخل القلب","fr":"Hémodynamique intra-cardiaque","w":2165,"b":[["p","L'étude de la sémiologie cardio-vasculaire sera précédée par celle de l'hémodynamique intracardiaque qui est l'étude des conditions mécaniques de la circulation sanguine ; ce qui permettra de mieux comprendre la sémiologie normale et pathologique."],["h2","I. RAPPEL ANATOMO-PHYSIOLOGIQUE DU CŒUR"],["li","1. Le cœur est divisé en 4 chambres, 2 oreillettes et 2 ventricules qui communiquent deux à deux par l'intermédiaire des valves auriculo-ventriculaires (fig. 1) :"],["li","A droite, le ventricule droit et l'oreillette droite par la valve tricuspide (fig. 2-2)."],["li","A gauche, le ventricule gauche et l'oreillette gauche par la valve mitrale (fig. 2-1). Les ventricules sont eux-mêmes en communication avec les gros vaisseaux par l'intermédiaire des valves sigmoïdes :"],["li","A droite, le ventricule droit et l'artère pulmonaire par les sigmoïdes pulmonaires."],["li","A gauche, le ventricule gauche et l'aorte par les sigmoïdes aortiques. Les valves auriculo-ventriculaires et sigmoïdes ont une mobilité passive; leur ouverture et leur fermeture sont sous la dépendance des variations de pression intracavitaire."],["li","2. Le cœur est une pompe qui assure la circulation du sang ; il est le lien entre la circulation pulmonaire et la circulation générale."],["li","Le cœur droit : envoie le sang dans les poumons du ventricule droit par l'artère pulmonaire, pour cela il doit vaincre les résistances pulmonaires."],["li","Le cœur gauche : envoie le sang vers la périphérie du ventricule gauche par l'aorte, pour cela il doit vaincre les résistances périphériques. Les résistances pulmonaires sont plus faibles que les résistances périphériques, ce qui explique que les pressions dans le cœur droit sont plus faibles que celles du cœur gauche."],["li","3. Le cycle cardiaque ou révolution cardiaque se déroule en 2 phases :"],["li","Une phase de contraction ventriculaire ou systole : c'est lors de cette phase que se fait l'éjection sanguine des ventricules vers les poumons d'une part (ventricule droit, artère pulmonaire) et vers la périphérie d'autre part (ventricule gauche, aorte)."],["li","Une phase de repos ventriculaire ou diastole : c'est pendant cette phase que s'accomplit le remplissage ventriculaire. L'étude de l'hémodynamique intracardiaque est l'étude de ce cycle cardiaque."],["h2","II. MÉTHODES D'ÉTUDE DE L'HÉMODYNAMIQUE INTRACARDIAQUE"],["p","L'hémodynamique intracardiaque est étudiée grâce au cathétérisme cardiaque qui consiste à introduire dans les cavités droites et gauches une sonde munie d'un manomètre qui permettra d'une part d'enregistrer des courbes de pression et d'autre part de mesurer avec exactitude les pressions dans chaque cavité."],["h3","1. Le cathétérisme droit"],["p","Explore les cavités droites. Un cathéter est introduit dans une veine du pli du coude, il est poussé dans la veine sousclaviére, la veine cave supérieure, l'oreillette droite, le ventricule droit, l'artère pulmonaire et enfin les capillaires pulmonaires."],["h3","2. La cathétérisme gauche"],["p","Explore les cavités gauches; un cathéter est introduit :"],["li","Soit dans U artère fémorale, il est alors poussé par voie rétrograde dans l'aorte, le ventricule gauche et l'oreillette gauche."],["li","Soit par voie trans-septale : le cathéter est d'abord introduit par voie veineuse jusqu'à l'oreillette droite puis dans l'oreillette gauche en perforant le septum interauriculaire puis dans le ventricule gauche. Le cathétérisme cardiaque doit être toujours confronté avec d'autres explorations fonctionnelles cardiaques :"],["li","Le phonocardiogramme qui est l'enregistrement acoustique des bruits du cœur."],["li","L'électrocardiogramme (ECG) qui est l'enregistrement de l'activité électrique du cœur."],["h2","III. LES RÉSULTATS"],["p","Ainsi le cathétérisme cardiaque permet d'enregistrer les courbes de pression dans les ventricules, les oreillettes et les gros vaisseaux et d'y mesurer les pressions."],["h3","1. Les courbes de pression"],["h4","1.1. La courbe de pression ventriculaire (fig. 3)"],["p","1.1.1. La systole ventriculaire : comprend deux phases, une phase de contraction et une phase d'éjection."],["li","Phase de contraction :"],["li","Le début de la contraction ventriculaire est la contraction préisovolumétrique, elle va s'accompagner d'une augmentation brusque de la pression dans le ventricule qui devient supérieure à la pression dans l'oreillette, ce qui entraîne  fermeture des valves auriculo-ventriculaires qui correspond au 1er bruit du cœur."],["li","La contraction du ventricule se poursuit, les valves auriculo-ventriculaires et sigmoïdes sont fermées : c'est la contraction isovolumétrique ; la pression ventriculaire s’élève rapidement et"],["p","devient supérieure à la pression dans les gros vaisseaux, d'où Couverture des valves sigmoïdes, elle correspond à la première partie ascendante de la courbe."],["li","Phase d'éjection : elle commence après l'ouverture des sigmoïdes, elle comprend plusieurs phases :"],["li","Une phase d'éjection rapide : qui correspond à la deuxième partie ascendante de la courbe, phase pendant laquelle la pression continue d'augmenter rapidement."],["li","Une phase d'éjection lente : qui correspond au sommet de la courbe."],["li","La proto-diastole de Wiggers : pendant laquelle la pression ventriculaire chute rapidement mais reste supérieure à la pression aortique, elle correspond à la première partie descendante de la courbe. Lorsque la pression ventriculaire devient inférieure à la pression dans les gros vaisseaux, il y a fermeture des valves sigmoïdes ce qui correspond au deuxième bruit cardiaque qui marque la fin de la systole et le début de la diastole."],["p","1.1.2. La diastole ventriculaire : se décompose en deux phases, une phase de relaxation et une phase de remplissage."],["li","Phase de relaxation : durant cette phase les valves auriculo-ventriculaires et sigmoïdes sont fermées, la pression dans le ventricule continue à diminuer ce qui correspond à la deuxième partie descendante de la courbe : c'est la relaxation isovolumétrique. Lorsque la pression dans le ventricule devient inférieure à la pression dans l'oreillette, il y a ouverture des valves auriculo-ventriculaires."],["li","Phase de remplissage : elle commence dés l'ouverture des valves auriculo-ventriculaires, elle comprend plusieurs phases :"],["li","Une phase de remplissage rapide : elle correspond à la dernière partie descendante de la courbe; la pression dans l'oreillette est supérieure à la pression dans le ventricule, d'où remplissage rapide du ventricule. Le 3e bruit cardiaque correspond à la fin de cette phase."],["li","Une phase de remplissage lent : la pression dans le ventricule commence à s'élever lentement alors que la pression dans l'oreillette continue à diminuer, le ventricule poursuit son remplissage."],["li","Une phase de diastasis : qui est la phase pendant laquelle il y a égalité des pressions dans le ventricule et l'oreillette, c'est une période de repos complet pour le cœur. Lorsqu'il y a accélération de la fréquence cardiaque, cette phase de diastasis disparaît."],["li","Une phase de remplissage actif : pendant laquelle il existe une élévation transitoire de la pression ventriculaire qui est due à la systole auriculaire qui chasse le sang restant dans l'oreillette vers le ventricule et termine ainsi le remplissage du ventricule ; cette phase correspond au 4e bruit cardiaque."],["h4","1.2. La courbe de pression auriculaire (fig. 3)"],["p","1.2.1. La systole auriculaire : qui est la contraction de l'oreillette s'accompagne d'une augmentation de pression dans l'oreillette qui se traduit sur la courbe sous la forme de «l'onde a»."],["p","1.2.2. Le sang chassé dans le ventricule lors de la systole auriculaire complète le remplissage ventriculaire qui s'accompagne d'une augmentation de pression dans ce dernier qui devient supérieure à la pression auriculaire d'où fermeture des valves auriculo-ventriculaires au «point z »."],["pre","Systole                   Diastole"],["p","Contraction préisovolumétrique"],["p","Systole auriculaire"],["p","FIG. 3. — Courbes de pression ventriculaire, auriculaire et aortique."],["p","1.2.3. La fermeture des valves auriculo-ventriculaires s'accompagne d'un bombement des valves (dans l'oreillette, ce qui entraîne un ressaut de la pression qui se traduit par « l'onde c »."],["p","1.2.4. La diastole auriculaire est traduite par une diminution de pression qui est enregistrée sur la courbe sous forme du « creux x »."],["p","1.2.5. L'arrivée du sang par les veines pulmonaires entraîne une augmentation de la pression auriculaire qui correspond à « l'onde v ». La pression dans l'oreillette devient supérieure à la pression dans le ventricule, l'ouverture des valves auriculo-ventriculaires se situe au sommet de « l'onde v »."],["p","1.2.6. Dès l'ouverture des valves auriculo-ventriculaires, la pression auriculaire chute rapidement du fait du remplissage ventriculaire, ce qui se traduit par le « creux y »."],["p","1.2.7. Il y a ensuite égalisation des pressions entre oreillettes et ventricules, puis survient de nouveau la systole auriculaire (onde à) qui termine la vidange de l'oreillette et le remplissage du ventricule."],["h4","1.3. La courbe de pression au niveau des gros vaisseaux (fig. 3)"],["p","1.3.1. L'ouverture des sigmoïdes : se produit lorsque la pression ventriculaire est supérieure à la pression aortique 1.3.2. Il existe alors une élévation brusque de la pression qui est parallèle à l'élévation de pression dans le ventricule correspondant à l'éjection rapide, puis la pression se stabilise en même temps que celle du ventricule pendant la phase d'éjection lente puis elle décroît. Lorsque la pression dans l'aorte devient supérieure à celle du ventricule, il y a fermeture des sigmoïdes qui est immédiatement suivie d'un ressaut de pression qui correspond à l'incisure dicrote et à l'onde catacrote."],["p","1.3.3. Puis la pression décroît progressivement dans l'aorte pendant la diastole, mais elle reste toujours supérieure à la pression du ventricule pendant cette période, cette chute de pression est due à la fuite du sang dans les artères périphériques."],["p","1.4. La courbe de pression dans les artères périphériques : elle a la même morphologie que celle enregistrée dans les gros vaisseaux mais elle s'élève avec un retard d'autant plus grand que l'on s'éloigne du cœur, le retard est de :"],["li","0,03 seconde dans la carotide primitive."],["li","0,06 seconde dans l'humérale."],["li","0,08 seconde dans la radiale."],["li","0,07 seconde dans la fémorale."],["h3","2. Les valeurs des pressions dans les différentes cavités et les gros vaisseaux"],["p","Sont exprimées en mm de Hg (mercure)."],["p","2.1. Cavités gauches :"],["pre","                             Maximale      Minimale      Moyenne\nOreillette                   8             0             5\nVentricule                   130           2             40\nAorte                        130           65            85"],["p","2.2. Cavités droites :"],["pre","                             Maximale Minimale           Moyenne\nOreillette                   5         0                 2\nVentricule                   25        2                 8\nArtère pulmonaire            25       10                 15"],["h2","IV. CONFRONTATIONS DU CATHÉTÉRISME CARDIAQUE AVEC LES AUTRES"],["p","EXPLORATIONS FONCTIONNELLES; PHONOCARDIOGRAMME ET ÉLECTROCARDIOGRAMME (ECG)"],["h3","1. Avec le phonocardiogramme (fig. 4)"],["p","Les phénomènes mécaniques enregistrés par le cathétérisme cardiaque et les phénomènes acoustiques enregistrés par le phonocardiogramme ne sont pas synchrones dans les cavités droites et dans les cavités gauches."],["p","En effet, la contraction auriculaire droite précède la contraction de l'oreillette gauche, du fait de la position du nœud sinusal qui est situé au niveau de l'abouchement de la veine cave supérieure."],["p","La contraction ventriculaire gauche, quant à elle, commence et finit avant celle du ventricule droit."],["p","FIG. 4. — Confrontation du cathétérisme cardiaque avec le phonocardiogramme et l'ECG."],["p","1.1. Le 1er bruit (B1) correspond à la fermeture des valves auriculo-ventriculaires qui a lieu lorsque la pression intraventriculaire devient supérieure à la pression intra-auriculaire ; il a donc lieu lorsque la courbe ventriculaire et la courbe auriculaire se croisent au point z."],["p","Ce premier bruit est fait de deux composantes : la composante mitrale qui précède la composante tricuspide."],["p","L'ouverture des valves sigmoïdes est inaudible; elle a lieu lorsque la courbe ventriculaire et la courbe artérielle se croisent."],["p","1.2. Le 2e bruit (B2) : Correspond à la fermeture des valves sigmoïdes qui a lieu lorsque la pression ventriculaire devient inférieure à la pression artérielle au-dessus des sigmoïdes; il a lieu lorsque la courbe ventriculaire et la courbe artérielle se recroisent."],["p","Ce deuxième bruit est fait de deux composantes : la composante aortique précédant la composante pulmonaire."],["p","Enfin le 2e bruit marque le début de la diastole."],["p","1.3. L'ouverture de la mitrale : a lieu lorsque la pression intraventriculaire devient inférieure à la pression auriculaire normalement elle est inaudible; elle peut en pathologie donner lieu à un"],["p","claquement (au cours du rétrécissement mitral) qui survient alors 0,08 seconde après la composante aortique du deuxième bruit."],["p","L'ouverture de la mitrale a lieu lorsque la courbe ventriculaire et la courbe auriculaire se croisent au sommet de l’onde v."],["p","1.4. Le 3e bruit (B3) : Correspond à la fin du remplissage rapide du ventricule, il se produit 0,15 seconde après la composante aortique du 2e bruit 1.5. Le 4e bruit (B4) : Correspond à la systole auriculaire ou phase de remplissage actif du ventricule; normalement, il est inaudible, il peut le devenir en pathologie et constituer alors soit le bruit de galop présystolique, soit le renforcement présystolique au cours du rétrécis sèment mitral."],["p","TABLEAU RÉCAPITULATIF Systole Contraction préisovoïumetrique. Fermeture des valves auriculo-ventriculaires : B1. Contraction isovolumétrique. Ouverture des sigmoïdes. Ejection. Proto-diastole de Wiggers."],["p","Diastole Fermeture des valves sigmoïdes : B2. Relaxation isovolumétrique. Ouverture des valves auriculo-ventriculaires : OM. Remplissage ventriculaire rapide : B3. Remplissage ventriculaire lent. Diastasis. Remplissage ventriculaire actif (systole auriculaire) : B4."],["p","Ce bruit pathologique disparaît en cas de fibrillation auriculaire."],["h3","2. Avec l’éiectrocardiogrammc (fig. 4)"],["p","L'ECG est le tracé de référence, il permet de mesurer les temps. Les phénomènes enregistrés par le cathétérisme et les phénomènes électriques enregistrés par PECG ne sont pas synchrones. Les phénomènes électriques précèdent les phénomènes mécaniques et acoustiques de 0,08 seconde."],["p","2.1. Le sommet de l'onde P de l’ECG (l'onde P représente la dépolarisation auriculaire) correspond au pied de l'onde a."],["h4","2.2. Le sommet de l'onde R du complexe QRS de l'ECG (complexe QRS représente la"],["p","dépolarisation ventriculaire) correspond au début de l’ascension des pressions du ventricule gauche, le début de l'augmentation des pressions dans le ventricule droit est plus tardif et correspond à la branche descendante de R."],["p","2.3. La fin de Fonde T : de FECG (l'onde T représente la repolarisation ventriculaire) correspond à la composante aortique du 2e bruit."]]},{"ar":"السيميولوجيا القلبية","fr":"Sémiologie cardiaque","w":10165,"b":[["h3","1. LES SIGNES FONCTIONNELS"],["p","L'interrogatoire du malade revêt une très grande importance, il permet de retrouver les signes subjectifs ou fonctionnels qui témoignent d'une atteinte cardiaque."],["p","Les trois signes fonctionnels les plus importants sont : la dyspnée, les douleurs précordiales et les palpitations. L'existence de ces signes fonctionnels et leur degré d'intensité est à la base de la classification fonctionnelle de la New York Heart Association qui permet d'apprécier le degré de tolérance d'une cardiopathie, donc de décider d'une attitude thérapeutique et de prévoir le pronostic."],["p","Stade 1 : Absence de signes fonctionnels lors de l'activité physique habituelle. Stade II : Présence de signes fonctionnels lors des efforts habituels. Stade III : Présence de signes fonctionnels pour des efforts légers. Stade IV : Présence de signes fonctionnels au repos. D'autres signes fonctionnels seront également recherchés : les syncopes et les lipothymies, la toux et les hémoptysies."],["h2","I. La dyspnée"],["p","La dyspnée chez le cardiaque est un signe fonctionnel majeur, elle s'observe surtout au cours des affections du cœur gauche."],["p","Elle peut revêtir plusieurs types : la dyspnée d'effort, la dyspnée paroxystique et la dyspnée de repos."],["p","1.1. La dyspnée d’effort : est le symptôme fonctionnel le plus couramment observé au cours des cardiopathies et aussi le plus précoce."],["li","A l'état physiologique : il existe un essoufflement à l’effort mais :"],["li","Il survient pour un effort inhabituel par sa violence et sa durée."],["li","Il cède rapidement en 1 à 2 minutes après l'arrêt de l'effort."],["li","Il peut y avoir une adaptation si le sujet subit un entraînement."],["li","A l'état pathologique la dyspnée d'effort est une polypnée qui a les caractères suivants :"],["li","Elle apparaît pour des efforts d'intensité variable :"],["li","soit lors de l'activité physique habituelle : jeu pour l'enfant, marche normale, montée des escaliers : il s'agit d'une dyspnée modérée;"],["li","soit pour des efforts moindres : montée d'un étage ou de quelques marches, marche sur une petite distance : il s'agit d'une dyspnée importante."],["li","Elle ne cède pas rapidement à l'arrêt de l'effort et dure au-delà de 5 minutes."],["li","Elle va en se majorant apparaissant pour des efforts de plus en plus restreints, aboutissant à la dyspnée de repos. La dyspnée d'effort n'est pas spécifique des affections cardiaques, elle peut se voir dans les insuffisances respiratoires et également en cas d'anémie."],["p","1.2. La dyspnée paroxystique est une crise d'étouffement durant de quelques minutes à quelques heures, d'apparition brutale, survenant soit le plus souvent spontanément, surtout la nuit au coucher ou réveillant le malade en plein sommeil, soit plus rarement à la suite d'un effort."],["p","On distingue deux aspects principaux : l'œdème aigu du poumon et l'asthme cardiaque."],["p","1.2.1. L'œdème aigu du poumon (OAP) :"],["p","survient lorsque la pression hydrostatique dans les capillaires pulmonaires devient supérieure à la pression oncotique, ce qui entraîne une transsudation du sérum dans les alvéoles et donc une véritable inondation alvéolaire."],["p","Il est caractéristique de l'insuffisance ventriculaire gauche et du rétrécissement mitral serré. Il peut revêtir plusieurs aspects, le plus typique est la grande crise d'OAP :"],["li","Le début est brutal en règle nocturne se manifestant par une sensation d'oppression thoracique rapidement croissante, un chatouillement laryngé et une toux."],["li","La phase d'état est atteinte en quelques minutes. Le malade est assis au bord du lit couvert de sueur, le teint blafard, cyanose, les jugulaires turgescentes. Trois signes fonctionnels principaux sont notés :"],["li","La polypnée : intense, angoissante avec orthopnée, sensation de grésillement laryngé; il n'y a pas de point de côté."],["li","La toux : incessante, quinteuse, pénible, qui ramène rapidement."],["li","L'expectoration séreuse caractéristique qui est mousseuse, rosée dite saumonée, très abondante remplissant plusieurs crachoirs en quelques minutes sans soulager le malade. A l'examen clinique : l'auscultation retrouve l'existence de râles crépitants d'abord aux deux /bases pulmonaires, puis remontant vers les sommets réalisant la classique marée montante des râles crépitants."],["li","L'évolution : est fonction de la précocité du traitement qui doit être institué en urgence. D'autres formes peuvent être rencontrées : la forme suraiguë, le plus souvent mortelle en quelques minutes par asphyxie ; à l'opposé la forme atténuée se manifestant par une toux quinteuse ramenant quelques crachats mousseux accompagnant une sensation d'oppression thoracique ; dans cette forme les accès ont tendance à se répéter plusieurs nuits de suite. Cette forme atténuée peut survenir au cours du rétrécissement mitral serré, elle apparaît alors à l'effort."],["h4","1.2.2. L'asthme cardiaque"],["li","II s'agit d'une crise dyspnéique à début brutal le plus souvent nocturne réalisant une bradypnée expiratoire avec thorax bloqué en inspiration et soif d'air intense."],["li","L'auscultation retrouve des sifflements expiratoires : les râles sibilants disséminés dans les deux champs pulmonaires."],["li","L'évolution : la crise se termine par quelques secousses de toux qui ramènent quelques crachats muqueux blanchâtres visqueux."],["p","Le diagnostic entre crise d'asthme bronchique et crise d'asthme cardiaque est posé sur l'examen du cœur et des vaisseaux entre les crises dans le premier cas cet examen est normal, dans le deuxième cas, on retrouve soit une cause cardiaque ou vasculaire d'insuffisance ventriculaire gauche, soit un rétrécissement mitral."],["p","1.3. La dyspnée permanente ou dyspnée de repos : elle est l'indice d'une cardiopathie décompensée avec diminution importante du débit cardiaque II s'agit d'une dyspnée qui est augmentée par le décubitus à recrudescence nocturne et qui est partiellement soulagée par la position assise ou demi assise réalisant l’orthopnée. L'interrogatoire précise son intensité par le nombre d'oreillers nécessaires au malade, au maximum le malade reste assis chaque nuit dans un fauteuil."],["p","1.4. La fausse dyspnée ou dyspnée périodique de Cheyne-Stokes : elle survient surtout pendant le sommeil, elle n'est pas ressentie par le malade sous forme d'une gêne respiratoire."],["p","Elle est en rapport avec une perturbation profonde de la fonction circulatoire retentissant sur les centres nerveux respiratoires, elle se voit dans la grande insuffisance cardiaque, elle est de fâcheux pronostic."],["h3","2. Les douleurs précordiales"],["p","On distingue deux types de douleurs précordiales : les douleurs organiques et les douleurs non organiques ou précordialgies."],["p","L'interrogatoire va préciser les caractères sémiologiques de la douleur, ce qui permettra de la classer :"],["li","Les circonstances d'apparition : spontanée ou provoquée."],["li","Le siège et les irradiations."],["li","Le type et l'intensité."],["li","La durée."],["li","Les signes accompagnateurs."],["li","L'évolution dans le temps : permanente ou paroxystique,"],["li","Les facteurs sédatifs."],["p","2.1. Les précordialgies sont des douleurs anorganiques, le cœur est indemne. C'est un signe fonctionnel d'origine névrotique entrant dans le cadre de la névrose cardiaque. Il s'agit d'un sujet au profil psychologique particulier, anxieux et émotif cherchant à se réfugier dans la maladie."],["p","Les précordialgies ont les caractères suivants :"],["p","2.1.1. Circonstances d'apparition : le plus» souvent d'apparition spontanée, parfois déclenchée par une contrariété ou une émotion ou la fatigue."],["p","2.1.2. Siège et irradiations : le siège est localisé, apexien (sous le sein gauche), punctiforme; sans irradiation."],["p","2.1.3. Type et intensité : elles sont ressenties comme pénibles, permanentes, mais elles n'empêchent pas le malade de vaquer à ses occupations, de manger et de dormir normalement."],["p","2.1.4. Durée, elle est variable :"],["li","Soit brusques et brèves : quelques minutes ou quelques secondes à type de pincement, piqûre d'aiguille ou coup de poignard."],["li","Soit tenaces et durables : plusieurs heures ou plusieurs jours à type de poids, de point ou de douleur sourde."],["p","2.1.5. Signes accompagnateurs : les palpitations à début et fin progressifs."],["p","2.1.6. Facteurs sédatifs : il n'existe aucun/acteur sédatif évident. Parfois, le repos peut avoir une influence favorable sur les précordialgies, mais leur disparition est lente et souvent incomplète. La trinitrine peut faire céder la douleur, mais toujours au bout d'un temps prolongé de 15 à 30 minutes."],["p","2.1.7. L'ECG est toujours normal."],["h4","2.2. Les douleurs précordiales organiques"],["p","2.2.1. L'angine de poitrine est une douleur thoracique en rapport avec des troubles de la circulation coronaire. Le plus souvent, il s'agit d'une diminution du débit coronaire due à une diminution du calibre des artères coronaires atteintes d'athérosclérose, mais elle peut aussi être fonctionnelle, secondaire à une cardiopathie. Exemple, le rétrécissement aortique."],["p","Le débit coronaire suffisant au repos, devient insuffisant à l'effort ce qui a pour conséquence une diminution de l'apport d'oxygène au myocarde et l'apparition de la douleur à l'effort."],["p","Les caractères sémiologiques de la douleur de l'angine de poitrine sont les suivants :"],["li","Circonstances d'apparition : la douleur apparaît à l'effort :"],["li","La marche : surtout si elle est rapide, contre le vent ou dans le froid, après un repas copieux."],["li","La montée d'escalier."],["li","L'effort inhabituel."],["li","Siège et irradiations : la douleur est rétrosternale localisée; les irradiations classiques sont au niveau du bras gauche, le long du bord interne jusqu'aux derniers doigts avec une sensation de striction du poignet. Parfois, la douleur peut avoir des irradiations bilatérales aux deux membres supérieurs et aux deux mâchoires."],["li","Type et intensité : elle est constrictive : sensation d'étau enserrant le cœur; elle est intense imposant l'arrêt de l'effort."],["li","Durée : elle est brève, elle dure quelques secondes à 2 minutes après l'arrêt de l'effort. Sa fin peut être marquée par des phénomènes postcritiques : éructations bâillements."],["li","Signes accompagnateurs : aucun."],["li","Facteurs sédatifs : le repos ou la prise de Trinitrine. Cette dernière fait céder la douleur en moins d'une minute, si elle est croquée et gardée sous la langue; ce caractère est utilisé comme test diagnostic. L'ECG doit être systématique, il sera soit normal, soit il montrera des troubles de la repolarisation localisés portant sur le segment ST et l'onde T."],["p","2.2.2. L'infarctus du myocarde : est une nécrose de la paroi myocardique d'au moins 2 cm2 correspondant au territoire d'une artère coronaire obstruée, il se manifeste essentiellement par une douleur thoracique qui possède les caractères suivants :"],["li","Circonstances d'apparition : elles sont variables, la douleur apparaît soit spontanément, soit après effort."],["p","TABLEAU RÉCAPITULATIF DES CARACTÈRES SÉMIOLOGIQUES DES DOULEURS PRÉCORDIALES"],["pre","Caractères             Précordialgies         Angine de poitrine          Infarctus du myocarde                Péricardite"],["p","sémiologiques"],["pre","Circonstances             Variables                  Effort                       Variables                     Spontanée"],["p","d'apparition"],["pre","Siège            Apexien -punctiforme    Rétro-sternale localisée       Rétro-sternale diffuse              AnginoÏde"],["pre","Irradiations              Aucune           Bras gauche ou mâchoires         Mâchoires et 2 MS,                  Aucune\n                                                  et 2 MS                     épigastre\n   Durée                  Variable          Inférieure ou égale à 2       Supérieure à 5 minutes               Infarctoïde"],["p","minutes"],["pre","Signes accompagnateurs       Palpitations                Aucun                   Agitation -Malaise             Fièvre -Frottement\n                                                                            Angoisse -Signes digestifs          péricardique ou"],["p","assourdissement des bruits du cœur"],["pre","Facteur sédatif            Aucun               Repos - Trinitrine                  Opiacés              Position penchée en avant"],["pre","     Examens                ECG normal         ECG normal ou troubles           ECG pathologique et            ECG pathologique\ncomplémentaires                                de la repolarisation          transaminases élevées       téléthorax : cardiomégalie"],["li","Siège et irradiations : c'est une douleur rétrosternale souvent diffuse, intéressant toute la partie antérieure du thorax. Les irradiations sont bilatérales et symétriques : mâchoires, membres supérieurs; parfois épigastrique."],["li","Type et intensité : elle est constrictive, atroce, angoissante."],["li","Durée : prolongée au-delà de 5 minutes."],["li","Signes accompagnateurs : la douleur est accompagnée d'agitation, de malaise profond avec angoisse, de pâleur, de sueurs froides, de troubles digestifs : nausées, vomissements, éructations. A l'examen clinique, il existe parfois une tendance au collapsus avec chute de la tension artérielle et une insuffisance ventriculaire gauche aiguë avec OAP."],["li","Facteurs sédatifs : elle résiste à la trinitrine, elle est soulagée par les opiacés. L'ECG va montrer dans les premières heures des signes de lésion, puis des signes de nécrose. Les transaminases sériques glutamino-oxalo-acétiques seront élevées."],["p","2.2.3. La péricardite aiguë : est l'inflammation du péricarde, elle peut être sèche ou bien s'accompagner d'un épanchement, elle entraîne une douleur thoracique qui possède les caractères suivants :"],["li","Circonstances d'apparition : elle est d'apparition spontanée."],["li","Siège et irradiations : elle est de topographie anginoïde, c'est-à-dire rétro-sternale localisée; sans irradiations."],["li","Type et intensité : c'est une douleur vive, exagérée par les mouvements respiratoires."],["li","Durée : sa durée est infarctoïde, c'est-à-dire qu'elle est prolongée."],["li","Signes accompagnateurs : la fièvre; l'auscultation retrouve un frottement péricar-dique en cas de péricardite sèche; un assourdissement des bruits du cœur en cas de péricardite avec épanchement."],["li","Facteurs sédatifs : la douleur est calmée par la position penchée en avant; elle résiste à la trinitrine. L'ECG montre des troubles diffus de la repolarisation portant sur le segment ST et l'onde T. Le téléthorax peut montrer un cœur augmenté de volume, surtout en cas de péricardite avec épanchement."],["h3","3. Les palpitations"],["p","Les palpitations sont des sensations anormales et désagréables produites par les contractions cardiaques. A l'état normal, les contractions du cœur ne sont pas perçues; en cas de palpitation, chaque contraction entraîne une sensation de choc ou d'ébranlement thoracique à l'emplacement de la pointe du cœur. Les palpitations peuvent être soit physiologiques, soit pathologiques."],["p","3.1. Les palpitations physiologiques. Elles sont induites par un effort violent inhabituel ou une forte émotion. Dans ces cas, l'augmentation de l'ondée systolique fait que la contraction cardiaque est plus ample et devient alors perceptible."],["p","3.2. Les palpitations pathologiques. Elles peuvent être soit provoquées, soit spontanées."],["p","3.2.1. Les palpitations provoquées : le sont par l'effort, elles accompagnent la dyspnée d'effort et se confondent alors avec elle."],["p","3.2.2. Les palpitations spontanées réalisent à elles seules un motif de consultation ; elles sont le plus souvent intermittentes et surviennent sans cause évidente."],["p","Suivant leur mode d'installation, on distingue : les palpitations d'apparition progressive et les palpitations à début brusque."],["li","Les palpitations à début progressif : ont les caractères suivants :"],["li","Elles ne modifient pas le rythme du cœur qui reste régulier."],["li","La fréquence cardiaque est modérément accélérée autour de 100 battements par minute."],["li","Leur début est progressif et elles s'arrêtent lentement au bout de quelques minutes parfois plus."],["li","Les circonstances d'apparition sont au nombre de trois :"],["li","après un repas copieux, surtout accompagné de boissons abondantes; elles surviennent au bout de 4 heures, elles sont souvent accompagnées par des sensations de battements artériels, au niveau des tempes;"],["li","après prise d'excitants : tabac, alcool, café, thé ou de certains médicaments : aminophylline, extraits thyroïdiens;"],["li","sans aucun rapport avec les repas, l'alimentation, l'effort ou les drogues ; survenant à n'importe quel moment de la journée, elles se voient chez des sujets ayant un profil psychologique particulier : anxieux, soucieux, elles peuvent alors s'accompagner de précordialgies traduisant une névrose cardiaque."],["li","Les palpitations à début brusque : elles sont le plus souvent en rapport avec un trouble du rythme cardiaque."],["li","Les extra-systoles : sont des contractions cardiaques anormales par leur temps prématuré et par le centre qui leur a donné naissance qui est extra-sinusal. Cette contraction prématurée est suivie d'un repos compensateur plus long que l'intervalle qui sépare deux systoles normales et la contraction qui suit l'extra-systole est souvent plus ample. Ces extra-systoles ne sont pas toujours ressenties par le malade; quand elles le sont, c'est sous forme de sensation d'arrêt fugitif du cœur qui correspond à la pause extra-systolique, soit sous forme de palpitation sporadique à type de coup de bélier, d'ébranlement, de bondissement en rapport avec la contraction post-extra-systolique plus ample."],["li","Les palpitations très rapides : elles correspondent aux crises de tachycardie. Elles sont à début brusque parfois ressenti par le malade comme un déclic. Elles sont très rapides, la fréquence cardiaque est égale ou supérieure à 150 par minute. Elles peuvent survenir sur un cœur sain; par crises plusieurs fois par année, c'est le cas de la tachycardie paroxystique de Bouveret, elles sont alors régulières. Elles peuvent être irrégulières, anarchiques, elles sont alors le signe d'une cardiopathie, c'est le cas de la fibrillation auriculaire."],["h3","4. Les syncopes et les lipothymies"],["p","4.1. Les syncopes : la syncope est une perte de connaissance brusque et passagère liée à une anoxie cérébrale."],["p","Elle se manifeste comme un accident subit avec perte totale de la conscience, si le sujet est debout au moment de l'accident, elle s'accompagne d'une chute sur le sol."],["p","Le malade présente une pâleur extrême du visage, le pouls artériel n'est pas perceptible et la tension artérielle est imprenable, la respiration peut être arrêtée. Le malade est soit calme en état de relâchement musculaire complet, soit agité présentant des secousses musculaires avec parfois perte des urines."],["p","La durée de cette perte de conscience est courte : quelques secondes à une minute; la récupération totale est immédiate : elle est circulatoire, réapparition des pouls et remontée de la TA et neurologique : reprise totale de la conscience et de la motricité."],["p","La syncope doit être différenciée de l'éclipsé cérébrale qui est une perte de conscience sans troubles circulatoires : le pouls et la TA restent normaux et de la crise comitiale qui et une perte de conscience s'accompagnant de convulsions mais sans troubles circulatoires Les causes des syncopes sont soit cardiaques, soit extra-cardiaques :"],["li","Les causes cardiaques :"],["li","La syncope du syndrome d’Adams-Stokes : elle survient spontanément surprenant le sujet aussi bien en pleine activité qu'au repos complet, elle est en rapport avec un bloc auriculo-ventriculaire complet"],["li","La syncope d'effort : survient à la marche rapide ou lors de la montée des escaliers, elle se voit essentiellement au cours du rétrécissement aortique."],["li","D'autres cardiopathies peuvent se compliquer de syncopes : chez l'enfant, la tétralogie de Fallot qui est une cardiopathie cyanogène; chez l'adulte, la cardiomyopathie obstructive."],["li","Les causes extra-cardiaques :"],["li","L'hypotension orthostatique idiopathique (sans cause décelable) ou iatrogène (due à l'administration d'un médicament, le plus souvent traitement hypotenseur)."],["li","L'hyper-réflectivité du sinus carotidien : elle est provoquée par une pression externe du sinus carotidien; elle réalise une syncope brusque et brève durant quelques secondes. Elle peut être provoquée sur le malade couché par une pression douée de la bifurcation carotidienne. Chez tout malade ayant présenté une syncope, on devra systématiquement ausculter te cœur à la recherche d'un souffle, compter la fréquence cardiaque, mesurer la tension artérielle en position couchée et en position debout, et faire un ECG."],["p","4.2. Les lipothymies : sont plus fréquentes que les syncopes vraies avec lesquelles elles sont le plus souvent confondues par le public."],["p","Elles doivent être différenciées des syncopes car leur signification est différente, elles sont toujours bénignes."],["p","La lipothymie est précédée de troubles sensoriels : troubles visuels, bourdonnements d'oreille ou bruits de tintements de cloche, de sueurs et de pâleur. Elle a un début progressif qui permet au malade de s'allonger pour éviter la chute."],["p","La perte de connaissance est incomplète. Le malade est pâle, le pouls est petit et lent. La durée est variable de quelques minutes à une demi-heure, la reprise de la conscience est progressive; elle est suivie d'un état de fatigue qui peut persister plusieurs heures."],["p","Les lipothymies surviennent souvent dans le sexe féminin mais non exclusivement et sont déclenchées par les émotions ou les contrariétés ; elles peuvent également se voir chez les sujets porteurs d'une névrose cardiaque ou « asthénie neuro-circulatoire » des auteurs anglo-saxons, elles sont alors associées à des précordialgies et à des palpitations à début progressif."],["p","On rapproche des lipothymies : les syncopes vaso-vagales appelées encore syncopes réflexes, elles sont déclenchées par une peur, une prise de sang, un traumatisme épigastrique. Le déroulement est tout à fait superposable à celui de la lipothymie, il s'agit en fait de fausses syncopes."],["h3","5. La toux"],["p","Peut revêtir plusieurs caractères, elle peut être :"],["p","5.1. Quinteuse : isolée survenant spontanément ou à l'effort, elle traduit alors un œdème pulmonaire mineur, elle se voit surtout au cours du rétrécissement mitral."],["p","5.2. Productive : ramenant une expectoration soit muqueuse d'origine bronchique, soit séreuse traduisant une forme atténuée d'œdème pulmonaire."],["h3","6. Les hémoptysies"],["p","Sont fréquentes au cours des cardiopathies, elles peuvent en être le symptôme révélateur. On peut distinguer : les hémoptysies isolées et les hémoptysies traduisant une complication."],["p","6.1. Les hémoptysies isolées : il s'agit d'hémoptysie de petite ou de moyenne abondance sans signes d'œdème pulmonaire, elles sont surtout fréquentes au cours du RM, elles sont dues à des télangiectasies bronchiques qui sont des anastomoses sous-muqueuses entre les veines bronchiques distales (tributaires des veines pulmonaires) et les veines bronchiques proximales (tributaires des veines bronchiques). Ces télangiectasies saignent lorsque la pression dans l'oreillette gauche est très élevée."],["p","6.2. Les hémoptysies traduisant une complication : les hémoptysies peuvent accompagner un OAP ou un infarctus pulmonaire."],["h2","II. LES SIGNES PHYSIQUES"],["p","L'examen en clinique du cœur doit se faire dans les conditions suivantes :"],["pre","— Le sujet doit être torse nu.                    , .,"],["li","La chambre d'examen doit être chaude, tranquille et bien éclairée."],["li","La position du sujet : l’examen se fait :"],["li","Sur le sujet en décubitus dorsal puis en décubitus latéral gauche."],["li","Sur le sujet assis penché en avant au repos et après effort."],["li","L'examinateur se place à la droite du sujet Cet examen clinique comprend quatre temps d'importance inégale : 1 inspection, la palpation, la percussion et l'auscultation. La palpation et l'auscultation sont les temps de l'examen qui apportent le plus de renseignements,"],["h3","1. L'inspection"],["p","Doit concerner le thorax dans son ensemble, puis la région précordiale et enfin elle recherche des signes périphériques anormaux."],["p","1.1. Le thorax : l'inspection du thorax a deux objectifs :"],["li","La recherche d'anomalies morphologiques thoraciques d'origine squelettique : scoliose, cyphose, thorax en entonnoir ou d'origine respiratoire : thorax en tonneau de l’emphysémateux."],["li","L'appréciation de la fréquence respiratoire et du type respiratoire."],["p","1.2. La région précordiale : l'inspection de la région précordiale recherche :"],["h4","1.2.1. Une anomalie morphologique"],["li","Une rétraction qui peut être en rapport avec une symphyse péricardique."],["li","Une voussure de la paroi antérieure de l'hémithorax gauche en rapport avec une cardiomégalie remontant le plus souvent à l'enfance : cardiopathie congénitale."],["p","1.2.2. Un foyer de pulsation :"],["li","A l'état normal : l'activité du cœur n'est pas visible sauf parfois chez la femme à la base du cou au niveau du creux sus-sternal et du creux sus-claviculaire."],["li","L'existence d'un soulèvement systolique de la paroi thoracique peut se voir :"],["li","Chez l'adolescent et le sujet émotif."],["li","Le plus souvent, il est dû à une anomalie cardiaque s'accompagnant de cardiomégalie."],["p","1.3. La recherche de signes périphériques anormaux : une cyanose, un hippocratisme digital, une turgescence spontanée des jugulaires."],["h3","2. La palpation"],["p","Est un temps capital. Elle va intéresser le précordium et également la périphérie."],["h4","2.1. Au niveau du précordium"],["p","2.1.1. Technique:"],["li","Avec la pulpe de l'index et du médius pour localiser le choc de pointe (fig. 1)."],["li","Avec les doigts en crochet pour explorer le creux sus-sternal (fig. 2)."],["li","Avec le pouce droit introduit dans l'angle xypho-costal gauche pour rechercher les battements d'un ventricule droit hypertrophié (fig. 3)."],["li","Avec la paume de la main posée bien à plat, on explore l'ensemble de la région précordiale à la recherche (fig. 4)."],["li","Soit d'un foyer ectopique de pulsations dû à une dilatation des cavités cardiaques ou des gros vaisseaux sous-jacents."],["li","Soit d'un choc ou d'un frémissement dû à la vibration d'un bruit ou d'un souffle prenant naissance au niveau d'un orifice du cœur."],["h4","2.1.2. Résultats"],["p","a) A l’êtât normal seul le choc de pointe est retrouvé :"],["li","Il se palpe au 4e ou 5e espace intercostal sur la ligne médio-claviculaire ou un peu en dedans d'elle."],["li","Il réalise un soulèvement systolique régulier; synchronie du pouls."],["li","Il est très localisé, le plus souvent punctiforme."],["li","Il est mobile avec les changements de position. b) Variations pathologiques : il peut s'agir d'anomalies du choc de pointe, d'un foyer ectopique de pulsations, de la perception tactile de vibrations qui ont une expression stéthacoustique : les frémissements et les chocs."],["p","LES ANOMALIES DU CHOC DE POINTE * Les variations d'intensité :"],["li","Diminution ou disparition du choc de pointe : peut être de cause extra-cardiaque : obésité, emphysème, ou de cause cardiaque : péricardite aiguë avec épanchement, péricardite constrictive, insuffisance cardiaque globale."],["li","Augmentation du choc de, pointe au cours de la fièvre, de l'hyperthyroïdie, de la névrose cardiaque et de l'insuffisance aortique. * Les variations de surface :"],["li","Globuleux : choc en dôme de Bard au cours de l'insuffisance aortique."],["li","Etalé, en masse : au cours de l'insuffisance cardiaque globale. * Les variations de la mobilité : le choc de pointe devient fixe dans les symphyses péricardiques. * Les variations du siège : le choc de pointe peut être dévié du fait d'affections des organes de voisinage ou bien du fait d'une maladie cardiaque."],["p","Fig 1 _ palpation du choc de pointe."],["p","FIG. 2. — Palpation du creux sus sternal."],["p","FIG. 3. — Recherche du signe de Harzer."],["p","FIG. 4. — Palpation du precordium la main à plat."],["li","Les causes extra-cardiaques :"],["li","Déviations latérales : le choc de pointe est refoulé en dehors en cas d'épanchement pleural droit, il est refoulé en dedans en cas d'épanchement pleural gauche (fig. 5). Le choc de pointe est attiré par les fibroses pleurales ou pulmonaires et en cas d'atélectasie (fig. 6)."],["li","Déviation verticale : le choc de pointe est déplacé vers le haut en cas d'ascite volumineuse."],["li","Les causes cardiaques : toute dilatation d'une cavité ventriculaire va entraîner une déviation du choc de pointe."],["li","Hypertrophie ventriculaire gauche : elle entraîne une déviation vers le bas au niveau du 6e espace intercostal gauche."],["li","Hypertrophie ventriculaire droite : elle entraîne une déviation en dehors vers la ligne , axillaire antérieure."],["li","Hypertrophie bi-ventriculaire : elle entraîne une déviation en bas et en dehors vers la ligne axillaire moyenne."],["p","LES FOYERS ECTOPIQUES DE PULSATIONS :"],["p","* Le signe de Harzer : est la palpation des battements du ventricule droit hypertrophié; il se recherche en introduisant le pouce droit dans l'angle xypho-costal gauche en demandant au malade d'effectuer une inspiration profonde. Il doit être différencié des battements artériels de l'aorte abdominale qui sont palpés au-dessous de l'appendice xyphoïde et qui sont profonds."],["p","* Un soulèvement thoracique systolique localisé est le signe d'une hypertrophie des cavités cardiaques. On peut ainsi observer un soulèvement :"],["li","De la région latéro-sternale gauche basse : à la partie interne des 5e et 6e espaces intercostaux gauches entre le sein et l'appendice xyphoïde ; il est le signe d'une hypertrophie ventriculaire droite et il est alors associé à un signe de Harzer."],["li","De la région latéro-sternale droite : entre le sein droit et le sternum; il est le signe d'un très gros cœur avec hypertrophie dilatation des deux oreillettes surtout de l'oreillette droite avec insuffisance tricuspidienne; il s'accompagne d'une hépatomégalie avec expansion systolique."],["p","Epanchement pleural aérien"],["p","FIG. 5. — Déplacement de la pointete du FIG. 6. — Déplacement de la pointe du cœur par une cœur par un épanchement pleural aérien."],["p","atélectasie droite."],["pre","FIG.7. – Augmentation de la matité cardiaque               FIG.8. – Les foyers d’auscultation\n        Epanchement péricardique                                    du cœur"],["p","* Un deuxième foyer de battement anormal : il s'agit d'un deuxième foyer de battements systoliques nettement distinct du choc de pointe, il est dû soit à un anévrisme aortique, soit à un anévrisme pariétal (paroi antéro-latérale du ventricule gauche)."],["li","Anévrisme aortique :"],["li","Aorte ascendante : il se palpe dans les 3e et 4e espaces intercostaux droits."],["li","Partie horizontale de la crosse aortique : il se palpe à la partie interne des 2e et 3e espaces intercostaux gauches. Ce deuxième foyer de battement est de taille variable, il peut atteindre un certain volume et réaliser une voussure ferme, battante et expansive. Classiquement, l'anévrisme de la crosse aortique était dû à la syphilis, actuellement il est le plus souvent en rapport avec l'athérosclérose."],["li","Anévrisme pariétal : le deuxième foyer de battement se palpe entre le mamelon gauche et le bord gauche du sternum au-dessus de la pointe du cœur. PERCEPTION TACTILE DE VIBRATIONS QUI ONT UNE EXPRESSION STÉTHACOUSTIQUE * Les frémissements : le frémissement est une sensation de vibrations mécaniques fines, serrées, régulières perçues par la main qui palpe; il est comparé à la sensation que perçoit la main qui caresse le dos d'un chat qui ronronne. Le frémissement est la traduction tactile d'un souffle ou d'un roulement, il en signe l'organicité, il peut siéger :"],["li","A la pointe : au niveau du foyer mitral, il est mieux perçu en décubitus latéral gauche; le frémissement est le plus souvent diastolique appelé frémissement cataire, il est retrouvé dans le rétrécissement mitral, il est plus rarement systolique et correspond alors à une insuffisance mitrale."],["li","A la base : il est mieux perçu en position assise penché en avant et en expiration."],["li","Au niveau du 2e espace intercostal droit (foyer aortique), frémissement systolique du rétrécissement aortique."],["li","Au niveau du 2e espace intercostal gauche (foyer pulmonaire), frémissement systolique du rétrécissement pulmonaire."],["li","Sous-claviculaire gauche ; frémissement continu à maximum télésystolique et protodiastolique de la persistance du canal artériel."],["li","Dans la région mésocardiaque : un frémissement systolique peut être retrouvé à l'extrémité interne des 4e ou 5e espaces intercostaux gauches au cours de la communication interventriculaire. * Les chocs : le choc est la perception tactile d'un bruit du cœur prenant naissance au niveau des valves du cœur."],["li","A la pointe : un choc vibrant et bref systolique contemporain du pouls correspond à un éclat du 1er bruit et traduit la fermeture systolique de la valve mitrale indurée dans le rétrécissement mitral. Plus rarement, on peut palper un choc protodiastolique correspondant au claquement d'ouverture de la mitrale retrouvé au cours du rétrécissement mitral."],["li","A la base '. un choc diastolique bref contemporain du 2e bruit correspondant à un éclat de B; peut être retrouvé au foyer aortique, il traduit une HTA; au foyer pulmonaire, il traduit une hypertension artérielle pulmonaire."],["li","Région mésocardiaque ou endapexienne : un soulèvement mou diastolique peut être perçu correspondant au bruit de galop protodiastolique (accentuation de 83) ou au bruit de galop présystolique (accentuation de 84)."],["h4","2.2. Recherche de signes périphériques anormaux"],["p","2.2.1. Des œdèmes sous-cutanés : déclives au niveau des membres inférieurs, donnant le signe du godet."],["p","2.2.2. Une hépatomégalie : lisse, ferme, douloureuse à la palpation, s'accompagnant d'un reflux hépato-jugulaire : dilatation des veines jugulaires obtenue en exerçant avec la main une pression sur le foie."],["h3","3. La percussion"],["p","A perdu beaucoup de son intérêt, elle a été supplantée par la radioscopie et la radiographie qui permettent d'apprécier avec plus d'exactitude le volume du cœur."],["li","A l'état normal, la matité cardiaque qui réalise d'ailleurs une submatité est retrouvée sur une petite surface parasternale gauche."],["li","Lorsque la matité devient franche à gauche du sternum et le déborde à droite, ceci correspond à une péricardite avec épanchement ou à une cardiomégalie importante (fig. 7)."],["h3","4. L'auscultation"],["p","Est un temps capital de l'examen cardiaque, mais il est aussi le plus difficile, demandant un long entraînement."],["p","4.1. Technique : actuellement, c'est l'auscultation médiate à l'aide d'un stéthoscope biauriculaire qui est utilisée."],["p","L'auscultation doit toujours s'accompagner de la prise simultanée du pouls carotidien (ou à défaut du pouls radial) qui permet de situer le 1er bruit qui est synchrone du pouls et donc de situer la systole."],["p","Le malade est successivement couché sur le dos, puis tourné sur le côté gauche, puis en position assise ou debout, en apnée inspiratoire et en apnée expiratoire. Les foyers d'auscultation (fig. 8) :"],["li","Le foyer mitral : siège à l'endroit où la main palpe le choc systolique de la pointe au niveau du 4e ou ,5e espace intercostal gauche un peu en dedans de la ligne médioclaviculaire."],["li","Le foyer tricuspidien : à la base de l'appendice xyphoïde."],["li","Le foyer aortique : à l'extrémité interne du 2e espace intercostal droit."],["li","Le foyer pulmonaire : à l'extrémité interne du 2e espace intercostal gauche."],["li","Le foyer d'Erb : à l'extrémité interne du 3e espace intercostal gauche correspondant à la superposition des foyers aortique et pulmonaire. Les autres régions thoraciques doivent être auscultées systématiquement : l'ensemble de la surface précordiale, les aisselles et le dos, les creux sus-claviculalyes et les gouttières carotidiennes, l’épigastre. L'auscultation cardiaque pathologique devra toujours être complétée par un enregistrement phonocardiographique."],["p","4.2. Résultats : l'auscultation va permettre d'apprécier le rythme cardiaque, d'écouter les bruits du cœur, de détecter des bruits surajoutés ou des souffles."],["pre","4.2.1. Le rythme cardiaque :        •"],["li","A l'état normal : le rythme est régulier et la fréquence varie entre 50 et 100 pulsations par minute, en moyenne 70 par minute."],["li","Les sujets qui ont une fréquence à tendance basse se rapprochant de 50 par minute sont les sportifs et les vagotoniques."],["li","Les sujets qui ont une fréquence à tendance élevée se rapprochant de 100 par minute sont les sujets émotifs et les neurotoniques. Parfois chez le sujet jeune, on peut retrouver une arythmie respiratoire : accélération de la fréquence à l'inspiration et ralentissement à l'expiration."],["li","Variations pathologiques :"],["li","Modifications de la fréquence : soit tachycardie qui est définie comme une fréquence cardiaque supérieure à 100 par minute; soit bradycardie qui est une fréquence inférieure à 50 par minute."],["li","Modifications du rythme qui peut être irrégulier; la cause de cette irrégularité ne pourra être précisée que par l'enregistrement de l'ECG."],["h4","4.2.2. Les bruits du cœur"],["p","a) Les bruits normaux (fig. 9) :"],["p","er LE 1 BRUIT OU B1 : il se situe au début de la systole ventriculaire, il est dû :"],["li","A la vibration du myocarde ventriculaire qui se contracte."],["li","A la fermeture des valves auriculo-ventriculaire mitrale et tricuspide; la fermeture de la première précédant de 0,01 seconde la fermeture de la seconde. C'est un bruit grave, sourd, prolongé : 0,10 seconde, intense, maximum au niveau de la pointe et dans la région mésocardiaque. e LE 2 BRUIT ou B2 : il se situe au début de la diastole, il est dû à la fermeture des valves sigmoïdes aortique et pulmonaire : la fermeture des premières précédant de 0,03 à 0,06 seconde celles des deuxièmes. C'est un bruit sec, bref: 0,08 seconde; aigu, moins intense que B1 ; maximum au niveau de la base du cœur et le long du bord gauche du sternum. e LE 3 BRUIT ou B3 : il se situe en début de diastole, il est donc proto-diastolique, il survient 0,11 à 0,18 seconde après le début du 2e bruit, il est dû à la mise sous tension des ventricules et des valves auriculo-ventriculaires lors du remplissage ventriculaire rapide. C'est un bruit sourd, inaudible à l'état normal, sauf chez l'enfant, l'adolescent et les sujets émotifs où il simule un dédoublement espacé du 2e bruit, il est entendu alors à la pointe et dans la région mésocardiaque, où il peut être associé à un petit souffle protosystolique ; cette association évoquant une éréthisme cardio-vasculaire."],["pre","e                                                              er"],["p","LE 4 BRUIT ou B4 : il est télédiastolique et précède de peu le 1 bruit, il correspond à la fin du remplissage ventriculaire sous l'influence de la systole auriculaire."],["p","Il est normalement inaudible. Lorsqu'il existe, il a une tonalité basse et une intensité faible, il s'entend mieux à la pointe."],["p","b) Variations physiologiques : sont les dédoublements qui correspondent à la séparation des composantes mitrale et tricuspide pour B1 et des composantes aortique et pulmonaire pour B2."],["p","DEDOUBLEMENT DE B1 (DDB1): il est perçu à la pointe, il est serré, variable avec les positions surtout net en position debout, variable avec les phases respiratoires."],["p","e DEDOUBLEMENT DE B2 (DDB2) : il est perçu à la base du cœur à l'extrémité interne des 2"],["pre","e     e"],["p","EICD et G, parfois 3 et 4 EICG, il est serré, il est variable avec les phases respiratoires : plus net à l'inspiration, plus serré à l'expiration où il peut disparaître, se voit surtout chez les sujets jeunes."],["p","c) Variations pathologiques :"],["p","VARIATIONS D'INTENSITÉ :"],["li","Diminution ou assourdissement des bruits du coeur : qui peut porter sur les deux bruits ou électivement sur un bruit."],["li","Assourdissement des deux bruits : peut être dû à des facteurs extra-cardiaques : obésité et emphysème pulmonaire ou à une cause cardiaque : péricardite avec épanchement, insuffisance cardiaque grave et infarctus du myocarde."],["li","Assourdissement électif d'un bruit :"],["li","diminution ou disparition de B1 lors des insuffisances mitrales à forte régurgitation;"],["li","diminution ou disparition de B2 au foyer aortique dans les sténoses aortiques serrées et calcifiées qui immobilisent les valves aortiques; au foyer pulmonaire dans les sténoses pulmonaires."],["li","Augmentation ou éclat des bruits du cœur :"],["li","Eclat des deux bruits du cœur : se voit en cas d'éréthisme cardio-vasculaire surtout chez le sujet jeune."],["li","Eclat de B1 à la pointe peut être en rapport :"],["li","soit avec un remaniement pathologique de la valve mitrale : induration fibreuse au cours du RM; l'éclat du 1er bruit à la pointe est alors bref, net, constant et associé à une modification du timbre qui prend une tonalité plus élevée;"],["li","soit avec une augmentation de la pression systolique dans le ventricule gauche : RA et HTA; l'éclat de B1 ne s'accompagne pas de modifications de timbre;"],["li","soit avec un trouble du rythme : réalisant un éclat intermittent de B1 : dans le pouls lent permanent ou bloc auriculo-ventriculaire, l'éclat intermittent de B1 lorsqu'il est intense est appelé bruit de canon; dans la fibrillation auriculaire, il peut exister également des variations d'intensité du 1er bruit."],["p","TABLEAU RÉCAPITULATIF DES VARIATIONS D'INTENSITÉ DES BRUITS"],["p","Assourdissements"],["li","Des deux bruits : Extra-cardiaques : obésité-emphysème"],["pre","                    Cardiaque        : Péricardite-IC Globale\n• B1 :               Pointe :IM\n• B2 :               Base :   FA = RA"],["p","FP = RP Eclats"],["li","Des deux bruits : Eréthisme cardio-vasculaire"],["pre","• B1 : Pointe        - A tonalité élevée : RM"],["li","Sans modification du timbre : RA — HTA"],["li","Intermittent : Bruit de canon : pouls lent permanent"],["li","Variable: FA"],["pre","• B2 : Base         FA : HTA-athérome-syphilis aortique"],["p","FP:HTAP"],["li","Eclat de B2 : Au foyer aortique : cet éclat peut être palpable, il est retrouvé en cas d'HTA et d'athérosclérose; quand il prend un timbre métallique en coup de gong, il réalise le clangor du 2e bruit évocateur de syphilis aortique: Au foyer pulmonaire : l'éclat du 2e bruit est retrouvé en cas d'hypertension artérielle pulmonaire ou en cas d'augmentation de la circulation pulmonaire dans les gros shunts gauche droit : communication interauriculaire, communication interventnculaire, persistance du canal artériel."],["p","DÉDOUBLEMENTS PATHOLOGIQUES DES BRUITS :"],["li","Dédoublement du 1er bruit à la pointe : est net dans l'insuffisance aortique et l'hypertension artérielle; s'il est fixe et espacé, il évoque un bloc de branche droit."],["li","Dédoublement du 2e bruit : fixe et permanent, ne variant pas en fonction de la respiration; il est retrouvé dans le rétrécissement mitral, la communication interauriculaire, la persistance du canal artériel, l'hypertension artérielle pulmonaire, le rétrécissement pulmonaire serré. d) Les bruits surajoutés : peuvent être systoliques ou diastoliques ; ils réalisent un rythme en 3 temps par l'adjonction aux deux bruits normaux d'un bruit supplémentaire. LES BRUITS SYSTOLIQUES : sont assez rares, ils réalisent des bruits brefs et secs, ils sont appelés claquements ou clicks."],["li","Le claquement artériel protosystolique : est entendu à la base du cœur; il s'agit d'un bruit d'éjection, il doit être différencié d'un dédoublement de B1, il est plus espacé; il est séparé du début du 1er bruit par un intervalle de 0,06 seconde. Il survient à la fin de la contraction isovolumétrique, après l'ouverture des valves sigmoïdes et le début de l'éjection et correspond à la brusque distension de la paroi aortique ou de la paroi pulmonaire."],["li","Claquement artériel aortique est retrouvé dans l'insuffisance aortique et le rétrécissement aortique et la coarctation de l'aorte."],["li","Claquement artériel pulmonaire est retrouvé dans l'hypertension artérielle pulmonaire et dans le rétrécissement pulmonaire peu serré."],["li","Le claquement télésystolique ou mésosystolique appelé encore bruit de triolet attribué autrefois à tort à une bride péricardique, est dû en fait à une élongation des cordages de la valve mitrale : il s'agit d'un bruit bref, sec, claqué, il est entendu dans la région mésocardiaque et endapexienne, il doit être différencié d'un dédoublement du 2e bruit, car il survient juste avant ce dernier, il peut être accompagné d'un souffle télésystolique bref LES BRUITS DIASTOLIQUES : sont beaucoup plus fréquents, ils sont de trois types : le claquement ou vibrance péricardique, le claquement d'ouverture de la mitrale et les bruits de galop."],["li","La vibrance péricardique : s'entend dans la région mésocardiaque, de timbre et d'intensité variable, tantôt sec, vibrant, claqué, tantôt sourd. Il survient peu après B2, il doit être différencié d'un claquement d'ouverture de la mitrale, d'un galop protodiastolique, d'un dédoublement de B3. Il est reconnu plus par les signes cliniques qui l'accompagnent que par son temps de survenue soit précoce : phase de relaxation isovolumétrique, soit tardif de remplissage rapide. Valeur sémiologique : péricardite constrictive."],["li","Le claquement d'ouverture de la mitrale (COM) s'entend à la pointe et dans la région endapexienne, c'est un bruit bref, claqué, intense (parfois perçu à la palpation), il survient 0,06 à 0,09 seconde après le début du 2e bruit. C'est un signe d'induration de hi valve mitrale, il s'entend dans le rétrécissement mitral."],["li","Les bruits de galop : représentent la perception acoustique nette des 3e ou 4e bruits cardiaques, ils réalisent un rythme cardiaque à trois temps par addition d'un 3e bruit diastolique."],["li","Caractères communs :"],["li","temps : diastolique;"],["li","timbre : sourd - grave;"],["li","c'est un bruit choc audible, mais aussi palpable, parfois visible;"],["li","s'accompagnent d'un assourdissement des bruits du cœur et d une tachycardie,"],["li","traduisent une intolérance du myocarde à une cardiopathie; il existe une inadaptation du ventricule malade au volume sanguin provenant de 1’oreillette."],["li","Classification :"],["li","suivant le temps : * galop présystolique : c'est le plus fréquent, il correspond à une exagération de B4. phase de remplissage actif du ventricule due à la systole auriculaire, il ne peut être entendu que s'il existe une contraction auriculaire efficace, il disparaît donc en cas de fibrillation auriculaire ; il survient juste avant B1 ; il s'entend à la pointe et dans la région endapexienne ; * galop proto-diastolique : il correspond à une exagération de B3 (phase de remplissage rapide), il est sourd, maximum en dedans de la pointe; il est indépendant de la contraction auriculaire, il persiste donc en cas de fibrillation auriculaire, * galop de sommation : ou galop méso-diastolique, il est dû à la superposition acoustique de B3 et de B4, il n'est pas forcément pathologique, il s'entend dans la région méso-cardique et se voit surtout en cas de tachycardie sinusale supérieure à 120 par minute; en effet, dans ce cas, il a raccourcissement de la diastole aux dépens du diastasis et donc rapprochement de la phase de remplissage rapide (B3) et de la phase de remplissage actif (B4);"],["li","suivant le siège : * le bruit de galop gauche : est entendu à la poi
